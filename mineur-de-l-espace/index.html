<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Mineur de l'espace</title>
<!-- polices dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/mineur.css" data-google="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400..700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060d;color:#dfe3ff;font-family:"Pixelify Sans",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#jeu{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ecran{position:absolute;left:0;top:0;transform-origin:0 0}
.ecran canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.btn{font-family:Silkscreen,monospace;font-size:11px;border:2px solid #5a6be0;background:#1d2560;color:#fff;border-radius:6px;padding:5px 8px;cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.panneau{position:absolute;right:10px;top:36px;width:300px;max-height:256px;overflow:auto;background:#0c0f22f0;border:2px solid #3b4690;border-radius:10px;padding:8px 10px;font-family:Silkscreen,monospace;font-size:11px;display:none;touch-action:pan-y}
.panneau.vu{display:block}
.onglets{display:flex;gap:4px;margin-bottom:6px}.onglets .btn{flex:1;font-size:9px;padding:5px 2px}.onglets .btn.actif{background:#3b4690;border-color:#ffcf4a}
.panneau h4{margin:0 0 4px;font-weight:400;font-size:13px;color:#ffcf4a}
.panneau p{margin:2px 0 6px;font-size:9px;color:#8c93c4}.panneau p.mis{color:#9fd0ff}.panneau p.vide{color:#8c93c4;margin:10px 0}
.ligne{display:flex;align-items:center;gap:8px;margin:5px 0}.ligne .nom{flex:1}.ligne .nom small{display:block;color:#8c93c4;font-size:9px}
.ligne .btn{max-width:130px;font-size:10px}
.go{display:block;width:100%;margin-top:8px;background:#2f7a3a;border-color:#6fdc7f;font-size:13px;padding:6px}
.bpause{position:absolute;right:8px;top:4px;width:32px;height:22px;padding:0;font-size:10px}
.pause{position:absolute;inset:0;background:#05060dd0;display:none;align-items:center;justify-content:center}
.pause.vu{display:flex}
.pause .boite{background:#0c0f22;border:2px solid #3b4690;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;width:240px}
.pause h3{margin:0 0 4px;font-family:Silkscreen,monospace;font-weight:400;color:#ffcf4a;text-align:center;font-size:18px}
.pause .doux{font-family:Silkscreen,monospace;font-size:8px;color:#8c93c4;text-align:center;margin:4px 0 0}
#tourner{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;font-family:Silkscreen,monospace;font-size:14px;color:#ffcf4a;background:#05060d;padding:24px;line-height:1.6}
body.debout #tourner{display:flex}
</style>
</head>
<body>
<div id="jeu"></div>
<div id="tourner">TOURNE LE TELEPHONE<br>A L'HORIZONTALE</div>
<script src="regles.js"></script>
<script src="planetes.js"></script>
<script src="../nebula/vaisseaux.js"></script>
<script src="chantier.js"></script>
<script src="jeu.js"></script>
</body>
</html>
