<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lune-Rover</title>
<meta name="description" content="Lune-Rover : programme Pico, le petit robot lunaire, pour ramasser les cristaux.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1c1240">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!-- polices dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/lune-rover.css" data-google="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #170f3a; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv" width="272" height="480" aria-label="Lune-Rover : programmer un robot lunaire"></canvas>
<script src="../ludo-scores.js"></script>
<script src="regles.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu. */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
