<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lune-Rover</title>
<meta name="description" content="Lune-Rover : programme ton petit robot pour ramasser les cristaux de la Lune.">
<link rel="manifest" href="../manifest.webmanifest">

<style>

  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; }
</style>

<body>
<canvas id="cv" width="272" height="480" aria-label="Lune-Rover : programmer un robot lunaire"></canvas>
<script src="../ludo-scores.js"></script>
<script src="regles.js"></script>
<script>
'use strict';
/* =====================================================================
   LUNE-ROVER : on écrit à l'avance le programme du rover (avancer, tourner,
   sauter, ramasser, fonction F1, répétitions, conditions), puis GO : il
   l'exécute pas à pas. Il faut ramasser tous les cristaux.
   - Règles et niveaux : regles.js (ROVER_LEVELS, roverRun…).
   - 3 étoiles si le programme n'est pas plus long que la solution de
     référence, 2 jusqu'à 2 instructions de plus, 1 sinon.
   - Classement familial : le total d'étoiles (lunerover / etoiles).
   L'écran est dessiné en 272×480 pixels logiques puis agrandi sans lissage.
   ===================================================================== */
const LW = 272, LH = 480, TAU = Math.PI * 2, FONT = '"Press Start 2P", monospace';
const OUT = '#0c0a12';
const GX = 8, GY = 34, GW = 256, GH = 216;          // zone de la carte
const LEVELS = ROVER_LEVELS;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const now = () => performance.now();
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('lunerover.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lunerover.' + k, JSON.stringify(v)); } catch (e) {} },
};

/* =========================================================
   AUDIO (petits bruitages WebAudio)
   ========================================================= */
const AC = { ctx: null, out: null, on: store.get('sfx', true) };
function audioInit() {
  if (AC.ctx) { if (AC.ctx.state === 'suspended') AC.ctx.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC.ctx = new Ctx(); AC.out = AC.ctx.createGain(); AC.out.gain.value = .5; AC.out.connect(AC.ctx.destination);
}
function tone(f, d, type = 'square', vol = .2, slide = 0, delay = 0) {
  if (!AC.on || !AC.ctx) return;
  const t = AC.ctx.currentTime + delay, o = AC.ctx.createOscillator(), g = AC.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(AC.out); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol = .3, delay = 0) {
  if (!AC.on || !AC.ctx) return;
  const t = AC.ctx.currentTime + delay, n = Math.floor(AC.ctx.sampleRate * d), b = AC.ctx.createBuffer(1, n, AC.ctx.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.ctx.createBufferSource(), g = AC.ctx.createGain(), f = AC.ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 800; s.buffer = b; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(AC.out); s.start(t);
}
const SFX = {
  click: () => tone(660, .05, 'square', .1),
  put: () => tone(520, .06, 'square', .1, 200),
  del: () => tone(300, .08, 'square', .1, -120),
  move: () => tone(140, .07, 'triangle', .12),
  turn: () => tone(240, .05, 'triangle', .1, 60),
  jump: () => tone(260, .25, 'square', .1, 500),
  pick: () => { tone(988, .08, 'square', .12); tone(1319, .14, 'square', .1, 0, .07); },
  crash: () => { noise(.4, .45); tone(110, .3, 'square', .14, -60); },
  fall: () => tone(520, .7, 'triangle', .22, -470),
  fail: () => tone(260, .4, 'triangle', .18, -140),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'square', .14, 0, i * .09)),
  star: i => tone(880 + i * 220, .12, 'triangle', .2),
};

/* =========================================================
   GRAPHISMES : sprites pixel par pixel, contour sombre automatique
   ========================================================= */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function sprite(map, pal, s = 1, outline = OUT) {
  const w = map[0].length, h = map.length, [c, g] = mk(w * s + 2, h * s + 2);
  map.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(1 + x * s, 1 + y * s, s, s); } }));
  if (!outline) return c;
  const [c2, g2] = mk(c.width, c.height);
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g2.drawImage(c, dx, dy);
  g2.globalCompositeOperation = 'source-in'; g2.fillStyle = outline; g2.fillRect(0, 0, c.width, c.height);
  g2.globalCompositeOperation = 'source-over'; g2.drawImage(c, 0, 0);
  return c2;
}
const ROVER_MAP = [
  '....kkkkk....', '...kwwwwwk...', '...kwBbBwk...', '....kkkkk....', 'kkk..kwk..kkk', 'kddkkkwkkkddk', 'kddkwwwwwkddk',
  'kkkkwyyywkkkk', '.k.kwggwwk.k.', 'kkkkbbbbbkkkk', 'kddkbBbBbkddk', 'kddkbbbbbkddk', 'kkk.kkkkk.kkk'];
const ROVER_PAL = { k: '#1a1622', w: '#e8eef6', g: '#a8b0c0', b: '#2f5fc8', B: '#8fb8ff', y: '#ffd23f', d: '#6a6672' };
const GEM_MAP = ['...w...', '..wcc..', '.wcccC.', 'wccCCCd', '.cCCCd.', '..CCd..', '...d...'];
const GEM_PAL = { w: '#ffffff', c: '#9ff6ff', C: '#3ad0f0', d: '#1a6aa0' };
const ICON = {
  A: ['....w....', '...www...', '..wwwww..', '.wwwwwww.', '...www...', '...www...', '...www...', '...www...'],
  G: ['..w......', '.ww......', 'wwwwwww..', '.ww...ww.', '..w....ww', '.......ww', '.......ww', '.......ww'],
  S: ['..wwww...', '.w....w..', 'w......w.', 'w.....www', 'w......w.', 'w........', '.........', 'www...www'],
  R: ['....w....', '...www...', '..wwwww..', '.wwwwwww.', '..wwwww..', '...www...', '....w....', '.........'],
};
ICON.D = ICON.G.map(r => [...r].reverse().join(''));
const OPC = { A: ['#5fd37a', '#2a7a44'], G: ['#6f93ff', '#2a3f9a'], D: ['#6f93ff', '#2a3f9a'], S: ['#ffaa4a', '#a2541a'], R: ['#5ae6f2', '#1a7a8a'], F: ['#b07aff', '#5a2ea0'] };
const OPNAME = { A: 'AVANCER', G: 'TOURNER A GAUCHE', D: 'TOURNER A DROITE', S: 'SAUTER', R: 'RAMASSER', F: 'APPELER F1' };
const CONDC = { c: '#5ae6f2', l: '#5fd37a', o: '#ffaa4a', b: '#ff5a5a' };
const CONDW = { c: 'SUR UN CRISTAL', l: 'VOIE LIBRE', o: 'CRATERE DEVANT', b: 'BLOQUE DEVANT' };
const CONDI = {
  c: ['..w..', '.www.', 'wwwww', '.www.', '..w..'],
  l: ['.w...', '.ww..', '.www.', '.ww..', '.w...'],
  o: ['.www.', 'w...w', 'w...w', 'w...w', '.www.'],
  b: ['wwwww', 'w.w.w', 'wwwww', 'w.w.w', 'wwwww'],
};
const INF = ['.ww.ww.', 'w..w..w', 'w..w..w', '.ww.ww.'];
let SP = null;
function buildSprites() {
  SP = { rover: [sprite(ROVER_MAP, ROVER_PAL, 1), sprite(ROVER_MAP, ROVER_PAL, 2)], gem: [sprite(GEM_MAP, GEM_PAL, 1), sprite(GEM_MAP, GEM_PAL, 2)], icon: {}, cond: {}, inf: sprite(INF, { w: '#ffffff' }, 1) };
  for (const k in ICON) SP.icon[k] = sprite(ICON[k], { w: '#ffffff' }, 1);
  for (const k in CONDI) SP.cond[k] = sprite(CONDI[k], { w: CONDC[k] }, 1);
  SP.sky = buildSky(); SP.earth = sphere(15, [['#ffffff', '#9fd3ff', '#3f7fd8', '#24508c', '#132a50'], ['#e8ffd0', '#7ad06a', '#3a9a4c', '#246a3a', '#163a28']], 9);
  SP.moon = sphere(46, [['#f4f0e8', '#cdc7bc', '#a39e95', '#77736c', '#4a4744']], 3, true);
}
// sphère ombrée (lumière en haut à gauche), avec continents (2 palettes) ou cratères
function sphere(r, pals, seed, craters) {
  const W = r * 2 + 3, [c, g] = mk(W, W), img = g.createImageData(W, W), rand = rnd(seed * 31 + r);
  const blobs = []; for (let i = 0; i < 8; i++) blobs.push([(rand() * 2 - 1) * r, (rand() * 2 - 1) * r, r * (.2 + rand() * .3)]);
  const L = [-.55, -.65, .52], n = Math.hypot(...L);
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const d2 = x * x + y * y; if (d2 > r * r) continue;
    const nx = x / r, ny = y / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
    let l = (nx * L[0] + ny * L[1] + nz * L[2]) / n + (((x + y) & 1) ? .03 : -.03);
    const inBlob = blobs.some(([bx, by, br]) => (x - bx) ** 2 + (y - by) ** 2 < br * br);
    let pal = pals[0];
    if (pals[1] && inBlob) pal = pals[1];
    if (craters && inBlob) l -= .18;
    const idx = l > .8 ? 0 : l > .5 ? 1 : l > .18 ? 2 : l > -.15 ? 3 : 4, k = ((y + r + 1) * W + x + r + 1) * 4, col = parseInt(pal[idx].slice(1), 16);
    img.data[k] = col >> 16; img.data[k + 1] = (col >> 8) & 255; img.data[k + 2] = col & 255; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
}
function buildSky() {
  const [c, g] = mk(LW, LH), rand = rnd(777);
  const gr = g.createLinearGradient(0, 0, 0, LH); gr.addColorStop(0, '#0a0a1c'); gr.addColorStop(1, '#05050b');
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 160; i++) { const s = rand(); g.fillStyle = s > .9 ? '#ffffff' : s > .6 ? '#aab0d8' : '#50547a'; g.fillRect(Math.floor(rand() * LW), Math.floor(rand() * LH), 1, 1); }
  return c;
}
// la carte du niveau est dessinée une fois : sol tramé, cratères, rochers, quadrillage
function buildBoard(M, cs) {
  const W = M.w * cs, H = M.h * cs, [c, g] = mk(W, H), rand = rnd(1234 + M.w * 7 + M.h);
  const SOIL = ['#c9c4ba', '#b5b0a6', '#a19c93', '#8c8880'];
  const img = g.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = Math.sin(x * .21 + Math.sin(y * .13) * 2) + Math.sin(y * .17 - x * .05) + (rand() - .5) * 1.2;
    const col = parseInt(SOIL[clamp(Math.floor(v + 1.6), 0, 3)].slice(1), 16), k = (y * W + x) * 4;
    img.data[k] = col >> 16; img.data[k + 1] = (col >> 8) & 255; img.data[k + 2] = col & 255; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // cailloux du décor
  for (let i = 0; i < M.w * M.h * 2; i++) { const x = Math.floor(rand() * W), y = Math.floor(rand() * H); g.fillStyle = '#6e6a64'; g.fillRect(x, y, 1, 1); g.fillStyle = '#e4e0d6'; g.fillRect(x - 1, y - 1, 1, 1); }
  // quadrillage discret
  g.fillStyle = 'rgba(40,36,48,.28)';
  for (let x = 0; x <= M.w; x++) g.fillRect(Math.min(W - 1, x * cs), 0, 1, H);
  for (let y = 0; y <= M.h; y++) g.fillRect(0, Math.min(H - 1, y * cs), W, 1);
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) {
    const t = M.cells[y * M.w + x], px = x * cs, py = y * cs, cx = px + cs / 2, cy = py + cs / 2;
    if (t === 'o') {
      const r = cs * .44;
      for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
        const d = Math.hypot(xx, yy * 1.1); if (d > r) continue;
        let col;
        if (d > r - 2) col = (xx + yy > 0) ? '#e8e3d8' : '#6a665f';          // bord : éclairé en bas à droite
        else { const l = (xx + yy) / r; col = l < -.3 ? '#1a1820' : l < .2 ? '#2a2830' : l < .6 ? '#3e3a40' : '#56524f'; }
        g.fillStyle = col; g.fillRect(Math.round(cx + xx), Math.round(cy + yy), 1, 1);
      }
    } else if (t === '#') {
      const r = cs * .42, seed = rnd(x * 31 + y * 17 + 5);
      const bumps = [0, 1, 2, 3, 4, 5].map(() => .82 + seed() * .2);
      for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
        const a = Math.atan2(yy, xx), rr = r * bumps[Math.floor(((a + Math.PI) / TAU) * 6) % 6];
        if (Math.hypot(xx, yy) > rr) continue;
        const nx = xx / r, ny = yy / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)), l = -nx * .55 - ny * .65 + nz * .5 + (((xx + yy) & 1) ? .04 : -.04);
        g.fillStyle = l > .7 ? '#e4d6c4' : l > .4 ? '#b29e88' : l > .1 ? '#86725f' : l > -.2 ? '#5c4c40' : '#3a2e28';
        g.fillRect(Math.round(cx + xx), Math.round(cy + yy), 1, 1);
      }
      // ombre portée
      g.fillStyle = 'rgba(20,16,24,.35)'; g.fillRect(Math.round(cx - r * .2), Math.round(cy + r * .85), Math.round(r * 1.3), 2);
    }
  }
  return c;
}

/* =========================================================
   ÉTAT
   ========================================================= */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let K = 1, T = 0, BTN = [];
const S = {
  phase: 'title', lvl: 0, P: null, line: 'main', sel: null, run: null, speed: store.get('speed', 1), tip: false,
  stars: store.get('stars', {}) || {}, best: store.get('best', {}) || {}, progs: store.get('progs', {}) || {},
  result: null, rankText: '', parts: [], shake: 0, levelPage: 0, board: null, M: null, cs: 30, ox: 0, oy: 0, picked: new Set(),
};
const totalStars = () => Object.values(S.stars).reduce((s, v) => s + (v | 0), 0);
const unlocked = () => { let n = 0; while (n < LEVELS.length && S.stars[n + 1] > 0) n++; return Math.min(n, LEVELS.length - 1); };
const tier = () => ROVER_TIERS[LEVELS[S.lvl].t];
function startLevel(i) {
  S.lvl = i; const L = LEVELS[i], M = roverMap(L);
  S.M = M; S.cs = Math.min(30, Math.floor(GW / M.w), Math.floor(GH / M.h));
  S.ox = GX + Math.floor((GW - M.w * S.cs) / 2); S.oy = GY + Math.floor((GH - M.h * S.cs) / 2);
  S.board = buildBoard(M, S.cs);
  let P = { main: [], f: [] };
  try { if (S.progs[i + 1]) { P = roverParse(S.progs[i + 1]); if (!roverAllowed(L, P)) P = { main: [], f: [] }; } } catch (e) { P = { main: [], f: [] }; }
  S.P = P; S.line = 'main'; S.sel = null; S.run = null; S.result = null; S.rankText = ''; S.parts = []; S.picked = new Set();
  S.tip = !!L.txt && !(S.stars[i + 1] > 0); S.phase = 'play';
}
function saveProg() { S.progs[S.lvl + 1] = roverText(S.P); store.set('progs', S.progs); }

/* =========================================================
   DESSIN : outils
   ========================================================= */
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function text(s, x, y, col, align = 'left', size = 8, shadow = '#05030c') {
  g.font = `${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'top';
  if (shadow) { g.fillStyle = shadow; g.fillText(s, x + 1, y + 1); }
  g.fillStyle = col; g.fillText(s, x, y);
}
function wrap(s, max) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line); return out;
}
function logo(s, x, y, size) {
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'top'; g.lineJoin = 'round';
  g.fillStyle = OUT; g.fillText(s, x + 2, y + 3);
  g.lineWidth = Math.max(3, size / 4); g.strokeStyle = OUT; g.strokeText(s, x, y);
  const gr = g.createLinearGradient(0, y, 0, y + size); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.5, '#d8d2c6'); gr.addColorStop(1, '#5ae6f2');
  g.fillStyle = gr; g.fillText(s, x, y);
}
function panel(x, y, w, h, gold) {
  R(x - 2, y - 2, w + 4, h + 4, OUT);
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, gold ? '#5a3c10' : '#262836'); gr.addColorStop(1, gold ? '#2a1606' : '#121320');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  R(x, y, w, 1, gold ? '#ffe28a' : '#9aa0c0'); R(x, y, 1, h, gold ? '#ffe28a' : '#9aa0c0');
  R(x, y + h - 1, w, 1, gold ? '#8a5a18' : '#3a3c52'); R(x + w - 1, y, 1, h, gold ? '#8a5a18' : '#3a3c52');
}
function button(x, y, w, h, label, act, opts = {}) {
  if (act) BTN.push({ x, y, w, h, act });
  R(x - 1, y - 1, w + 2, h + 2, OUT);
  const top = opts.gold ? '#ffd23f' : opts.on ? '#5fd37a' : opts.off ? '#3a3c4c' : '#5a6078', bot = opts.gold ? '#c27a12' : opts.on ? '#2a7a44' : opts.off ? '#22232e' : '#2c2f42';
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(x, y, w, h);
  R(x + 1, y + 1, w - 2, 1, opts.gold ? '#fff2b0' : '#c8cee8');
  if (label) text(label, x + w / 2, y + Math.round((h - 8) / 2) + 1, opts.gold ? '#2a1600' : '#f2f4ff', 'center', 8, opts.gold ? null : '#05030c');
}
function star(x, y, on, big) {
  const m = ['...y...', '...y...', '..yyy..', 'yyyyyyy', '.yyyyy.', '..yyy..', '.yy.yy.', '.y...y.'];
  const s = big ? 3 : 1;
  m.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === 'y') R(x + c * s, y + r * s, s, s, on ? (r < 2 ? '#fff2a8' : '#ffc21f') : '#3a3c52'); }));
}
// un bloc d'instruction : couleur de l'opération, icône, répétition et condition
function block(x, y, w, h, ins, hl) {
  const [top, bot] = OPC[ins.o];
  R(x - 1, y - 1, w + 2, h + 2, hl ? '#ffffff' : OUT);
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(x, y, w, h);
  R(x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,.5)');
  if (ins.o === 'F') text('F1', x + w / 2, y + Math.round(h / 2) - 4, '#ffffff', 'center', 8, OUT);
  else { const ic = SP.icon[ins.o]; g.drawImage(ic, Math.round(x + (w - ic.width) / 2), Math.round(y + (h - ic.height) / 2)); }
  if (ins.c) { R(x, y, 9, 9, OUT); g.drawImage(SP.cond[ins.c], x + 1, y + 1); }
  if (ins.n === 0) { R(x + w - 10, y + h - 7, 10, 7, OUT); g.drawImage(SP.inf, x + w - 10, y + h - 7); }
  else if (ins.n > 1) { R(x + w - 9, y + h - 9, 9, 9, OUT); text(String(ins.n), x + w - 4, y + h - 8, '#ffd23f', 'center', 7, null); }
}

/* =========================================================
   DESSIN : la carte et le rover
   ========================================================= */
const cellXY = (x, y) => [S.ox + x * S.cs + S.cs / 2, S.oy + y * S.cs + S.cs / 2];
function roverState() {
  // position affichée du rover : entre deux pas pendant l'exécution
  const st0 = { x: S.M.start[0], y: S.M.start[1], d: S.M.start[2] };
  const r = S.run; if (!r) return { ...st0, a: st0.d * Math.PI / 2, z: 0, sc: 1 };

    if (before === 0) stepStart(steps[0]);
    r.k = Math.min(steps.length, r.k + dt * S.speed / STEP);
    for (let i = Math.floor(before); i < Math.floor(r.k); i++) { stepEnd(steps[i]); stepStart(steps[i + 1]); }
    r.cur = steps[Math.min(Math.floor(r.k), steps.length - 1)];
    if (r.k >= steps.length) endRun();
  }
  BTN = [];
  g.setTransform(K, 0, 0, K, 0, 0); g.imageSmoothingEnabled = false;
  if (S.phase === 'title') drawTitle(t);
  else if (S.phase === 'help') drawHelp(t);
  else if (S.phase === 'levels') drawLevels(t);
  else drawPlay(t);
  requestAnimationFrame(frame);
}

/* =========================================================
   COMMANDES
   ========================================================= */
function logical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const [x, y] = logical(e);
  for (let i = BTN.length - 1; i >= 0; i--) { const b = BTN[i]; if (x >= b.x && y >= b.y && x < b.x + b.w && y < b.y + b.h) { b.act(); return; } }
  if (S.phase === 'play' && S.sel) S.sel = null;     // toucher ailleurs : désélectionner
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.phase === 'play') { S.run = null; S.phase = 'levels'; } });
function resize() {
  const top = cv.getBoundingClientRect().top + window.scrollY - (parseFloat(cv.style.marginTop) || 0);
  const aw = window.innerWidth, ah = Math.max(200, window.innerHeight - top);
  const sc = Math.min(aw / LW, ah / LH), dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(LW * sc) + 'px'; cv.style.height = Math.floor(LH * sc) + 'px';
  cv.style.marginTop = Math.max(0, Math.floor((ah - LH * sc) / 2)) + 'px';
  K = Math.max(1, Math.ceil(sc * dpr - .05));
  cv.width = LW * K; cv.height = LH * K;
}
window.addEventListener('resize', resize);
// pour les tests : LuneRover.setProgram('A3 R | G A4 R') puis LuneRover.go()
window.LuneRover = { LEVELS, S, startLevel, go, run: roverRun, parse: roverParse,
  setProgram(s) { S.P = roverParse(s); saveProg(); } };

buildSprites();
setTimeout(resize, 0); resize();
(document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).then(() => requestAnimationFrame(frame));
</script>
<script>
/* Ludothèque : mode hors connexion, et bouton de retour au menu dans l'appli installée */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    var app = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    if (!app) return;
    var a = document.createElement("a");
    a.href = "../index.html"; a.textContent = "◀ MENU"; a.setAttribute("aria-label", "Retour au menu de la Ludothèque");
    a.style.cssText = "display:block; width:max-content; margin:4px auto 6px; padding:6px 10px; font:9px 'Press Start 2P',monospace; letter-spacing:1px;" +
      "color:#f2f0ff; background:#110d22; border:3px solid #f2f0ff; border-radius:4px; box-shadow:0 0 0 2px #000, 3px 3px 0 2px #000; text-decoration:none; position:relative; z-index:60;";
    var line = document.createElement("div");
    line.style.cssText = "flex:0 0 100%; width:100%;";
    line.appendChild(a);
    document.body.style.flexWrap = "wrap"; document.body.style.alignContent = "flex-start";
    document.body.insertBefore(line, document.body.firstChild);
    window.dispatchEvent(new Event("resize"));
  } catch (e) {}
})();
</script>
