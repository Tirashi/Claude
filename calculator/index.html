<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<meta name="description" content="Calculator : le calcul mental de 7 à 77 ans, en série de 20, contre la montre ou avec le calcul du jour.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#10122b">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Patrick+Hand&family=Schoolbell&family=Rubik:ital,wght@0,500;0,700;1,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-style="A">
  <div class="brandbar"><span class="brand">CALCULATOR</span><span class="solar"><i></i><i></i><i></i><i></i></span></div>

  <section id="menu" class="scr">
    <div class="logo" id="logo"></div>
    <div class="date" id="date"></div>
    <div class="sub" id="rec"></div>
    <div class="box" id="boxOps"><h3 data-t="ops"></h3><div class="ops" id="ops"></div></div>
    <div class="box" id="boxLvl"><h3 data-t="lvl"></h3><div class="lvl" id="lvl"></div></div>
    <div class="box"><h3 data-t="mode"></h3><div class="modes" id="modes"></div><p class="note" id="note"></p></div>
    <div class="box"><h3 data-t="style"></h3><div class="styles" id="styles"></div></div>
    <button class="go" id="go"></button>
    <div class="links"><a id="lu" class="ludo-retour" href="../index.html"></a><a id="rk" href="../classements/index.html#calculator"></a><button id="snd"></button></div>
  </section>

  <section id="play" class="scr" hidden>
    <div class="hud"><button id="quit" aria-label="Arrêter la partie">✕</button><span id="hl"></span><span id="hr"></span></div>
    <div class="bar"><i id="barI"></i></div>
    <div class="screen"><div class="q" id="q"></div><div class="ans" id="ans"></div><div class="msg" id="msg"></div></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="end" class="scr" hidden>
    <div class="logo" id="et"></div>
    <div class="stars" id="es"></div>
    <div class="big" id="eb"></div>
    <div class="sheet"><div class="rows" id="er"></div><div class="miss" id="em"></div></div>
    <div class="endbtns"><button class="go alt" id="back"></button><button class="go" id="again"></button></div>
  </section>
</div>

<script src="../ludo-scores.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu. */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
