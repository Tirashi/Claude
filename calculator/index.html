<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<meta name="description" content="Calculator : le calcul mental de 7 à 77 ans, en série de 20, contre la montre ou avec le calcul du jour.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#10122b">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Patrick+Hand&family=Schoolbell&family=Rubik:ital,wght@0,500;0,700;1,800&display=swap">
<style>
/* Un seul jeu, trois habillages (maquette maquettes/calculator.html) : A arcade 16 bits, B cahier d'écolier, C calculatrice de poche.
   Le style est porté par data-style sur #app ; la logique ne change pas. */
:root {
  --a-bg: #10122b; --a-panel: #1d2150; --a-line: #3a3f8f; --a-yellow: #ffd23f; --a-cyan: #4fd6e8; --a-red: #ff4d6d; --a-green: #6be675; --a-text: #f2f0ff; --a-dim: #a7a9d8;
  --b-paper: #fbf8f0; --b-line: #c7d5ee; --b-line-2: #9db4dd; --b-margin: #e0525a; --b-ink: #1f3b8f; --b-pencil: #55555e; --b-star: #f5b301; --b-ok: #2f9e44; --b-high: #ffe58a;
  --c-body: #2b2d31; --c-body-2: #3a3d43; --c-lcd: #c4d0a8; --c-lcd-ink: #1d2418; --c-ghost: rgba(29,36,24,.08); --c-key: #e9e5da; --c-key-ink: #2b2d31; --c-op: #e8783a; --c-ok: #4caf6a; --c-label: #b8b8be; --c-red: #c0392b;
  --f-pixel: "Press Start 2P", "Courier New", monospace; --f-hand: "Patrick Hand", "Comic Sans MS", cursive; --f-title: "Schoolbell", "Comic Sans MS", cursive; --f-calc: "Rubik", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: #050507; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
a { color: inherit; }
#app { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.scr[hidden], [hidden] { display: none !important; }
#menu { overflow-y: auto; }
.brandbar { display: none; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { height: clamp(46px, 8.6vh, 66px); }
.pad .ok { grid-column: 1 / -1; }
.pad .pm.off { visibility: hidden; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.hud { display: flex; align-items: center; gap: 10px; }
.hud #hl { flex: 1; }
.links { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.links a { text-decoration: none; }
.links button { text-transform: inherit; letter-spacing: inherit; }
.endbtns { display: flex; gap: 10px; margin-top: auto; }
.endbtns .go, [data-style=C] .endbtns .go { flex: 1; }
.dim { opacity: .35; pointer-events: none; }
.miss div { display: flex; justify-content: space-between; gap: 8px; }
.rows div { display: flex; justify-content: space-between; gap: 8px; }
#end .sheet { display: flex; flex-direction: column; gap: 8px; }
.note:empty { display: none; }
.pop { animation: pop .25s ease-out; }
@keyframes pop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@media (prefers-reduced-motion: reduce) { .pop, .shake { animation: none; } }

/* ---------- A : arcade 16 bits ---------- */
[data-style=A] { background: var(--a-bg); color: var(--a-text); font-family: var(--f-pixel); font-size: 10px; line-height: 1.6;
  background-image: linear-gradient(rgba(255,255,255,.03) 50%, transparent 50%); background-size: 100% 4px; }
[data-style=A] .logo { text-align: center; font-size: 22px; color: var(--a-yellow); text-shadow: 3px 3px 0 var(--a-red), 6px 6px 0 #000; margin: 6px 0 2px; }
[data-style=A] .date { display: none; }
[data-style=A] .sub { text-align: center; color: var(--a-cyan); font-size: 9px; }
[data-style=A] .box, [data-style=A] .sheet { background: var(--a-panel); border: 3px solid var(--a-text); box-shadow: 0 0 0 3px #000, 4px 4px 0 3px #000; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin: 3px; }
[data-style=A] h3 { margin: 0; font-size: 10px; color: var(--a-yellow); font-weight: 400; }
[data-style=A] .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
[data-style=A] .op { height: 44px; background: var(--a-bg); color: var(--a-line); border: 3px solid var(--a-line); font-family: var(--f-pixel); font-size: 20px; }
[data-style=A] .op.on { color: var(--a-bg); background: var(--a-cyan); border-color: var(--a-text); }
[data-style=A] .lvl { display: flex; flex-direction: column; gap: 3px; }
[data-style=A] .lvl button { display: flex; justify-content: space-between; padding: 5px 6px; color: var(--a-dim); text-align: left; }
[data-style=A] .lvl button.on { color: var(--a-text); background: var(--a-line); }
[data-style=A] .lvl button.on span:first-child::before { content: "▶ "; color: var(--a-yellow); }
[data-style=A] .lvl button span:last-child { color: var(--a-cyan); }
[data-style=A] .modes, [data-style=A] .styles { display: flex; gap: 6px; }
[data-style=A] .modes button, [data-style=A] .styles button { flex: 1; padding: 8px 2px; border: 2px solid var(--a-line); color: var(--a-dim); font-size: 8px; }
[data-style=A] .modes button.on, [data-style=A] .styles button.on { border-color: var(--a-yellow); color: var(--a-yellow); }
[data-style=A] .note { margin: 0; font-size: 8px; color: var(--a-cyan); }
[data-style=A] .go { min-height: 48px; background: var(--a-red); color: var(--a-text); border: 3px solid var(--a-text); box-shadow: 0 5px 0 #000; font-family: var(--f-pixel); font-size: 13px; margin: 4px 3px 6px; }
[data-style=A] .go.alt { background: var(--a-panel); }
[data-style=A] .links { font-size: 9px; color: var(--a-cyan); }
[data-style=A] .hud { color: var(--a-yellow); }
[data-style=A] #quit { width: 30px; height: 30px; border: 2px solid var(--a-text); color: var(--a-text); font-size: 10px; }
[data-style=A] .bar { height: 12px; border: 2px solid var(--a-text); background: var(--a-bg); }
[data-style=A] .bar i { display: block; height: 100%; background: var(--a-green); }
[data-style=A] .q { font-size: clamp(20px, 7vw, 30px); text-shadow: 3px 3px 0 #000; text-align: center; }
[data-style=A] .ans { min-width: 150px; padding: 12px; text-align: center; font-size: 28px; color: var(--a-yellow); border: 3px solid var(--a-text); background: #000; }
[data-style=A] .ans.ok { color: var(--a-green); } [data-style=A] .ans.ko { color: var(--a-red); }
[data-style=A] .msg { min-height: 14px; font-size: 10px; }
[data-style=A] .msg.ok { color: var(--a-green); } [data-style=A] .msg.ko { color: var(--a-red); }
[data-style=A] .pad button { background: var(--a-panel); border: 3px solid var(--a-line); box-shadow: 0 4px 0 #000; font-family: var(--f-pixel); font-size: 17px; }
[data-style=A] .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
[data-style=A] .pad .ok { background: var(--a-green); color: var(--a-bg); font-size: 14px; }
[data-style=A] .pad .del, [data-style=A] .pad .pm { color: var(--a-red); }
[data-style=A] .big { text-align: center; font-size: 26px; color: var(--a-yellow); }
[data-style=A] .stars { text-align: center; font-size: 30px; color: var(--a-yellow); letter-spacing: 6px; }
[data-style=A] .stars .off { color: var(--a-line); }
[data-style=A] .rows .rec { color: var(--a-green); }
[data-style=A] .miss div { color: var(--a-red); }
[data-style=A] .miss b { color: var(--a-text); font-weight: 400; }

/* ---------- B : cahier d'écolier ---------- */
[data-style=B] { background-color: var(--b-paper); color: var(--b-ink); font-family: var(--f-hand); font-size: 19px; line-height: 1.2;
  background-image: linear-gradient(90deg, transparent 34px, var(--b-margin) 34px, var(--b-margin) 36px, transparent 36px),
    linear-gradient(var(--b-line-2) 1px, transparent 1px), linear-gradient(var(--b-line) 1px, transparent 1px);
  background-size: 100% 100%, 100% 32px, 100% 8px; }
[data-style=B] .scr { padding-left: 46px; gap: 8px; }
[data-style=B] .logo { font-family: var(--f-title); font-size: 36px; color: var(--b-margin); transform: rotate(-2deg); transform-origin: left; margin-top: 4px; }
[data-style=B] .date { font-size: 16px; color: var(--b-pencil); margin-top: -6px; }
[data-style=B] .sub { font-size: 17px; color: var(--b-pencil); }
[data-style=B] .box { display: flex; flex-direction: column; gap: 4px; }
[data-style=B] h3 { margin: 4px 0 0; font-size: 19px; font-weight: 400; text-decoration: underline; text-decoration-color: var(--b-margin); text-underline-offset: 3px; }
[data-style=B] .ops { display: flex; gap: 10px; }
[data-style=B] .op { width: 50px; height: 50px; border-radius: 50% 46% 52% 48%; border: 2px solid var(--b-ink); color: var(--b-ink); font-family: var(--f-hand); font-size: 30px; line-height: 1; }
[data-style=B] .op.on { background: var(--b-high); box-shadow: 2px 2px 0 var(--b-ink); }
[data-style=B] .lvl { display: flex; flex-direction: column; gap: 2px; }
[data-style=B] .lvl button { display: flex; gap: 8px; align-items: center; color: var(--b-pencil); text-align: left; padding: 2px 0; }
[data-style=B] .lvl button::before { content: ""; width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 3px; flex: none; }
[data-style=B] .lvl button.on { color: var(--b-ink); }
[data-style=B] .lvl button.on::before { background: var(--b-ink); box-shadow: inset 0 0 0 2px var(--b-paper); }
[data-style=B] .lvl button span:last-child { margin-left: auto; font-size: 16px; color: var(--b-pencil); }
[data-style=B] .modes, [data-style=B] .styles { display: flex; flex-wrap: wrap; gap: 4px 14px; }
[data-style=B] .modes button, [data-style=B] .styles button { color: var(--b-pencil); padding: 2px 0; }
[data-style=B] .modes button.on, [data-style=B] .styles button.on { color: var(--b-ink); background: linear-gradient(transparent 55%, var(--b-high) 55%); }
[data-style=B] .note { margin: 0; font-size: 16px; color: var(--b-pencil); }
[data-style=B] .go { align-self: center; padding: 6px 30px; background: var(--b-ok); color: #fff; border-radius: 12px 16px 10px 18px; font-family: var(--f-title); font-size: 26px; box-shadow: 2px 3px 0 var(--b-ink); margin: 6px 0; }
[data-style=B] .go.alt { background: var(--b-paper); color: var(--b-ink); border: 2px solid var(--b-ink); }
[data-style=B] .links { font-size: 17px; color: var(--b-pencil); }
[data-style=B] .hud { font-size: 18px; color: var(--b-pencil); }
[data-style=B] #quit { width: 30px; height: 30px; border: 2px solid var(--b-pencil); border-radius: 50%; color: var(--b-pencil); font-size: 16px; }
[data-style=B] .bar { height: 8px; border-radius: 4px; border: 1.5px solid var(--b-ink); }
[data-style=B] .bar i { display: block; height: 100%; background: var(--b-high); border-radius: 3px; }
[data-style=B] .screen { align-items: flex-start; padding-left: 4px; gap: 10px; }
[data-style=B] .q { font-size: clamp(38px, 12vw, 54px); line-height: 1; }
[data-style=B] .q .eq { color: var(--b-pencil); }
[data-style=B] .ans { font-size: clamp(38px, 12vw, 54px); line-height: 1; min-width: 100px; min-height: 58px; border-bottom: 2px dashed var(--b-pencil); padding: 0 6px; }
[data-style=B] .ans.ok, [data-style=B] .msg.ok { color: var(--b-ok); } [data-style=B] .ans.ko, [data-style=B] .msg.ko { color: var(--b-margin); }
[data-style=B] .msg { min-height: 26px; font-family: var(--f-title); font-size: 22px; }
[data-style=B] .pad button { background: rgba(255,255,255,.75); border: 2px solid var(--b-ink); border-radius: 10px 14px 12px 8px; font-family: var(--f-hand); font-size: 28px; }
[data-style=B] .pad button:active { background: var(--b-high); }
[data-style=B] .pad .ok { background: var(--b-ok); color: #fff; border-color: var(--b-ok); font-family: var(--f-title); font-size: 24px; }
[data-style=B] .pad .del, [data-style=B] .pad .pm { color: var(--b-margin); }
[data-style=B] #end .logo { font-size: 40px; }
[data-style=B] .big { align-self: center; font-family: var(--f-title); font-size: 40px; color: var(--b-margin); transform: rotate(-6deg); border: 3px solid var(--b-margin); border-radius: 50%; padding: 4px 22px; }
[data-style=B] .stars { display: flex; gap: 10px; justify-content: center; font-size: 36px; color: var(--b-star); }
[data-style=B] .stars span { filter: drop-shadow(1px 1px 0 var(--b-ink)); }
[data-style=B] .stars .off { color: var(--b-line-2); filter: none; }
[data-style=B] .rows { font-size: 18px; }
[data-style=B] .rows .rec { color: var(--b-ok); }
[data-style=B] .miss { font-size: 18px; }
[data-style=B] .miss s { color: var(--b-margin); }
[data-style=B] .miss b { color: var(--b-ok); font-weight: 400; }

/* ---------- C : calculatrice de poche ---------- */
[data-style=C] { background: linear-gradient(160deg, var(--c-body-2), var(--c-body) 40%); color: var(--c-label); font-family: var(--f-calc); font-weight: 500; font-size: 14px; }
[data-style=C] .brandbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
[data-style=C] .brand { font-style: italic; font-weight: 800; font-size: 19px; letter-spacing: 1px; }
[data-style=C] .solar { display: flex; gap: 2px; padding: 3px; background: #1a1612; border-radius: 3px; }
[data-style=C] .solar i { width: 18px; height: 13px; background: linear-gradient(135deg, #5a3a2a, #2a1a12); }
[data-style=C] .logo, [data-style=C] .date { display: none; }
[data-style=C] #end .logo { display: block; text-align: center; font-weight: 700; font-size: 18px; color: #fff; letter-spacing: .08em; text-transform: uppercase; }
[data-style=C] .sub, [data-style=C] .screen, [data-style=C] .big { background: var(--c-lcd); color: var(--c-lcd-ink); border-radius: 6px; box-shadow: inset 0 3px 8px rgba(0,0,0,.35), 0 0 0 4px #15161a; margin: 4px; }
[data-style=C] .sub { padding: 10px 12px; font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
[data-style=C] h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
[data-style=C] .box { display: flex; flex-direction: column; gap: 6px; }
[data-style=C] .ops, [data-style=C] .modes, [data-style=C] .styles { display: flex; gap: 6px; }
[data-style=C] .lvl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
[data-style=C] .lvl button:first-child { grid-column: 1 / -1; }
[data-style=C] .op, [data-style=C] .modes button, [data-style=C] .styles button, [data-style=C] .lvl button, [data-style=C] .pad button, [data-style=C] .go, [data-style=C] #quit {
  flex: 1; border-radius: 8px; background: var(--c-key); color: var(--c-key-ink); font-family: var(--f-calc); font-weight: 700; box-shadow: 0 3px 0 #8c887e; }
[data-style=C] .op { height: 44px; font-size: 22px; background: #4a4d55; color: #8a8d96; box-shadow: 0 3px 0 #1f2024; }
[data-style=C] .op.on { background: var(--c-op); color: #fff; box-shadow: 0 3px 0 #9a4a1e; }
[data-style=C] .modes button, [data-style=C] .styles button { min-height: 38px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 4px; }
[data-style=C] .lvl button { min-height: 38px; font-size: 13px; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; gap: 4px; text-align: left; }
[data-style=C] .lvl button span:last-child { font-weight: 500; font-size: 12px; opacity: .7; }
[data-style=C] .modes button.on, [data-style=C] .styles button.on, [data-style=C] .lvl button.on { background: var(--c-op); color: #fff; box-shadow: 0 3px 0 #9a4a1e; }
[data-style=C] .note { margin: 0; font-size: 12px; }
[data-style=C] .go { flex: none; min-height: 48px; background: var(--c-ok); color: #fff; box-shadow: 0 3px 0 #2c6b3e; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
[data-style=C] .go.alt { background: var(--c-key); color: var(--c-key-ink); box-shadow: 0 3px 0 #8c887e; }
[data-style=C] button:active { transform: translateY(2px); }
[data-style=C] .links { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
[data-style=C] .hud { font-weight: 700; letter-spacing: .06em; }
[data-style=C] #quit { flex: none; width: 34px; height: 30px; font-size: 13px; background: var(--c-red); color: #fff; box-shadow: 0 3px 0 #7a2218; }
[data-style=C] .bar { height: 6px; background: #1a1b1f; border-radius: 3px; }
[data-style=C] .bar i { display: block; height: 100%; background: var(--c-op); border-radius: 3px; }
[data-style=C] .screen { flex: none; align-items: stretch; padding: 10px 12px; gap: 6px; }
[data-style=C] .msg { order: -1; font-size: 12px; font-weight: 700; letter-spacing: .06em; min-height: 15px; }
[data-style=C] .q, [data-style=C] .ans, [data-style=C] .big { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
[data-style=C] .q { min-height: 40px; } [data-style=C] .ans { min-height: 56px; }
[data-style=C] .opsym { font-size: 28px; font-weight: 700; padding: 0 2px; }
[data-style=C] .pad { margin-top: auto; }
[data-style=C] .pad button { font-size: 22px; }
[data-style=C] .pad .ok { background: var(--c-ok); color: #fff; box-shadow: 0 3px 0 #2c6b3e; font-size: 18px; }
[data-style=C] .pad .del, [data-style=C] .pad .pm { background: var(--c-op); color: #fff; box-shadow: 0 3px 0 #9a4a1e; }
[data-style=C] .big { padding: 10px 12px; min-height: 64px; }
[data-style=C] .stars { font-size: 30px; color: var(--c-op); text-align: center; letter-spacing: 6px; }
[data-style=C] .stars .off { color: #4a4d55; }
[data-style=C] #end .sheet { background: #f4f1e8; color: #2b2d31; padding: 10px 12px 16px; font-family: "Courier New", monospace; font-size: 14px; line-height: 1.5; gap: 0;
  background-image: radial-gradient(circle at 6px 100%, var(--c-body) 5px, transparent 5.5px); background-size: 12px 8px; background-repeat: repeat-x; background-position: bottom; }
[data-style=C] #end .sheet .rows { border-bottom: 1px dashed #999; padding-bottom: 4px; margin-bottom: 4px; }
[data-style=C] .rows .rec { font-weight: 700; }
[data-style=C] .miss div { color: var(--c-red); }
svg.seg { display: block; }
</style>
</head>
<body>
<div id="app" data-style="A">
  <div class="brandbar"><span class="brand">CALCULATOR</span><span class="solar"><i></i><i></i><i></i><i></i></span></div>

  <section id="menu" class="scr">
    <div class="logo" id="logo"></div>
    <div class="date" id="date"></div>
    <div class="sub" id="rec"></div>
    <div class="box" id="boxOps"><h3 data-t="ops"></h3><div class="ops" id="ops"></div></div>
    <div class="box" id="boxLvl"><h3 data-t="lvl"></h3><div class="lvl" id="lvl"></div></div>
    <div class="box"><h3 data-t="mode"></h3><div class="modes" id="modes"></div><p class="note" id="note"></p></div>
    <div class="box"><h3 data-t="style"></h3><div class="styles" id="styles"></div></div>
    <button class="go" id="go"></button>
    <div class="links"><a id="rk" href="../classements/index.html#calculator"></a><button id="snd"></button></div>
  </section>

  <section id="play" class="scr" hidden>
    <div class="hud"><button id="quit" aria-label="Arrêter la partie">✕</button><span id="hl"></span><span id="hr"></span></div>
    <div class="bar"><i id="barI"></i></div>
    <div class="screen"><div class="q" id="q"></div><div class="ans" id="ans"></div><div class="msg" id="msg"></div></div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="end" class="scr" hidden>
    <div class="logo" id="et"></div>
    <div class="stars" id="es"></div>
    <div class="big" id="eb"></div>
    <div class="sheet"><div class="rows" id="er"></div><div class="miss" id="em"></div></div>
    <div class="endbtns"><button class="go alt" id="back"></button><button class="go" id="again"></button></div>
  </section>
</div>

<script src="../ludo-scores.js"></script>
<script>
/* ---------- sauvegarde (préfixe calculator.) ---------- */
const load = (k, d) => { try { const v = localStorage.getItem('calculator.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem('calculator.' + k, JSON.stringify(v)); } catch (e) {} };
const $ = id => document.getElementById(id);

/* ---------- réglages ---------- */
const OPS = ['+', '-', 'x', '/'];
const SYM = { '+': '+', '-': '−', 'x': '×', '/': '÷' };
const CAT = { '+': 'add', '-': 'sub', 'x': 'mul', '/': 'div' };
const LEVELS = [['Petit écolier', '7 + 2'], ['Écolier', '8 × 7'], ['Collège', '45 + 27'], ['Costaud', '34 × 12'], ['Champion', '−8 × 15']];
const MODES = [['serie', 'Série 20', 'Série de 20'], ['chrono', '60 s', 'Contre la montre'], ['jour', 'Du jour', 'Calcul du jour']];
const STYLES = [['A', 'Arcade'], ['B', 'Cahier'], ['C', 'Calculatrice']];
const SERIE = 20, CHRONO_MS = 60000, PENALTY = 5000;
// étoiles en contre la montre : bonnes réponses pour 1, 2, 3 étoiles, par niveau
const CHRONO_STARS = { 1: [8, 14, 20], 2: [8, 14, 20], 3: [5, 9, 13], 4: [3, 6, 9], 5: [4, 7, 10] };
const cfg = Object.assign({ ops: '+-x', lvl: 2, mode: 'serie', style: 'A', son: true }, load('cfg', {}));
if (!/^[-+x/]{1,4}$/.test(cfg.ops)) cfg.ops = '+-x';
const catOf = ops => ops.length > 1 ? 'mix' : CAT[ops];
const dayNum = (d = new Date()) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();

/* ---------- les calculs ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// un calcul d'opération op au niveau L ; les divisions tombent toujours juste, pas de négatif avant le niveau 5
function gen(op, L, r = Math.random) {
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  const nz = (a, b) => { let v; do v = ri(a, b); while (v === 0 || v === 1 || v === -1); return v; };
  let a, b;
  if (L === 5) {
    if (op === '+' || op === '-') { a = nz(-99, 99); b = nz(-99, 99); if (a > 0 && b > 0) b = -b; }
    else if (op === 'x') { a = nz(-20, 20); b = ri(2, 15) * (r() < .5 ? -1 : 1); if (a > 0 && b > 0) a = -a; }
    else { b = ri(2, 12) * (r() < .5 ? -1 : 1); const q = ri(2, 20) * (r() < .5 ? -1 : 1); a = b * q; }
  } else if (op === '+') {
    if (L === 1) { a = ri(1, 9); b = ri(0, 10 - a); }
    else if (L === 2) { a = ri(2, 18); b = ri(1, 20 - a); }
    else if (L === 3) { a = ri(10, 99); b = ri(10, 99); }
    else { a = ri(100, 499); b = ri(100, 499); }
  } else if (op === '-') {
    if (L === 1) { a = ri(1, 10); b = ri(0, a); }
    else if (L === 2) { a = ri(5, 20); b = ri(1, a); }
    else if (L === 3) { a = ri(20, 99); b = ri(10, a); }
    else { a = ri(200, 999); b = ri(100, a); }
  } else if (op === 'x') {
    if (L === 1) { a = ri(1, 5); b = ri(1, 10); }
    else if (L === 2) { a = ri(2, 10); b = ri(2, 10); }
    else if (L === 3) { a = ri(11, 50); b = ri(2, 9); }
    else { a = ri(11, 25); b = ri(11, 19); }
    if (r() < .5) [a, b] = [b, a];
  } else {
    let q;
    if (L === 1) { b = ri(1, 5); q = ri(1, 10); }
    else if (L === 2) { b = ri(2, 10); q = ri(1, 10); }
    else if (L === 3) { b = ri(2, 9); q = ri(Math.ceil(10 / b), Math.floor(99 / b)); }
    else { b = ri(2, 15); q = ri(Math.ceil(100 / b), Math.min(99, Math.floor(999 / b))); }
    a = b * q;
  }
  const res = op === '+' ? a + b : op === '-' ? a - b : op === 'x' ? a * b : a / b;
  return { a, b, op, res, L };
}
// le calcul du jour : les mêmes 20 calculs pour toute la famille, du niveau 1 au niveau 4 (5 de chaque), les 4 opérations
function dailySeries(day = dayNum()) {
  const r = rng(day * 7919 + 13), out = [];
  for (let blk = 0; blk < 4; blk++) {
    const ops = OPS.slice();
    for (let i = ops.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ops[i], ops[j]] = [ops[j], ops[i]]; }
    ops.push(OPS[Math.floor(r() * 4)]);
    for (const op of ops) out.push(gen(op, blk + 1, r));
  }
  return out;
}
const neg = n => n < 0 ? '−' + (-n) : String(n);
const qText = c => `${neg(c.a)} ${SYM[c.op]} ${c.b < 0 ? '(' + neg(c.b) + ')' : c.b}`;

/* ---------- textes selon le style ---------- */
// arcade : majuscules sans accent (Press Start 2P n'a pas de majuscules accentuées)
const deacc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const TXT = {
  ops: { A: 'Opérations', B: 'Je choisis mes calculs', C: 'Opérations' },
  lvl: { A: 'Niveau', B: 'Mon niveau', C: 'Niveau' },
  mode: { A: 'Mode', B: 'Mon exercice', C: 'Mode' },
  style: { A: 'Style', B: 'Mon style', C: 'Style' },
  go: { A: 'Jouer', B: "C'est parti !", C: 'On · jouer' },
  again: { A: 'Rejouer', B: 'Encore !', C: 'Rejouer' },
  back: { A: 'Menu', B: 'Menu', C: 'Menu' },
  rk: { A: 'Classement', B: 'Le classement de la famille', C: 'Classement' },
};
const t = (k, s = cfg.style) => { const v = TXT[k] ? TXT[k][s] : k; return s === 'A' ? deacc(v) : v; };
const tx = s => cfg.style === 'A' ? deacc(s) : s;

/* ---------- chiffres à 7 segments (style C) ---------- */
const SEGS = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', '?': 'abge', ' ': '' };
const GEO = { a: [3, 0, 14, 3], b: [17, 3, 3, 14], c: [17, 19, 3, 14], d: [3, 33, 14, 3], e: [0, 19, 3, 14], f: [0, 3, 3, 14], g: [3, 16.5, 14, 3] };
function seg(txt, h) {
  const w = h * 20 / 36;
  return [...String(txt)].map(ch => {
    if (ch === ':' || ch === '.') return `<span class="opsym">${ch}</span>`;
    const on = SEGS[ch] ?? '';
    return `<svg class="seg" width="${w}" height="${h}" viewBox="-1 -1 22 38">` + Object.entries(GEO).map(([k, [x, y, rw, rh]]) =>
      `<rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="1.2" fill="${on.includes(k) ? 'var(--c-lcd-ink)' : 'var(--c-ghost)'}"/>`).join('') + '</svg>';
  }).join('');
}
const segNum = (n, h) => seg(String(n).replace('−', '-'), h);
const segCalc = c => segNum(c.a, 30) + `<span class="opsym">${SYM[c.op]}</span>` + (c.b < 0 ? `<span class="opsym">(</span>${segNum(c.b, 30)}<span class="opsym">)</span>` : segNum(c.b, 30)) + '<span class="opsym">=</span>';

/* ---------- temps ---------- */
const fmtT = ms => { const s = Math.floor(ms / 1000), d = Math.floor(ms % 1000 / 100); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}.${d}`; };
const fmtS = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- sons (bips synthétisés) ---------- */
let AC = null;
function beep(f, d, type = 'square', vol = .06, f2) {
  if (!cfg.son) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.linearRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
const SFX = {
  key: () => beep(cfg.style === 'C' ? 2400 : 900, .03, cfg.style === 'B' ? 'triangle' : 'square', .025),
  ok: () => { beep(660, .08, 'square', .05); setTimeout(() => beep(990, .12, 'square', .05), 70); },
  ko: () => beep(200, .3, 'sawtooth', .05, 120),
  end: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .14, 'square', .05), i * 110)),
};

/* ---------- records ---------- */
const best = load('best', {});      // serie:L:cat (ms, plus bas = mieux), chrono:L:cat (bonnes réponses)
const daily = load('daily', {});    // AAAAMMJJ : temps de la tentative classée du jour
function recLine() {
  if (cfg.mode === 'jour') {
    const d = daily[dayNum()];
    return d ? tx('Aujourd\'hui : ' + fmtT(d)) : load('dailyTry', 0) === dayNum() ? tx('Calcul du jour commencé') : tx('Pas encore joué aujourd\'hui');
  }
  const v = best[`${cfg.mode}:${cfg.lvl}:${catOf(cfg.ops)}`];
  if (!v) return tx('Pas encore de record');
  return tx('Record : ') + (cfg.mode === 'serie' ? fmtT(v) : v + tx(' bonnes'));
}

/* ---------- menu ---------- */
function setStyle(s) {
  cfg.style = s; $('app').dataset.style = s;
  document.querySelector('meta[name=theme-color]').content = s === 'A' ? '#10122b' : s === 'B' ? '#fbf8f0' : '#2b2d31';
}
function renderMenu() {
  const s = cfg.style;
  $('logo').textContent = s === 'A' ? 'CALCULATOR' : 'Calculator';
  $('date').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('rec').textContent = recLine();
  document.querySelectorAll('[data-t]').forEach(h => h.textContent = t(h.dataset.t));
  $('ops').innerHTML = OPS.map(o => `<button class="op${cfg.ops.includes(o) ? ' on' : ''}" data-op="${o}">${SYM[o]}</button>`).join('');
  $('lvl').innerHTML = LEVELS.map(([n, ex], i) => `<button class="${cfg.lvl === i + 1 ? 'on' : ''}" data-l="${i + 1}"><span>${s === 'B' ? n : tx((i + 1) + ' ' + n)}</span><span>${ex}</span></button>`).join('');
  $('modes').innerHTML = MODES.map(([k, short, long]) => `<button class="${cfg.mode === k ? 'on' : ''}" data-m="${k}">${s === 'B' ? long : tx(short)}</button>`).join('');
  $('styles').innerHTML = STYLES.map(([k, n]) => `<button class="${s === k ? 'on' : ''}" data-s="${k}">${tx(n)}</button>`).join('');
  const jour = cfg.mode === 'jour';
  $('boxOps').classList.toggle('dim', jour); $('boxLvl').classList.toggle('dim', jour);
  $('note').textContent = jour ? tx('20 calculs, du plus facile au plus dur, les 4 opérations. ' + (load('dailyTry', 0) === dayNum() ? 'Déjà joué : hors classement.' : 'Une seule tentative classée par jour.'))
    : cfg.mode === 'chrono' ? tx('Le plus de bonnes réponses en 60 secondes.') : tx('20 calculs chronométrés, 5 secondes de plus par erreur.');
  $('go').textContent = t('go'); $('rk').textContent = t('rk');
  $('snd').textContent = tx(cfg.son ? 'Son : oui' : 'Son : non');
}
$('menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.op) { const o = b.dataset.op; let ops = cfg.ops.includes(o) ? cfg.ops.replace(o, '') : cfg.ops + o; if (!ops) return; cfg.ops = OPS.filter(x => ops.includes(x)).join(''); }
  else if (b.dataset.l) cfg.lvl = +b.dataset.l;
  else if (b.dataset.m) cfg.mode = b.dataset.m;
  else if (b.dataset.s) setStyle(b.dataset.s);
  else if (b.id === 'snd') cfg.son = !cfg.son;
  else if (b.id === 'go') return start();
  else return;
  save('cfg', cfg); SFX.key(); renderMenu();
});

/* ---------- partie ---------- */
let S = null;
function show(id) { for (const k of ['menu', 'play', 'end']) $(k).hidden = k !== id; }
function start() {
  const mode = cfg.mode, today = dayNum();
  S = { mode, lvl: cfg.lvl, ops: cfg.ops, cat: catOf(cfg.ops), i: 0, good: 0, bad: 0, misses: [], val: '', busy: false, t0: performance.now(), over: false };
  if (mode === 'jour') { S.list = dailySeries(today); S.day = today; S.ranked = load('dailyTry', 0) !== today; save('dailyTry', today); S.ops = '+-x/'; S.cat = 'mix'; }
  // la touche ± ne sert qu'au niveau Champion (résultats négatifs)
  const pm = mode !== 'jour' && cfg.lvl === 5;
  $('pad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '±', '0', '←', 'OK'].map(k =>
    `<button data-k="${k}" class="${k === 'OK' ? 'ok' : k === '←' ? 'del' : k === '±' ? 'pm' + (pm ? '' : ' off') : ''}">${k === 'OK' ? t('ok') : k}</button>`).join('');
  show('play'); next(); SFX.key(); loop();
}
TXT.ok = { A: 'OK', B: 'Valider', C: '=' };
function next() {
  let c;
  if (S.list) c = S.list[S.i];
  else { const ops = [...S.ops]; do c = gen(ops[Math.floor(Math.random() * ops.length)], S.lvl); while (S.cur && qText(c) === qText(S.cur)); }
  S.cur = c; S.val = ''; S.busy = false; draw();
}
function draw(mark) {
  const c = S.cur, C = cfg.style === 'C';
  $('q').innerHTML = C ? segCalc(c) : qText(c) + (cfg.style === 'B' ? ' <span class="eq">=</span>' : ' =');
  const shown = mark === 'ko' ? String(c.res) : S.val;
  $('ans').innerHTML = C ? segNum(shown.replace('−', '-') || '?', 46) : (shown.replace('-', '−') || (cfg.style === 'A' ? '_' : '&nbsp;'));
  $('ans').className = 'ans' + (mark ? ' ' + mark : '');
  $('msg').className = 'msg' + (mark ? ' ' + mark : '');
  $('msg').textContent = mark === 'ok' ? tx(['Bravo !', 'Bien joué !', 'Juste !', 'Super !'][S.good % 4]) : mark === 'ko' ? tx("C'était " + neg(c.res)) : '';
  hud();
}
function hud() {
  const now = performance.now(), el = now - S.t0;
  if (S.mode === 'chrono') {
    const left = Math.max(0, CHRONO_MS - el);
    $('hl').textContent = tx('Bonnes : ') + S.good; $('hr').textContent = '⏱ ' + fmtS(left);
    $('barI').style.width = (left / CHRONO_MS * 100) + '%';
  } else {
    $('hl').textContent = tx(cfg.style === 'B' ? `calcul ${S.i + 1} sur ${SERIE}` : `Calcul ${S.i + 1}/${SERIE}`); $('hr').textContent = '⏱ ' + fmtS(el + S.bad * PENALTY).replace(/^/, '');
    $('barI').style.width = (S.i / SERIE * 100) + '%';
  }
}
function loop() {
  if (!S || S.over) return;
  hud();
  if (S.mode === 'chrono' && performance.now() - S.t0 >= CHRONO_MS) return finish();
  requestAnimationFrame(loop);
}
function press(k) {
  if (!S || S.over || S.busy) return;
  if (k === '←') S.val = S.val.slice(0, -1);
  else if (k === '±') S.val = S.val.startsWith('-') ? S.val.slice(1) : '-' + S.val;
  else if (k === 'OK') { if (S.val && S.val !== '-') answer(+S.val); return; }
  else if (/^\d$/.test(k) && S.val.replace('-', '').length < 5) S.val = S.val === '0' ? k : S.val === '-0' ? '-' + k : S.val + k;
  SFX.key();
  // juste : validé tout de suite, sans toucher OK
  if (S.val && S.val !== '-' && +S.val === S.cur.res) return answer(+S.val);
  draw();
}
function answer(v) {
  const c = S.cur, ok = v === c.res;
  S.busy = true;
  if (ok) { S.good++; SFX.ok(); }
  else { S.bad++; S.misses.push({ q: qText(c), given: v, res: c.res }); SFX.ko(); }
  draw(ok ? 'ok' : 'ko');
  const a = $('ans'); a.classList.remove('pop', 'shake'); void a.offsetWidth; a.classList.add(ok ? 'pop' : 'shake');
  setTimeout(() => { if (!S || S.over) return; S.i++; if (S.mode !== 'chrono' && S.i >= SERIE) finish(); else next(); }, ok ? 280 : 1200);
}
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  if ($('play').hidden) return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('←'); else if (e.key === 'Enter') press('OK'); else if (e.key === '-' && !$('play').querySelector('.pm.off')) press('±');
});
$('quit').addEventListener('click', () => { if (!S) return; S.over = true; SFX.key(); renderMenu(); show('menu'); });

/* ---------- fin de partie ---------- */
function finish() {
  S.over = true;
  const el = performance.now() - S.t0, today = dayNum();
  let score, key, isRec = false, stars;
  if (S.mode === 'chrono') {
    score = S.good; key = `chrono:${S.lvl}:${S.cat}`;
    if (score > 0 && !(best[key] >= score)) { best[key] = score; isRec = true; }
    stars = CHRONO_STARS[S.lvl].filter(n => score >= n).length;
  } else {
    score = Math.round(el + S.bad * PENALTY);
    stars = S.bad === 0 ? 3 : S.bad <= 2 ? 2 : S.bad <= 5 ? 1 : 0;
    if (S.mode === 'serie') { key = `serie:${S.lvl}:${S.cat}`; if (!(best[key] <= score)) { best[key] = score; isRec = true; } }
    else if (S.ranked) { daily[today] = score; save('daily', daily); }
  }
  save('best', best); save('parties', load('parties', 0) + 1);
  if (window.LudoScores) {
    const rank = r => { if (r) $('erank') && ($('erank').textContent = tx('Classement : ' + LudoScores.rankText(r))); };
    if (key && score > 0) LudoScores.submit('calculator', key, score, S.mode !== 'chrono').then(rank).catch(() => {});
    if (S.mode === 'jour' && S.ranked) LudoScores.submit('calculator', 'daily:' + today, score, true).then(rank).catch(() => {});
  }
  // l'écran de fin
  const C = cfg.style === 'C';
  $('et').textContent = tx(['Courage !', 'Pas mal !', 'Bravo !', 'Parfait !'][stars]);
  $('es').innerHTML = '★'.repeat(stars).split('').map(s => `<span>${s}</span>`).join('') + '★'.repeat(3 - stars).split('').map(s => `<span class="off">${s}</span>`).join('');
  const bigTxt = S.mode === 'chrono' ? String(score) : fmtT(score);
  $('eb').innerHTML = C ? seg(S.mode === 'chrono' ? String(score) : bigTxt.replace(/\.\d$/, ''), 44) : S.mode === 'chrono' ? score + tx(score > 1 ? ' bonnes' : ' bonne') : cfg.style === 'B' ? bigTxt.replace(/\.\d$/, '') : bigTxt;
  const rows = [];
  if (C) rows.push([`${MODES.find(m => m[0] === S.mode)[1].toUpperCase()} · ${S.mode === 'jour' ? 'DU ' + String(today).slice(6) + '/' + String(today).slice(4, 6) : 'NIV ' + S.lvl}`, S.mode === 'chrono' ? '' : fmtT(score)]);
  if (S.mode === 'chrono') rows.push([tx('Bonnes réponses'), S.good], [tx('Erreurs'), S.bad]);
  else rows.push([tx('Bonnes réponses'), `${S.good}/${SERIE}`], [tx('Pénalité'), S.bad ? `+${S.bad * PENALTY / 1000} s` : '0 s']);
  const recV = S.mode === 'jour' ? null : best[key];
  if (S.mode === 'jour') rows.push([tx(S.ranked ? 'Calcul du jour' : 'Hors classement'), S.ranked ? tx('classé') : tx('déjà joué')]);
  else rows.push([tx(isRec ? 'Nouveau record !' : 'Record'), S.mode === 'chrono' ? recV : fmtT(recV), 'rec']);
  $('er').innerHTML = rows.map(([a, b, cl]) => `<div class="${cl || ''}"><span>${a}</span><span>${b}</span></div>`).join('') + `<div class="rec" id="erank"></div>`;
  const miss = S.misses.slice(0, 6);
  $('em').innerHTML = miss.length ? (C ? '' : `<div><span>${tx(cfg.style === 'B' ? 'Je corrige :' : 'À revoir')}</span></div>`) + miss.map(m =>
    cfg.style === 'B' ? `<div><span>${m.q} = <s>${neg(m.given)}</s> <b>${neg(m.res)}</b></span></div>`
    : C ? `<div><span>${m.q} = ${neg(m.given)} ✗</span><span>${neg(m.res)}</span></div>`
    : `<div><span>${m.q} = <b>${neg(m.res)}</b></span><span>(${neg(m.given)})</span></div>`).join('') + (S.misses.length > 6 ? `<div><span>…</span></div>` : '') : '';
  $('again').textContent = t('again'); $('back').textContent = t('back');
  show('end'); SFX.end();
}
$('again').addEventListener('click', () => { SFX.key(); start(); });
$('back').addEventListener('click', () => { SFX.key(); renderMenu(); show('menu'); });

/* ---------- au démarrage ---------- */
setStyle(cfg.style); renderMenu();
// le bouton ◀ MENU de l'appli s'ajoute en haut de la page : il garde sa hauteur, le jeu prend le reste
window.addEventListener('resize', () => { const f = document.body.firstElementChild; if (f && f.id !== 'app') { f.style.flex = 'none'; document.body.style.flexWrap = 'nowrap'; } });
window.Calculator = { gen, dailySeries, start, press, answer, finish, cfg, best, daily, get S() { return S; }, renderMenu, setStyle, catOf };
</script>
<script>
/* Ludothèque : mode hors connexion, et bouton de retour au menu dans l'appli installée */
(function () {
  try {
