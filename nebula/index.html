<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula</title>
<meta name="description" content="Nebula : rogue-lite tactique spatial. Mène ta flotte à travers trois secteurs pirates jusqu'à la Rouille-Reine.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!-- polices dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/nebula.css" data-google="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv" width="544" height="960" aria-label="Nebula : combat tactique spatial"></canvas>
<script src="vaisseaux.js"></script>
<script src="evenements.js"></script>
<script src="regles.js"></script>
<script src="sons.js"></script>
<script src="../ludo-scores.js"></script>
<script>
'use strict';
/* =====================================================================
   NEBULA : rogue-lite tactique spatial (cahier des charges : specs/nebula.md).
   Les règles (combat, IA, carte, comptoir, score) sont dans regles.js ;
   ici : sauvegarde, AFFICHAGE ET COMMANDES. Écran de 544×960 pixels
   logiques (le double des jeux 272×480), agrandi avec lissage.
   ===================================================================== */
const V = window.NebulaVaisseaux;
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('nebula.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nebula.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('nebula.' + k); } catch (e) {} },
};

const LW = 544, LH = 960, TAU = Math.PI * 2, CS = 72, GX = 20, GY = 112;
const cv = document.getElementById('cv');
let g = cv.getContext('2d');   // contexte de dessin courant (le décor du combat se dessine un temps ailleurs)
const C = { acc: '#f2b24a', acc2: 'rgba(242,178,74,', txt: '#d8dee8', dim: '#7d8a9e', ally: '#7fc4ff', ally2: 'rgba(127,196,255,', foe: '#ff5a4a', foe2: 'rgba(255,90,74,', ok: '#8fe0a0' };
const F = { ui: s => `600 ${s}px Rajdhani, "Arial Narrow", sans-serif`, bold: s => `700 ${s}px Rajdhani, "Arial Narrow", sans-serif`, mono: s => `${s}px "Share Tech Mono", Consolas, monospace`, title: s => `${s}px Michroma, "Arial Narrow", sans-serif` };
let K = 1, BTN = [], now = 0, run = store.get('run', null);
{ const raw = run; run = migrate(raw); if (raw && !run) store.set('run.bak', raw); }   // illisible : mise de côté, pas effacée
const meta = Object.assign({ data: 0, games: 0, wins: 0, cleared: 0, kills: 0, bestSector: 0, unlocked: [] }, store.get('meta', {}));
if (!Array.isArray(meta.unlocked)) meta.unlocked = [];
let best = Number(store.get('best', 0)) || 0, SFX = store.get('sfx', true), VIB = store.get('vib', true), SPEED = store.get('speed', 1) === 2 ? 2 : 1;
const UI = { screen: 'title', sel: null, wi: 0, bay: false, hangar: false, pick: null, confirm: 0, node: null, legend: false, ghost: null, pickP: null, ranges: !!store.get('ranges', false) };
function save() { if (run && run.training) return; if (run && run.phase !== 'end') store.set('run', run); else store.del('run'); }

/* ---------- sprites et décors fabriqués à la demande ---------- */
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);   // écran tactile = téléphone
V.setScale(COARSE ? 1 : 2);
const want = new Set(), BGS = {};
const hexs = a => a.map(V.hex);
const BGDEF = {
  title: [4, [40, 60, 110, 90, 60, 120], [150, 1150, 520, 11, hexs(['#0a2a4a', '#164a6e', '#2a6a5a', '#6a7a4a', '#9a8a6a']), [110, 170, 255], true]],
  map: [7, [30, 50, 80, 50, 40, 70]],
  combat: [12, [50, 40, 70, 80, 40, 60], [560, 40, 120, 5, hexs(['#3a1e14', '#6a3a22', '#9a5a32', '#c88a5a', '#e8c09a']), [255, 170, 120], false]],
  hangar: [19, [20, 40, 60, 40, 40, 60]],
  // secteur 2 (nébuleuse d'Orphée, violette) et 3 (le Seuil, rouge)
  map2: [8, [70, 30, 100, 90, 40, 120]],
  combat2: [13, [80, 30, 110, 110, 50, 140], [520, 860, 140, 17, hexs(['#1a1030', '#3a2060', '#6a40a0', '#a080d0', '#e0d0ff']), [190, 140, 255], false]],
  map3: [9, [90, 30, 20, 120, 50, 30]],
  combat3: [14, [100, 30, 25, 140, 60, 30], [60, 900, 160, 23, hexs(['#200806', '#501410', '#902818', '#d05028', '#ffb070']), [255, 120, 80], false]],
};
const secBg = k => k + (run && run.sector > 1 ? run.sector : '');   // fond du secteur en cours
function spr(t) { const id = sprite(t); if (id in V.TIMES) return V.get(id); want.add(id); return null; }
function bg(k) { if (BGS[k]) return BGS[k]; want.add('bg:' + k); return null; }
function work() {
  const t0 = performance.now();
  for (const id of want) {
    if (id.startsWith('bg:')) { const d = BGDEF[id.slice(3)]; BGS[id.slice(3)] = V.space(d[0], d[1], d[2], COARSE ? 2 : 1); } else V.get(id);
    want.delete(id); if (performance.now() - t0 > 24) break;
  }
}
const RS = COARSE ? 1 : 2, ROCKS = [V.rock(52 * RS, 3), V.rock(44 * RS, 8), V.rock(60 * RS, 14)];   // astéroïdes en double définition sur ordinateur
// fond : agrandi une fois à la taille réelle de l'écran puis posé tel quel (l'agrandir à chaque image coûtait cher au téléphone)
const BGK = {};
function drawBg(k) {
  const b = bg(k); if (!b) { g.fillStyle = '#04060c'; g.fillRect(0, 0, LW, LH); return; }
  if (g !== cv.getContext('2d')) { g.drawImage(b, 0, 0); return; }
  let c = BGK[k]; if (!c || c.K !== K) { const [c2, g2] = V.mk(Math.round(LW * K), Math.round(LH * K)); g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = 'high'; g2.drawImage(b, 0, 0, c2.width, c2.height); c = BGK[k] = c2; c.K = K; }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, 0, 0); g.restore();
}

/* ---------- petits outils de dessin ---------- */
// texte ; s'il dépasse la largeur permise (par défaut : jusqu'au bord de l'écran moins 16 px), il est resserré
function txt(s, x, y, col, font, align = 'left', ls = 0, maxW) {
  g.font = font; g.textAlign = align; g.textBaseline = 'top'; g.fillStyle = col;
  // largeur mesurée sans espacement, puis espacement ajouté à la main (tous les navigateurs ne le comptent pas)
  const has = 'letterSpacing' in g; if (has) g.letterSpacing = '0px';
  const room = maxW || (align === 'center' ? Math.min(x, LW - x) * 2 - 32 : align === 'right' ? x - 16 : LW - x - 16), w = g.measureText(s).width + (has ? ls * s.length : 0);
  if (has) g.letterSpacing = ls + 'px';
  if (w > room && room > 0) { g.save(); g.translate(x, y); g.scale(room / w, 1); g.fillText(s, 0, 0); g.restore(); } else g.fillText(s, x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
function wrapLines(s, maxW, font) { g.font = font; const out = []; let line = ''; for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } if (line) out.push(line); return out; }
function para(s, x, y, maxW, col, font, lh) { const L = wrapLines(s, maxW, font); L.forEach((l, i) => txt(l, x, y + i * lh, col, font)); return L.length * lh; }
function frameBox(x, y, w, h, col, corner = 10, fill = 'rgba(6,10,18,.72)') {
  g.fillStyle = fill; g.fillRect(x, y, w, h);
  g.strokeStyle = col; g.lineWidth = 1; g.globalAlpha = .35; g.strokeRect(x + .5, y + .5, w - 1, h - 1); g.globalAlpha = 1;
  g.lineWidth = 2; g.beginPath();
  for (const [px, py, sx, sy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) { g.moveTo(px + sx * corner, py + sy); g.lineTo(px + sx, py + sy); g.lineTo(px + sx, py + sy * corner); }
  g.stroke();
}
function corners(x, y, w, h, col, len = 10, lw = 2) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
  for (const [px, py, sx, sy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) { g.moveTo(px + sx * len, py); g.lineTo(px, py); g.lineTo(px, py + sy * len); } g.stroke(); }
// bouton : o.primary (ambre), o.off (grisé, sans action), o.size, o.col
function btn(x, y, w, h, label, act, o = {}) {
  const size = o.size || 20, col = o.off ? 'rgba(125,138,158,.45)' : o.col || (o.primary ? C.acc : C.dim);
  if (o.primary && !o.off) { g.fillStyle = C.acc2 + '.16)'; g.fillRect(x, y, w, h); }
  frameBox(x, y, w, h, col, 8, o.primary ? 'rgba(0,0,0,0)' : 'rgba(6,10,18,.6)');
  txt(label, x + w / 2, y + (h - size) / 2 + 1, o.off ? 'rgba(125,138,158,.6)' : o.col || (o.primary ? C.acc : C.txt), F.ui(size), 'center', o.ls == null ? 3 : o.ls, w - 14);
  if (!o.off && act) BTN.push({ x, y, w, h, act, primary: !!o.primary });
}
// zone tactile ; o.hold : l'action attend le lever du doigt, et un toucher long fait o.hold à la place
function zone(x, y, w, h, act, o) { BTN.push({ x, y, w, h, act, hold: o && o.hold }); }
function meter(x, y, w, v, max, col) { const n = Math.max(1, max), gap = n > 12 ? 1 : 2, sw = (w - (n - 1) * gap) / n; for (let i = 0; i < n; i++) { g.fillStyle = i < v ? col : 'rgba(255,255,255,.08)'; g.fillRect(x + i * (sw + gap), y, sw, 6); } }
function topBar(left, sub, r1, r2, subW) {
  const gr = g.createLinearGradient(0, 0, 0, 96); gr.addColorStop(0, 'rgba(4,6,12,.95)'); gr.addColorStop(1, 'rgba(4,6,12,.55)'); g.fillStyle = gr; g.fillRect(0, 0, LW, 96);
  g.fillStyle = C.acc2 + '.5)'; g.fillRect(24, 94, LW - 48, 1);
  txt(left, 24, 22, C.txt, F.title(19), 'left', 4); txt(sub, 24, 56, C.dim, F.ui(20), 'left', 2, subW);
  txt(r1, LW - 24, 22, C.acc, F.mono(22), 'right'); txt(r2, LW - 24, 54, C.dim, F.mono(20), 'right');
}
const pad2 = n => String(n).padStart(2, '0');
function drawSprite(t, x, y, sc = 1, alpha = 1) { const s = spr(t); if (s) V.drawShip(g, s, x, y, sc, now, alpha); }
const fitScale = (t, h) => Math.min(1.6, h / (TYPES[t].n * 72));

/* ---------- sons : nebula/sons.js (bruitages étouffés, bips discrets, saut lourd, ambiances) ---------- */
const AU = {};
function au() {
  if (!SFX) return null;
  if (!AU.ctx) { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx || !window.NebulaSons) return null; AU.ctx = new Ctx(); AU.out = AU.ctx.createGain(); AU.out.gain.value = .9; AU.out.connect(AU.ctx.destination);
    NebulaSons.init(AU.ctx, AU.out); AU.warm = NebulaSons.LIST.slice(); }
  if (AU.ctx.state === 'suspended' && !document.hidden) AU.ctx.resume(); ambience(); return AU.ctx;
}
// fabrique les sons d'avance, un à la fois, quand le jeu est au repos
function warmSounds() { if (AU.warm && AU.warm.length) NebulaSons.warm(AU.warm.shift()); }
// nom du jeu → son retenu ; pan : position du tir à l'écran (-1 gauche, 1 droite)
const SND = { canon: 'canon', essaim: 'canon', laser: 'laser', missile: 'missile', torpille: 'torpille', charge: 'missile', salve: 'missile', boom: 'explosion', shield: 'bouclier', coque: 'coque',
  jump: 'saut', click: 'bip', valide: 'valide', grapple: 'grappin', winch: 'treuil', ion: 'ion', warp: 'renforts', couvee: 'renforts', heal: 'soin', mark: 'marque', mine: 'mine', jam: 'ion',
  win: 'victoire', lose: 'defaiteB' };
function sfx(k, delay = 0, pan = 0) {
  if (!au()) return; delay = Math.max(0, delay);
  const t = AU.ctx.currentTime + delay;
  if (k === 'salve') { for (let i = 0; i < 3; i++) NebulaSons.play('missile', t + i * .08, pan + (i - 1) * .2, .6); return; }
  if (SND[k]) NebulaSons.play(SND[k], t, pan);
}
const panX = x => (x / LW - .5) * 1.4;
/* ambiance (réglage AMBIANCE de l'écran titre) : TENSION en combat, GARDE sur les autres écrans ; coupée quand la page est cachée */
let AMB = store.get('amb', false);
function ambience() {
  if (!AU.ctx) return;
  const on = SFX && AMB && !document.hidden, combat = UI.screen === 'game' && run && run.phase === 'combat' && !run.training;
  NebulaSons.ambience(on ? (combat ? 'tension' : 'garde') : null);
}
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else if (SFX) AU.ctx.resume(); ambience(); });

// vibration courte quand un vaisseau du joueur est touché (réglage VIBRATIONS de l'écran titre)
function buzz(ms, delay = 0) { if (!VIB || !navigator.vibrate) return; setTimeout(() => { try { navigator.vibrate(ms); } catch (e) {} }, Math.max(0, delay) * 1000); }

/* ---------- animations : on rejoue les événements de la logique ---------- */
const ANIM = { move: {}, death: {}, spawn: {}, fx: [], busy: 0, arrive: 0 };
const busy = () => now < ANIM.busy;
const center = s => [GX + s.c * CS + CS / 2, GY + s.r * CS + lenOf(s) * CS / 2];
const cellCenter = (c, r) => [GX + c * CS + CS / 2, GY + r * CS + CS / 2];
function resetAnim() { ANIM.move = {}; ANIM.death = {}; ANIM.spawn = {}; ANIM.fx = []; ANIM.busy = 0; ANIM.arrive = 0; }
function play(ev) {
  const st = run.combat, k = 1 / SPEED; let t = Math.max(now, ANIM.busy);   // k : animations deux fois plus rapides en ×2
  for (const e of ev) {
    const s = e.id != null ? byId(st, e.id) : null;
    if (e.e === 'turn') { if (e.n > 1) ANIM.fx.push({ k: 'banner', t0: t, dur: 1 * k, text: 'TOUR ' + e.n }); t += .2 * k; }
    else if (e.e === 'move') { const d = ((e.path.length - 1) * .1 + .05) * k; if (e.pulled) sfx('winch', t - now); (ANIM.move[e.id] = ANIM.move[e.id] || []).push({ t0: t, t1: t + d, path: e.path }); t += d + .04 * k; }
    else if (e.e === 'shot') {
      const a = byId(st, e.from), d = (e.fx === 'torpille' ? .55 : e.fx === 'missile' ? .45 : e.fx === 'charge' ? .3 : .25) * k;
      const to = e.to != null ? center(byId(st, e.to)) : cellCenter(...e.cell);
      ANIM.fx.push({ k: 'shot', fx: e.fx, foe: a.side === 'E', t0: t, dur: d, a: center(a), b: to }); sfx(e.fx, t - now, panX(center(a)[0])); t += d;
    }
    else if (e.e === 'swarm') { ANIM.fx.push({ k: 'swarm', t0: t, dur: .35 * k, a: center(s || byId(st, e.from)) }); sfx('essaim', t - now); t += .3 * k; }
    else if (e.e === 'dmg') { const [x, y] = center(s); ANIM.fx.push({ k: 'num', t0: t, dur: 1, x, y, text: '-' + e.n, col: e.hull ? (s.side === 'E' ? C.acc : C.foe) : C.ally }); ANIM.fx.push({ k: 'hit', t0: t, dur: .3 * k, x, y, shield: !e.hull }); if (!e.hull) sfx('shield', t - now, panX(x)); else { sfx('coque', t - now, panX(x)); if (s.side === 'P') buzz(e.n >= 4 ? 70 : 35, t - now); } }
    else if (e.e === 'boom') { const [x, y] = center(s); ANIM.death[e.id] = t + .08 * k; ANIM.fx.push({ k: 'boom', t0: t, dur: .9 * k, x, y, big: e.big }); ANIM.fx.push({ k: 'debris', t0: t, dur: 1.3 * k, x, y, big: e.big, seed: e.id * 97 + 13, foe: s.side === 'E' }); sfx('boom', t - now, panX(x)); if (s.side === 'P') buzz(160, t - now); t += .22 * k; }
    else if (e.e === 'blast') { const [x, y] = cellCenter(e.c, e.r); ANIM.fx.push({ k: 'blast', t0: t, dur: .6 * k, x, y, big: e.big }); sfx('boom', t - now); t += .15 * k; }
    else if (e.e === 'spawn') { ANIM.spawn[e.id] = t; const [x, y] = center(s); sfx(s.t === 'brulot' ? 'couvee' : 'warp', t - now); ANIM.fx.push({ k: 'warp', t0: t, dur: .5 * k, x, y }); t += .25 * k; }
    else if (e.e === 'ion') { const [x, y] = center(s); ANIM.fx.push({ k: 'hit', t0: t, dur: .5 * k, x, y, shield: true }); ANIM.fx.push({ k: 'num', t0: t, dur: .9, x, y, text: 'BOUCLIER PERDU', col: C.ally, small: true }); sfx('ion', t - now); t += .1 * k; }
    else if (e.e === 'shield') { const [x, y] = center(s); ANIM.fx.push({ k: 'hit', t0: t, dur: .5 * k, x, y, shield: true }); }
    else if (e.e === 'heal') { const [x, y] = center(s); sfx('heal', t - now); ANIM.fx.push({ k: 'num', t0: t, dur: 1, x, y, text: '+' + e.n, col: C.ok }); }
    else if (e.e === 'mark') { const [x, y] = center(s); sfx('mark', t - now); ANIM.fx.push({ k: 'num', t0: t, dur: .9, x, y, text: 'MARQUÉ', col: C.acc, small: true }); }
    else if (e.e === 'zone') { ANIM.fx.push({ k: 'zone', t0: t, dur: .6 * k, x: GX + e.c * CS, y: GY + e.r * CS }); sfx('salve', t - now); t += .2 * k; }
    else if (e.e === 'jam') { const [x, y] = center(s); ANIM.fx.push({ k: 'num', t0: t, dur: .9, x, y, text: 'BROUILLÉ', col: '#78dcff', small: true }); }
    else if (e.e === 'mine') { const [x, y] = cellCenter(e.c, e.r); sfx('mine', t - now, panX(x)); ANIM.fx.push({ k: 'hit', t0: t, dur: .4 * k, x, y, shield: e.side === 'P' }); ANIM.fx.push({ k: 'num', t0: t, dur: .8, x, y, text: 'MINE POSÉE', col: e.side === 'P' ? C.acc : C.foe, small: true }); t += .15 * k; }
    else if (e.e === 'miss') { const [x, y] = cellCenter(...e.cell); ANIM.fx.push({ k: 'num', t0: t, dur: .8, x, y, text: 'DANS LE VIDE', col: C.dim, small: true }); }
  }
  ANIM.busy = t;
}
// début d'un combat : la flotte arrive très vite du bas de l'écran et freine jusqu'à sa case de départ
function arrive(st) {
  // le saut ne s'entend qu'ici : sa montée de 2 s, puis la flotte surgit avec le « vwOOM »
  const k = 1 / SPEED, snd = !!au(); if (snd) sfx('jump'); const base = snd ? now + 1.95 : now; let end = now;
  st.ships.filter(o => o.side === 'P' && !o.dead).sort((a, b) => a.r - b.r || a.c - b.c).forEach((o, i) => {
    const t0 = base + .1 * k + i * .08 * k, t1 = t0 + .6 * k;
    ANIM.move[o.id] = [{ t0, t1, path: [[o.c, o.r + 8], [o.c, o.r]], ease: 1 }]; end = Math.max(end, t1);
  });
  ANIM.busy = Math.max(ANIM.busy, end); ANIM.arrive = end;
}
function shipPos(s) {
  const segs = ANIM.move[s.id]; let c = s.c, r = s.r;
  if (segs && segs.length) {
    const cur = segs.filter(q => q.t0 <= now).pop();
    if (!cur) [c, r] = segs[0].path[0];
    else if (now < cur.t1) { const p = cur.path, v = (now - cur.t0) / (cur.t1 - cur.t0), f = (cur.ease ? 1 - (1 - v) ** 3 : v) * (p.length - 1), i = Math.min(p.length - 2, Math.floor(f)), u = f - i; c = p[i][0] + (p[i + 1][0] - p[i][0]) * u; r = p[i][1] + (p[i + 1][1] - p[i][1]) * u; }
    else [c, r] = cur.path[cur.path.length - 1];
    if (now > segs[segs.length - 1].t1) delete ANIM.move[s.id];
  }
  return [GX + c * CS + CS / 2, GY + r * CS + lenOf(s) * CS / 2, c, r];
}
const visible = s => s.dead ? (ANIM.death[s.id] != null && now < ANIM.death[s.id]) : !(ANIM.spawn[s.id] > now);
function drawFx() {
  ANIM.fx = ANIM.fx.filter(f => now < f.t0 + f.dur + .05);
  for (const f of ANIM.fx) {
    const u = (now - f.t0) / f.dur; if (u < 0 || u > 1) continue;
    g.save();
    if (f.k === 'shot') {
      const [ax, ay] = f.a, [bx, by] = f.b, col = f.foe ? '255,110,80' : '255,200,120';

// effet d'un module sur un vaisseau : « VITESSE 3 → 4 »
function modPreview(f, m) {
  const ws = TYPES[f.t].w, up = (a, b) => `${a} → ${b}`;
  if (m === 'blindage') return 'COQUE MAX ' + up(maxHullOf(f), maxHullOf(f) + 3);
  if (m === 'bouclier') return 'BOUCLIER ' + up(shMaxOf(f), shMaxOf(f) + 1);
  if (m === 'propulseurs') return 'VITESSE ' + up(spdOf(f), spdOf(f) + 1);
  if (m === 'ciblage') { const a = ws.filter(w => !w.swarm); return a.length ? 'PORTÉE ' + a.map(w => `${w.name} ${up(wRng(f, w), wRng(f, w) + 1)}`).join(' · ') : ws.length ? "SANS EFFET SUR L'ESSAIM" : 'SANS EFFET : PAS D\'ARME'; }
  if (m === 'canons') return ws.length ? 'DÉGÂTS ' + ws.map(w => `${w.name} ${up(wDmg(f, w), wDmg(f, w) + 1)}`).join(' · ') : 'SANS EFFET : PAS D\'ARME';
  return '';
}
// effet d'un pilote sur un vaisseau (à la place du pilote déjà posé, dont on perd le bonus) : « VITESSE 3 → 4 »
function pilotPreview(f, p) {
  const g2 = Object.assign({}, f, { pilot: p }), up = (a, b) => `${a} → ${b}`, out = [], ws = TYPES[f.t].w;
  if (maxHullOf(g2) !== maxHullOf(f)) out.push('COQUE MAX ' + up(maxHullOf(f), maxHullOf(g2)));
  if (shMaxOf(g2) !== shMaxOf(f)) out.push('BOUCLIER ' + up(shMaxOf(f), shMaxOf(g2)));
  if (spdOf(g2) !== spdOf(f)) out.push('VITESSE ' + up(spdOf(f), spdOf(g2)));
  if (ws.some(w => wDmg(g2, w) !== wDmg(f, w))) out.push('DÉGÂTS ' + ws.map(w => `${w.name} ${up(wDmg(f, w), wDmg(g2, w))}`).join(' · '));
  if (p.k === 'mecano') out.push('+1 COQUE À CHAQUE TOUR DE COMBAT');
  if (p.k === 'veteran' && (p.vet || 0) < 4) out.push('+1 COQUE MAX PAR VICTOIRE');
  if (p.k === 'tireur' && !ws.length) out.push("SANS EFFET : PAS D'ARME");
  return out.join(' · ') || 'SANS CHANGEMENT';
}

/* ---------- entraînement guidé (tutoriel) ----------
   Un combat préparé (makeTraining) joué à la place de la partie, qui est mise de côté puis rendue
   telle quelle (l'entraînement n'est jamais sauvegardé). Proposé une fois avant le premier départ
   (nebula.tuto), et rejouable depuis le manuel. Étapes : 0 accueil, 1 choisir, 2 esquiver, 3 tirer,
   4 bouclier et coque, 5 FIN DU TOUR, 6 bravo, 7 combat libre jusqu'au bout. */
const TUTO = { on: false, step: 0, real: null, after: null, label: 'TERMINER' };
function startTraining(after, label = 'TERMINER') {
  store.set('tuto', 1);
  TUTO.real = run; TUTO.after = after; TUTO.label = label; TUTO.step = 0; TUTO.on = true;
  run = { training: true, phase: 'combat', combat: makeTraining(), sector: 1, fleet: [] };
  UI.screen = 'game'; UI.sel = null; UI.hangar = false; resetAnim();
}
function leaveTraining() { if (!TUTO.on) return; TUTO.on = false; run = TUTO.real; TUTO.real = null; resetAnim(); UI.sel = null; UI.ghost = null; }
function endTraining() { const a = TUTO.after; leaveTraining(); TUTO.after = null; if (a) a(); else UI.screen = 'title'; }
// premier départ : on propose l'entraînement une fois (même à qui a déjà joué)
function launch(go) { if (store.get('tuto', 0)) go(); else { UI.screen = 'tutoAsk'; UI.after = go; } }
function drawTutoAsk() {
  drawBg('hangar');
  frameBox(40, 280, LW - 80, 330, C.ally, 14, 'rgba(6,10,18,.94)');

  btn(92, 476, LW - 184, 54, "S'ENTRAÎNER", () => startTraining(UI.after, 'DÉCOLLER'), { primary: true, size: 22 });
  btn(92, 542, LW - 184, 46, 'PARTIR DIRECTEMENT', () => { store.set('tuto', 1); const go = UI.after; UI.after = null; go(); }, { size: 19 });
}
const inDanger = (st, s) => { const d = dangerMap(st); return cellsOf(s).some(([c, r]) => d.get(c + ',' + r)); };
// une bulle d'aide : en haut de l'écran (y = 4) ou au milieu ; les touchers dessus ne passent pas au combat
function bubble(title, text, y, btns = [], quit = true) {
  const L = wrapLines(text, LW - 72, F.ui(19)), h = 44 + L.length * 22 + (btns.length ? 64 : 0);
  if (y == null) y = Math.round((LH - h) / 2) - 40;

  L.forEach((l, i) => txt(l, 34, y + 38 + i * 22, C.txt, F.ui(19)));
  if (quit) btn(LW - 132, y + 6, 104, 30, 'QUITTER', () => endTraining(), { size: 14, ls: 1 });
  btns.forEach(([label, act, primary], i) => { const w = (LW - 80 - (btns.length - 1) * 12) / btns.length; btn(40 + i * (w + 12), y + h - 58, w, 46, label, act, { primary, size: 19 }); });
}
const pulseBox = (x, y, w, h, col) => { g.globalAlpha = .5 + Math.sin(now * 6) * .5; corners(x - 4, y - 4, w + 8, h + 8, col, 16, 3); g.globalAlpha = 1; };
function drawTuto(st) {
  const B = busy(), ch = st.ships.find(s => s.t === 'chasseur'), mine = sideOf(st, 'P');
  if (!ch) return;
  // on avance tout seul quand le joueur a fait ce qu'on attend
  if (TUTO.step >= 1 && TUTO.step <= 5 && st.turn >= 2 && !B) TUTO.step = 6;
  if (TUTO.step === 1 && UI.sel === ch.id) TUTO.step = 2;
  if (TUTO.step === 2 && ((ch.moved && !inDanger(st, ch)) || ch.acted)) TUTO.step = 3;
  if (TUTO.step === 3 && mine.some(s => s.acted) && !B) TUTO.step = 4;
  if (TUTO.step === 7 || st.result) return;
  const L = GX + ch.c * CS, T = GY + ch.r * CS;
  if (TUTO.step === 0) { g.fillStyle = 'rgba(2,4,8,.6)'; g.fillRect(0, 0, LW, LH); zone(0, 0, LW, LH, () => {});
