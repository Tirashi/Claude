<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Club d'agility</title>
<meta name="description" content="Le Club d'agility : entraîne tes chiens, gagne des concours et fais grandir ton club jusqu'au Championnat de France.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1c2a1a">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #0f1a12; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; cursor: pointer; }
#ask { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(4,10,6,.7); }
#ask[hidden] { display: none; }
#ask form { width: min(320px, 90vw); padding: 16px; background: linear-gradient(#34543a, #142616); border: 3px solid #f4efe6; box-shadow: 0 0 0 3px #120c16, 4px 4px 0 3px #120c16; border-radius: 4px; }
#askTitle { font: 12px 'Press Start 2P', monospace; color: #ffd23f; text-align: center; margin-bottom: 14px; text-shadow: 2px 2px 0 #120c16; }
#askInput { box-sizing: border-box; width: 100%; font: 14px 'Press Start 2P', monospace; padding: 10px 8px; color: #120c16; background: #fff6e0; border: 3px solid #120c16; border-radius: 2px; }
#ask .row { display: flex; gap: 10px; margin-top: 14px; }
#ask button { flex: 1; font: 10px 'Press Start 2P', monospace; padding: 10px 4px; color: #fff; background: #2c4a30; border: 3px solid #120c16; box-shadow: inset 0 2px 0 rgba(255,255,255,.25); cursor: pointer; }
#ask #askOk { background: #a07018; color: #fff6c2; }
</style>
</head>
<body>
<canvas id="cv" width="272" height="480" aria-label="Le Club d'agility"></canvas>
<div id="ask" hidden><form onsubmit="return false"><div id="askTitle"></div><input id="askInput" type="text" autocomplete="off" spellcheck="false">
<div class="row"><button type="button" id="askNo">ANNULER</button><button type="submit" id="askOk">OK</button></div></form></div>
<script src="../injagility/chiens32.js"></script>
<script src="../ludo-scores.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu. */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
