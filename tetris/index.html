<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetris 16 bits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a tall well on the left, a column of RPG windows on the right, touch pad under both. */
:root{
  color-scheme: dark;
  --night:#0d0f1f; --night-2:#191c38;
  --win-top:#3b2a8a; --win-bot:#160f45; --frame:#f2eeff; --frame-shadow:#7a68c8; --ink:#05040f;
  --text:#f2eeff; --dim:#aaa2dc; --gold:#facc15;
  --f-display:"Press Start 2P","Courier New",monospace; --f-body:"VT323","Lucida Console",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0; background-color:var(--night); color:var(--text); font-family:var(--f-body); font-size:20px;
  background-image:radial-gradient(var(--night-2) 1px, transparent 1.5px); background-size:4px 4px;
  padding-inline:16px; padding-block:18px 36px}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:50; background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px)}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
h1{margin:0; text-align:center; font-family:var(--f-display); font-weight:400; font-size:clamp(26px,8vw,40px); letter-spacing:6px; line-height:1.2}
h1 span:nth-child(6n+1){color:#ef4444} h1 span:nth-child(6n+2){color:#f97316} h1 span:nth-child(6n+3){color:#facc15}
h1 span:nth-child(6n+4){color:#22c55e} h1 span:nth-child(6n+5){color:#22d3ee} h1 span:nth-child(6n){color:#a855f7}
h1 span{text-shadow:3px 3px 0 #000}
.win{background:linear-gradient(var(--win-top), var(--win-bot)); border:4px solid var(--frame); border-radius:6px;
  box-shadow:0 0 0 3px var(--ink), inset 0 0 0 2px var(--frame-shadow), 6px 6px 0 3px #000; padding:10px}
.game{display:flex; gap:14px; align-items:flex-start; justify-content:center}
.well{flex:0 0 auto; width:clamp(170px, 54vw, 270px); position:relative}
.well canvas{display:block; width:100%; height:auto; aspect-ratio:1/2; image-rendering:pixelated; image-rendering:crisp-edges; border:3px solid var(--ink)}
.side{flex:1 1 0; min-width:0; max-width:170px; display:flex; flex-direction:column; gap:12px}
.stat{text-align:center}
.stat .k{font-family:var(--f-display); font-size:8px; letter-spacing:1px; color:var(--dim)}
.stat .v{font-family:var(--f-display); font-size:clamp(11px,3.4vw,15px); color:var(--gold); margin-top:8px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
#nextCanvas{display:block; width:100%; max-width:96px; margin:8px auto 0; aspect-ratio:1; image-rendering:pixelated}
.keys{font-size:17px; line-height:1.25; color:var(--dim)}
.keys b{font-family:var(--f-display); font-size:7px; font-weight:400; color:var(--text)}
.overlay{position:absolute; inset:3px; display:grid; place-items:center; background:rgba(5,4,15,.78); padding:10px}
.overlay .win{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.overlay h2{margin:0; font-family:var(--f-display); font-weight:400; font-size:clamp(12px,4vw,16px); color:var(--gold); text-shadow:3px 3px 0 #000; line-height:1.5}
.overlay p{margin:0; font-size:20px}
.btn{font-family:var(--f-display); font-size:9px; letter-spacing:1px; color:var(--text); background:linear-gradient(#5a46c0,#2a1e80); border:3px solid var(--frame); border-radius:4px; padding:10px 12px; cursor:pointer;
  box-shadow:0 0 0 2px var(--ink), 3px 3px 0 2px #000; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.btn:hover{background:linear-gradient(#6c58d8,#3a2c9a); color:var(--gold)}
.btn:active,.btn.on{transform:translate(2px,2px); box-shadow:0 0 0 2px var(--ink), 1px 1px 0 2px #000}
.btn:focus-visible{outline:3px dashed var(--gold); outline-offset:3px}
.pad{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.pad .btn{font-family:Arial,"Segoe UI Symbol",sans-serif; font-size:22px; padding:10px 0}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
@media (max-width:420px){ .keys{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <h1 aria-label="Tetris"><span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span></h1>
  <div class="game">
    <div class="win well">
      <canvas id="board" width="80" height="160" tabindex="0" aria-label="Puits de jeu"></canvas>
      <div class="overlay" id="overlay">
        <div class="win">
          <h2 id="overlayTitle">TETRIS</h2>
          <p id="overlayScore">Appuie sur Entrée pour jouer.</p>
          <button class="btn" id="overlayBtn" type="button">JOUER</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="win stat"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
      <div class="win stat"><div class="k">NIVEAU</div><div class="v" id="level">1</div></div>
      <div class="win stat"><div class="k">LIGNES</div><div class="v" id="lines">0</div></div>
      <div class="win stat"><div class="k">SUIVANT</div><canvas id="nextCanvas" width="32" height="32"></canvas></div>
      <div class="win stat"><div class="k">RECORD</div><div class="v" id="best">0</div></div>
      <div class="win keys">
        <b>GAUCHE DROITE</b> déplacer<br><b>HAUT</b> rotation<br><b>BAS</b> chute rapide<br><b>ESPACE</b> chute directe<br><b>P</b> pause
      </div>
    </div>
  </div>
  <div class="pad" aria-label="Commandes tactiles">
    <button class="btn" type="button" data-a="left" aria-label="Gauche">◀</button>
    <button class="btn" type="button" data-a="rotate" aria-label="Rotation">↻</button>
    <button class="btn" type="button" data-a="right" aria-label="Droite">▶</button>
    <button class="btn" type="button" data-a="soft" aria-label="Chute rapide">▼</button>
    <button class="btn" type="button" data-a="hard" aria-label="Chute directe">⤓</button>
  </div>
  <div class="row">
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="soundBtn" type="button">SON : OUI</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  const COLS = 10, ROWS = 20, B = 8;   // blocs de 8 px logiques
  const canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
  const nextCanvas = document.getElementById("nextCanvas"), nextCtx = nextCanvas.getContext("2d");
  ctx.imageSmoothingEnabled = nextCtx.imageSmoothingEnabled = false;
  const $ = id => document.getElementById(id);
  const scoreEl = $("score"), levelEl = $("level"), linesEl = $("lines"), bestEl = $("best");
  const overlay = $("overlay"), overlayTitle = $("overlayTitle"), overlayScore = $("overlayScore"), overlayBtn = $("overlayBtn");

  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  /* ---------- son ---------- */
  let actx = null, soundOn = store.get("tetris16.sound", true);
  function tone(notes, type = "square", dur = .05, vol = .045) {
    if (!soundOn) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); let t = actx.currentTime;
      for (const f of notes) { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .9; }
    } catch (e) {}
  }
  const SFX = {
    move: () => tone([300], "triangle", .025, .05), rotate: () => tone([520, 700], "square", .03, .03),
    lock: () => tone([140], "triangle", .06, .08), drop: () => tone([400, 200, 120], "square", .03, .04),
    clear: n => tone(n === 4 ? [523, 659, 784, 1047, 1319] : [659, 880, 1047].slice(0, n + 1), "square", .07, .05),
    level: () => tone([523, 659, 784, 1047], "square", .09, .05), over: () => tone([392, 349, 311, 262, 196], "square", .15, .05),
  };

  /* ---------- pièces (règles de l'original) ---------- */
  const COLORS = { I: "#22d3ee", O: "#facc15", T: "#a855f7", S: "#22c55e", Z: "#ef4444", J: "#3b82f6", L: "#f97316" };
  const SHAPES = {
    I: [[0,0],[1,0],[2,0],[3,0]], O: [[0,0],[1,0],[0,1],[1,1]], T: [[0,0],[1,0],[2,0],[1,1]],
    S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]], L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES = Object.keys(SHAPES);

  // briques 16 bits : bord clair en haut à gauche, sombre en bas à droite, reflet
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c + (k > 0 ? (255 - c) * k : c * k))));
    return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, "0")).join("");
  }
  const TILE = {};
  for (const t of TYPES) {
    const c = document.createElement("canvas"); c.width = c.height = B; const g = c.getContext("2d"), base = COLORS[t];
    g.fillStyle = shade(base, -.65); g.fillRect(0, 0, B, B);
    g.fillStyle = base; g.fillRect(1, 1, 6, 6);
    g.fillStyle = shade(base, .5); g.fillRect(1, 1, 6, 1); g.fillRect(1, 1, 1, 6);
    g.fillStyle = shade(base, -.35); g.fillRect(1, 6, 6, 1); g.fillRect(6, 1, 1, 6);
    g.fillStyle = "#ffffff"; g.fillRect(2, 2, 1, 1);
    TILE[t] = c;
  }
  const WELL = document.createElement("canvas"); WELL.width = COLS * B; WELL.height = ROWS * B;
  (() => { const g = WELL.getContext("2d"); g.fillStyle = "#0b0a24"; g.fillRect(0, 0, WELL.width, WELL.height);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { g.fillStyle = (x + y) % 2 ? "#100e30" : "#0d0b2a"; g.fillRect(x * B, y * B, B, B); g.fillStyle = "#1a1748"; g.fillRect(x * B, y * B, 1, 1); } })();

  function randomType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }
  function createPiece(type) { return { type, cells: SHAPES[type].map(([x, y]) => ({ x, y })), x: 3, y: -1 }; }
  function rotateCells(cells) {
    const cx = 1.5, cy = 1.5;
    return cells.map(({ x, y }) => ({ x: Math.round(cx - (y - cy)), y: Math.round(cy + (x - cx)) }));
  }

  let board = createEmptyBoard(), current = null, next = null;
  let score = 0, level = 1, linesCleared = 0, dropInterval = 800, dropTimer = 0, lastTime = 0;
  let paused = false, gameOver = false, started = false, animFrame = null, clearingRows = [], clearAnimTimer = 0;
  let best = store.get("tetris16.best", 0); bestEl.textContent = best;
  const CLEAR_FLASH_INTERVAL = 80, CLEAR_ANIM_DURATION = 320;

  function createEmptyBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
  function spawnPiece() {
    current = next || createPiece(randomType()); current.x = 3; current.y = -1;
    next = createPiece(randomType()); drawNext();
    if (collides(current, 0, 0)) endGame();
  }
  function collides(piece, dx, dy, cellsOverride) {
    for (const c of cellsOverride || piece.cells) {
      const nx = piece.x + c.x + dx, ny = piece.y + c.y + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
    return false;
  }
  function merge() { for (const c of current.cells) { const ny = current.y + c.y; if (ny >= 0) board[ny][current.x + c.x] = current.type; } }
  function getFullRows() { const rows = []; for (let y = 0; y < ROWS; y++) if (board[y].every(c => c)) rows.push(y); return rows; }
  function finishClear() {
    const cleared = clearingRows.length, gone = new Set(clearingRows);
    board = board.filter((_, y) => !gone.has(y));
    while (board.length < ROWS) board.unshift(Array(COLS).fill(null));
    score += [0, 100, 300, 500, 800][cleared] * level;
    linesCleared += cleared;
    const newLevel = 1 + Math.floor(linesCleared / 10);
    if (newLevel > level) SFX.level();
    level = newLevel;
    dropInterval = Math.max(100, 800 - (level - 1) * 60);
    updateHUD(); clearingRows = []; spawnPiece();
  }
  function updateHUD() { scoreEl.textContent = score; levelEl.textContent = level; linesEl.textContent = linesCleared; }
  function hardDrop() { let n = 0; while (!collides(current, 0, 1)) { current.y++; n++; } if (n) SFX.drop(); lockPiece(); }
  function lockPiece() {
    merge();
    const full = getFullRows();
    if (full.length) { clearingRows = full; clearAnimTimer = 0; current = null; SFX.clear(full.length); }
    else { spawnPiece(); SFX.lock(); }
    dropTimer = 0;
  }
  function move(dx) { if (!collides(current, dx, 0)) { current.x += dx; SFX.move(); } }
  function softDrop() { if (!collides(current, 0, 1)) { current.y++; score += 1; updateHUD(); } else lockPiece(); }
  function rotate() {
    if (current.type === "O") return;
    const rotated = rotateCells(current.cells);
    for (const k of [0, -1, 1, -2, 2]) if (!collides(current, k, 0, rotated)) { current.cells = rotated; current.x += k; SFX.rotate(); return; }
  }
  function getGhostY() { let dy = 0; while (!collides(current, 0, dy + 1)) dy++; return current.y + dy; }

  function draw() {
    ctx.drawImage(WELL, 0, 0);
    const flashOn = clearingRows.length > 0 && Math.floor(clearAnimTimer / CLEAR_FLASH_INTERVAL) % 2 === 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!board[y][x]) continue;
      if (clearingRows.includes(y) && flashOn) { ctx.fillStyle = "#ffffff"; ctx.fillRect(x * B, y * B, B, B); continue; }
      ctx.drawImage(TILE[board[y][x]], x * B, y * B);
    }
    if (current) {
      const gy = getGhostY();
      ctx.fillStyle = COLORS[current.type];
      for (const c of current.cells) {
        const px = (current.x + c.x) * B, py = (gy + c.y) * B;
        if (gy + c.y < 0) continue;
        // fantôme : contour pointillé façon pixel
        for (let i = 0; i < B; i += 2) { ctx.fillRect(px + i, py, 1, 1); ctx.fillRect(px + i + 1, py + B - 1, 1, 1); ctx.fillRect(px, py + i + 1, 1, 1); ctx.fillRect(px + B - 1, py + i, 1, 1); }
      }
      for (const c of current.cells) { const py = current.y + c.y; if (py >= 0) ctx.drawImage(TILE[current.type], (current.x + c.x) * B, py * B); }
    }
  }
  function drawNext() {
    nextCtx.fillStyle = "#0b0a24"; nextCtx.fillRect(0, 0, 32, 32);
    if (!next) return;
    const xs = next.cells.map(c => c.x), ys = next.cells.map(c => c.y);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    const w = (Math.max(...xs) - minX + 1) * B, h = (Math.max(...ys) - minY + 1) * B;
    const ox = Math.floor((32 - w) / 2), oy = Math.floor((32 - h) / 2);
    for (const c of next.cells) nextCtx.drawImage(TILE[next.type], ox + (c.x - minX) * B, oy + (c.y - minY) * B);
  }

  function showOverlay(title, msg, btn) { overlayTitle.textContent = title; overlayScore.textContent = msg; overlayBtn.textContent = btn; overlay.hidden = false; }
  function endGame() {
    gameOver = true; SFX.over();
    const rec = score > best;
    if (rec) { best = score; store.set("tetris16.best", best); bestEl.textContent = best; }
    showOverlay("GAME OVER", `Score final : ${score}${rec && score ? " · NOUVEAU RECORD !" : ""}`, "REJOUER");
    if (animFrame) cancelAnimationFrame(animFrame);
  }
  function togglePause() {
    if (gameOver || !started) return;
    paused = !paused;
    if (paused) showOverlay("PAUSE", "", "REPRENDRE");
    else { overlay.hidden = true; lastTime = performance.now(); loop(lastTime); }
  }
  function resetGame() {
    board = createEmptyBoard(); score = 0; level = 1; linesCleared = 0; dropInterval = 800; dropTimer = 0;
    clearingRows = []; clearAnimTimer = 0; paused = false; gameOver = false; started = true;
    updateHUD(); next = createPiece(randomType()); spawnPiece();
    overlay.hidden = true; canvas.focus({ preventScroll: true });
    lastTime = performance.now();
    if (animFrame) cancelAnimationFrame(animFrame);
    loop(lastTime);
  }
  function loop(time) {
    if (paused || gameOver) return;
    const delta = time - lastTime; lastTime = time;
    if (clearingRows.length) { clearAnimTimer += delta; if (clearAnimTimer >= CLEAR_ANIM_DURATION) finishClear(); }
    else { dropTimer += delta; if (dropTimer > dropInterval) { dropTimer = 0; if (!collides(current, 0, 1)) current.y++; else lockPiece(); } }
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  function act(a) {
    if (!started || gameOver) { if (a === "start") resetGame(); return; }
    if (paused || clearingRows.length || !current) return;
    if (a === "left") move(-1); else if (a === "right") move(1); else if (a === "soft") softDrop();
    else if (a === "rotate") rotate(); else if (a === "hard") hardDrop();
    draw();
  }
  document.addEventListener("keydown", e => {
    if ((!started || gameOver) && (e.key === "Enter" || e.key === " ")) { if (e.target.tagName !== "BUTTON") { e.preventDefault(); resetGame(); } return; }
    const map = { ArrowLeft: "left", ArrowRight: "right", ArrowDown: "soft", ArrowUp: "rotate", " ": "hard" };
    if (map[e.key]) { e.preventDefault(); act(map[e.key]); }
    else if (e.key === "p" || e.key === "P") togglePause();
  });
  // boutons tactiles : maintenir ◀ ▶ ▼ répète l'action
  document.querySelectorAll(".pad .btn").forEach(b => {
    let rep = null;
    const stop = () => { clearInterval(rep); clearTimeout(rep); rep = null; b.classList.remove("on"); };
    b.addEventListener("pointerdown", e => {
      e.preventDefault(); b.classList.add("on"); const a = b.dataset.a; act(a);
      if (a === "left" || a === "right" || a === "soft") rep = setTimeout(() => { rep = setInterval(() => act(a), 70); }, 220);
    });
    b.addEventListener("pointerup", stop); b.addEventListener("pointerleave", stop); b.addEventListener("pointercancel", stop);
    b.addEventListener("contextmenu", e => e.preventDefault());
  });
  overlayBtn.addEventListener("click", () => { if (paused && !gameOver) togglePause(); else resetGame(); });
  $("pauseBtn").onclick = togglePause;
  const soundBtn = $("soundBtn");
  soundBtn.textContent = "SON : " + (soundOn ? "OUI" : "NON");
  soundBtn.onclick = () => { soundOn = !soundOn; store.set("tetris16.sound", soundOn); soundBtn.textContent = "SON : " + (soundOn ? "OUI" : "NON"); SFX.rotate(); };

  // écran d'attente : puits vide et pièce suivante visible
  next = createPiece(randomType()); drawNext(); draw();
})();
</script>
</body>
</html>
