<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake 16 bits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a garden plot in a wooden frame, score window on top, d-pad below for touch. */
:root{
  color-scheme: dark;
  --ground:#10190f; --ground-2:#1a2a18;
  --wood:#8a5a2b; --wood-hi:#c08a4f; --wood-lo:#4e2f12;
  --ink:#0b1208; --text:#eafbe6; --dim:#a9c9a0;
  --leaf:#7cfc00; --apple:#ff4b4b; --gold:#ffd23f;
  --f-display:"Press Start 2P","Courier New",monospace; --f-body:"VT323","Lucida Console",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0; background-color:var(--ground); color:var(--text); font-family:var(--f-body); font-size:21px;
  background-image:radial-gradient(var(--ground-2) 1px, transparent 1.5px); background-size:4px 4px;
  padding-inline:16px; padding-block:20px 40px}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:50; background:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px)}
.wrap{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
h1{margin:0; text-align:center; font-family:var(--f-display); font-weight:400; font-size:clamp(26px,8vw,40px); letter-spacing:6px; color:var(--leaf);
  text-shadow:3px 3px 0 #2f6b0a, 6px 6px 0 #000}
.win{background:linear-gradient(#2c4a22,#16260f); border:4px solid #e9f7dc; border-radius:6px; box-shadow:0 0 0 3px var(--ink), inset 0 0 0 2px #5f8f45, 6px 6px 0 3px #000; padding:12px}
.hud{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
.hud .k{font-family:var(--f-display); font-size:8px; letter-spacing:1px; color:var(--dim)}
.hud .v{font-family:var(--f-display); font-size:clamp(12px,3.6vw,16px); margin-top:8px; color:var(--text); font-variant-numeric:tabular-nums}
.hud .v.hl{color:var(--leaf)}
.frame{background:var(--wood); border:4px solid var(--ink); border-radius:6px; padding:10px; box-shadow:inset 3px 3px 0 var(--wood-hi), inset -4px -4px 0 var(--wood-lo), 6px 6px 0 #000; position:relative}
canvas{display:block; width:100%; height:auto; aspect-ratio:1; max-width:100%; image-rendering:pixelated; image-rendering:crisp-edges; border:3px solid var(--ink); touch-action:none}
canvas:focus{outline:none}
.overlay{position:absolute; inset:10px; display:grid; place-items:center; background:rgba(8,14,6,.72); text-align:center; padding:16px}
.overlay .win{display:flex; flex-direction:column; gap:14px; align-items:center; max-width:300px}
.overlay h2{margin:0; font-family:var(--f-display); font-weight:400; font-size:16px; color:var(--leaf); text-shadow:3px 3px 0 #000; line-height:1.5}
.overlay p{margin:0; font-size:22px}
.btn{font-family:var(--f-display); font-size:10px; letter-spacing:1px; color:var(--text); background:#3d6b22; border:3px solid #e9f7dc; border-radius:4px; padding:10px 14px; cursor:pointer;
  box-shadow:0 0 0 2px var(--ink), 3px 3px 0 2px #000; touch-action:manipulation}
.btn:hover{background:#4d8a2a}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 2px var(--ink), 1px 1px 0 2px #000}
.btn:focus-visible{outline:3px dashed var(--gold); outline-offset:3px}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:center}
.pad{display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,52px); gap:6px; justify-content:center}
.pad .btn{font-family:Arial,"Segoe UI Symbol",sans-serif; font-size:22px; padding:0}
.pad .up{grid-column:2} .pad .left{grid-column:1; grid-row:2} .pad .down{grid-column:2; grid-row:2} .pad .right{grid-column:3; grid-row:2}
.info{text-align:center; color:var(--dim); font-size:19px}
kbd{font-family:var(--f-display); font-size:8px; color:var(--text); background:#000; border:2px solid var(--dim); padding:1px 4px}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNAKE</h1>
  <section class="win hud">
    <div><div class="k">SCORE</div><div class="v hl" id="score">0</div></div>
    <div><div class="k">POMMES</div><div class="v" id="apples">0</div></div>
    <div><div class="k">MEILLEUR</div><div class="v" id="best">0</div></div>
  </section>
  <div class="frame">
    <canvas id="game" width="160" height="160" tabindex="0" aria-label="Terrain du serpent"></canvas>
    <div class="overlay" id="overlay">
      <div class="win">
        <h2 id="ovTitle">PRÊT ?</h2>
        <p id="ovMsg">Appuie sur une flèche ou glisse sur l'écran pour partir.</p>
        <button class="btn" id="ovBtn" type="button">JOUER</button>
      </div>
    </div>
  </div>
  <div class="pad" aria-label="Croix directionnelle">
    <button class="btn up" type="button" data-d="up" aria-label="Haut">▲</button>
    <button class="btn left" type="button" data-d="left" aria-label="Gauche">◀</button>
    <button class="btn down" type="button" data-d="down" aria-label="Bas">▼</button>
    <button class="btn right" type="button" data-d="right" aria-label="Droite">▶</button>
  </div>
  <div class="row">
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="restart" type="button">REJOUER</button>
    <button class="btn" id="soundBtn" type="button">SON : OUI</button>
  </div>
  <div class="info"><kbd>FLÈCHES</kbd> ou <kbd>ZQSD</kbd> pour se déplacer · <kbd>ESPACE</kbd> pause</div>
</div>

<script>
(() => {
"use strict";
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const GRID = 20, C = 8;                 // 20×20 cases de 8 px logiques
const START_SPEED = 140, MIN_SPEED = 60; // ms par pas, comme l'original

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- son ---------- */
let actx = null, soundOn = store.get("snake16.sound", true);
function tone(notes, type="square", dur=.06, vol=.05){
  if (!soundOn) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); let t = actx.currentTime;
    for (const f of notes){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur); t += dur*.9; }
  }catch(e){}
}
const SFX = { eat: () => tone([660, 990], "square", .05), turn: () => tone([220], "triangle", .02, .03),
  die: () => tone([330, 247, 196, 131], "sawtooth", .12, .05), start: () => tone([392, 523, 659], "square", .06), pause: () => tone([440, 330], "triangle", .06, .07) };

/* ---------- sprites ---------- */
function sprite(map, pal){ const c = document.createElement("canvas"); c.width = map[0].length; c.height = map.length; const x = c.getContext("2d");
  map.forEach((row,r) => [...row].forEach((ch,i) => { if (pal[ch]){ x.fillStyle = pal[ch]; x.fillRect(i,r,1,1); } })); return c; }
const APPLE = sprite([
  "....n...",
  "...ngg..",
  ".rrnrrr.",
  "rwrrrrrr",
  "rwrrrrrr",
  "rrrrrrrd",
  ".rrrrrd.",
  "..rddd.."], {n:"#5a3418", g:"#5fd03a", r:"#ff4b4b", w:"#ffd0d0", d:"#b8232c"});
// fond : damier d'herbe pré-dessiné
const LAWN = document.createElement("canvas"); LAWN.width = LAWN.height = GRID*C;
(() => { const x = LAWN.getContext("2d");
  for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++){
    x.fillStyle = (r+c) % 2 ? "#2f6b22" : "#377a28"; x.fillRect(c*C, r*C, C, C);
    x.fillStyle = (r+c) % 2 ? "#3a7f2b" : "#428c31";
    const s = (r*31 + c*17) % 7; x.fillRect(c*C + 1 + s % 5, r*C + 2 + (s*3) % 5, 1, 2);
  } })();

/* ---------- état ---------- */
let snake, dir, queue, food, score, apples, best = store.get("snakeBestScore", 0), speed, timer, state = "ready", flash = 0, pops = [];
$("best").textContent = best;
function resetGame(){
  snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir = {x:1,y:0}; queue = []; score = 0; apples = 0; speed = START_SPEED; pops = [];
  food = placeFood(); updateHud();
}
function placeFood(){ let p; do { p = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)}; } while (snake.some(s => s.x === p.x && s.y === p.y)); return p; }
function updateHud(){ $("score").textContent = score; $("apples").textContent = apples; }

function start(){ resetGame(); state = "run"; hideOverlay(); SFX.start(); clearTimeout(timer); timer = setTimeout(tick, speed); }
function tick(){
  if (state !== "run") return;
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
  // la queue avance au même pas : on ne compte pas la dernière case sauf si on mange
  const willEat = head.x === food.x && head.y === food.y;
  const body = willEat ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (willEat){ score += 10; apples++; updateHud(); SFX.eat(); pops.push({x: head.x*C+4, y: head.y*C, t: 0}); food = placeFood(); speed = Math.max(MIN_SPEED, speed - 3); }
  else snake.pop();
  timer = setTimeout(tick, speed);
}
function gameOver(){
  state = "over"; clearTimeout(timer); flash = 1; SFX.die();
  const rec = score > best;
  if (rec){ best = score; store.set("snakeBestScore", best); $("best").textContent = best; }
  setTimeout(() => showOverlay("PARTIE TERMINÉE", `Score : ${score} · ${apples} pomme${apples > 1 ? "s" : ""}${rec && score ? " · NOUVEAU RECORD !" : ""}`, "REJOUER"), 600);
}
function togglePause(){
  if (state === "run"){ state = "pause"; clearTimeout(timer); SFX.pause(); showOverlay("PAUSE", "Appuie sur Espace pour continuer.", "REPRENDRE"); }
  else if (state === "pause"){ state = "run"; hideOverlay(); SFX.pause(); timer = setTimeout(tick, speed); }
}
function showOverlay(t, m, b){ $("ovTitle").textContent = t; $("ovMsg").textContent = m; $("ovBtn").textContent = b; $("overlay").hidden = false; }
function hideOverlay(){ $("overlay").hidden = true; canvas.focus({preventScroll:true}); }

/* ---------- direction : file de 2 virages pour ne jamais se retourner sur soi ---------- */
const DIRS = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
function steer(name){
  const d = DIRS[name]; if (!d) return;
  if (state === "ready" || state === "over"){ start(); }
  if (state !== "run") return;
  const last = queue.length ? queue[queue.length-1] : dir;
  if ((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
  if (queue.length < 2){ queue.push(d); SFX.turn(); }
}
const KEYS = {ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", z:"up", s:"down", a:"left", q:"left", d:"right"};
window.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); if (state === "run" || state === "pause") togglePause(); else if (e.target.tagName !== "BUTTON") start(); return; }
  const n = KEYS[e.key] || KEYS[e.key.toLowerCase()]; if (!n) return;
  e.preventDefault(); steer(n);
});
let sw = null;
canvas.addEventListener("pointerdown", e => { sw = {x: e.clientX, y: e.clientY}; });
canvas.addEventListener("pointerup", e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18){ if (state === "ready" || state === "over") start(); return; }
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
document.querySelectorAll(".pad .btn").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); steer(b.dataset.d); }));
$("ovBtn").onclick = () => state === "pause" ? togglePause() : start();
$("restart").onclick = start;
$("pauseBtn").onclick = () => { if (state === "run" || state === "pause") togglePause(); };
$("soundBtn").onclick = () => { soundOn = !soundOn; store.set("snake16.sound", soundOn); $("soundBtn").textContent = "SON : " + (soundOn ? "OUI" : "NON"); SFX.eat(); };
$("soundBtn").textContent = "SON : " + (soundOn ? "OUI" : "NON");

/* ---------- rendu ---------- */
const BODY = "#7cfc00", BODY_HI = "#c4ff7a", BODY_LO = "#3f9a0a", OUT = "#16300a";
function seg(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function draw(now){
  ctx.drawImage(LAWN, 0, 0);
  // pomme qui rebondit
  const bob = Math.floor(now/250) % 2;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(food.x*C+1, food.y*C+7, 6, 1);
  ctx.drawImage(APPLE, food.x*C, food.y*C - bob);
  // serpent : contour puis corps, avec des ponts entre segments voisins
  const dead = state === "over" && Math.floor(now/120) % 2;
  for (let pass = 0; pass < 2; pass++){
    snake.forEach((s, i) => {
      const x = s.x*C, y = s.y*C, inset = i === snake.length-1 ? 2 : 1;
      const col = pass ? (dead ? "#ff6b6b" : (i % 2 ? BODY : "#6fe800")) : OUT;
      const o = pass ? 0 : -1;
      seg(x+inset+o, y+inset+o, C-2*inset-2*o, C-2*inset-2*o, col);
      const n = snake[i+1];
      if (n){ const mx = Math.min(x, n.x*C), my = Math.min(y, n.y*C);
        if (n.y === s.y) seg(mx+4, y+2+o, C+o*-2, 4-2*o, col); else seg(x+2+o, my+4, 4-2*o, C+o*-2, col); }
      if (pass && !dead){ seg(x+inset, y+inset, 2, 1, BODY_HI); seg(x+C-inset-2, y+C-inset-1, 2, 1, BODY_LO); }
    });
  }
  // tête : yeux orientés + langue
  const h = snake[0], hx = h.x*C, hy = h.y*C, d = dir;
  const eyes = d.x ? [[hx+(d.x>0?5:1), hy+1], [hx+(d.x>0?5:1), hy+5]] : [[hx+1, hy+(d.y>0?5:1)], [hx+5, hy+(d.y>0?5:1)]];
  for (const [ex, ey] of eyes){ seg(ex, ey, 2, 2, "#ffffff"); seg(ex + (d.x>0?1:0), ey + (d.y>0?1:0), 1, 1, "#000"); }
  if (state === "run" && Math.floor(now/300) % 3 === 0){ seg(hx+3+d.x*5, hy+3+d.y*5, 2, 2, "#ff3b5c"); }
  // +10 qui s'envolent
  pops = pops.filter(p => (p.t += 1) < 30);
  for (const p of pops){ ctx.fillStyle = "#000"; ctx.font = '6px "Press Start 2P"'; ctx.fillText("+10", p.x-7+1, p.y-p.t/3+1); ctx.fillStyle = "#ffd23f"; ctx.fillText("+10", p.x-7, p.y-p.t/3); }
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*.6})`; ctx.fillRect(0, 0, 160, 160); flash = Math.max(0, flash - .08); }
  requestAnimationFrame(draw);
}
resetGame();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
