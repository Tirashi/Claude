<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pont stellaire</title>
<meta name="description" content="Pont stellaire : relie les étoiles par des faisceaux de lumière pour dessiner une constellation.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#070a1c">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html, body { margin: 0; height: 100%; background: #04050e; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; cursor: pointer; }
</style>

<body>
<canvas id="cv" width="272" height="480" aria-label="Pont stellaire : puzzle des étoiles à relier"></canvas>
<script src="../ludo-scores.js"></script>
<script>
'use strict';
/* =====================================================================
   PONT STELLAIRE : les règles du Hashi, dans un ciel étoilé en 32 bits.
   - Chaque étoile porte un nombre : c'est le nombre de faisceaux qui
     doivent en partir.
   - Les faisceaux sont droits (horizontaux ou verticaux), un ou deux
     entre deux étoiles, et ne se croisent jamais.
   - À la fin, toutes les étoiles sont reliées en une seule constellation.
   - Commandes : toucher une étoile puis une voisine (ou glisser de l'une
     vers l'autre) ajoute un faisceau : 1, puis 2, puis aucun. Toucher un
     faisceau le fait aussi tourner.
   - Les grilles sont générées à partir d'une graine, puis un solveur
     vérifie qu'elles n'ont qu'une seule solution. Le Ciel du jour (9×9)
     a la même graine pour toute la famille.
   - Records : le meilleur temps par taille (+30 s par indice), et le
     temps du Ciel du jour, envoyés au classement familial.
   L'écran est dessiné en 272×480 pixels logiques puis agrandi sans lissage.
   ===================================================================== */
const LW = 272, LH = 480, TAU = Math.PI * 2, FONT = '"Press Start 2P", monospace', OUT = '#0b0614';
const SIZES = [[7, 'PETIT'], [9, 'MOYEN'], [11, 'GRAND']];
const ISLANDS = { 7: [10, 13], 9: [17, 21], 11: [25, 31] };
const HINT_MS = 30000;
const NAMES = ['la Lyre', 'le Cygne', 'Cassiopée', 'la Licorne', "l'Aigle", 'le Dauphin', 'la Baleine', 'le Phénix', 'la Colombe', 'le Caméléon',
  'la Boussole', 'le Paon', 'la Grue', 'le Toucan', 'la Girafe', 'le Lynx', 'la Flèche', 'le Petit Renard', 'la Couronne', 'le Sextant',
  'le Bouvier', 'la Chevelure', 'le Loup', 'le Corbeau', 'la Coupe', 'le Lézard', 'le Petit Cheval', "l'Écu", 'le Télescope', 'la Mouche'];
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('pontstellaire.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pontstellaire.' + k, JSON.stringify(v)); } catch (e) {} },
};
const now = () => performance.now();
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const todayKey = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const fmtTime = ms => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

/* =========================================================
   GRILLE : étoiles, faisceaux possibles, croisements
   ========================================================= */
// à partir des étoiles [{x, y, n}], la liste des paires voisines (la plus proche dans chaque direction)
function buildEdges(N, isl) {
  const at = {}; isl.forEach((s, i) => at[s.x + ',' + s.y] = i);
  const edges = [], adj = isl.map(() => []);
  isl.forEach((s, i) => {
    for (const [dx, dy] of [[1, 0], [0, 1]]) {
      for (let k = 1; k < N; k++) {
        const j = at[(s.x + dx * k) + ',' + (s.y + dy * k)];
        if (j !== undefined) { const e = { a: i, b: j, h: dy === 0, cross: [] }; adj[i].push(edges.length); adj[j].push(edges.length); edges.push(e); break; }
      }
    }
  });
  // deux faisceaux se croisent si l'un est horizontal, l'autre vertical, et qu'ils se coupent hors des étoiles
  edges.forEach((e, i) => {
    if (!e.h) return;
    const y = isl[e.a].y, x0 = Math.min(isl[e.a].x, isl[e.b].x), x1 = Math.max(isl[e.a].x, isl[e.b].x);
    edges.forEach((f, j) => {
      if (f.h) return;
      const x = isl[f.a].x, y0 = Math.min(isl[f.a].y, isl[f.b].y), y1 = Math.max(isl[f.a].y, isl[f.b].y);
      if (x > x0 && x < x1 && y > y0 && y < y1) { e.cross.push(j); f.cross.push(i); }
    });
  });
  return { edges, adj };
}
function connected(isl, edges, val) {
  const seen = new Set([0]), stack = [0];
  while (stack.length) { const i = stack.pop(); edges.forEach((e, k) => { if (val[k] > 0) { const j = e.a === i ? e.b : e.b === i ? e.a : -1; if (j >= 0 && !seen.has(j)) { seen.add(j); stack.push(j); } } }); }
  return seen.size === isl.length;
}

/* =========================================================
   SOLVEUR : bornes [lo, hi] par faisceau, propagation, puis essais.
   Renvoie le nombre de solutions (on s'arrête à 2) et la première trouvée.
   ========================================================= */
function solve(isl, G, limit = 2) {
  const { edges, adj } = G, E = edges.length;
  let count = 0, first = null, nodes = 0;
  function propagate(lo, hi) {
    let changed = true;
    while (changed) {
      changed = false;
      for (let i = 0; i < isl.length; i++) {
        const need = isl[i].n; let sl = 0, sh = 0;
        for (const k of adj[i]) { sl += lo[k]; sh += hi[k]; }
        if (sl > need || sh < need) return false;
        for (const k of adj[i]) {
          const nlo = Math.max(lo[k], need - (sh - hi[k])), nhi = Math.min(hi[k], need - (sl - lo[k]));
          if (nlo > nhi) return false;
          if (nlo !== lo[k] || nhi !== hi[k]) { lo[k] = nlo; hi[k] = nhi; changed = true; }
        }
      }
      for (let k = 0; k < E; k++) if (lo[k] > 0) for (const c of edges[k].cross) { if (lo[c] > 0) return false; if (hi[c] > 0) { hi[c] = 0; changed = true; } }
      // deux étoiles de 1 (ou deux étoiles de 2 en double) ne peuvent pas se suffire à elles seules
      if (isl.length > 2) for (let k = 0; k < E; k++) {
        const e = edges[k], na = isl[e.a].n, nb = isl[e.b].n;
        if (na === nb && na <= 2 && hi[k] >= na) { hi[k] = na - 1; if (lo[k] > hi[k]) return false; changed = true; }
      }
    }
    return true;
  }
  function rec(lo, hi) {
    if (count >= limit || ++nodes > 200000) return;
    if (!propagate(lo, hi)) return;
    let pick = -1, best = 9;
    for (let k = 0; k < E; k++) if (lo[k] < hi[k]) { const w = hi[k] - lo[k]; if (w < best) { best = w; pick = k; if (w === 1) break; } }
    if (pick < 0) {
      if (connected(isl, edges, lo)) { count++; if (!first) first = lo.slice(); }
      return;
    }
    for (let v = hi[pick]; v >= lo[pick]; v--) {
      const l2 = lo.slice(), h2 = hi.slice(); l2[pick] = v; h2[pick] = v; rec(l2, h2);
      if (count >= limit) return;
    }
  }
  const lo = new Array(E).fill(0), hi = edges.map(e => Math.min(2, isl[e.a].n, isl[e.b].n));
  rec(lo, hi);
  return { count: nodes > 200000 ? 99 : count, sol: first };
}

/* =========================================================
   GÉNÉRATEUR : on fait pousser un arbre de faisceaux depuis une étoile,
   on ajoute quelques boucles, puis on garde la grille si sa solution est unique.
   ========================================================= */
function generate(N, seed) {
  const rand = mulberry(seed);
  const ri = n => Math.floor(rand() * n);
  const [minI, maxI] = ISLANDS[N];
  for (let tries = 0; tries < 400; tries++) {
    const target = minI + ri(maxI - minI + 1);
    const cell = [...Array(N)].map(() => new Array(N).fill(0));          // 0 vide, 1 étoile, 2 faisceau
    const isl = [], bridges = [];
    const put = (x, y) => { cell[y][x] = 1; isl.push({ x, y, n: 0 }); return isl.length - 1; };
    put(ri(N), ri(N));
    let stall = 0;
    while (isl.length < target && stall < 600) {
      stall++;
      const i = ri(isl.length), s = isl[i], [dx, dy] = [[1, 0], [-1, 0], [0, 1], [0, -1]][ri(4)];
      const len = 2 + ri(Math.max(1, N - 2));
      const tx = s.x + dx * len, ty = s.y + dy * len;
      if (tx < 0 || ty < 0 || tx >= N || ty >= N || cell[ty][tx]) continue;
      let ok = true;
      for (let k = 1; k < len; k++) if (cell[s.y + dy * k][s.x + dx * k]) { ok = false; break; }
      if (!ok) continue;
      // pas d'étoiles collées l'une à l'autre : plus joli et plus lisible
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([ax, ay]) => cell[ty + ay] && cell[ty + ay][tx + ax] === 1)) continue;
      for (let k = 1; k < len; k++) cell[s.y + dy * k][s.x + dx * k] = 2;
      const j = put(tx, ty), w = rand() < .4 ? 2 : 1;
      bridges.push([i, j, w]); isl[i].n += w; isl[j].n += w; stall = 0;
    }
    if (isl.length < minI) continue;
    // boucles : relier des voisines alignées dont le chemin est libre
    const G = buildEdges(N, isl);
    for (const e of G.edges) {
      if (bridges.some(b => (b[0] === e.a && b[1] === e.b) || (b[0] === e.b && b[1] === e.a))) continue;
      if (rand() > .35) continue;
      const A = isl[e.a], B = isl[e.b], dx = Math.sign(B.x - A.x), dy = Math.sign(B.y - A.y), len = Math.abs(B.x - A.x) + Math.abs(B.y - A.y);
      let ok = true; for (let k = 1; k < len; k++) if (cell[A.y + dy * k][A.x + dx * k]) { ok = false; break; }
      if (!ok) continue;
      for (let k = 1; k < len; k++) cell[A.y + dy * k][A.x + dx * k] = 2;
      const w = rand() < .3 ? 2 : 1; bridges.push([e.a, e.b, w]); A.n += w; B.n += w;
    }
    if (isl.some(s => s.n > 8 || s.n < 1)) continue;
    const res = solve(isl, G);
    if (res.count === 1) return { N, isl, G, sol: res.sol, seed };
  }
  return null;
}

/* =========================================================
   AUDIO (petits bruitages WebAudio)
   ========================================================= */
const AC = { ctx: null, out: null, on: store.get('sfx', true) };
function audioInit() {
  if (AC.ctx) { if (AC.ctx.state === 'suspended') AC.ctx.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC.ctx = new Ctx(); AC.out = AC.ctx.createGain(); AC.out.gain.value = .45; AC.out.connect(AC.ctx.destination);
}
function tone(f, d, type = 'triangle', vol = .2, slide = 0, delay = 0) {
  if (!AC.on || !AC.ctx) return;
  const t = AC.ctx.currentTime + delay, o = AC.ctx.createOscillator(), g = AC.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(AC.out); o.start(t); o.stop(t + d + .02);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319];
const SFX = {
  click: () => tone(660, .05, 'square', .08),
  select: () => tone(880, .06, 'sine', .15),
  beam: v => tone(v === 0 ? 330 : v === 1 ? 660 : 990, .12, 'sine', .2, v === 0 ? -120 : 200),
  done: i => tone(SCALE[i % SCALE.length] * 2, .15, 'sine', .1),
  error: () => tone(160, .15, 'square', .12),
  win: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .3, 'sine', .15, 0, i * .1)),
};

/* =========================================================
   GRAPHISMES : ciel tramé, étoiles en volume ombré
   ========================================================= */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function buildSky() {
  const [c, g] = mk(LW, LH), img = g.createImageData(LW, LH), rand = mulberry(777);
  const blobs = [[200, 120, 130, [40, 70, 140]], [60, 300, 140, [90, 30, 120]], [220, 440, 110, [20, 80, 110]]];
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    let r = 5, gg = 6, b = 20;
    for (const [bx, by, br, col] of blobs) {
      const d = Math.hypot(x - bx, (y - by) * 1.15) / br, w = Math.max(0, 1 - d) + Math.sin(x * .06 + y * .025) * .07;
      const q = Math.floor(w * 4 + bayer[(y & 3) * 4 + (x & 3)] / 16) / 4;
      r += col[0] * q * .45; gg += col[1] * q * .45; b += col[2] * q * .45;
    }
    const k = (y * LW + x) * 4; img.data[k] = r; img.data[k + 1] = gg; img.data[k + 2] = b; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tw = [];
  for (let i = 0; i < 150; i++) {
    const x = Math.floor(rand() * LW), y = Math.floor(rand() * LH), s = rand();
    if (s > .94) tw.push([x, y, rand() * TAU]); else { g.fillStyle = s > .6 ? '#aab4ee' : s > .3 ? '#6870a8' : '#40447a'; g.fillRect(x, y, 1, 1); }
  }
  return { img: c, tw };
}
// une étoile : disque ombré (lumière en haut à gauche), halo et branches de lumière
const STAR_PAL = {
  base: ['#ffffff', '#fff1c4', '#ffd76a', '#e09a2a', '#9a5a1a'],
  done: ['#ffffff', '#d8fff0', '#7ff0c0', '#2fb88a', '#16705a'],
  over: ['#ffffff', '#ffd0c8', '#ff8a7a', '#d0403a', '#7a1a20'],
  sel:  ['#ffffff', '#e6f6ff', '#9fdcff', '#4a9ae0', '#24508a'],
};
function starSprite(r, pal) {
  const S = r * 2 + 9, [c, g] = mk(S, S), img = g.createImageData(S, S), o = S / 2;
  const L = [-.5, -.65, .57];
  const put = (x, y, col, a = 255) => { const k = (y * S + x) * 4, n = parseInt(col.slice(1), 16);
    img.data[k] = n >> 16; img.data[k + 1] = (n >> 8) & 255; img.data[k + 2] = n & 255; img.data[k + 3] = a; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x + .5 - o, dy = y + .5 - o, d = Math.hypot(dx, dy);
    if (d <= r) {
      const nx = dx / r, ny = dy / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const l = nx * L[0] + ny * L[1] + nz * L[2] + (((x + y) & 1) ? .03 : -.03);
      put(x, y, d > r - 1 ? pal[4] : pal[l > .85 ? 0 : l > .55 ? 1 : l > .2 ? 2 : 3]);
    } else if (d <= r + 1.2) put(x, y, OUT);
    else if ((Math.abs(dx) < 1 || Math.abs(dy) < 1) && d < r + 4.5) put(x, y, pal[1], 200);   // petites branches en croix
    else if (d < r + 3 && ((x + y) & 1)) put(x, y, pal[2], 70);                              // halo tramé
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* =========================================================
   ÉTAT
   ========================================================= */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let K = 1, T = 0, BTN = [], SKY = null, SPR = {};
const S = {
  phase: 'title', P: null, val: [], hist: [], sel: -1, drag: null, t0: 0, elapsed: 0, hints: 0, mode: 9, daily: false, offRank: false,
  best: store.get('best', {}) || {}, dailyDone: store.get('daily', {}) || {}, wins: store.get('wins', 0) || 0,
  winT: 0, rankText: '', record: false, flash: [], parts: [], name: '', msg: '', msgT: 0,
};
// géométrie de la grille à l'écran
function layout(N) { const cs = Math.floor(256 / N), size = cs * N; return { cs, ox: Math.floor((LW - size) / 2), oy: 58 + Math.floor((256 - size) / 2), r: Math.max(7, Math.round(cs * .36)) }; }
const pos = (s, Lo) => [Lo.ox + s.x * Lo.cs + Lo.cs / 2, Lo.oy + s.y * Lo.cs + Lo.cs / 2];
function sprites(r) {
  if (SPR.r === r) return SPR;
  SPR = { r }; for (const k in STAR_PAL) SPR[k] = starSprite(r, STAR_PAL[k]); return SPR;
}
/* ciel du jour : une seule tentative classée. Elle est sauvegardée à part (pontstellaire.dailyRun, chrono compris) :
   quitter puis revenir la reprend au même temps. Une fois réussie, le ciel du jour se rejoue hors classement. */
function dailyRun() { const r = store.get('dailyRun', null); return r && r.day === todayKey() ? r : null; }
{ // ancienne sauvegarde : un ciel du jour en cours rangé avec les autres parties
  const old = store.get('game', null);
  if (old && old.daily) { if (old.day === todayKey() && !store.get('dailyRun', null)) store.set('dailyRun', old); store.set('game', null); }
}
function startDaily() {
  const d = todayKey(), run = dailyRun();
  if (!(S.dailyDone[d] > 0) && run && resumeGame(run)) return;
  startPuzzle(9, true);
}
function startPuzzle(N, daily) {
  const seed = daily ? todayKey() * 7 + 11 : (Math.random() * 2 ** 31) | 0;
  let P = generate(N, seed), s2 = seed;
  while (!P) P = generate(N, ++s2);
  S.P = P; S.val = new Array(P.G.edges.length).fill(0); S.hist = []; S.sel = -1; S.hints = 0; S.mode = N; S.daily = daily;
  S.offRank = daily && S.dailyDone[todayKey()] > 0;
  S.t0 = now(); S.elapsed = 0; S.phase = 'play'; S.flash = []; S.parts = []; S.msg = ''; S.rankText = ''; S.record = false;
  S.name = NAMES[P.seed % NAMES.length];
  saveGame();
}
function saveGame() {
  const ranked = S.daily && !S.offRank, slot = ranked ? 'dailyRun' : 'game';
  if (!S.P || S.phase !== 'play') { if (!S.daily) store.set('game', null); return; }
  if (S.daily && !ranked) return;   // le ciel du jour rejoué hors classement ne se sauvegarde pas
  store.set(slot, { N: S.P.N, seed: S.P.seed, daily: S.daily, day: S.daily ? todayKey() : 0, val: S.val, el: S.elapsed + (now() - S.t0), h: S.hints });
}
function resumeGame(saved) {
  const s = saved || store.get('game', null);
  if (!s || !ISLANDS[s.N] || (s.daily && s.day !== todayKey())) return false;
  const P = generate(s.N, s.seed); if (!P || P.G.edges.length !== (s.val || []).length) return false;
  S.P = P; S.val = s.val.slice(); S.hist = []; S.sel = -1; S.hints = s.h || 0; S.mode = s.N; S.daily = !!s.daily;
  S.offRank = false; S.elapsed = s.el || 0; S.t0 = now(); S.phase = 'play'; S.flash = []; S.parts = []; S.name = NAMES[P.seed % NAMES.length]; S.msg = '';
  return true;
}
const elapsed = () => S.elapsed + (S.phase === 'play' ? now() - S.t0 : 0);
const score = () => Math.round(elapsed() + S.hints * HINT_MS);
function degree(i) { let n = 0; for (const k of S.P.G.adj[i]) n += S.val[k]; return n; }

/* =========================================================
   COUPS
   ========================================================= */
function edgeBetween(i, j) { return S.P.G.adj[i].find(k => { const e = S.P.G.edges[k]; return (e.a === i && e.b === j) || (e.a === j && e.b === i); }); }
function blocked(k) { return S.P.G.edges[k].cross.some(c => S.val[c] > 0); }
function cycle(k) {
  const e = S.P.G.edges[k], max = Math.min(2, S.P.isl[e.a].n, S.P.isl[e.b].n);
  if (S.val[k] === 0 && blocked(k)) { SFX.error(); say('Un faisceau en croise un autre.'); return; }
  const before = [degree(e.a) === S.P.isl[e.a].n, degree(e.b) === S.P.isl[e.b].n];
  S.hist.push([k, S.val[k]]);
  S.val[k] = S.val[k] >= max ? 0 : S.val[k] + 1;
  SFX.beam(S.val[k]);
  [e.a, e.b].forEach((i, q) => { if (!before[q] && degree(i) === S.P.isl[i].n) { S.flash.push([i, now()]); SFX.done(i); } });
  checkWin(); saveGame();
}
function say(m) { S.msg = m; S.msgT = now(); }
function undo() { const h = S.hist.pop(); if (!h) return; S.val[h[0]] = h[1]; SFX.click(); saveGame(); }
function clearAll() { if (!S.val.some(v => v)) return; S.hist.push(...S.val.map((v, k) => [k, v]).filter(x => x[1]).reverse()); S.val.fill(0); SFX.click(); saveGame(); }
// indice : corrige ou pose un faisceau de la solution (30 s de pénalité)
function hint() {
  const sol = S.P.sol, wrong = S.val.findIndex((v, k) => v > sol[k]);
  let k = wrong >= 0 ? wrong : S.val.findIndex((v, k) => v < sol[k]);
  if (k < 0) return;
  S.hist.push([k, S.val[k]]); S.val[k] = sol[k]; S.hints++; S.flash.push([S.P.G.edges[k].a, now()], [S.P.G.edges[k].b, now()]);

/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu. */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
