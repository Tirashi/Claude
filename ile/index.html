<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Île des naufragés</title>
<meta name="description" content="L'Île des naufragés : répartis les tâches, explore l'île et quitte-la avant la saison des tempêtes.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a2a3a">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #04121a; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv" width="272" height="480" aria-label="L'Île des naufragés : survivre et quitter l'île"></canvas>
<script src="../ludo-scores.js"></script>
<script>
'use strict';
/* =====================================================================
   L'ÎLE DES NAUFRAGÉS : gestion de survie en 32 bits.
   - Huit naufragés, chacun avec un talent et un caractère. Chaque matin,
     on donne une tâche à chacun (pêche, cueillette, eau, bois, chantier,
     exploration, soins, repos, guet) ; « FIN DU JOUR » fait passer la nuit.
   - Il faut manger, boire, s'abriter et garder le moral. Personne ne meurt :
     un naufragé à bout de forces se repose jusqu'à ce qu'on le soigne.
   - L'île est dans le brouillard : explorer révèle les cases (source,
     grotte, épave, ruines, volcan…) et ce qu'elles cachent.
   - Trois façons de partir avant le 40e jour (saison des tempêtes) :
     le FEU DE SIGNAL allumé par le guetteur quand un navire passe,
     le RADEAU (corde et voile de l'épave, provisions), ou la RADIO de
     l'épave réparée avec 3 pièces (les secours arrivent 3 jours après).
   - Tout est tiré d'une graine : l'Île du jour est la même pour toute la
     famille (une seule tentative classée, qui compte dès le départ).
   - Score : évasion, jours d'avance, santé, moral, découvertes, trésor.
   L'écran est dessiné en 272×480 pixels logiques puis agrandi sans lissage.
   ===================================================================== */
const LW = 272, LH = 480, TAU = Math.PI * 2, FONT = '"Press Start 2P", monospace', OUT = '#08141c';
const DAYS = 40, MW = 6, MH = 5, TW = 44, TH = 33, MX = 4, MY = 40;
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('ile.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ile.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ile.' + k); } catch (e) {} },
};
const now = () => performance.now();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const todayKey = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// hasard reproductible : le même pour une graine, un jour et un naufragé donnés (quels que soient les choix du joueur)
function H(seed, a = 0, b = 0) { let h = Math.imul(seed | 0, 374761393) ^ Math.imul(a + 1, 668265263) ^ Math.imul(b + 7, 2246822519); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }

/* =========================================================
   LES NAUFRAGÉS : talents et caractères
   ========================================================= */
const TALENTS = {
  pecheur: { name: 'PECHEUR', txt: 'Pêche beaucoup mieux (+1,5).' },
  charpentier: { name: 'CHARPENTIER', txt: 'Coupe plus de bois et bâtit deux fois plus vite.' },
  infirmiere: { name: 'INFIRMIERE', txt: 'Ses soins rendent 2 cœurs au lieu d\'un.' },
  cuisinier: { name: 'CUISINIER', txt: 'Tout le monde mange un peu moins, et le moral monte (+2 par jour).' },
  exploratrice: { name: 'EXPLORATRICE', txt: 'Explore deux cases par jour, sans jamais se blesser.' },
  enfant: { name: 'ENFANT DEBROUILLARD', txt: 'Cueille plus de fruits (+1) et remonte le moral (+1 par jour).' },
  mecano: { name: 'MECANO', txt: 'Répare la radio deux fois plus vite, et bâtit bien (+0,5).' },
  marin: { name: 'MARIN', txt: 'Au guet, voit les navires venir la veille. Le radeau a plus de chances avec lui.' },
};
const TRAITS = {
  courageux: { name: 'COURAGEUX', txt: 'Se blesse deux fois moins en explorant.' },
  raleur: { name: 'RALEUR', txt: 'Fait baisser le moral (-2 par jour).' },
  peureux: { name: 'PEUREUX', txt: 'Refuse d\'explorer : il se repose à la place.' },
  reveur: { name: 'REVEUR', txt: 'Le repos lui remonte beaucoup le moral (+5).' },
  travailleur: { name: 'TRAVAILLEUR', txt: 'Produit 50 % de plus.' },
  gourmand: { name: 'GOURMAND', txt: 'Mange une ration et demie.' },
};
const NAMES = ['Léa', 'Hugo', 'Jade', 'Louis', 'Inès', 'Malo', 'Rose', 'Nina', 'Tom', 'Iris', 'Noé', 'Lou', 'Basile', 'Margot', 'Sacha', 'Zoé',
  'Jules', 'Alice', 'Gaspard', 'Lina', 'Max', 'Chloé', 'Victor', 'Emma', 'Paul', 'Mila', 'Oscar', 'Anna', 'Elio', 'Romy'];
const TASKS = [
  ['peche', 'PECHE', '#3fa0e0'], ['cueillette', 'CUEILLETTE', '#5cbf4a'], ['eau', 'EAU', '#5ce1ff'], ['bois', 'BOIS', '#c08040'],
  ['chantier', 'CHANTIER', '#ffb040'], ['explorer', 'EXPLORER', '#e8d070'], ['soins', 'SOINS', '#ff7a8a'], ['repos', 'REPOS', '#a9a6d8'], ['guet', 'GUET', '#ffffff'],
];
const TASK = Object.fromEntries(TASKS.map(t => [t[0], t]));

/* =========================================================
   LES CHANTIERS
   ========================================================= */
const PROJ = [
  { id: 'abri', name: 'ABRI', pts: 6, wood: 4, txt: 'Protège des nuits froides et des tempêtes.' },
  { id: 'reserve', name: 'RESERVE', pts: 4, wood: 3, txt: 'La nourriture ne se gâte plus, et les crabes ne la volent plus.' },
  { id: 'citerne', name: 'CITERNE', pts: 4, wood: 3, txt: '+1 eau chaque jour, +3 quand il pleut.' },
  { id: 'pieges', name: 'PIEGES', pts: 3, wood: 2, txt: '+1,5 nourriture chaque jour.' },
  { id: 'tour', name: 'TOUR DE GUET', pts: 5, wood: 5, txt: 'Le guetteur voit les navires la veille de leur passage.' },
  { id: 'feu', name: 'FEU DE SIGNAL', pts: 6, wood: 8, txt: 'Quand un navire passe, le guetteur l\'allume : sauvés !' },
  { id: 'radeau', name: 'RADEAU', pts: 12, wood: 14, need: ['corde', 'voile'], txt: 'Avec la corde et la voile de l\'épave. Pour prendre la mer : 10 repas et 10 eau.' },
  { id: 'radio', name: 'RADIO', pts: 5, wood: 0, need: ['radio', 'pieces'], txt: 'La radio de l\'épave et 3 pièces : les secours arrivent 3 jours après l\'appel.' },
];
const P = Object.fromEntries(PROJ.map(p => [p.id, p]));
const ITEMS = {
  hache: 'HACHE (+1 bois)', filet: 'FILET (pêche x1,5)', trousse: 'TROUSSE (soins +1)', corde: 'CORDE (radeau)', voile: 'VOILE (radeau)',
  radio: 'RADIO CASSEE', pieces: 'PIECES DE RADIO', longue: 'LONGUE-VUE (guet)',
};

/* =========================================================
   L'ÎLE : 6 × 5 cases, plage tout autour, brouillard à explorer
   ========================================================= */
const TILES = {
  mer: { name: 'LA MER' }, plage: { name: 'PLAGE' }, jungle: { name: 'JUNGLE' }, colline: { name: 'COLLINE' }, rochers: { name: 'ROCHERS' },
  source: { name: 'SOURCE' }, grotte: { name: 'GROTTE' }, volcan: { name: 'VOLCAN' }, ruines: { name: 'RUINES' }, epave: { name: 'EPAVE' }, lagon: { name: 'LAGON' },
};
const nb4 = i => { const x = i % MW, y = (i / MW) | 0, o = []; if (x > 0) o.push(i - 1); if (x < MW - 1) o.push(i + 1); if (y > 0) o.push(i - MW); if (y < MH - 1) o.push(i + MW); return o; };
function makeIsland(seed) {
  const R = mulberry(seed * 31 + 7);
  for (let tries = 0; tries < 200; tries++) {
    // une île en forme de patate : on part du centre et on ajoute des cases voisines
    const land = new Set([2 * MW + 2]);
    while (land.size < 21) { const a = [...land][Math.floor(R() * land.size)], n = nb4(a); land.add(n[Math.floor(R() * n.length)]); }
    const tiles = [...Array(MW * MH)].map((_, i) => ({ t: land.has(i) ? 'jungle' : 'mer', seen: false, item: null, done: false }));
    const isLand = i => tiles[i].t !== 'mer';
    const edge = i => isLand(i) && (nb4(i).some(j => !isLand(j)) || nb4(i).length < 4);
    const coast = [...land].filter(edge), inner = [...land].filter(i => !edge(i));
    if (inner.length < 3) continue;
    coast.forEach(i => tiles[i].t = 'plage');
    // le camp : une plage en bas de l'île
    const camp = coast.slice().sort((a, b) => ((b / MW) | 0) - ((a / MW) | 0) || R() - .5)[0];
    const far = coast.filter(i => i !== camp && !nb4(camp).includes(i));
    if (far.length < 3) continue;
    const pick = arr => arr.splice(Math.floor(R() * arr.length), 1)[0];
    const sh = arr => arr.sort(() => R() - .5);
    sh(far); sh(inner);
    const midd = [...land].filter(i => i !== camp && !nb4(camp).includes(i) && tiles[i].t === 'jungle');
    tiles[pick(far)].t = 'epave';
    tiles[pick(inner)].t = 'volcan';
    const rest = sh([...land].filter(i => i !== camp && tiles[i].t !== 'epave' && tiles[i].t !== 'volcan'));
    for (const t of ['source', 'grotte', 'ruines', 'colline', 'rochers', 'rochers', 'colline', 'lagon']) { const i = rest.pop(); if (i == null) break; if (t === 'lagon' && tiles[i].t !== 'plage') continue; tiles[i].t = t; }
    if (!tiles.some(x => x.t === 'source') || !tiles.some(x => x.t === 'grotte') || !tiles.some(x => x.t === 'ruines')) continue;
    // ce que cachent les cases
    const at = t => tiles.findIndex(x => x.t === t);
    tiles[at('epave')].item = ['radio', 'corde', 'voile'];
    tiles[at('ruines')].item = ['pieces', R() < .5 ? 'tresor' : 'longue'];
    tiles[at('grotte')].item = ['pieces'];
    const others = sh(tiles.map((x, i) => i).filter(i => isLand(i) && i !== camp && !tiles[i].item));
    tiles[others.pop()].item = ['pieces'];
    tiles[others.pop()].item = ['hache'];
    tiles[others.pop()].item = ['filet'];
    tiles[others.pop()].item = ['trousse'];
    tiles[others.pop()].item = ['naufrage'];
    if (!tiles.some(x => x.item && x.item.includes('tresor'))) tiles[others.pop()].item = ['tresor'];
    tiles[camp].seen = true; nb4(camp).forEach(j => { if (tiles[j].t === 'mer') tiles[j].seen = true; });
    tiles.forEach((x, i) => { if (x.t === 'mer') x.seen = true; });
    return { tiles, camp };
  }
  return null;
}

/* =========================================================
   NOUVELLE PARTIE
   ========================================================= */
function makeCrew(seed) {
  const R = mulberry(seed * 17 + 3), names = NAMES.slice().sort(() => R() - .5), tal = Object.keys(TALENTS).sort(() => R() - .5);
  const tr = Object.keys(TRAITS);
  return [...Array(8)].map((_, i) => ({
    name: names[i], talent: tal[i], trait: tr[Math.floor(R() * tr.length)], hp: 3, task: ['peche', 'peche', 'cueillette', 'eau', 'eau', 'bois', 'chantier', 'explorer'][i],
    skin: Math.floor(R() * 4), hair: Math.floor(R() * 6), long: R() < .5,
  }));
}
function shipsFor(seed) { return [[9, 16], [19, 27], [29, 37]].map(([a, b], k) => a + Math.floor(H(seed, 900 + k) * (b - a + 1))); }
function newRun(seed, daily) {
  let isl = makeIsland(seed), s = seed; while (!isl) isl = makeIsland(++s);
  const proj = {}; PROJ.forEach(p => proj[p.id] = { p: 0, paid: false });
  return { v: 1, seed, daily: !!daily, offRank: false, day: 1, food: 10, water: 10, wood: 3, moral: 60, items: {}, pieces: 0, crew: makeCrew(seed),
    tiles: isl.tiles, camp: isl.camp, target: -1, proj, sel: 'abri', ships: shipsFor(seed), radioDay: 0, tresor: false, found: 1, sick: -1,
    phase: 'day', report: [], result: null, rescuers: 0 };
}

/* =========================================================
   UNE JOURNÉE PUIS UNE NUIT
   ========================================================= */
const built = (r, id) => r.proj[id].p >= P[id].pts;
const alive = r => r.crew;
function eff(r, c) {
  if (c.hp <= 0) return 0;
  return (c.hp === 1 ? .6 : 1) * (c.trait === 'travailleur' ? 1.5 : 1) * (.7 + r.moral / 333);
}
const fmt1 = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
function canBuild(r, id) {
  const p = P[id];
  if (built(r, id)) return 'TERMINE';
  if (p.need) for (const n of p.need) { if (n === 'pieces' ? r.pieces < 3 : !r.items[n]) return 'IL MANQUE : ' + (n === 'pieces' ? `PIECES ${r.pieces}/3` : n === 'radio' ? 'LA RADIO' : n.toUpperCase()); }
  if (!r.proj[id].paid && r.wood < p.wood) return `IL MANQUE DU BOIS (${p.wood})`;
  return '';
}
function explorable(r) { const o = []; r.tiles.forEach((x, i) => { if (!x.seen && nb4(i).some(j => r.tiles[j].seen && r.tiles[j].t !== 'mer')) o.push(i); }); return o; }
function reveal(r, i, log, who) {
  const x = r.tiles[i]; if (x.seen) return; x.seen = true; r.found++;
  const name = TILES[x.t].name;
  let line = `${who} découvre : ${name.toLowerCase()}`;
  if (x.t === 'source') line += ' (de l\'eau douce !)';
  if (x.t === 'grotte') line += ' (un abri naturel)';
  if (x.t === 'jungle') { r.food += 2; line += ' (+2 fruits)'; }
  if (x.t === 'colline' || x.t === 'volcan') { nb4(i).forEach(j => { if (!r.tiles[j].seen) { r.tiles[j].seen = true; r.found++; } }); line += ' : vue sur les alentours'; }
  if (x.t === 'lagon') { r.food += 2; line += ' (+2 poissons)'; }
  log.push(line + '.');
  if (x.item) for (const it of x.item) {
    if (it === 'pieces') { r.pieces++; log.push(`  Une pièce de radio ! (${r.pieces}/3)`); }
    else if (it === 'tresor') { r.tresor = true; r.moral += 10; log.push('  Un coffre plein d\'or : le trésor de l\'île !'); }
    else if (it === 'naufrage') {
      const R = mulberry(r.seed * 5 + i), name = NAMES.filter(n => !r.crew.some(c => c.name === n))[Math.floor(R() * 10)], tal = Object.keys(TALENTS)[Math.floor(R() * 8)];
      r.crew.push({ name, talent: tal, trait: 'courageux', hp: 2, task: 'repos', skin: Math.floor(R() * 4), hair: Math.floor(R() * 6), long: R() < .5 });
      r.moral += 8; log.push(`  ${name}, une autre naufragée, se joint au camp !`);
    } else { r.items[it] = true; log.push(`  Trouvé : ${ITEMS[it].toLowerCase()}.`); }
  }
  x.item = null;
}
function endDay(r) {
  const log = [], crew = r.crew, has = t => crew.some(c => c.talent === t && c.hp > 0);
  const work = {}; TASKS.forEach(t => work[t[0]] = []);
  crew.forEach(c => { let t = c.task; if (c.hp <= 0) t = 'repos'; if (t === 'explorer' && c.trait === 'peureux') t = 'repos'; work[t].push(c); });
  const sum = (t, f) => work[t].reduce((a, c) => a + f(c) * eff(r, c), 0);
  // production
  const fish = sum('peche', c => 3 + (c.talent === 'pecheur' ? 1.5 : 0)) * (r.items.filet ? 1.5 : 1);
  const jungles = r.tiles.filter(x => x.seen && x.t === 'jungle').length;
  const fruit = sum('cueillette', c => 2.5 + (c.talent === 'enfant' ? 1 : 0) + Math.min(1.5, jungles * .3));
  const source = r.tiles.some(x => x.seen && x.t === 'source');
  const water = sum('eau', () => source ? 5 : 3);
  const wood = sum('bois', c => 2.5 + (r.items.hache ? 1 : 0) + (c.talent === 'charpentier' ? 1 : 0));
  r.food += fish + fruit; r.water += water; r.wood += wood;
  if (fish) log.push(`Pêche : +${fmt1(fish)} nourriture.`); if (fruit) log.push(`Cueillette : +${fmt1(fruit)} nourriture.`);
  if (water) log.push(`Eau : +${fmt1(water)}${source ? ' (source)' : ''}.`); if (wood) log.push(`Bois : +${fmt1(wood)}.`);
  if (built(r, 'pieges')) { r.food += 1.5; log.push('Pièges : +1,5 nourriture.'); }
  if (built(r, 'citerne')) { r.water += 1; log.push('Citerne : +1 eau.'); }
  // chantier
  if (work.chantier.length) {
    const id = r.sel, p = P[id], why = canBuild(r, id);
    if (why === 'TERMINE') log.push(`Chantier : ${p.name.toLowerCase()} déjà terminé, choisis-en un autre.`);
    else if (why) log.push(`Chantier ${p.name.toLowerCase()} : ${why.toLowerCase()}.`);
    else {
      if (!r.proj[id].paid) { r.wood -= p.wood; r.proj[id].paid = true; }
      const pts = sum('chantier', c => 1 + (c.talent === 'charpentier' ? 1 : 0) + (c.talent === 'mecano' ? (id === 'radio' ? 1 : .5) : 0));
      r.proj[id].p = Math.min(p.pts, r.proj[id].p + pts);
      if (built(r, id)) { log.push(`${p.name} TERMINE !`); r.moral += 6;
        // le chantier suivant est choisi tout seul (le premier de la liste encore à faire)
        const next = PROJ.find(q => !built(r, q.id) && !/IL MANQUE : /.test(canBuild(r, q.id))) || PROJ.find(q => !built(r, q.id));
        if (next) { r.sel = next.id; log.push(`  Prochain chantier : ${next.name.toLowerCase()}.`); } if (id === 'radio') { r.radioDay = r.day + 3; log.push('Appel lancé à la radio : les secours arrivent dans 3 jours !'); } }
      else log.push(`Chantier ${p.name.toLowerCase()} : ${fmt1(r.proj[id].p)}/${p.pts}.`);
    }
  }
  // exploration
  const targets = explorable(r);
  for (const c of work.explorer) {
    for (let k = 0; k < (c.talent === 'exploratrice' ? 2 : 1); k++) {
      const open = explorable(r); if (!open.length) { if (!k) log.push(`${c.name} : toute l'île est explorée.`); break; }
      const i = open.includes(r.target) ? r.target : open.sort((a, b) => H(r.seed, r.day, a) - H(r.seed, r.day, b))[0];
      const danger = r.tiles[i].t === 'volcan' ? .45 : .15, safe = c.talent === 'exploratrice' ? 0 : c.trait === 'courageux' ? .5 : 1;
      reveal(r, i, log, c.name);
      if (r.target === i) r.target = -1;
      if (H(r.seed, r.day * 13 + k, crew.indexOf(c)) < danger * safe) { c.hp--; log.push(`  ${c.name} s'est blessé en chemin.`); }
    }
  }
  void targets;
  // soins et repos
  for (const c of work.soins) { const n = 1 + (c.talent === 'infirmiere' ? 1 : 0) + (r.items.trousse ? 1 : 0), t = crew.filter(x => x.hp < 3 && x !== c).sort((a, b) => a.hp - b.hp)[0];
    if (t) { t.hp = Math.min(3, t.hp + n); if (r.sick === crew.indexOf(t)) r.sick = -1; log.push(`${c.name} soigne ${t.name} (+${n}).`); } }
  for (const c of work.repos) { if (c.hp < 3) c.hp++; r.moral += c.trait === 'reveur' ? 5 : 1.5; }
  // guet et navires
  const ship = r.ships.includes(r.day), soon = r.ships.includes(r.day + 1), watch = work.guet.length > 0;
  const seesEarly = built(r, 'tour') || work.guet.some(c => c.talent === 'marin') || r.items.longue;
  if (ship) {
    if (watch && built(r, 'feu')) { log.push('Un navire passe au large… le guetteur allume le feu de signal. Il fait demi-tour : SAUVES !'); return finish(r, log, 'feu'); }
    if (watch) log.push('Un navire est passé au large ! Sans feu de signal, il ne vous a pas vus.');
    else log.push('Personne ne faisait le guet… Plus tard, quelqu\'un dit avoir vu une fumée de navire.');
    r.moral -= 8;
  }
  if (soon && watch && seesEarly) log.push('Le guetteur aperçoit un navire à l\'horizon : il passera DEMAIN !');
  if (r.radioDay && r.day >= r.radioDay) { log.push('Un hélicoptère se pose sur la plage : les secours sont là. SAUVES !'); return finish(r, log, 'radio'); }
  // la nuit : manger, boire, dormir
  const eat = crew.reduce((a, c) => a + (c.trait === 'gourmand' ? 1.5 : 1), 0) * (has('cuisinier') ? .85 : 1), drink = crew.length;
  r.food -= eat; r.water -= drink;
  log.push(`Le soir : ${fmt1(eat)} nourriture et ${drink} eau consommées.`);
  if (r.food < 0) { const n = Math.min(crew.length, Math.ceil(-r.food)); hurt(r, n, 1, log, 'ont eu faim'); r.food = 0; r.moral -= 10; }
  if (r.water < 0) { const n = Math.min(crew.length, Math.ceil(-r.water)); hurt(r, n, 2, log, 'ont eu soif'); r.water = 0; r.moral -= 12; }
  if (!built(r, 'reserve') && r.food > 6) { const lost = Math.floor((r.food - 6) * .25); if (lost) { r.food -= lost; log.push(`${lost} nourriture s'est gâtée (une réserve la garderait).`); } }
  const shelter = built(r, 'abri') ? 1 : r.tiles.some(x => x.seen && x.t === 'grotte') ? .5 : 0;
  if (!shelter) { r.moral -= 3; log.push('Nuit froide sans abri (-3 moral).'); }
  // traits et talents

// le radeau : on prend la mer
function sail(r) {

  if (H(r.seed, r.day, 999) < chance) { log.push('Le radeau franchit la barrière de corail… Trois jours plus tard, une côte ! SAUVES !'); return finish(r, log, 'radeau'); }
  r.proj.radeau.p = Math.floor(P.radeau.pts / 2); r.moral -= 15; c.forEach(x => x.hp = Math.max(0, x.hp - 1));

function frame(ts) {

  requestAnimationFrame(frame);
}
function logical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH]; }
cv.addEventListener('pointerdown', e => {

  for (let i = BTN.length - 1; i >= 0; i--) { const b = BTN[i]; if (x >= b.x && y >= b.y && x < b.x + b.w && y < b.y + b.h) { b.act(); return; } }

  if (S.screen === 'play' && !S.pop && x >= MX && x < MX + MW * TW && y >= MY && y < MY + MH * TH) {

    if (explorable(r).includes(i)) { r.target = r.target === i ? -1 : i; SFX.pick(); save(); }
  }

function resize() {

  cv.style.width = Math.floor(LW * sc) + 'px'; cv.style.height = Math.floor(LH * sc) + 'px';
  cv.style.marginTop = Math.max(0, Math.floor((ah - LH * sc) / 2)) + 'px';
  K = Math.max(1, Math.ceil(sc * dpr - .05)); cv.width = LW * K; cv.height = LH * K;
}
