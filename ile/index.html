<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>La colonie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@700;800&family=Signika:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fit" id="fit">
  <div class="screen" id="screen">
    <div class="top" id="top"></div>
    <div class="mapw" id="mapw">
      <canvas id="map" aria-label="Carte de l'île"></canvas>
      <div class="zoom"><button id="zin" aria-label="Vue détaillée">+</button><button id="zout" aria-label="Vue d'ensemble">−</button></div>
    </div>
    <div class="drawer" id="drawer">
      <button class="handle" id="handle" aria-label="Ouvrir ou fermer le volet"><span id="harrow">›</span><small>CASE</small></button>
      <div class="body" id="panel"></div>
    </div>
    <div class="bottom" id="bottom"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
</div>

<div class="rotate" id="rotate" hidden>
  <div class="ph" aria-hidden="true"></div>
  <b>Tourne ton téléphone</b>
  <p>La colonie se joue à l'horizontale, pour voir toute la carte.</p>
  <button id="anyway">Jouer quand même</button>
  <a href="../index.html">Retour à la Ludothèque</a>
</div>

<script src="regles.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion, et bouton de retour au menu dans l'appli installée */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
