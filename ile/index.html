<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>La colonie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@700;800&family=Signika:wght@400;600;700&display=swap">
<style>
/* La colonie (specs/colonie.md) : un tout petit Banished au tour par tour, téléphone à l'horizontale.
   L'écran fait 640 × 360 pixels logiques. La carte occupe toute la largeur ; le volet de la case glisse depuis la droite.
   Règles (logique pure) dans regles.js ; ici l'affichage et les commandes. */
:root{
  color-scheme: dark;
  --night:#0b1a14; --ink:#06100c; --text:#f4f1e6; --dim:#a9c4b8; --gold:#ffd23f; --ok:#6cf09a; --bad:#ff7a6a; --warn:#ffb03a; --sci:#8ac8ff;
  --panel:rgba(18,40,33,.94); --panel2:#0e221c; --line:#2f6a56;
  --f-title:"Alegreya Sans SC", "Trebuchet MS", sans-serif; --f-ui:"Signika", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night)}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text); font-family:var(--f-ui); font-size:17px; line-height:1.35;
  padding:8px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:2px solid var(--gold); outline-offset:1px}
.num{font-variant-numeric:tabular-nums}

/* ---------- l'écran 640 × 360, agrandi ---------- */
.fit{position:relative; overflow:hidden; border-radius:10px; box-shadow:0 0 0 2px #000, 0 0 0 5px #2a4a3e, 0 10px 30px rgba(0,0,0,.6); flex:none}
.screen{position:absolute; left:0; top:0; width:640px; height:360px; transform-origin:0 0; background:var(--ink); overflow:hidden}

/* barre du haut */
.top{position:absolute; left:0; top:0; width:640px; height:34px; display:flex; align-items:center; gap:4px; padding:0 5px;
  background:linear-gradient(#2a4a3f, #17322a); border-bottom:1px solid #000; z-index:3}
.menu{width:28px; height:28px; flex:none; border:1px solid #000; border-radius:7px; background:linear-gradient(#24503f, #1a3d31); font-size:16px; font-weight:700; color:var(--gold); line-height:1}
.date{display:flex; flex-direction:column; justify-content:center; padding:0 4px 0 2px; min-width:84px}
.date b{font-family:var(--f-title); font-weight:800; font-size:15px; line-height:15px; color:var(--gold); letter-spacing:.03em}
.date small{font-size:11px; line-height:13px; color:var(--dim)}
.res{display:grid; grid-template-columns:14px auto; grid-template-rows:14px 12px; column-gap:4px; align-items:center; height:28px; padding:1px 5px 1px 4px;
  border-radius:6px; background:linear-gradient(#10261f, #0b1c17); border:1px solid #2f5a4a; text-align:left}
.res canvas{grid-row:1 / 3; width:14px; height:14px; image-rendering:pixelated}
.res b{font-weight:700; font-size:13px; line-height:14px; font-variant-numeric:tabular-nums}
.res i{font-style:normal; font-weight:600; font-size:11px; line-height:12px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
.res i.up{color:var(--ok)} .res i.dn{color:var(--bad)}
.res.hot{border-color:var(--bad); box-shadow:0 0 0 1px rgba(255,122,106,.35)}
.spacer{flex:1}

/* la carte, sur toute la largeur */
.mapw{position:absolute; left:0; top:34px; width:640px; height:292px; overflow:hidden; background:#145a8a}
.mapw canvas{position:absolute; left:0; top:0; width:640px; height:292px; touch-action:none; cursor:grab}
.zoom{position:absolute; left:6px; top:6px; display:flex; flex-direction:column; gap:5px}
.zoom button{width:30px; height:28px; border:1px solid #000; border-radius:7px; background:linear-gradient(rgba(40,80,66,.95), rgba(15,36,30,.95)); font-size:18px; font-weight:700; line-height:1; box-shadow:0 2px 0 rgba(0,0,0,.5)}
.zoom button:disabled{opacity:.35}

/* le volet rétractable */
.drawer{position:absolute; right:0; top:34px; width:214px; height:292px; z-index:2; transform:translateX(0); transition:transform .22s ease-out}
.drawer.shut{transform:translateX(214px)}
.drawer .body{height:100%; overflow-y:auto; padding:8px 8px 10px; display:flex; flex-direction:column; gap:6px; background:var(--panel);
  border-left:1px solid #000; box-shadow:-6px 0 14px rgba(0,0,0,.35); scrollbar-width:thin}
.handle{position:absolute; left:-28px; top:10px; width:28px; height:52px; border:1px solid #000; border-right:0; border-radius:8px 0 0 8px;
  background:linear-gradient(90deg, #2a5a4a, #17322a); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:16px; font-weight:700; color:var(--gold); box-shadow:-3px 2px 6px rgba(0,0,0,.35)}
.handle small{font-size:9px; font-weight:600; color:var(--dim); letter-spacing:.06em}
.drawer h3{margin:0; display:flex; align-items:flex-start; justify-content:space-between; gap:4px; font-family:var(--f-title); font-weight:800; font-size:16px; line-height:17px; color:var(--gold); letter-spacing:.02em}
.drawer h3 button{flex:none; width:24px; height:22px; border:1px solid #000; border-radius:6px; background:#1f4a3c; font-size:12px; color:var(--dim)}
.drawer .hero{display:flex; gap:8px; align-items:center}
.drawer .hero canvas{width:44px; height:44px; flex:none; image-rendering:pixelated; border-radius:6px; background:#0e221c; border:1px solid var(--line)}
.drawer p{margin:0; font-size:13px; line-height:16px; color:var(--dim)}
.drawer p b{color:var(--text); font-weight:600}
.drawer .lbl{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; margin-top:2px}
.good{color:var(--ok)!important} .bad{color:var(--bad)!important} .warn{color:var(--warn)!important} .sci{color:var(--sci)!important}
.pm{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px; border-radius:8px; background:var(--panel2); border:1px solid var(--line)}
.pm span{font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
.pm button, .btn{min-width:32px; height:28px; border:1px solid #000; border-radius:7px; background:linear-gradient(#3fa070, #2a7a50); color:#fff; font-size:17px; font-weight:700; line-height:1; box-shadow:0 2px 0 #000, 0 1px 0 rgba(255,255,255,.25) inset}
.pm button:disabled, .btn:disabled{opacity:.35}
.btn{font-size:13px; padding:0 10px}
.btn.red{background:linear-gradient(#a8443a, #7a2a20)}
.btn.blue{background:linear-gradient(#2a6a7c, #1a4a5a)}
.seg{display:flex; gap:4px} .seg .btn{flex:1; height:26px; font-size:12px} .seg .btn.on{box-shadow:0 0 0 2px var(--gold)}
.who{display:flex; flex-wrap:wrap; gap:4px}
.who span{display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600; padding:1px 6px 1px 1px; border-radius:5px; background:var(--panel2)}
.who canvas{width:16px; height:16px; image-rendering:pixelated; border-radius:3px}
.bar{height:9px; border-radius:5px; border:1px solid #000; background:#08201a; position:relative; overflow:hidden; flex:none}
.bar span{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#ffe27a, #e0a820)}
.bar em{position:absolute; top:0; bottom:0; background:repeating-linear-gradient(115deg, #fff2a8 0 3px, transparent 3px 6px)}
.build{display:grid; grid-template-columns:30px 1fr; gap:0 6px; align-items:center; text-align:left; padding:4px 6px 4px 4px; border:1px solid #000; border-radius:8px; background:linear-gradient(#24503f, #1a3d31); box-shadow:0 2px 0 rgba(0,0,0,.5)}
.build:disabled{opacity:.45}
.build canvas{grid-row:1 / 3; width:30px; height:30px; image-rendering:pixelated}
.build b{font-weight:700; font-size:13px; line-height:15px}
.build small{font-size:12px; line-height:14px; color:var(--dim)}
.build.lock{background:linear-gradient(#2a3a44, #1e2a32)}
.build.lock small{color:var(--sci)}
.hint{font-size:13px; color:var(--dim); border-top:1px dashed var(--line); padding-top:6px}
.mood{display:flex; flex-direction:column; gap:1px}
.mood span{display:flex; justify-content:space-between; font-size:12px; color:var(--dim)}

/* barre du bas */
.bottom{position:absolute; left:0; top:326px; width:640px; height:34px; display:flex; align-items:center; gap:5px; padding:0 5px; background:linear-gradient(#17322a, #0e221c); border-top:1px solid #000; z-index:3}
.alert{flex:1; min-width:0; height:26px; display:flex; align-items:center; gap:6px; padding:0 9px; border:1px solid #000; border-radius:7px; background:#3a2a12; color:var(--warn); font-size:13px; font-weight:700; text-align:left; white-space:nowrap; overflow:hidden}
.alert span{overflow:hidden; text-overflow:ellipsis}
.alert.danger{background:linear-gradient(#5a1c18, #43130f); color:#ffc0b0}
.alert.calm{background:#123026; color:var(--ok)}
.alert.info{background:#123026; color:var(--dim)}
.alert em{font-style:normal; margin-left:auto; padding:0 6px; border-radius:9px; background:rgba(0,0,0,.35); color:var(--dim); font-size:11px}
.cmd{height:26px; padding:0 11px; border:1px solid #000; border-radius:7px; background:linear-gradient(#2a6a7c, #1a4a5a); font-size:13px; font-weight:700; box-shadow:0 2px 0 #000, 0 1px 0 rgba(255,255,255,.18) inset; white-space:nowrap}
.cmd.sci{background:linear-gradient(#3a4a8a, #26326a); color:#fff!important}
.cmd.sci.ready{box-shadow:0 0 0 2px var(--sci), 0 2px 0 #000}
.cmd.go{background:linear-gradient(#ffc44a, #d88a14); color:#2a1400; padding:0 14px}

/* fenêtres */
.sheet{position:absolute; left:0; top:34px; width:640px; height:292px; background:rgba(4,10,8,.72); display:flex; align-items:center; justify-content:center; z-index:5}
.sheet .box{width:620px; max-height:280px; overflow-y:auto; background:#16302a; border:1px solid #000; border-radius:10px; box-shadow:0 0 0 1px var(--line) inset, 0 12px 30px rgba(0,0,0,.6); padding:10px; display:flex; flex-direction:column; gap:8px; scrollbar-width:thin}
.sheet h2{margin:0; display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--f-title); font-weight:800; font-size:17px; color:var(--gold); letter-spacing:.02em}
.sheet h2 button{flex:none; height:26px; padding:0 10px; border:1px solid #000; border-radius:7px; background:linear-gradient(#2a6a7c, #1a4a5a); font-family:var(--f-ui); font-size:13px; font-weight:700}
.sheet p{margin:0; font-size:14px; line-height:18px; color:var(--dim)} .sheet p b{color:var(--text)}
.posts{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px}
.post{display:grid; grid-template-columns:30px minmax(0, 1fr) auto; gap:0 6px; align-items:center; padding:5px; border-radius:8px; background:var(--panel2); border:1px solid var(--line)}
.post canvas{width:30px; height:30px; image-rendering:pixelated; grid-row:1 / 3}
.post b{font-weight:700; font-size:13px; line-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.post small{font-size:12px; line-height:14px; color:var(--ok); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.post .pm{grid-column:3; grid-row:1 / 3; background:none; border:0; padding:0; gap:4px}
.post .pm button{min-width:28px; height:26px}
.colons{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px}
.colon{display:grid; grid-template-columns:30px minmax(0, 1fr); gap:0 6px; align-items:center; text-align:left; padding:5px; border:1px solid #000; border-radius:8px; background:var(--panel2)}
.colon.on{box-shadow:0 0 0 2px var(--gold)}
.colon:disabled{opacity:.6; cursor:default}
.colon canvas{width:30px; height:30px; image-rendering:pixelated; grid-row:1 / 4; border-radius:5px}
.colon b{font-weight:700; font-size:13px; line-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.colon small{font-size:11px; line-height:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.colon small.job{color:var(--gold)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chips button{height:26px; padding:0 9px; border:1px solid #000; border-radius:7px; background:linear-gradient(#24503f, #1a3d31); font-size:12px; font-weight:700}
.chips button:disabled{opacity:.35}
.cards{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.card{width:144px; min-height:118px; display:flex; flex-direction:column; gap:4px; padding:8px; border:1px solid #3a2a10; border-radius:8px;
  background:linear-gradient(#fbf3dc, #eadcb4); color:#2a1a08; box-shadow:0 3px 0 rgba(0,0,0,.45); animation:pop .35s both}
.card canvas{width:36px; height:36px; image-rendering:pixelated}
.card b{font-family:var(--f-title); font-weight:800; font-size:15px; line-height:16px; color:#7a2a10}
.card p{margin:0; font-size:13px; line-height:16px; color:#2a1a08}
.card.bad{background:linear-gradient(#ffe6dc, #f4c4b4)} .card.good{background:linear-gradient(#eaf8dc, #cfe8b8)} .card.sci{background:linear-gradient(#e4eeff, #c4d4f4)}
@keyframes pop{from{transform:translateY(12px) scale(.94); opacity:0}}
.alerts{display:flex; flex-direction:column; gap:5px}
.alerts p{margin:0; padding:6px 9px; border-radius:7px; background:var(--panel2); font-size:13px; line-height:17px; color:var(--dim)}
.alerts p b{display:block; font-size:14px; font-weight:700}
.alerts p.danger{border:1px solid var(--bad)} .alerts p.danger b{color:#ffb0a0} .alerts p.warn b{color:var(--warn)} .alerts p.info b{color:var(--text)}
.sheet .wide{align-self:center; height:30px; padding:0 16px; border:1px solid #000; border-radius:7px; background:linear-gradient(#ffc44a, #d88a14); color:#2a1400; font-size:14px; font-weight:700; box-shadow:0 2px 0 #000}
.sheet .wide.blue{background:linear-gradient(#2a6a7c, #1a4a5a); color:var(--text)}
.row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.tree{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; align-items:start}
.branch{display:flex; flex-direction:column; gap:4px}
.branch > b{font-family:var(--f-title); font-weight:800; font-size:15px; color:var(--sci); text-align:center}
.plan{display:grid; grid-template-columns:28px minmax(0, 1fr); gap:0 5px; align-items:center; text-align:left; padding:4px; border:1px solid #000; border-radius:8px; background:var(--panel2); position:relative}
.plan canvas{grid-row:1 / 3; width:28px; height:28px; image-rendering:pixelated}
.plan b{font-size:12px; line-height:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plan small{font-size:11px; line-height:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plan.fait{border-color:#2f6a56; background:#173a2e} .plan.fait small{color:var(--ok)}
.plan.pret{background:linear-gradient(#3a4a8a, #26326a); box-shadow:0 0 0 2px var(--sci)} .plan.pret small{color:#fff}
.plan.bloque{opacity:.5}
.plan:not(:last-child)::after{content:""; position:absolute; left:17px; bottom:-5px; width:2px; height:4px; background:var(--line)}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px}
.stats div{padding:6px; border-radius:8px; background:var(--panel2); text-align:center}
.stats b{display:block; font-family:var(--f-title); font-size:22px; color:var(--gold)}
.stats small{font-size:12px; color:var(--dim)}

/* « tourne ton téléphone » */
.rotate{position:fixed; inset:0; z-index:20; background:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); text-align:center}
.rotate .ph{width:54px; height:92px; border:5px solid var(--text); border-radius:10px; position:relative; animation:turn 2.4s ease-in-out infinite}
.rotate .ph::before{content:""; position:absolute; inset:6px 5px 16px; border-radius:3px; background:linear-gradient(#5cbf4a, #2f7a2a)}
@keyframes turn{0%,25%{transform:rotate(0)} 55%,100%{transform:rotate(-90deg)}}
.rotate b{font-family:var(--f-title); font-weight:800; font-size:26px; line-height:28px; color:var(--gold)}
.rotate p{margin:0; max-width:30ch; color:var(--dim)}
.rotate button, .rotate a{padding:10px 16px; border:1px solid #000; border-radius:8px; background:linear-gradient(#2a6a7c, #1a4a5a); font-weight:700; color:var(--text); text-decoration:none}
@media (prefers-reduced-motion: reduce){ .rotate .ph, .card{animation:none} .drawer{transition:none} }
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="screen" id="screen">
    <div class="top" id="top"></div>
    <div class="mapw" id="mapw">
      <canvas id="map" aria-label="Carte de l'île"></canvas>
      <div class="zoom"><button id="zin" aria-label="Vue détaillée">+</button><button id="zout" aria-label="Vue d'ensemble">−</button></div>
    </div>
    <div class="drawer" id="drawer">
      <button class="handle" id="handle" aria-label="Ouvrir ou fermer le volet"><span id="harrow">›</span><small>CASE</small></button>
      <div class="body" id="panel"></div>
    </div>
    <div class="bottom" id="bottom"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
</div>

<div class="rotate" id="rotate" hidden>
  <div class="ph" aria-hidden="true"></div>
  <b>Tourne ton téléphone</b>
  <p>La colonie se joue à l'horizontale, pour voir toute la carte.</p>
  <button id="anyway">Jouer quand même</button>
  <a href="../index.html">Retour à la Ludothèque</a>
</div>

<script src="regles.js"></script>
<script>
'use strict';
const TS = 32, WW = MW * TS, WH = MH * TS, VW = 640, VH = 292, DRW = 214;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('ile.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ile.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ile.' + k); } catch (e) {} },
};
let run = null, isle = null;
// état de l'affichage (jamais sauvegardé)
const V = { sel: null, panel: null, drawer: false, zoom: 1.25, cam: { x: 0, y: 0 }, floats: [], sheet: null, confirmed: false, report: [], busy: false, rotDismissed: false, demo: null, active: 0 };

/* =================== le terrain, pixel par pixel =================== */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const SP = s => ({ // couleurs de chaque terrain selon la saison : [sombre, moyen, clair]
  mead: [['#3f9a3a', '#5cbf4a', '#7ad65a'], ['#6a9a30', '#8cc04a', '#a8d45a'], ['#8a7a30', '#b0a848', '#c8bc5a'], ['#c0d0dc', '#e2eaf0', '#f8fbfd']][s],
  forg: [['#2f7a2f', '#3f8f3a', '#4fa046'], ['#4f7a2a', '#628a32', '#749a3c'], ['#6a5a28', '#7f6a30', '#8f7a3a'], ['#b8c8d4', '#d4e0e8', '#eef4f8']][s],
  hill: [['#6a8a40', '#7f9c4a', '#93ae58'], ['#88883e', '#9c9c48', '#b0b058'], ['#8a7a40', '#9c8c4a', '#ae9e58'], ['#c8d4dc', '#e0e8ee', '#f6f9fb']][s],
  rock: [['#6e6e64', '#86867a', '#a0a094'], ['#6e6e64', '#86867a', '#a0a094'], ['#6e6a60', '#86827a', '#a09c94'], ['#b4bec6', '#d0d8de', '#eef2f6']][s],
  sand: s === 3 ? ['#cfcabc', '#e4e0d4', '#f4f2ea'] : ['#d4b878', '#e8d090', '#f4e2a8'],
  wet: s === 3 ? '#b0b4b0' : '#b89a5c',
  marsh: s === 3 ? ['#a8bcb4', '#c4d4cc', '#dce8e2'] : ['#3a6a48', '#4a7a50', '#5c8c5a'],
  sea: s === 3 ? ['#123e60', '#16486e', '#1f5a80'] : ['#0f4e7c', '#145a8a', '#1a6a9e'],
  shallow: s === 3 ? ['#2a6a8a', '#347a9a', '#3f88a8'] : ['#2478aa', '#2a88bc', '#3498ca'],
  riv: s === 3 ? ['#a8cce0', '#c4e0f0', '#e4f2fa'] : ['#2a88c8', '#3fa0e0', '#6ab8ea'],
  bank: s === 3 ? '#9aa8a8' : '#8a7a4a', foam: [236, 248, 255],
});
const season = () => dateOf(run).season;
let groundCv, terrainCv, fogCv, staticCv, groundKey = '', sceneryKey = '', staticDirty = true;
function riverSegs() { return isle.river.map(i => [(i % MW + .5) * TS, ((i / MW | 0) + .5) * TS]); }
// le sol (ne change qu'avec l'île et la saison)
function buildGround() {
  const key = isle.seed + ':' + season(); if (key === groundKey) return; groundKey = key; sceneryKey = '';

      add(`<p>Lits : <b>${who.length} / ${b.type === 'tente' ? 8 : 4}</b>${s === 3 ? ` · chauffage <span class="bad">−${HEAT[b.type]} bois</span>` : ''}</p>`);

  if (t === T.HILL || t === T.ROCK) facts.push(`pierre : <b>${t === T.ROCK ? 'beaucoup' : 'un peu'}</b>`); if (N4.some(([dx, dy]) => inside(x + dx, y + dy) && [T.SEA, T.RIV].includes(isle.t[(y + dy) * MW + x + dx]))) facts.push('poisson à côté');

}
function renderBottom() {

  a.innerHTML = first ? `<span>${first[0] === 'info' ? '' : '⚠ '}${first[1]}</span>${al.length > 1 ? `<em>+${al.length - 1}</em>` : ''}` : '<span>Tout va bien</span>'; a.onclick = () => openSheet('alerts'); bt.append(a);
  const ready = Object.keys(TREE).some(k => researchState(run, k) === 'pret');
  const sc = document.createElement('button'); sc.className = 'cmd sci' + (ready ? ' ready' : ''); sc.textContent = `Savoir ${fl(run.res.savoir)}`; sc.onclick = () => openSheet('recherche'); bt.append(sc);
  [['Postes', 'postes'], ['Colons', 'colons']].forEach(([l, s]) => { const b = document.createElement('button'); b.className = 'cmd'; b.textContent = l; b.onclick = () => openSheet(s); bt.append(b); });

function refresh() { renderTop(); renderPanel(); renderBottom(); if (!$('sheet').hidden && V.sheet !== 'report') openSheet(V.sheet); }
// après une commande du joueur : sauvegarde et nouvel affichage
function changed() { V.confirmed = false; save(); refresh(); wake(); }

/* =================== fenêtres =================== */
let colonSel = null;

      [...posts(run), null].forEach(b => { const bt = document.createElement('button'), id = b === null ? null : postId(b);
        bt.textContent = b === null ? 'Sans poste' : nameOf(b) + (b !== null && colonSel.tal && TALENT_FOR[keyOf(b)] === colonSel.tal ? ' ★' : ''); bt.disabled = colonSel.post === id;

}

/* =================== la semaine passe =================== */
function nextWeek() {

  const res = endWeek(run), now = performance.now();
  V.floats = res.floats.map(f => ({ ...f, t: now })); V.report = res.rep; V.confirmed = false; V.busy = true; wake();

/* =================== démarrage et mise à l'échelle =================== */
$('anyway').onclick = () => { $('rotate').hidden = true; V.rotDismissed = true; fit(); };
function fit() {
  const W = window.innerWidth - 16, Hh = window.innerHeight - 16, s = Math.max(.4, Math.min(W / 640, Hh / 360, 2.4));
  $('fit').style.width = `${640 * s}px`; $('fit').style.height = `${360 * s}px`; $('screen').style.transform = `scale(${s})`;
  S = Math.min(3, s * Math.min(2, window.devicePixelRatio || 1)); cv.width = Math.round(VW * S); cv.height = Math.round(VH * S);

}
