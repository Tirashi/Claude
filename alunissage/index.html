<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alunissage</title>
<meta name="description" content="Alunissage : pose ton module en douceur, site après site.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#070a1c">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #04050e; overflow: hidden; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { display: block; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv" width="272" height="480" aria-label="Alunissage : poser un module lunaire"></canvas>
<script src="../ludo-scores.js"></script>
<script>
'use strict';
/* =====================================================================
   ALUNISSAGE : poser un module en douceur sur une suite de sites.
   - Deux réacteurs : le gauche pousse vers le haut et vers la droite, le
     droit vers le haut et vers la gauche ; les deux ensemble : tout droit.
   - Se poser sur une aire (×2, ×3 ou ×5) assez lentement, sinon c'est la
     casse. Le carburant est limité ; il se recharge en partie à chaque site.
   - Une mission enchaîne les sites (gravité, vent, relief de plus en plus
     durs) jusqu'au crash. Le score total est le record (classement).
   - Mission du jour : la même suite de sites pour toute la famille.
   L'écran est dessiné en 272×480 pixels logiques puis agrandi sans lissage.
   ===================================================================== */
const LW = 272, LH = 480, TAU = Math.PI * 2, FONT = '"Press Start 2P", monospace', OUT = '#0b0614';
const GROUND_TOP = 230, GROUND_BOT = 392, VY_OK = 24, VX_OK = 12;
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('alunissage.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('alunissage.' + k, JSON.stringify(v)); } catch (e) {} },
};
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const todayKey = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// les mondes : gravité (px/s²), vent (px/s²), relief, couleurs du sol et du ciel
const WORLDS = [
  { name: 'LA LUNE', g: 11, wind: 0, rough: .6, sky: ['#05060f', '#0a0c1e'], rock: ['#d6d4cc', '#a8a59c', '#7a776f', '#4e4b46', '#2c2a28'] },
  { name: 'PHOBOS', g: 7, wind: 0, rough: .9, sky: ['#08060c', '#140e18'], rock: ['#c8b8a0', '#9a8670', '#6e5c4a', '#463a2e', '#261f18'] },
  { name: 'MARS', g: 14, wind: 4, rough: .8, sky: ['#2a1410', '#6a3420'], rock: ['#e8a070', '#c07048', '#904a30', '#5e2e1e', '#341810'] },
  { name: 'EUROPE', g: 10, wind: 0, rough: 1, sky: ['#04081a', '#0e1838'], rock: ['#f0f6ff', '#c4d8ee', '#8eaccc', '#5a7898', '#2e4260'] },
  { name: 'TITAN', g: 9, wind: 5, rough: .9, sky: ['#3a2a0a', '#7a5a1e'], rock: ['#d8b070', '#a8844a', '#7a5e32', '#4e3c20', '#2a2010'] },
  { name: 'COMETE', g: 4, wind: 0, rough: 1.3, sky: ['#02030a', '#060a1a'], rock: ['#9aa0a8', '#6e747c', '#4c5058', '#30343a', '#1a1c20'] },
];
const SITE_COUNT = 12;
function makeSite(seed, n) {
  const R = mulberry(seed * 977 + n * 131), w = WORLDS[n < 6 ? n : Math.floor(R() * WORLDS.length)], lvl = n;
  const rough = w.rough * (1 + lvl * .08), pts = [], N = 34;
  let y = GROUND_TOP + 60 + R() * 80;
  for (let i = 0; i <= N; i++) { y = clamp(y + (R() - .5) * 46 * rough, GROUND_TOP + 10, GROUND_BOT - 8); pts.push([i * LW / N, y]); }
  // aires d'atterrissage : plus elles sont étroites, plus elles rapportent
  const pads = [], specs = [[5, 3 + (lvl > 6 ? 0 : 1)], [3, 5], [2, 7 - Math.min(2, lvl >> 2)]];
  for (const [mul, segs] of specs) {
    for (let tries = 0; tries < 40; tries++) {
      const i0 = 1 + Math.floor(R() * (N - segs - 2));
      if (pads.some(p => i0 < p.i1 + 2 && i0 + segs > p.i0 - 2)) continue;
      const py = Math.round(clamp(pts[i0][1], GROUND_TOP + 20, GROUND_BOT - 12));
      for (let k = i0; k <= i0 + segs; k++) pts[k][1] = py;
      pads.push({ i0, i1: i0 + segs, x0: pts[i0][0], x1: pts[i0 + segs][0], y: py, mul }); break;
    }
  }
  const windDir = R() < .5 ? -1 : 1;
  return { world: w, pts, pads, g: w.g * (1 + lvl * .03), wind: w.wind * windDir * (1 + lvl * .05), x0: 40 + R() * 192, vx0: (R() - .5) * 30, n };
}
function groundY(site, x) {
  const p = site.pts, i = clamp(Math.floor(x / (LW / (p.length - 1))), 0, p.length - 2), [ax, ay] = p[i], [bx, by] = p[i + 1];
  return ay + (by - ay) * (x - ax) / (bx - ax);
}

/* ---------- audio ---------- */
const AC = { ctx: null, out: null, on: store.get('sfx', true), noise: null, ng: null };
function audioInit() {
  if (AC.ctx) { if (AC.ctx.state === 'suspended') AC.ctx.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC.ctx = new Ctx(); AC.out = AC.ctx.createGain(); AC.out.gain.value = .45; AC.out.connect(AC.ctx.destination);
  // souffle continu des réacteurs, dont on règle le volume
  const n = AC.ctx.sampleRate, b = AC.ctx.createBuffer(1, n, n), c = b.getChannelData(0); for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
  const s = AC.ctx.createBufferSource(), f = AC.ctx.createBiquadFilter(); s.buffer = b; s.loop = true; f.type = 'lowpass'; f.frequency.value = 500;
  AC.ng = AC.ctx.createGain(); AC.ng.gain.value = 0; s.connect(f); f.connect(AC.ng); AC.ng.connect(AC.out); s.start();
}
function tone(f, d, type = 'square', vol = .15, slide = 0, delay = 0) {
  if (!AC.on || !AC.ctx) return;
  const t = AC.ctx.currentTime + delay, o = AC.ctx.createOscillator(), g = AC.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.out); o.start(t); o.stop(t + d + .02);
}
const SFX = {
  click: () => tone(660, .05, 'square', .08),
  land: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .12, 0, i * .08)),
  crash: () => { tone(110, .6, 'sawtooth', .25, -80); tone(60, .8, 'square', .2, -20, .05); },
  alarm: () => tone(880, .08, 'square', .08),
};
function engineSound(level) { if (AC.ng && AC.ctx) AC.ng.gain.setTargetAtTime(AC.on ? level * .35 : 0, AC.ctx.currentTime, .03); }

/* ---------- état ---------- */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let K = 1, T = 0, BTN = [];
const S = { phase: 'title', site: null, n: 0, seed: 0, daily: false, ship: null, fuel: 100, score: 0, parts: [], best: store.get('best', 0) || 0,
  dailyBest: store.get('daily', {}) || {}, sites: store.get('sites', 0) || 0, left: false, right: false, msg: '', result: null, rankText: '', stars: null };
function newMission(daily) {
  S.daily = daily; S.seed = daily ? todayKey() : (Math.random() * 2 ** 31) | 0; S.n = 0; S.score = 0; S.fuel = 100; S.rankText = ''; startSite();
}
function startSite() {
  S.site = makeSite(S.seed, S.n); S.ship = { x: S.site.x0, y: 52, vx: S.site.vx0, vy: 0, t: 0 }; S.parts = []; S.result = null; S.phase = 'fly'; S.left = S.right = false;
}

/* ---------- physique ---------- */
const THRUST = 30, SIDE = 13, BURN = 6;
function step(dt) {
  const s = S.ship, site = S.site, l = S.left && S.fuel > 0, r = S.right && S.fuel > 0;
  let ax = site.wind * (s.y < GROUND_TOP ? 1 : .5), ay = site.g;
  if (l) { ay -= THRUST * (r ? .75 : .62); ax += SIDE * (r ? 0 : 1); }
  if (r) { ay -= THRUST * (l ? .75 : .62); ax -= SIDE * (l ? 0 : 1); }
  S.fuel = Math.max(0, S.fuel - ((l ? 1 : 0) + (r ? 1 : 0)) * BURN * dt);
  s.vx += ax * dt; s.vy += ay * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.t += dt;
  if (s.x < 6) { s.x = 6; s.vx = Math.abs(s.vx) * .3; } if (s.x > LW - 6) { s.x = LW - 6; s.vx = -Math.abs(s.vx) * .3; }
  if (s.y < 20) { s.y = 20; s.vy = Math.max(0, s.vy); }
  // flammes et poussière
  const flame = (dx, side) => { for (let k = 0; k < 2; k++) S.parts.push({ x: s.x + dx, y: s.y + 7, vx: side * 10 + (Math.random() - .5) * 10, vy: 30 + Math.random() * 30, t: 0, life: .25 + Math.random() * .15, c: Math.random() < .5 ? '#fff2a8' : '#ff9a3a', s: 1 }); };
  if (l) flame(-4, -1); if (r) flame(4, 1);
  const gy = groundY(site, s.x);
  if ((l || r) && gy - s.y < 40) for (let k = 0; k < 2; k++) S.parts.push({ x: s.x + (Math.random() - .5) * 20, y: gy - 1, vx: (Math.random() < .5 ? -1 : 1) * (20 + Math.random() * 40), vy: -Math.random() * 12, t: 0, life: .5, c: site.world.rock[1], s: 1 });
  engineSound((l ? .5 : 0) + (r ? .5 : 0));
  // contact avec le sol : sous les deux pieds
  const feet = [s.x - 6, s.x + 6].map(x => groundY(site, x)), touch = Math.min(...feet) - (s.y + 8);
  if (touch <= 0) land(feet);
}
function land(feet) {
  const s = S.ship, pad = S.site.pads.find(p => s.x - 5 >= p.x0 && s.x + 5 <= p.x1);
  const soft = s.vy <= VY_OK && Math.abs(s.vx) <= VX_OK, flat = Math.abs(feet[0] - feet[1]) < 2;
  engineSound(0);
  if (pad && soft && flat) {
    const gentle = Math.round(clamp(1 - s.vy / VY_OK, 0, 1) * 50);
    s.y = pad.y - 8; s.vx = 0; s.vy = 0;
    const fuelB = Math.round(S.fuel), pts = pad.mul * (100 + fuelB) + gentle;
    S.score += pts; S.result = { ok: true, pts, mul: pad.mul, fuelB, t: performance.now() };
    S.fuel = Math.min(100, S.fuel + 60); S.phase = 'landed'; SFX.land();
    S.sites = Math.max(S.sites, S.n + 1); store.set('sites', S.sites);
    for (let k = 0; k < 24; k++) { const a = -Math.random() * Math.PI; S.parts.push({ x: s.x, y: s.y + 8, vx: Math.cos(a) * 30, vy: Math.sin(a) * 20, t: 0, life: .7, c: S.site.world.rock[1], s: 1 }); }
  } else {
    const why = !soft ? (s.vy > VY_OK ? 'TROP VITE' : 'TROP DE GLISSADE') : !pad ? 'HORS DE L\'AIRE' : 'SOL EN PENTE';
    S.result = { ok: false, why, t: performance.now() }; S.phase = 'crashed'; SFX.crash();
    for (let k = 0; k < 60; k++) { const a = Math.random() * TAU, v = 20 + Math.random() * 70; S.parts.push({ x: s.x, y: s.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: .8 + Math.random(), c: ['#fff2a8', '#ff9a3a', '#e2603a', '#d8c070', '#9aa0a8'][k % 5], s: k % 4 ? 1 : 2, gr: 1 }); }
    endMission();
  }
}
function endMission() {
  const sc = S.score;
  if (sc > S.best) { S.best = sc; store.set('best', sc); }
  if (S.daily) { const d = todayKey(); if (!(S.dailyBest[d] >= sc)) { S.dailyBest[d] = sc; store.set('daily', S.dailyBest); } }
  if (sc > 0 && window.LudoScores) {
    LudoScores.submit('alunissage', 'best', sc, false).then(r => { if (r && !S.daily) S.rankText = 'CLASSEMENT : ' + LudoScores.rankText(r).toUpperCase(); });
    if (S.daily) LudoScores.submit('alunissage', 'daily:' + todayKey(), sc, false).then(r => { if (r) S.rankText = 'MISSION DU JOUR : ' + LudoScores.rankText(r).toUpperCase(); });
  }
}

/* ---------- dessin ---------- */
const R_ = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function text(s, x, y, col, align = 'left', size = 8, sh = '#05030c') { g.font = `${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'top'; if (sh) { g.fillStyle = sh; g.fillText(s, x + 1, y + 1); } g.fillStyle = col; g.fillText(s, x, y); }
function wrap(s, max) { const out = []; let line = ''; for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); } if (line) out.push(line); return out; }
function logo(s, x, y, size) {
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'top'; g.lineJoin = 'round';
  g.fillStyle = OUT; g.fillText(s, x + 2, y + 3); g.lineWidth = Math.max(3, size / 4); g.strokeStyle = OUT; g.strokeText(s, x, y);
  const gr = g.createLinearGradient(0, y, 0, y + size); gr.addColorStop(0, '#fffbe8'); gr.addColorStop(.5, '#e8e4d8'); gr.addColorStop(1, '#9aa0a8'); g.fillStyle = gr; g.fillText(s, x, y);
}
function panel(x, y, w, h, gold) {
  R_(x - 2, y - 2, w + 4, h + 4, OUT); const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, gold ? '#5a3c10' : '#1c2858'); gr.addColorStop(1, gold ? '#2a1606' : '#0b0f2e'); g.fillStyle = gr; g.fillRect(x, y, w, h);
  R_(x, y, w, 1, gold ? '#ffe28a' : '#8fb0ff'); R_(x, y, 1, h, gold ? '#ffe28a' : '#8fb0ff');
}
function button(x, y, w, h, label, act, o = {}) {
  BTN.push({ x, y, w, h, act }); R_(x - 1, y - 1, w + 2, h + 2, OUT);
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, o.gold ? '#ffd23f' : '#3f63d8'); gr.addColorStop(1, o.gold ? '#c27a12' : '#1d2f86'); g.fillStyle = gr; g.fillRect(x, y, w, h);
  R_(x + 1, y + 1, w - 2, 1, o.gold ? '#fff2b0' : '#9fb8ff'); text(label, x + w / 2, y + Math.round((h - (o.size || 8)) / 2) + 1, o.gold ? '#2a1600' : '#f2f4ff', 'center', o.size || 8, o.gold ? null : '#05030c');
}
// ciel : dégradé du monde, étoiles, et la Terre (ou le soleil) au loin
let SKYC = {};
function sky(site) {
  const key = site.world.name; if (SKYC[key]) return SKYC[key];
  const c = document.createElement('canvas'); c.width = LW; c.height = LH; const x = c.getContext('2d'), R = mulberry(key.length * 71);
  const gr = x.createLinearGradient(0, 0, 0, GROUND_BOT); gr.addColorStop(0, site.world.sky[0]); gr.addColorStop(1, site.world.sky[1]); x.fillStyle = gr; x.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 120; i++) { const s = R(); x.fillStyle = s > .9 ? '#ffffff' : s > .6 ? 'rgba(200,210,255,.7)' : 'rgba(150,160,210,.45)'; x.fillRect(R() * LW | 0, R() * 260 | 0, 1, 1); }
  // une planète au loin, ombrée en paliers
  const px = 40 + R() * 190, py = 70 + R() * 60, pr = 10 + R() * 12;
  for (let yy = -pr; yy <= pr; yy++) for (let xx = -pr; xx <= pr; xx++) { const d = (xx * xx + yy * yy) / (pr * pr); if (d > 1) continue;
    const l = (-xx * .6 - yy * .5) / pr + Math.sqrt(1 - d) * .6, k = l > .7 ? 0 : l > .35 ? 1 : l > 0 ? 2 : 3;
    x.fillStyle = key === 'LA LUNE' ? ['#bfe0ff', '#4a8ad8', '#2a5a9a', '#122a4a'][k] : ['#fff0c8', '#e8b060', '#a86a30', '#4a2a14'][k]; x.fillRect(px + xx | 0, py + yy | 0, 1, 1); }
  return SKYC[key] = c;
}
function drawGround(site) {
  const p = site.pts, rock = site.world.rock;
  g.beginPath(); g.moveTo(0, LH); for (const [x, y] of p) g.lineTo(x, y); g.lineTo(LW, LH); g.closePath();
  const gr = g.createLinearGradient(0, GROUND_TOP, 0, LH); gr.addColorStop(0, rock[2]); gr.addColorStop(1, rock[4]); g.fillStyle = gr; g.fill();
  // arêtes éclairées et cratères
  for (let i = 0; i < p.length - 1; i++) { const [ax, ay] = p[i], [bx, by] = p[i + 1], up = by < ay, len = Math.ceil(bx - ax);
    for (let k = 0; k < len; k++) { const x = ax + k, y = ay + (by - ay) * k / len; R_(x | 0, y | 0, 1, 2, up ? rock[0] : rock[1]); R_(x | 0, (y | 0) + 2, 1, 2, rock[2]); } }
  const R = mulberry(site.n * 7 + 3);
  for (let i = 0; i < 18; i++) { const x = R() * LW, y = groundY(site, x) + 10 + R() * 50, r = 2 + R() * 4; if (y > GROUND_BOT + 40) continue;
    g.fillStyle = rock[4]; g.fillRect(x - r | 0, y | 0, r * 2 | 0, Math.max(1, r * .6) | 0); g.fillStyle = rock[1]; g.fillRect(x - r | 0, (y + r * .6) | 0, r * 2 | 0, 1); }
  // aires d'atterrissage : plaque, balises, multiplicateur
  for (const pad of site.pads) {
    R_(pad.x0, pad.y, pad.x1 - pad.x0, 3, '#c8ccd4'); R_(pad.x0, pad.y + 3, pad.x1 - pad.x0, 1, '#6a7080');
    const on = Math.sin(T * 5 + pad.mul) > 0;
    R_(pad.x0, pad.y - 3, 2, 3, on ? '#5cff8a' : '#2a6a40'); R_(pad.x1 - 2, pad.y - 3, 2, 3, on ? '#5cff8a' : '#2a6a40');
    text('x' + pad.mul, (pad.x0 + pad.x1) / 2 + 1, pad.y + 7, pad.mul === 5 ? '#ffd23f' : '#e6fbff', 'center', 6);
  }
}
function drawShip(s, t) {
  const x = Math.round(s.x), y = Math.round(s.y), l = S.left && S.fuel > 0 && S.phase === 'fly', r = S.right && S.fuel > 0 && S.phase === 'fly';
  // jambes
  R_(x - 7, y + 4, 1, 4, '#9aa0a8'); R_(x + 6, y + 4, 1, 4, '#9aa0a8'); R_(x - 8, y + 7, 3, 1, '#c8ccd4'); R_(x + 5, y + 7, 3, 1, '#c8ccd4');
  R_(x - 6, y + 3, 2, 2, '#6a7080'); R_(x + 4, y + 3, 2, 2, '#6a7080');
  // étage de descente : feuille d'or ombrée
  R_(x - 6, y, 12, 5, OUT); R_(x - 5, y + 1, 10, 3, '#c88a20'); R_(x - 5, y + 1, 6, 1, '#ffd76a'); R_(x - 5, y + 3, 10, 1, '#8a5a10');
  // étage de remontée : cabine grise, hublot
  R_(x - 5, y - 6, 10, 7, OUT); R_(x - 4, y - 5, 8, 5, '#c8ccd4'); R_(x - 4, y - 5, 3, 2, '#ffffff'); R_(x + 1, y - 2, 3, 2, '#7a8090'); R_(x - 2, y - 4, 3, 2, '#2a3a5a'); R_(x - 2, y - 4, 1, 1, '#9fd8ff');
  R_(x + 2, y - 9, 1, 3, '#9aa0a8'); R_(x + 1, y - 10, 3, 1, '#c8ccd4');
  // réacteurs (gauche et droit) et leurs flammes
  R_(x - 5, y + 5, 3, 2, '#3a3f4a'); R_(x + 2, y + 5, 3, 2, '#3a3f4a');
  const fl = (fx) => { const n = 4 + (t * 30 | 0) % 3; for (let k = 0; k < n; k++) R_(fx, y + 7 + k, 2, 1, k < 2 ? '#fff2a8' : k < 4 ? '#ffb040' : '#e2603a'); };
  if (l) fl(x - 5); if (r) fl(x + 3);
}
function hud() {
  const s = S.ship, w = S.site.world;
  R_(0, 0, LW, 40, 'rgba(6,8,24,.85)'); R_(0, 40, LW, 1, '#2a3a7a');
  text(`SITE ${S.n + 1} · ${w.name}`, 6, 6, '#e6fbff', 'left', 7);
  text(`SCORE ${S.score}`, 266, 6, '#ffd23f', 'right', 7);
  text('CARBURANT', 6, 20, '#8fa0d0', 'left', 6);
  R_(64, 20, 70, 6, OUT); R_(65, 21, Math.round(68 * S.fuel / 100), 4, S.fuel < 20 ? '#ff6a5a' : '#5cf2ff');
  const vyOk = s.vy <= VY_OK, vxOk = Math.abs(s.vx) <= VX_OK;
  text(`V ${Math.max(0, Math.round(s.vy))}`, 150, 20, vyOk ? '#5cff8a' : '#ff6a5a', 'left', 6);
  text(`H ${Math.round(Math.abs(s.vx))}`, 196, 20, vxOk ? '#5cff8a' : '#ff6a5a', 'left', 6);
  const alt = Math.max(0, Math.round(groundY(S.site, s.x) - s.y - 8)); text(`ALT ${alt}`, 266, 30, '#8fa0d0', 'right', 6);
  if (S.site.wind) text(S.site.wind > 0 ? 'VENT >' : '< VENT', 6, 30, '#ffb040', 'left', 6);
  text(`G ${(S.site.g / 6.2).toFixed(1)}`, 100, 30, '#8fa0d0', 'left', 6);
}
// boutons des réacteurs, en bas
function engineButtons() {
  const y = 404, h = 70, sides = [[8, 'GAUCHE', S.left], [140, 'DROIT', S.right]];
  for (const [x, label, on] of sides) {
    R_(x - 1, y - 1, 126, h + 2, OUT); const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, on ? '#ffb040' : '#2a3458'); gr.addColorStop(1, on ? '#a85a10' : '#141a34'); g.fillStyle = gr; g.fillRect(x, y, 124, h);
    R_(x, y, 124, 1, on ? '#fff2b0' : '#6a7ab0');
    text('REACTEUR', x + 62, y + 22, on ? '#2a1600' : '#c8d4f4', 'center', 7, on ? null : '#05030c');
    text(label, x + 62, y + 36, on ? '#2a1600' : '#ffd23f', 'center', 8, on ? null : '#05030c');
  }
}
function drawFly(t) {
  const site = S.site;
  g.drawImage(sky(site), 0, 0); drawGround(site);
  for (const p of S.parts) R_(Math.round(p.x), Math.round(p.y), p.s, p.s, p.c);
  if (S.phase !== 'crashed') drawShip(S.ship, t);
  hud();
  R_(0, 398, LW, LH - 398, '#05060f');
  if (S.phase === 'fly') { engineButtons(); if (S.ship.t < 3) { const m = wrap('Pose-toi doucement sur une aire. Les deux réacteurs ensemble : tout droit.', 30); m.forEach((l, i) => text(l, 136, 52 + i * 10, '#e6fbff', 'center', 6)); } }
  else drawResult(t);
}
function drawResult(t) {
  const r = S.result, y = 404;
  if (r.ok) {
    panel(10, y - 120, 252, 100, true);
    text('ALUNISSAGE REUSSI', 136, y - 110, '#fff2a8', 'center', 8);
    text(`AIRE x${r.mul}`, 136, y - 92, '#ffd23f', 'center', 8);
    text(`(100 + ${r.fuelB} carburant) x ${r.mul}`, 136, y - 76, '#e8d8b0', 'center', 6);
    text(`+${r.pts} POINTS`, 136, y - 60, '#5cff8a', 'center', 8);
    text('Carburant +60 pour le site suivant', 136, y - 44, '#c8d4f4', 'center', 6);
    button(40, y + 8, 192, 30, 'SITE SUIVANT', () => { SFX.click(); S.n++; startSite(); }, { gold: true });
    button(40, y + 44, 192, 24, 'ARRETER LA MISSION', () => { SFX.click(); endMission(); S.result = { ok: false, stop: true, why: 'MISSION ARRETEE' }; S.phase = 'stopped'; }, { size: 6 });
  } else {
    panel(10, y - 110, 252, 92);
    text(r.stop ? 'FIN DE MISSION' : 'CRASH !', 136, y - 100, r.stop ? '#fff2a8' : '#ff9a8a', 'center', 10);
    text(r.why, 136, y - 82, '#ffc0a8', 'center', 7);
    text(`SCORE DE LA MISSION : ${S.score}`, 136, y - 64, '#ffd23f', 'center', 7);
    text(S.score >= S.best && S.score > 0 ? 'NOUVEAU RECORD !' : `RECORD : ${S.best}`, 136, y - 50, S.score >= S.best && S.score > 0 ? '#5cff8a' : '#8fa0d0', 'center', 6);
    if (S.rankText) text(S.rankText, 136, y - 36, '#9fdcff', 'center', 6);
    button(40, y + 8, 192, 30, S.daily ? 'MISSION AU HASARD' : 'NOUVELLE MISSION', () => { SFX.click(); newMission(false); }, { gold: true });
    button(40, y + 44, 92, 24, 'MENU', () => { SFX.click(); S.phase = 'title'; }, { size: 7 });
    button(140, y + 44, 92, 24, 'CLASSEMENT', () => { location.href = '../classements/index.html#alunissage'; }, { size: 6 });
  }
}
let TITLE = null;
function drawTitle(t) {
  if (!TITLE) TITLE = makeSite(4242, 0);
  g.drawImage(sky(TITLE), 0, 0); drawGround(TITLE);
  const s = { x: 136 + Math.sin(t * .7) * 50, y: 200 + Math.sin(t * 1.3) * 10 }; S.left = Math.sin(t * 3) > 0; S.right = Math.sin(t * 3 + 1) > 0;
  const keep = S.phase; S.phase = 'fly'; drawShip(s, t); S.phase = keep; S.left = S.right = false;
  logo('ALUNISSAGE', 136, 56, 20);
  text('POSE-TOI EN DOUCEUR', 136, 86, '#c8d4f4', 'center', 7);
  R_(0, 300, LW, LH - 300, 'rgba(5,6,15,.55)');
  const d = todayKey();
  button(46, 312, 180, 28, 'MISSION', () => { audioInit(); SFX.click(); newMission(false); }, { gold: true });
  button(46, 348, 180, 24, S.dailyBest[d] ? `DU JOUR · ${S.dailyBest[d]}` : 'MISSION DU JOUR', () => { audioInit(); SFX.click(); newMission(true); }, { size: 7 });
  button(46, 380, 86, 22, 'CLASSEMENT', () => { location.href = '../classements/index.html#alunissage'; }, { size: 6 });
  button(140, 380, 86, 22, AC.on ? 'SON OUI' : 'SON NON', () => { AC.on = !AC.on; store.set('sfx', AC.on); SFX.click(); }, { size: 6 });
  text(`RECORD : ${S.best}`, 136, 414, '#ffd23f', 'center', 7);
  wrap('Deux réacteurs : GAUCHE pousse vers la droite, DROIT vers la gauche, les deux ensemble tout droit. Aires x2, x3, x5.', 32).forEach((l, i) => text(l, 136, 430 + i * 11, '#8fa0d0', 'center', 6));
}

/* ---------- boucle ---------- */
function frame(ts) {
  const t = ts / 1000, dt = Math.min(.04, t - (T || t)); T = t;
  if (S.phase === 'fly') { let left = dt; while (left > 0) { const h = Math.min(left, 1 / 120); step(h); left -= h; if (S.phase !== 'fly') break; }
    if (S.fuel > 0 && S.fuel < 15 && (t * 4 | 0) !== ((t - dt) * 4 | 0)) SFX.alarm(); }
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.gr) p.vy += 40 * dt; }
  S.parts = S.parts.filter(p => p.t < p.life);
  BTN = []; g.setTransform(K, 0, 0, K, 0, 0); g.imageSmoothingEnabled = false;
  if (S.phase === 'title') drawTitle(t); else drawFly(t);
  requestAnimationFrame(frame);
}

/* ---------- commandes : un doigt par réacteur (multitouche), ou flèches ---------- */
const touches = new Map();
function logical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH]; }
function updateEngines() { let l = false, r = false; for (const side of touches.values()) { if (side === 'L') l = true; if (side === 'R') r = true; } S.left = l || KEYS.l; S.right = r || KEYS.r; }
const KEYS = { l: false, r: false };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const [x, y] = logical(e);
  for (let i = BTN.length - 1; i >= 0; i--) { const b = BTN[i]; if (x >= b.x && y >= b.y && x < b.x + b.w && y < b.y + b.h) { b.act(); return; } }
  if (S.phase !== 'fly') return;
  touches.set(e.pointerId, x < LW / 2 ? 'L' : 'R'); try { cv.setPointerCapture(e.pointerId); } catch (_) {} updateEngines();
});
const lift = e => { touches.delete(e.pointerId); updateEngines(); };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'q') KEYS.l = true; if (e.key === 'ArrowRight' || e.key === 'd') KEYS.r = true; if (e.key === 'ArrowUp' || e.key === ' ') KEYS.l = KEYS.r = true; updateEngines(); });
document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'q') KEYS.l = false; if (e.key === 'ArrowRight' || e.key === 'd') KEYS.r = false; if (e.key === 'ArrowUp' || e.key === ' ') KEYS.l = KEYS.r = false; updateEngines(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { touches.clear(); KEYS.l = KEYS.r = false; updateEngines(); engineSound(0); } });
cv.addEventListener('contextmenu', e => e.preventDefault());
function resize() {
  const top = cv.getBoundingClientRect().top + window.scrollY - (parseFloat(cv.style.marginTop) || 0);
  const aw = window.innerWidth, ah = Math.max(200, window.innerHeight - top);
  const sc = Math.min(aw / LW, ah / LH), dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(LW * sc) + 'px'; cv.style.height = Math.floor(LH * sc) + 'px';
  cv.style.marginTop = Math.max(0, Math.floor((ah - LH * sc) / 2)) + 'px';
  K = Math.max(1, Math.ceil(sc * dpr - .05)); cv.width = LW * K; cv.height = LH * K;
}
window.addEventListener('resize', resize);
window.Alunissage = { S, makeSite, newMission, startSite, step };
setTimeout(resize, 0); resize();
(document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).then(() => requestAnimationFrame(frame));
</script>
<script>
/* Ludothèque : mode hors connexion, et bouton de retour au menu dans l'appli installée */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    var app = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    if (!app) return;
    var a = document.createElement("a");
    a.href = "../index.html"; a.textContent = "◀ MENU"; a.setAttribute("aria-label", "Retour au menu de la Ludothèque");
    a.style.cssText = "display:block; width:max-content; margin:4px auto 6px; padding:6px 10px; font:9px 'Press Start 2P',monospace; letter-spacing:1px;" +
      "color:#f2f0ff; background:#110d22; border:3px solid #f2f0ff; border-radius:4px; box-shadow:0 0 0 2px #000, 3px 3px 0 2px #000; text-decoration:none; position:relative; z-index:60;";
    var line = document.createElement("div");
    line.style.cssText = "flex:0 0 100%; width:100%;";
    line.appendChild(a);
    document.body.style.flexWrap = "wrap"; document.body.style.alignContent = "flex-start";
    document.body.insertBefore(line, document.body.firstChild);
    window.dispatchEvent(new Event("resize"));
  } catch (e) {}
})();
</script>
