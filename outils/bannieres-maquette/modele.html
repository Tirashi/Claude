<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bannières</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --fond:#8fc6e8; --encre:#2b1d0e; --papier:#f3e2b8; --bord:#7a5228; --or:#e8b23a; --rouge:#a8401c; --gris:#b9a57c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond:#8fc6e8; } }
  :root[data-theme="dark"] { --fond:#8fc6e8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--fond); font-family:'Press Start 2P', monospace; color:var(--encre); touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; }
  .cadre { background:var(--papier); border:3px solid var(--bord); box-shadow:3px 3px 0 rgba(0,0,0,.25); }
  #res { position:fixed; left:12px; right:12px; top:10px; padding:4px 4px; font-size:7px; line-height:1.9; display:grid; grid-template-columns:repeat(3, 1fr); gap:0 6px; pointer-events:none; }
  #res b { font-weight:normal; color:var(--rouge); }
  #res .tour { grid-column:1 / -1; display:flex; justify-content:space-between; border-top:2px dotted var(--gris); margin-top:3px; padding-top:3px; }
  #fiche { position:fixed; left:12px; right:12px; bottom:62px; padding:2px 2px; font-size:7px; line-height:1.8; overflow-wrap:anywhere; }
  #fiche .titre { font-size:9px; color:var(--rouge); margin-bottom:2px; }
  #fiche .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  #fiche .journal { color:#5a4630; }
  button { white-space:normal; line-height:1.5; overflow-wrap:anywhere; font:inherit; color:var(--encre); background:var(--or); border:3px solid var(--bord); box-shadow:0 3px 0 var(--bord); cursor:pointer; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 var(--bord); }
  button:disabled { background:#d8c9a6; color:#8b7a5c; box-shadow:none; }
  #fiche .actions button { font-size:7px; padding:4px 4px; flex:1 1 auto; }
  .boutons { position:fixed; left:12px; right:12px; bottom:12px; display:flex; gap:8px; }
  .boutons button { flex:1; font-size:7px; padding:6px 0; }
  .boutons #fin { flex:1.6; background:#c94f2c; color:#fff6e0; }
  #voile { position:fixed; inset:0; background:rgba(30,20,8,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #voile.cache, #fiche.cache { display:none; }
  #boite { width:100%; max-width:360px; padding:4px; font-size:7px; overflow-wrap:anywhere; line-height:1.9; max-height:80vh; overflow:auto; }
  #boite h2 { font-size:9px; font-weight:normal; color:var(--rouge); margin-bottom:8px; }
  #boite p { margin-bottom:10px; }
  #boite button { display:block; width:100%; font-size:7px; padding:4px 4px; margin-top:7px; text-align:left; line-height:1.7; }
  #boite button small { display:block; font-size:6px; color:#6b4a20; }
  #toast { position:fixed; left:16px; right:16px; top:96px; text-align:center; font-size:7px; line-height:1.6; padding:2px; transition:opacity .3s; pointer-events:none; }
  #toast.cache { opacity:0; }
  .credit { position:fixed; right:14px; top:92px; font-size:6px; color:#20415a; opacity:.75; }
  #boite h2.banniere, #bataille .banniere, #issue h2.banniere { color:#fff6e0; text-align:center; font-size:8px; padding:11px 22px 15px; text-shadow:0 2px 0 #7a2a18; }
  /* la bataille */
  body.en-bataille #fiche, body.en-bataille .boutons, body.en-bataille #res, body.en-bataille .credit { display:none; }
  #bataille { position:fixed; left:12px; right:12px; top:10px; font-size:7px; line-height:1.8; overflow-wrap:anywhere; }
  #bataille.cache, #issue.cache { display:none; }
  #bataille .camps { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  #bataille .camp b { font-weight:normal; color:var(--rouge); }
  .jauge { height:16px; background:#3b2a18; border:2px solid #2b1d0e; margin:3px 0; position:relative; }
  .jauge i { position:absolute; left:0; top:0; bottom:0; transition:width .5s; min-width:0; box-sizing:border-box; }
  #issue { position:fixed; left:12px; right:12px; bottom:14px; text-align:center; font-size:7px; line-height:1.9; overflow-wrap:anywhere; }
  #issue h2 { font-size:9px; font-weight:normal; }
  #issue button { font-size:8px; padding:6px 16px; margin-top:6px; }
  #issue .tactiques { display:flex; gap:4px; margin-top:4px; }
  #issue .tactiques button { flex:1; font-size:7px; padding:3px 0; margin:0; line-height:1.6; }
  #issue button small { display:block; font-size:5px; line-height:1.6; color:#6b4a20; }
  #issue .renoncer { font-size:6px; padding:2px 8px; margin-top:4px; }
</style>
<script>
// ---------- l'interface en pixel art, dessinée ici (cadres, boutons, bannière) ----------
// chaque motif est dessiné en petit sur un canvas, puis posé en « border-image » agrandi ×3 sans lissage
(function () {
  const K = 3, css = [];
  function motif(w, h, peindre) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'), px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const col = peindre(x, y, Math.min(x, y, w - 1 - x, h - 1 - y)); if (col) px(x, y, col); }
    return c.toDataURL();
  }
  const coin = (x, y, w, h, n) => (x < n || x > w - 1 - n) && (y < n || y > h - 1 - n) && Math.min(x, w - 1 - x) + Math.min(y, h - 1 - y) < n;
  // le parchemin : contour sombre, cadre de bois à deux tons, filet sombre, papier (un peu plus clair en haut), coins coupés
  const parchemin = motif(24, 24, (x, y, d) => {
    if (coin(x, y, 24, 24, 2)) return null;
    if (d === 0) return '#2b1d0e';
    if (d === 1) return y < 12 ? '#c98f4a' : '#a86c32';
    if (d === 2) return '#7a4a22';
    if (d === 3) return '#2b1d0e';
    if (d === 4) return '#fff6dc';
    return y < 8 ? '#f6e7bf' : '#efdcab';
  });
  // le bandeau du haut : même chose, plus fin
  const bandeau = motif(16, 16, (x, y, d) => {
    if (coin(x, y, 16, 16, 1)) return null;
    if (d === 0) return '#2b1d0e';
    if (d === 1) return '#a86c32';
    if (d === 2) return '#2b1d0e';
    return y < 6 ? '#f6e7bf' : '#efdcab';
  });
  // boutons de bois (ou rouges) : reflet en haut, ombre en bas
  const bouton = (clair, fond, ombre, sombre) => motif(12, 12, (x, y, d) => {
    if (coin(x, y, 12, 12, 1)) return null;
    if (d === 0) return '#2b1d0e';
    if (y === 1) return clair;
    if (y >= 9) return y === 10 ? sombre : ombre;
    return fond;
  });
  const bois = bouton('#f3d08e', '#e0b064', '#b07c3a', '#7a4a22'), rouge = bouton('#f28a6c', '#d0482c', '#9c2c1a', '#6a1a10');
  const boisAppui = bouton('#b07c3a', '#c99450', '#c99450', '#7a4a22');
  // la bannière : un ruban rouge aux bouts fendus
  const banniere = motif(32, 14, (x, y) => {
    const bout = Math.min(x, 31 - x);
    if (bout < 4 && (y < 2 || y > 11 || Math.abs(y - 6.5) < 3 - bout)) return null;   // la fente des bouts
    if (y < 2 || y > 11) return null;
    if (y === 2 || y === 11 || (bout === 0)) return '#2b1d0e';
    if (bout < 4) return y < 7 ? '#9c2c1a' : '#7a1e12';   // les bouts, plus sombres (derrière)
    if (bout === 4) return '#2b1d0e';
    if (y === 3) return '#f28a6c';
    if (y >= 9) return '#a8301c';
    return '#d0482c';
  });
  css.push(`.cadre { border:${8 * K}px solid transparent; border-image:url(${parchemin}) 8 fill / ${8 * K}px; background:none; box-shadow:0 ${K}px 0 rgba(0,0,0,.25); image-rendering:pixelated; }`);
  css.push(`#res.cadre { border-width:${4 * K}px; border-image:url(${bandeau}) 5 fill / ${4 * K}px; }`);
  css.push(`button { border:${4 * K}px solid transparent; border-image:url(${bois}) 4 fill / ${4 * K}px; background:none; box-shadow:none; image-rendering:pixelated; }`);
  css.push(`button:active { border-image:url(${boisAppui}) 4 fill / ${4 * K}px; transform:translateY(${K}px); box-shadow:none; }`);
  css.push(`button:disabled { filter:grayscale(1) opacity(.55); }`);
  css.push(`.boutons #fin { border-image:url(${rouge}) 4 fill / ${4 * K}px; color:#fff6e0; }`);
  css.push(`.banniere { border:solid transparent; border-width:${2 * K}px ${6 * K}px; border-image:url(${banniere}) 2 6 fill / ${2 * K}px ${6 * K}px; background:none; image-rendering:pixelated; }`);
  css.push(`.jauge { border:${K}px solid #2b1d0e; background:#4a3420; box-shadow:inset 0 ${K}px 0 #2b1d0e; height:${4 * K}px; }`);
  css.push(`.jauge i { border:0; background:#d0482c; box-shadow:inset 0 ${K}px 0 #f28a6c, inset 0 -${K}px 0 #9c2c1a; }`);
  css.push(`.jauge.bleu i { background:#3a7ad8; box-shadow:inset 0 ${K}px 0 #8ab8f2, inset 0 -${K}px 0 #24508f; }`);
  const s = document.createElement('style'); s.textContent = css.join('\n'); document.head.append(s);
})();
</script>
</head>

<div id="res" class="cadre"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*GLTF*/</script>
<script>
// Maquette de Bannières (specs/bannieres.md) : armées-personnages sur la carte, déplacement, préparation de bataille (3 tactiques)
// et bataille réglée par la règle du cahier des charges, puis rejouée coup par coup en 3D. La carte vient de ducCarte (duche/regles.js).

// ---------- géométries KayKit converties ----------
// [sommets, indices, base64(pos Int16 ×4096, normales Int8, uv Uint16, indices)] ou, pour une variante de couleur, [modèle de même forme, base64(uv)]
const geos = {};
const octets = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new DataView(u.buffer); };
function geo(nom) {
  if (geos[nom]) return geos[nom];
  const e = KAYKIT[nom] || DONJON[nom] || FORET[nom];
  if (typeof e[0] === 'string') {
    const base = geo(e[0]), n = base.attributes.position.count, dv = octets(e[1]), uv = new Float32Array(n * 2);
    for (let i = 0; i < n * 2; i++) uv[i] = dv.getUint16(i * 2, true) / 65535;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', base.attributes.position); g.setAttribute('normal', base.attributes.normal);
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(base.index);
    g.computeBoundingBox();
    return geos[nom] = g;
  }
  const [n, ni, b64] = e, dv = octets(b64);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  let o = 0;
  for (let i = 0; i < n * 3; i++, o += 2) pos[i] = dv.getInt16(o, true) / 4096;
  for (let i = 0; i < n * 3; i++, o += 1) nor[i] = dv.getInt8(o) / 127;
  for (let i = 0; i < n * 2; i++, o += 2) uv[i] = dv.getUint16(o, true) / 65535;
  const grand = n >= 65536, idx = grand ? new Uint32Array(ni) : new Uint16Array(ni);
  for (let i = 0; i < ni; i++, o += grand ? 4 : 2) idx[i] = grand ? dv.getUint32(o, true) : dv.getUint16(o, true);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingBox();
  return geos[nom] = g;
}

// ---------- rendu ----------
const rendu = new THREE.WebGLRenderer({ antialias: true });
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.outputEncoding = THREE.sRGBEncoding;
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(rendu.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc6e8);
scene.fog = new THREE.Fog(0x8fc6e8, 30, 60);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const ciel = new THREE.HemisphereLight(0xdff1ff, 0x5a7040, 0.75);
scene.add(ciel);
const soleil = new THREE.DirectionalLight(0xfff1d6, 1.0);
soleil.position.set(-8, 16, 6);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
soleil.shadow.bias = -0.0008;
scene.add(soleil);

// L'atlas KayKit, et deux copies retouchées : le violet (le bleu de l'atlas tourné vers le violet, KayKit n'a pas de violet)
// et le gris (bâtiments d'une terre redevenue neutre)
function matiere(retouche, source = KAYKIT_TEX) {
  const tex = new THREE.Texture();
  tex.flipY = false; tex.encoding = THREE.sRGBEncoding;
  const img = new Image();
  img.onload = () => {
    if (!retouche) tex.image = img;
    else {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height);
      for (let i = 0; i < d.data.length; i += 4) retouche(d.data, i);
      g.putImageData(d, 0, 0); tex.image = c;
    }
    tex.needsUpdate = true;
  };
  img.src = source;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0 });
}
function teinte(r, g, b) { const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; if (!d) return [0, 0, mx / 255]; let h = mx === r ? (g - b) / d % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, d / mx, mx / 255]; }
function rgb(h, s, v) { const f = n => { const k = (n + h / 60) % 6; return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1)))); }; return [f(5), f(3), f(1)]; }
const matBase = matiere();
const matViolet = matiere((p, i) => { const [h, s, v] = teinte(p[i], p[i + 1], p[i + 2]); if (h > 195 && h < 250 && s > 0.3) [p[i], p[i + 1], p[i + 2]] = rgb(h + 65, s * 0.9, v * 0.95); });
const matDonjon = matiere(null, DONJON_TEX), matForet = matiere(null, FORET_TEX);
// la bannière bleue du donjon tournée vers le violet (le donjon n'a pas de violet)
const matDonjonViolet = matiere((p, i) => { const [h, s, v] = teinte(p[i], p[i + 1], p[i + 2]); if (h > 195 && h < 250 && s > 0.3) [p[i], p[i + 1], p[i + 2]] = rgb(h + 65, s * 0.9, v * 0.95); }, DONJON_TEX);
const matGris = matiere((p, i) => { const m = (p[i] + p[i + 1] + p[i + 2]) / 3; for (let k = 0; k < 3; k++) p[i + k] = Math.round(p[i + k] * 0.35 + m * 0.65); });

function objet(nom, mat, ombre = true) {
  mat = mat || (DONJON[nom] ? matDonjon : FORET[nom] ? matForet : matBase);
  const m = new THREE.Mesh(geo(nom), mat);
  m.castShadow = ombre; m.receiveShadow = true;
  return m;
}

// ---------- la carte : coordonnées et côtés ----------
const px = (q, r) => 2 * (q + r / 2), pz = (q, r) => Math.sqrt(3) * r;
const COTES = DUC_VOIS;   // 0 = est, puis dans le sens des aiguilles d'une montre vu du ciel (1 = sud-est… 5 = nord-est)
// tuiles de rivière KayKit : côtés reliés quand la tuile n'est pas tournée ; tourner de n × 60° fait passer le côté k au côté k − n
const RIVIERES = { hex_river_A: [0, 3], hex_river_A_curvy: [0, 3], hex_river_B: [3, 5], hex_river_C: [3, 4], hex_river_D: [1, 3, 5], hex_river_E: [0, 3, 5], hex_river_F: [0, 1, 3], hex_river_G: [2, 3, 4] };
function tuileRiviere(cotes) {
  const voulu = [...cotes].sort().join();
  for (const [nom, c] of Object.entries(RIVIERES))
    for (let n = 0; n < 6; n++) if (c.map(k => (k - n + 6) % 6).sort().join() === voulu) return { nom, rot: n * Math.PI / 3 };
  return { nom: 'hex_river_A', rot: 0 };
}
function cotesRiviere(etat, i) {
  const [q, r] = DUC_CASES[i], c = [];
  COTES.forEach(([dq, dr], k) => { const j = ducCase(q + dq, r + dr); if (j >= 0 && etat.terres[j].t === 'riviere') c.push(k); });
  if (c.length === 1) c.push((c[0] + 3) % 6);   // bout de rivière : elle file tout droit vers la mer (ou sous le château)
  if (!c.length) c.push(0, 3);
  return c.slice(0, 3);
}

// ---------- couleurs des seigneurs ----------
const COUL = {
  or: { k: 'yellow', hex: 0xf2c230, mat: matBase, nom: 'OR' },
  rouge: { k: 'red', hex: 0xd8322a, mat: matBase, nom: 'ROUGE' },
  bleu: { k: 'blue', hex: 0x2f6fe0, mat: matBase, nom: 'BLEU' },
  violet: { k: 'blue', hex: 0x9b4fd6, mat: matViolet, nom: 'VIOLET' },
};
const BAT_MODELE = { chateau: 'castle', ferme: 'windmill', scierie: 'lumbermill', mine: 'mine', marche: 'market', caserne: 'barracks', tour: 'tower_A' };
const sansAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

// ---------- décor d'une terre ----------
function hasardTerre(i, k) { let x = (i + 1) * 9301 + k * 49297; x = (x * 233280 + 12345) % 2147483647; return (x % 1000) / 1000; }
function decor(etat, i) {
  const t = etat.terres[i], S = t.prop >= 0 ? etat.seigneurs[t.prop] : null, C = S && COUL[S.coul];
  const d = [], rot = k => Math.floor(hasardTerre(i, k) * 6) * Math.PI / 3;
  if (t.bat === 'chateau') { d.push(['building_castle_' + (C ? C.k : 'blue'), 0, 0, C ? C.mat : matGris, 0, true]); return d; }
  if (t.camp) { d.push(['tent', -0.35, -0.35, matBase, rot(1)], ['weaponrack', 0.5, -0.45, matBase, rot(2)], ['barrel_small_stack', -0.7, 0.3, null, rot(3)]); return d; }
  if (t.ruine) { d.push(['wall_broken', -0.1, -0.55, null, 0], ['pillar', 0.6, -0.2, null, 0], ['rubble_half', -0.55, 0.25, null, rot(2)], ['torch_lit', 0.25, -0.5, null, 0]); return d; }
  const q = t.qual;
  // le décor reste au fond de la terre : l'armée se tient devant
  if (t.t === 'foret') d.push([['trees_A_medium', 'trees_B_large', 'trees_A_large'][q - 1], 0, -0.2, matBase, rot(1)]);
  else if (t.t === 'colline') d.push([['hill_single_A', 'hills_B', 'hills_C_trees'][q - 1], 0, -0.15, matBase, rot(1)]);
  else if (t.t === 'montagne') d.push([['mountain_C_grass', 'mountain_B_grass', 'mountain_A_grass_trees'][q - 1], 0, -0.1, matBase, rot(1)]);
  else if (t.t === 'marais') d.push(['waterplant_A', -0.45, 0.3, matBase, rot(1)], ['waterplant_B', 0.4, -0.35, matBase, rot(2)], ['waterlily_A', 0.3, 0.45, matBase, rot(3)], ['waterplant_C', 0.05, -0.1, matBase, rot(5)]);
  else if (t.t === 'plaine') d.push([q >= 2 ? 'building_grain' : 'tree_single_A', q >= 2 ? 0 : -0.5, q >= 2 ? 0 : -0.4, matBase, rot(1)]);
  return d;
}
// étiquette de garnison : le nombre de soldats sur une bannière de la couleur du seigneur
function etiquette(n, couleur, brig) {
  const c = document.createElement('canvas'); c.width = 96; c.height = 48;
  const g = c.getContext('2d');
  g.fillStyle = '#2b1d0e'; g.fillRect(8, 4, 80, 34); g.fillRect(40, 38, 16, 8);
  g.fillStyle = brig ? '#5b2a1e' : '#' + couleur.toString(16).padStart(6, '0'); g.fillRect(12, 8, 72, 26);
  g.fillStyle = '#fff6e0'; g.font = "18px 'Press Start 2P', monospace"; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText((brig ? 'B' : '') + n, 48, 22);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));

// ---------- la bataille : la règle (pure, tirée d'une graine ; § 6 du cahier) ----------
// l'ordre de combat : la mêlée devant, archers et mages derrière ; la première ligne, ce sont les 3 premiers vivants
const DERRIERE = t => (UNITES[t].tir || UNITES[t].feu ? 1 : 0);
function rangs(liste) { return liste.map((u, k) => k).filter(k => liste[k].pv > 0).sort((a, b) => DERRIERE(liste[a].type) - DERRIERE(liste[b].type) || a - b); }
function simuler(A, D, tacA, tacD, terrain, chateau, graine) {

  const volees = c => 1 + ((c ? tacD : tacA) !== 'charger' ? 1 : 0) + (c === 1 && terrain === 'colline' ? 1 : 0);
  for (let v = 0; v < Math.max(volees(0), volees(1)); v++) {

  const fuit = c => cotes[c].some(u => UNITES[u.type].fuit) && vivants(cotes[c]) * 2 < n0[c];

    if (!vivants(d)) return 'victoire';

        if (U.double && fe.length > 1) cibles.push(fe[(s0 + 1) % fe.length]);

          if (n === 0 && tac === 'charger') deg += 1;

          if (n === 0 && c === 0 && (terrain === 'marais' || terrain === 'riviere')) deg = Math.max(0, deg - 1);

function chance(A, D, tacA, tacD, terrain, chateau) {

// les terres atteignables : on paie le terrain d'arrivée ; une montagne ou une armée arrêtent ; une armée ennemie se prend en bataille
function atteignables(a) {
  const meil = new Map([[a.terre, { cout: 0, de: -1 }]]), file = [a.terre];
  while (file.length) {
    file.sort((x, y) => meil.get(x).cout - meil.get(y).cout);
    const i = file.shift(), ci = meil.get(i).cout;
    if (i !== a.terre && (etat.terres[i].t === 'montagne' || armeeSur(i))) continue;

  [0, 1].forEach(c => rangsVivants(c).forEach((k, slot) => { const [x, z] = placeRang(c, slot); figures[c][k].position.set(x, 0, z); }));
  const asp = innerWidth / innerHeight, d = Math.max(8, 5.6 / (2 * Math.tan(15 * Math.PI / 180) * Math.min(1.2, asp)));
  cameraB.aspect = asp; cameraB.position.set(0, 0.5 + d * Math.sin(0.2), d * Math.cos(0.2)); cameraB.lookAt(0, 0.35 + d * 0.035, 0); cameraB.updateProjectionMatrix();
  const effets = [EFFETS[terre.t]]; if (terre.bat === 'chateau') effets.push('CHATEAU : LE DEFENSEUR PARE PLUS SOUVENT.');
  $('bataille').innerHTML = `<div class="banniere">BATAILLE : ${sansAccent(DUC_TERRAINS[terre.t].nom)}</div>` +
    `<div class="camps"><div class="camp">${nomArmee(att)}<br><b>${compo(att.unites)}</b><div class="jauge bleu"><i id="jA" style="width:${100 * att.unites.reduce((t, u) => t + u.pv, 0) / bataille.vie0[0]}%"></i></div></div>` +
    `<div class="camp">${nomArmee(def)}<br><b>${compo(def.unites)}</b><div class="jauge"><i id="jD" style="width:${100 * def.unites.reduce((t, u) => t + u.pv, 0) / bataille.vie0[1]}%"></i></div></div></div>` +

// le décor d'un côté du champ de bataille (cote : −1 à gauche, +1 à droite), toujours derrière les rangs
function decorBataille(t, cote) {

  if (t.bat === 'chateau') {   // les remparts du château, avec la herse au milieu et deux torches
    poser('wall', 1.0, -1.25, 1, 0); poser('wall_gated', 2.8, -1.25, 1, 0); poser('wall', 4.6, -1.25, 1, 0);
    poser('torch_lit', 1.9, -1.0); poser('torch_lit', 3.7, -1.0);
  } else if (t.camp) {
    poser('tent', 2.2, -1.5, 1.1, cote * 0.6); poser('crates_stacked', 0.9, -1.4, 1.1, 0.3); poser('barrel_large', 3.4, -0.9, 1, 0); poser('chest_gold', 1.6, -0.85, 1, -0.4); poser('torch_lit', 2.9, -0.7);
  } else if (t.ruine) {

  } else {   // les provisions de l'armée, des buissons et des pierres sur les côtés
    poser('box_stacked', 3.6, -1.1, 1, 0.4); poser('keg', 2.9, -1.4, 1, 0); poser('Bush_1_A_Color1', 4.4, -0.3, 1.6); poser('Rock_1_A_Color1', 1.5, -1.7, 1.1, 0.7); poser('Bush_2_C_Color1', 0.8, -1.9, 1.2); poser('Bush_4_A_Color1', 2.1, -1.9, 1.5);

// le combat rejoué : chaque « temps » du journal (volée, assaut, fin) devient une petite scène d'environ 1,5 s
function jouerBataille(res, apres) {
  const B = bataille;
  B.file = res.journal.slice(); B.apres = apres; B.res = res;
  B.prochain = () => {
    const e = B.file.shift(); if (!e) return;
    B.temps = { e, debut: performance.now(), faits: {} };
    if (e.temps === 'assaut' && e.n === 0) B.figures.flat().forEach(g => { const u = g.userData; if (!u.mort && !u.T.archer && !u.T.mage) u.versContact = true; });
  };
  B.prochain();
}
function vieJauges() { const B = bataille; [0, 1].forEach(c => { const v = B.vie[c].reduce((t, x) => t + Math.max(0, x), 0); $(c ? 'jD' : 'jA').style.width = (100 * v / Math.max(1, B.vie0[c])) + '%'; }); }
function toucher(c, k, deg, mort) {
  const B = bataille, g = B.figures[c][k]; if (!g || g.userData.mort) return;
  B.vie[c][k] -= deg; vieJauges();
  if (mort) { jouer(g, 'Death_A', true); g.userData.mort = true; g.userData.anneau.visible = false; }
  else jouer(g, deg ? 'Hit_A' : 'Melee_Block', true);
}
function animerBataille(now, dt) {
  const B = bataille, T = B.temps;
  B.figures.flat().forEach(g => {
    const u = g.userData; u.mixer.update(dt);
    if (u.mort) return;
    g.rotation.y += (u.rotVise - g.rotation.y) * Math.min(1, dt * 10);
    // chacun rejoint sa place dans les rangs (la mêlée au contact après le premier assaut), en courant
    const s = u.c ? 1 : -1;
    let x = placeRang(u.c, Math.max(0, rangsVivants(u.c).indexOf(u.k)))[0];
    if (u.versContact) x = s * (XCONTACT + Math.abs(x) - XFRONT);
    if (u.fuite) { x = s * 7; u.rotVise = u.rot + Math.PI; }
    const ecart = x - g.position.x, enCours = u.courant && u.courant.loop === THREE.LoopOnce && u.courant.isRunning();
    if (Math.abs(ecart) > 0.05 && (!enCours || u.fuite)) { g.position.x += Math.sign(ecart) * Math.min(Math.abs(ecart), 1.6 * dt); jouer(g, 'Running_A', false, 1.2); }
    else if (!enCours && !u.fete && u.courant !== u.actions[u.T.repos]) jouer(g, u.T.repos);
  });
  if (T) {
    const e = T.e, f = (now - T.debut) / 1000, une = cle => (T.faits[cle] ? false : (T.faits[cle] = true));
    if (e.temps === 'volee') {
      e.tirs.forEach((s, n) => {
        const g = B.figures[s.c][s.k]; if (!g || g.userData.mort) return;
        const u = g.userData;
        if (s.sorte === 'fleche') {
          if (une('bande' + n)) { jouer(g, 'Ranged_Bow_Draw', true); u.rotVise = u.rot - Math.PI / 6; }   // on vise sur sa gauche : un trois quarts garde le visage vers l'ennemi
          if (f > 0.45 && une('tire' + n)) { jouer(g, 'Ranged_Bow_Release', true); tirer(g, B.figures[s.e][s.t], now, s.touche); }
          if (f > 1.1 && une('fin' + n)) u.rotVise = u.rot;
        } else {
          if (une('sort' + n)) jouer(g, 'Ranged_Magic_Shoot', true);
          if (f > 0.4 && une('feu' + n)) lancerFeu(g, B.figures[s.e][s.t], now, s.touche);
        }
      });
      if (f > 0.95 && une('touches')) e.coups.forEach(cp => toucher(cp.c, cp.k, cp.deg, cp.mort));
      if (f > 1.6) B.temps = null;
    } else if (e.temps === 'assaut') {
      const g2 = f - (e.n === 0 ? 0.9 : 0.1);   // au premier assaut, on laisse la mêlée courir au contact
      if (g2 > 0) {
        e.frappes.forEach((fr, n) => { const g = B.figures[fr.c][fr.k]; if (g && !g.userData.mort && g2 > (n % 3) * 0.07 && une('frappe' + n)) jouer(g, g.userData.T.attaques[n % g.userData.T.attaques.length] || 'Melee_1H_Attack_Chop', true, 1.15); });
        if (g2 > 0.45 && une('son')) son();
        if (g2 > 0.55 && une('coups')) { e.frappes.filter(fr => fr.pare).forEach(fr => toucher(fr.e, fr.t, 0, false)); e.coups.forEach(cp => toucher(cp.c, cp.k, cp.deg, cp.mort)); }
        if (g2 > 1.35) B.temps = null;

    if (!B.temps) B.prochain();

  B.fleches = B.fleches.filter(fl => {
    const k = (now - fl.debut) / (550 * (window.lenteurFleches || 1));

    const pos = k2 => new THREE.Vector3(fl.a.x + (fl.b.x - fl.a.x) * k2, fl.a.y + (fl.b.y - fl.a.y) * k2 + Math.sin(k2 * Math.PI) * 1.0, fl.a.z + (fl.b.z - fl.a.z) * k2);
    fl.o.position.copy(pos(k)); fl.o.lookAt(pos(Math.min(1, k + 0.02)));

  });
  B.feux = B.feux.filter(fe => {
    const k = (now - fe.debut) / 500;
    if (k >= 1.6) { sceneB.remove(fe.o); return false; }
    if (k < 1) { fe.o.position.lerpVectors(fe.a, fe.b, k); fe.o.position.y += Math.sin(k * Math.PI) * 0.5; fe.o.scale.setScalar(1 + Math.sin(now / 40) * 0.15); }
    else { fe.o.scale.setScalar(1 + (k - 1) * 6); fe.o.material.opacity = Math.max(0, 1 - (k - 1) / 0.6); fe.o.material.color.setHex(0xffd04a); }

  });
  if (pixelB) { rendu.setRenderTarget(rtB); rendu.render(sceneB, cameraB); rendu.setRenderTarget(null); rendu.render(ecranB, camEcran); }

}
const TITRES = { victoire: "L'ATTAQUANT L'EMPORTE", defaite: "L'ATTAQUANT EST BATTU", retraite: "L'ATTAQUANT SE REPLIE", tenu: 'LE DEFENSEUR TIENT' };
function finCombat(issue) {
  const B = bataille, F = B.figures, gagnant = issue === 'victoire' ? 0 : 1;
  if (issue === 'retraite') F[0].forEach(g => { g.userData.fuite = true; g.userData.versContact = false; });
  if (issue === 'victoire') F[1].forEach(g => { g.userData.fuite = true; g.userData.versContact = false; });   // les derniers défenseurs détalent
  F[gagnant].forEach(g => { if (!g.userData.mort) { g.userData.fete = true; jouer(g, 'Cheering'); } });
  const morts = c => (c ? B.res.D : B.res.A).filter(u => u.pv === 0).length;
  setTimeout(() => {
    $('issue').innerHTML = `<h2 class="banniere">${TITRES[issue]}</h2><div>PERTES : ${morts(0)} A ${morts(1)}</div>`;
    $('issue').append(bouton('CONTINUER', () => B.apres()));
    $('issue').classList.remove('cache');
  }, 1300);
}
// une flèche (le modèle de l'archer) : elle arrive sur sa cible, ou se plante à côté
function tirer(archer, cible, now, touche) {
  const o = AV.armes.arrow_bow.clone(), m = (AV.mats.Ranger[archer.userData.coul] || AV.mats.Ranger.neutre).fixe;
  o.traverse(x => { if (x.isMesh) x.material = m; });
  o.scale.setScalar(0.7 * 1.1 / AV.haut * 2.2); sceneB.add(o);
  const main = new THREE.Vector3(); archer.getObjectByName('handslotl').getWorldPosition(main);
  const b = cible.position.clone().add(touche ? new THREE.Vector3(0, 0.55, 0) : new THREE.Vector3(archer.userData.c ? -0.5 : 0.5, 0.02, 0.3));
  bataille.fleches.push({ o, debut: now, a: main, b });
}
// une boule de feu du mage
const geoFeu = new THREE.SphereGeometry(0.13, 12, 8);
function lancerFeu(mage, cible, now, touche) {
  const o = new THREE.Mesh(geoFeu, new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.95 }));
  const a = new THREE.Vector3(); mage.getObjectByName('handslotr').getWorldPosition(a);
  sceneB.add(o); bataille.feux.push({ o, debut: now, a, b: cible.position.clone().add(new THREE.Vector3(touche ? 0 : 0.4, 0.5, 0)) });
}
function finirBataille() {
  bataille = null;
  document.body.classList.remove('en-bataille'); $('bataille').classList.add('cache'); $('issue').classList.add('cache');
}
// un petit choc d'épées (WebAudio, pas de fichier)
let audio = null;
function son() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const n = audio.sampleRate * 0.12, buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n / 6)) * (0.6 + 0.4 * Math.sin(i * 0.9));
    const s = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 3200; g.gain.value = 0.25;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(audio.destination); s.start();

// ---------- caméra et toucher ----------
let angle = -0.5, auto = false;   // face au duché du joueur (coin en bas à gauche)
function cadrer() {
  const w = innerWidth, h = innerHeight;
  rendu.setSize(w, h); camera.aspect = w / h; cameraB.aspect = w / h; cameraB.updateProjectionMatrix();
  camera.userData.d = Math.max(19.5, 24 / Math.min(1, camera.aspect * 1.25));
  camera.updateProjectionMatrix();
}
addEventListener('resize', cadrer); cadrer();
let touche = null;
rendu.domElement.addEventListener('pointerdown', e => { touche = { x: e.clientX, y: e.clientY, a: angle, bouge: false }; });
addEventListener('pointermove', e => {
  if (!touche) return;
  const dx = e.clientX - touche.x;
  if (Math.abs(dx) > 6) touche.bouge = true;
  if (touche.bouge) { angle = touche.a - dx * 0.008; auto = false; majBouton(); }
});
addEventListener('pointerup', e => { if (touche && !touche.bouge && !bataille) choisir(e.clientX, e.clientY); touche = null; });
const rayon = new THREE.Raycaster();
// toucher : une armée à vous (elle se sélectionne), une terre éclairée (l'armée choisie y va), une terre (sa description)
function choisir(x, y) {
  if (occupe || bataille || !etat) return;
  rayon.setFromCamera({ x: x / innerWidth * 2 - 1, y: -y / innerHeight * 2 + 1 }, camera);
  const objs = [...etat.armees.map(a => a.objet).filter(o => o && o.visible), ...groupes];
  const hit = rayon.intersectObjects(objs, true)[0];
  let o = hit && hit.object; while (o && !objs.includes(o)) o = o.parent;
  if (!o) { deselectionner(); majFiche(); return; }
  const i = o.userData.armee ? o.userData.armee.terre : o.userData.i;
  if (choix.armee && choix.chemins.has(i)) { deplacer(choix.armee, i); return; }
  const a = armeeSur(i);
  if (a && a.s === 0 && a.pts > 0 && a !== choix.armee) { selectionner(a); return; }
  deselectionner(); majFiche(i);
}
const bTourner = $('tourner');
const majBouton = () => bTourner.textContent = 'TOURNE ' + (auto ? 'OUI' : 'NON');
bTourner.onclick = () => { auto = !auto; majBouton(); };

// ---------- animation ----------
const rebond = x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
let avant = performance.now();
function boucle(now) {
  const dt = Math.min(0.05, (now - avant) / 1000); avant = now;
  if (auto) angle += dt * 0.1;
  const d = camera.userData.d;
  camera.position.set(Math.sin(angle) * d * 0.72, d * 0.72, Math.cos(angle) * d * 0.72);
  camera.lookAt(Math.sin(angle) * 2.2, -0.6, Math.cos(angle) * 2.2);   // la carte remonte au-dessus du panneau du bas
  groupes.forEach(g => {
    const u = g.userData;
    const k = Math.min(1, Math.max(0, (now - debut - u.delai) / 700));
    u.lev += (0 - u.lev) * Math.min(1, dt * 12);
    let y = (1 - rebond(k)) * 14 + u.lev;
    // terre qui change de seigneur : un bond ; terre attaquée : un tremblement

    if (u.choc && now > u.choc) { const f = (now - u.choc) / 450; if (f < 1) g.position.x = u.x + Math.sin(f * 40) * 0.08 * (1 - f); else u.choc = 0; }

    if (u.pop) {
      const f = (now - u.pop) / 1100;
      const s = f < 0.45 ? 0.001 : Math.min(1, rebond(Math.min(1, (f - 0.45) / 0.55)));
      u.batiments.forEach(o => o.scale.set(1, s, 1));
      if (u.echaf) u.echaf.visible = f < 0.6;

  etat.armees.forEach(a => { if (!a.objet) return; a.objet.visible = now - debut > 2300; a.objet.userData.fig.userData.mixer.update(dt); });

  nuages.forEach((c, i) => { c.position.x += dt * (0.25 + i * 0.05); if (c.position.x > 14) c.position.x = -14; });

  requestAnimationFrame(boucle);
}
