<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Magasinier</title>
<meta name="description" content="Le Magasinier : pousse les caisses sur les marques dans un entrepôt en HD-2D.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#140e0a">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="jeu">
  <div id="ecran">
    <canvas id="cv" aria-label="L'entrepôt : le docker et les caisses"></canvas>
    <div class="hud" id="hud" hidden><span id="hNom">QUAI 1</span><span id="hCoups">COUPS 0</span><button id="bPause" aria-label="Pause">❚❚</button></div>
    <div class="bulle fenetre" id="bulle" hidden></div>
  </div>
  <div id="cmd" hidden>
    <button class="fenetre" id="bAnnuler">↶<br>ANNULER</button>
    <div class="pad" id="pad"><i></i><button class="fenetre" data-d="H" aria-label="Haut">▲</button><i></i><button class="fenetre" data-d="G" aria-label="Gauche">◀</button><i></i><button class="fenetre" data-d="D" aria-label="Droite">▶</button><i></i><button class="fenetre" data-d="B" aria-label="Bas">▼</button><i></i></div>
    <button class="fenetre" id="bRecommencer">⟲<br>RECOMMENCER</button>
  </div>

  <div class="ecranMenu" id="eTitre">
    <div class="fenetre carte">
      <h1>LE<br>MAGASINIER</h1>
      <p class="petit">Pousse les caisses sur les marques. On ne peut que pousser, jamais tirer.</p>
      <button class="fenetre" id="bContinuer" hidden>CONTINUER</button>
      <button class="fenetre" id="bJouer">JOUER</button>
      <p class="petit" id="tEtoiles"></p>
      <a class="fenetre lien ludo-retour" href="../index.html">◀ LUDOTHEQUE</a>
    </div>
  </div>

  <div class="ecranMenu" id="eNiveaux" hidden>
    <div class="fenetre carte">
      <div class="onglets" id="onglets"></div>
      <p class="titre2" id="nEntrepot"></p>
      <p class="petit" id="nInfo"></p>
      <div class="grilleNiv" id="grilleNiv"></div>
      <button class="fenetre" id="bTitre">◀ TITRE</button>
    </div>
  </div>

  <div class="ecranMenu" id="ePause" hidden>
    <div class="fenetre carte">
      <p class="titre2">PAUSE</p>
      <button class="fenetre" id="bReprendre">REPRENDRE</button>
      <button class="fenetre" id="bRecommencerP">RECOMMENCER</button>
      <button class="fenetre" id="bNiveauxP">NIVEAUX</button>
      <div class="rang"><button class="fenetre" id="bBruit">BRUITAGES : OUI</button><button class="fenetre" id="bMusique">MUSIQUE : OUI</button></div>
      <button class="fenetre" id="bCroix">CROIX : OUI</button>
      <button class="fenetre" id="bEffets">EFFETS : COMPLETS</button>
      <a class="fenetre lien ludo-retour" href="../index.html">◀ LUDOTHEQUE</a>
    </div>
  </div>

  <div class="ecranMenu" id="eFin" hidden>
    <div class="fenetre carte">
      <p class="titre2">BRAVO !</p>
      <div class="etoiles" id="fEtoiles"></div>
      <p id="fCoups"></p>
      <p class="petit" id="fObjectif"></p>
      <button class="fenetre" id="bSuivant">SUIVANT</button>
      <button class="fenetre" id="bRejouer">REJOUER</button>
      <button class="fenetre" id="bNiveauxF">NIVEAUX</button>
    </div>
  </div>
</div>
<script src="../lib/three.min.js"></script>
<script src="regles.js"></script>
<script src="niveaux.js"></script>
<script src="sons.js"></script>
<script src="docker.js"></script>
<script src="scene.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu (écran titre, pause). */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
