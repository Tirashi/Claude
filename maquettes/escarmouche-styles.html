<title>Escarmouche, trois styles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Écran de téléphone : choix du style en haut, carte, fenêtre de commandement ; la scène de combat recouvre la carte */
:root {
  --fond: #1d3b6e; --fen: #2f63b8; --fen2: #20478a; --bord: #ffffff; --txt: #ffffff; --doux: #bcd6ff; --accent: #ffd94a; --rouge: #d9443a;
  --police: "Pixelify Sans", "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
body[data-style="dcss"] { --fond: #15120f; --fen: #2b241d; --fen2: #1c1713; --bord: #a8854a; --txt: #f0e2c0; --doux: #b8a47e; --accent: #e8b84a; --rouge: #b8402e; }
body[data-style="maison"] { --fond: #2a3f2c; --fen: #f4e7c4; --fen2: #e6d3a3; --bord: #4a3020; --txt: #3a2414; --doux: #7a5a3a; --accent: #c8452e; --rouge: #c8452e; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--txt); font-family: var(--police); font-size: 16px; line-height: 1.25;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 24px;
  transition: background .3s;
}
.ecran { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.styles button {
  font-family: var(--police); font-weight: 700; font-size: 14px; line-height: 1.1; padding: 8px 4px; cursor: pointer;
  background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.35); border-radius: 6px;
}
body[data-style="maison"] .styles button { color: #f4e7c4; border-color: rgba(244,231,196,.4); }
.styles button small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.styles button[aria-pressed="true"] { background: var(--accent); color: #1b1208; border-color: var(--accent); }
.styles button:focus-visible, .fenetre button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bandeau { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #fff; }
body[data-style="maison"] .bandeau { color: #f4e7c4; }
.bandeau .camp { padding: 2px 8px; border-radius: 4px; background: #2f7fd0; }
.bandeau .camp.rouge { background: #d0443a; }
.carte { position: relative; line-height: 0; border-radius: 6px; overflow: hidden; }
.carte canvas { width: 100%; max-width: 100%; image-rendering: pixelated; display: block; touch-action: manipulation; }
#scene { position: absolute; inset: 0; height: 100%; pointer-events: none; }
.ruban {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.7); opacity: 0; pointer-events: none;
  font-weight: 700; font-size: 20px; line-height: 1.3; text-align: center; white-space: nowrap; padding: 8px 18px;
  background: var(--fen); color: var(--txt); border: 3px solid var(--bord); border-radius: 8px;
  transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.6,1);
}
.ruban.vu { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.fenetre { background: linear-gradient(var(--fen), var(--fen2)); border: 3px solid var(--bord); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
body[data-style="dcss"] .fenetre { border-radius: 2px; box-shadow: inset 0 0 0 2px #000; }
.fiches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fiche { display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: center; min-width: 0; }
.fiche canvas { width: 44px; height: 44px; image-rendering: pixelated; border-radius: 4px; background: rgba(0,0,0,.18); }
.fiche .nom { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.fiche .val { font-size: 14px; color: var(--doux); }
.fiche .val b { color: var(--txt); }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.actions button {
  font-family: var(--police); font-weight: 700; font-size: 15px; padding: 10px 4px; cursor: pointer; border-radius: 6px;
  background: rgba(255,255,255,.14); color: var(--txt); border: 2px solid var(--bord);
}
body[data-style="maison"] .actions button { background: rgba(74,48,32,.08); }
.actions button.chaud { background: var(--accent); color: #1b1208; border-color: var(--accent); }
.actions button:disabled { opacity: .35; cursor: default; }
.aide { font-size: 15px; color: var(--doux); min-height: 2.5em; }
.reglage { font-size: 15px; display: flex; gap: 6px; align-items: center; color: var(--doux); }
.notes { display: grid; gap: 8px; font-size: 16px; color: #e8eef8; }
body[data-style="maison"] .notes { color: #f4e7c4; }
.notes h2 { margin: 0; font-size: 17px; color: var(--accent); }
body[data-style="maison"] .notes h2 { color: #ffd27a; }
.notes p { margin: 0; }
.notes a { color: inherit; }
@media (prefers-reduced-motion: reduce) { body, .ruban { transition: none; } }
</style>

<div class="ecran">
  <div class="styles" role="group" aria-label="Style">
    <button id="s-gba" data-style="gba" aria-pressed="true">16 px<small>façon GBA</small></button>
    <button id="s-dcss" data-style="dcss" aria-pressed="false">Dungeon Crawl<small>32 px</small></button>
    <button id="s-maison" data-style="maison" aria-pressed="false">Pixel maison<small>32 px animé</small></button>
  </div>
  <div class="bandeau"><span id="jour">JOUR 1</span><span class="camp" id="camp">BLEUS</span><span id="or">3 VILLAGES</span></div>
  <div class="carte">
    <canvas id="jeu" width="128" height="160"></canvas>
    <canvas id="scene" width="512" height="640"></canvas>
    <div class="ruban" id="ruban"></div>
  </div>
  <div class="fenetre">
    <div class="fiches">
      <div class="fiche"><canvas id="f-terrain" width="32" height="32"></canvas><div><div class="nom" id="t-nom">Plaine</div><div class="val" id="t-val">Défense ★</div></div></div>
      <div class="fiche"><canvas id="f-unite" width="32" height="32"></canvas><div><div class="nom" id="u-nom">—</div><div class="val" id="u-val">touche une troupe</div></div></div>
    </div>
    <div class="actions">
      <button id="a-attaque" disabled>Attaquer</button>
      <button id="a-capture" disabled>Capturer</button>
      <button id="a-attendre" disabled>Attendre</button>
      <button id="a-fin" class="chaud">Fin du tour</button>
    </div>
    <div class="aide" id="aide">Touche une troupe bleue pour voir où elle peut aller.</div>
    <label class="reglage"><input type="checkbox" id="o-scene" checked> Scènes de combat</label>
  </div>
  <div class="notes" id="notes"></div>
</div>

const CARTE = [

let unites, bat, jour, joueur, sel, phase, portee, cibles, marche, effets, scene, curseur, fini;
function nouvellePartie() {
  let id = 1;
  const pose = (role, camp, x, y) => ({ id: id++, role, camp, x, y, fx: x, fy: y, pv: 10, fait: false, dir: camp === 'B' ? 1 : -1, marche: false });
  unites = [pose('inf', 'B', 3, 8), pose('inf', 'B', 4, 9), pose('arc', 'B', 2, 8), pose('cav', 'B', 5, 9), pose('sie', 'B', 2, 9),
            pose('inf', 'R', 4, 1), pose('inf', 'R', 3, 0), pose('arc', 'R', 5, 0), pose('cav', 'R', 1, 1), pose('sie', 'R', 4, 2)];
  bat = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < L; x++) { const c = CARTE[y][x]; if ('vHB'.includes(c)) bat.push({ x, y, qg: c !== 'v', camp: c === 'B' ? 'B' : c === 'H' ? 'R' : null, pts: c === 'v' ? 10 : 20 }); }
  jour = 1; joueur = 'B'; sel = null; phase = 'libre'; portee = null; cibles = []; marche = null; effets = []; scene = null; curseur = { x: 3, y: 8 }; fini = false;
}
const uniteEn = (x, y) => unites.find(u => u.x === x && u.y === y && u.pv > 0);

const terre = (x, y) => x >= 0 && y >= 0 && x < L && y < H && CARTE[y][x] !== '~';
const eau = (x, y) => x >= 0 && y >= 0 && x < L && y < H && CARTE[y][x] === '~';

// GBA : planche de Toen en 16 px
function toen(ctx, nom, x, y, f = 0, miroir = false) {
  const [sy, w, h, n] = D.toen.meta[nom]; const fr = f % n;
  if (miroir) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(IM.toen, fr * w, sy, w, h, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(IM.toen, fr * w, sy, w, h, x, y, w, h);
}
const TOEN_R = { inf: 'inf', arc: 'anti', cav: 'lourd', sie: 'dist' };
// Dungeon Crawl : planche d'une ligne de tuiles de 32 px
function dc(ctx, nom, x, y, miroir = false, w = 32) {
  const i = D.dcss.idx[nom];
  if (miroir) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(IM.dcss, i * 32, 0, 32, 32, 0, 0, w, w); ctx.restore(); }
  else ctx.drawImage(IM.dcss, i * 32, 0, 32, 32, x, y, w, w);
}

const MP = {

};
const cache = {};
function feuille(cle, w, h, dessin) {
  if (cache[cle]) return cache[cle];
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const p = (a, b, l, ht, col) => { x.fillStyle = col; x.fillRect(a, b, l, ht); };
  dessin(p, x); cache[cle] = c; return c;
}
// une troupe maison de 32 × 32, tournée vers la droite ; pose 0 et 1 = repos, 2 = coup
function troupeMaison(role, camp, pose) {

    p(8, 29, 16, 2, 'rgba(0,0,0,.25)');
    if (role === 'cav') {
      // cheval
      p(5, 17 + b, 20, 8, o); p(6, 18 + b, 18, 6, MP.cheval); p(6, 22 + b, 18, 2, MP.cheval2);
      p(22, 12 + b, 6, 8, o); p(23, 13 + b, 4, 6, MP.cheval); p(26, 14 + b, 3, 4, o); p(26, 15 + b, 2, 2, MP.cheval);
      p(21, 11 + b, 3, 6, MP.crin); p(3, 18 + b, 3, 6, MP.crin);
      for (const lx of [7, 11, 18, 22]) { p(lx, 24 + b, 3, 6 - b, o); p(lx + 1, 25 + b, 1, 4 - b, MP.cheval2); }
      p(7, 18 + b, 10, 3, c1); p(7, 20 + b, 10, 1, c2);

      p(11, 7 + b, 8, 11, o); p(12, 8 + b, 6, 9, c1); p(12, 13 + b, 6, 2, c2); p(13, 8 + b, 2, 3, c3);

    const le = e - debut, adv = att ? s.d : s.a, debutAdv = att ? s.coupD : 0, leAdv = e - debutAdv, advActif = !att || s.dD;
    const n0 = escouade(s.pv0[u.id]), n1 = escouade(s.pv1[u.id]);
    const sens = cote === 'gauche' ? 1 : -1, base = cote === 'gauche' ? 205 : W - 205;
    const touche = advActif && leAdv > 700 && leAdv < 1000;
    const places = [[0, 0], [-78, -46], [-78, 46], [-146, -14], [-146, 60]];
    for (let i = 0; i < n0; i++) {
      const perdu = i >= n1, [ox, oy] = places[i];
      let x = base + sens * ox * (u.role === 'cav' || u.role === 'sie' ? 1.25 : 1), y = 432 + oy, pose = Math.floor(t / 300 + i) % 2, rot = 0, alpha = 1;
      if (actif && le >= 0 && le < 1500) {
        const ccac = u.role === 'inf' || u.role === 'cav';
        if (ccac && le < 600) x += sens * Math.sin(Math.min(1, le / 500) * Math.PI / 2) * (u.role === 'cav' ? 120 : 80);
        else if (ccac && le < 1100) x += sens * (u.role === 'cav' ? 120 : 80) * (1 - (le - 600) / 500);
        if (le > 450 && le < 750) pose = 2;
        if (!ccac && le > 300 && le < 650) pose = 2;
      }
      if (touche) x += -sens * 6 * Math.sin(leAdv / 20);
      if (perdu && advActif && leAdv > 760) { const p = Math.min(1, (leAdv - 760) / 400); rot = sens * -p * Math.PI / 2; alpha = 1 - p * .9; }
      const w = 32 * S().scene, cx = x, cy = y;
      sx.save(); sx.globalAlpha = alpha; sx.translate(cx, cy); sx.rotate(rot);
      if (touche && Math.floor(leAdv / 60) % 2) sx.globalAlpha = alpha * .4;
      const v = { ...u, dir: sens };
      if (style === 'gba') S().unite(sx, v, -48, -96, t, pose === 2 ? 1 : pose, 96);
      else S().unite(sx, v, -w / 2, -w, t, pose, w);
      sx.restore();
      // projectiles
      if (actif && !(u.role === 'inf' || u.role === 'cav') && le > 500 && le < 760) {
        const p = (le - 500) / 260, px = cx + sens * (40 + p * (W - 410 - 60)), py = cy - 60 - Math.sin(p * Math.PI) * (u.role === 'sie' ? 140 : 40);
        if (u.role === 'arc') { sx.strokeStyle = style === 'dcss' ? '#e8d8b0' : '#5a3a1e'; sx.lineWidth = 3; sx.beginPath(); sx.moveTo(px, py); sx.lineTo(px - sens * 18, py + 4); sx.stroke(); sx.fillStyle = '#ddd'; sx.fillRect(px - 2, py - 2, 4, 4); }
        else if (style === 'dcss') dc(sx, 'flamme', px - 24, py - 24, false, 48);
        else { sx.fillStyle = '#222'; sx.beginPath(); sx.arc(px, py, 10, 0, 7); sx.fill(); sx.fillStyle = '#8a8070'; sx.beginPath(); sx.arc(px - 2, py - 2, 7, 0, 7); sx.fill(); }
      }
    }
    // coup sur l'escouade : éclat, explosion ou entaille, puis les dégâts
    if (advActif && leAdv > 680 && leAdv < 1050) {
      const p = (leAdv - 680) / 370, cx = base - sens * 40, cy = 400;
      if (style === 'dcss' && (adv.role === 'sie')) dc(sx, 'explosion', cx - 80, cy - 80, false, 160);
      else for (let j = 0; j < 12; j++) { const an = j * .52, r = 20 + p * 90; sx.fillStyle = j % 2 ? '#fff' : '#ffd94a'; sx.fillRect(cx + Math.cos(an) * r - 4, cy + Math.sin(an) * r * .6 - 4, 8 * (1 - p) + 2, 8 * (1 - p) + 2); }
      const n = att ? s.dD : s.dA; if (n) chiffre(sx, '-' + n, cx + 30, cy - 90 - p * 30, 44);
    }
  }
  sx.restore();
  // étiquettes : nom, PV qui descendent, escouade
  if (k > .9) for (const cote of ['gauche', 'droite']) {
    const u = s[cote], att = u === s.a, imp = att ? s.coupD + 700 : 700, actif = att ? s.dD : true;
    const p = actif ? Math.min(1, Math.max(0, (e - imp) / 500)) : 0, pv = s.pv0[u.id] + (s.pv1[u.id] - s.pv0[u.id]) * p;
    const x = cote === 'gauche' ? 18 : W - 18; sx.textAlign = cote === 'gauche' ? 'left' : 'right';
    sx.font = '700 30px "Pixelify Sans", sans-serif'; sx.lineWidth = 7; sx.strokeStyle = '#111';
    const nom = S().noms[u.role]; sx.strokeText(nom, x, y0 + 40); sx.fillStyle = u.camp === 'B' ? '#9cc8ff' : '#ffa89a'; sx.fillText(nom, x, y0 + 40);
    const bw = 190, bx = cote === 'gauche' ? x : x - bw;
    sx.fillStyle = '#111'; sx.fillRect(bx - 3, y0 + 52, bw + 6, 16); sx.fillStyle = pv > 5 ? '#6cd04a' : pv > 2 ? '#f2c14e' : '#e2533f'; sx.fillRect(bx, y0 + 55, bw * pv / 10, 10);
    sx.font = '700 26px "Pixelify Sans", sans-serif'; const txt = Math.ceil(pv) + ' PV'; sx.strokeText(txt, x, y0 + 98); sx.fillStyle = '#fff'; sx.fillText(txt, x, y0 + 98);
  }
}

// ---------- fiches ----------
const fT = document.getElementById('f-terrain').getContext('2d'), fU = document.getElementById('f-unite').getContext('2d');
function majFiches(x, y) {
  const T = S().T, c = CARTE[y][x], t = performance.now();
  for (const f of [fT, fU]) { f.canvas.width = T; f.canvas.height = T; f.imageSmoothingEnabled = false; }
  fT.save(); fT.translate(-x * T, -y * T); S().sol(fT, c, x, y, t); fT.restore();
  const b = batEn(x, y); if (b) S().bat(fT, b, 0, 0, t);
  const [nom, def] = TERRAINS[c];
  document.getElementById('t-nom').textContent = b ? (b.camp ? nom + (b.camp === 'B' ? ' bleu' : ' rouge') : nom + ' libre') : nom;
  document.getElementById('t-val').innerHTML = 'Défense <b>' + ('★'.repeat(def) || '—') + '</b>' + (b ? ` · <b>${b.pts}</b> pts` : '');
  const u = uniteEn(x, y);
  if (u) {
    S().unite(fU, u, 0, 0, t, 0); const r = ROLES[u.role];
    document.getElementById('u-nom').textContent = S().noms[u.role];
    document.getElementById('u-val').innerHTML = `PV <b>${u.pv}</b> · Mvt <b>${r.mv}</b> · Tir <b>${r.rg[0] === r.rg[1] ? r.rg[0] : r.rg.join('-')}</b>`;
  } else { document.getElementById('u-nom').textContent = '—'; document.getElementById('u-val').textContent = 'case libre'; }
}
const aide = m => document.getElementById('aide').textContent = m;
function majBoutons() {
  document.getElementById('a-attaque').disabled = !(phase === 'agir' && cibles.length);
  document.getElementById('a-capture').disabled = !(phase === 'agir' && sel && peutCapturer(sel));
  document.getElementById('a-attendre').disabled = phase !== 'agir';
  document.getElementById('a-fin').disabled = !!(marche || scene) || joueur === 'R' || fini;
}
function majBandeau() {
  document.getElementById('jour').textContent = 'JOUR ' + jour;
  const c = document.getElementById('camp'); c.textContent = joueur === 'B' ? 'BLEUS' : 'ROUGES'; c.classList.toggle('rouge', joueur === 'R');
  document.getElementById('or').textContent = bat.filter(b => b.camp === 'B').length + ' BATIMENTS';
}
function ruban(txt) { const r = document.getElementById('ruban'); r.textContent = txt; r.classList.add('vu'); clearTimeout(ruban.t); ruban.t = setTimeout(() => r.classList.remove('vu'), 1200); }
function verifierFin() {
  if (fini) return;
  const qgB = bat.find(b => CARTE[b.y][b.x] === 'B'), qgR = bat.find(b => CARTE[b.y][b.x] === 'H');
  if (!unites.some(u => u.camp === 'R') || qgR.camp === 'B') { fini = true; ruban('VICTOIRE !'); aide('Victoire ! Recharge la page pour rejouer.'); }
  else if (!unites.some(u => u.camp === 'B') || qgB.camp === 'R') { fini = true; ruban('DEFAITE...'); aide('Les rouges ont gagné. Recharge la page pour rejouer.'); }
  majBoutons(); majBandeau();
}
function capturer(u) {
  const b = batEn(u.x, u.y), max = b.qg ? 20 : 10; b.pts -= u.pv;
  if (b.pts <= 0) { b.camp = u.camp; b.pts = max; ruban(b.qg ? 'QG PRIS !' : 'VILLAGE PRIS'); } else aide(`Encore ${b.pts} points pour le prendre.`);
  verifierFin();
}
function abandons() { for (const b of bat) if (b.pts < (b.qg ? 20 : 10) && !unites.some(u => u.x === b.x && u.y === b.y && ROLES[u.role].capture && u.camp !== b.camp)) b.pts = b.qg ? 20 : 10; }

// ---------- joueur ----------
function finirUnite() { if (sel) sel.fait = true; sel = null; portee = null; cibles = []; phase = 'libre'; abandons(); majBoutons(); aide('Choisis une autre troupe, ou Fin du tour.'); }
cv.addEventListener('pointerdown', ev => {
  if (scene) { finirScene(); return; }
  if (marche || joueur !== 'B' || fini) return;
  const r = cv.getBoundingClientRect(), x = Math.floor((ev.clientX - r.left) / r.width * L), y = Math.floor((ev.clientY - r.top) / r.height * H);
  if (x < 0 || y < 0 || x >= L || y >= H) return;
  curseur = { x, y }; majFiches(x, y);
  const u = uniteEn(x, y);
  if (phase === 'agir') {
    const c = cibles.find(c => c.x === x && c.y === y);
    if (c) { const a = sel; phase = 'combat'; cibles = []; majBoutons(); combat(a, c, () => { if (a.pv > 0) a.fait = true; sel = null; phase = 'libre'; abandons(); majBoutons(); aide('Choisis une autre troupe, ou Fin du tour.'); }); }
    return;
  }
  if (phase === 'choix' && sel && !portee.ennemi && portee.d[x + ',' + y] !== undefined) {
    const a = sel, bouge = x !== a.x || y !== a.y; phase = 'marche'; const p = portee; portee = null; majBoutons();
    deplacer(a, chemin(p.pere, x, y), () => {
      phase = 'agir'; cibles = ROLES[a.role].fixe && bouge ? [] : ciblesDepuis(a, a.x, a.y); majBoutons(); majFiches(a.x, a.y);
      aide(peutCapturer(a) ? 'Tu peux Capturer ce bâtiment.' : cibles.length ? 'Touche une case rouge pour attaquer, ou Attendre.' : ROLES[a.role].fixe && bouge ? 'Une catapulte ne tire pas après avoir bougé.' : 'Personne à portée : Attendre.');
    });
    return;
  }
  if (u && u.camp === 'B' && !u.fait) { sel = u; portee = calculPortee(u); phase = 'choix'; cibles = []; aide('Touche une case bleue pour y aller (ou la troupe pour rester sur place).'); }
  else if (u && u.camp === 'R') { sel = null; portee = { ...calculPortee(u), ennemi: true }; phase = 'choix'; cibles = []; aide('Jusqu\'où cette troupe rouge peut aller.'); }
  else { sel = null; portee = null; phase = 'libre'; aide('Touche une troupe bleue pour voir où elle peut aller.'); }
  majBoutons();
});
document.getElementById('a-attendre').onclick = finirUnite;
document.getElementById('a-attaque').onclick = () => aide('Touche une des cases rouges.');
document.getElementById('a-capture').onclick = () => { if (sel && peutCapturer(sel)) { const u = sel; capturer(u); u.fait = true; sel = null; cibles = []; phase = 'libre'; majBoutons(); } };
document.getElementById('a-fin').onclick = () => { if (joueur === 'B' && !marche && !scene && !fini) tourRouge(); };

// ---------- les rouges ----------
function tourRouge() {
  sel = null; portee = null; cibles = []; phase = 'libre'; abandons(); joueur = 'R'; majBandeau(); majBoutons(); ruban('TOUR DES ROUGES');
  const file = unites.filter(u => u.camp === 'R'); let i = 0;
  const suivant = () => {
    if (fini) return;
    if (i >= file.length) return setTimeout(() => { abandons(); unites.forEach(u => u.fait = false); joueur = 'B'; jour++; majBandeau(); majBoutons(); ruban('JOUR ' + jour); aide('À toi ! Touche une troupe bleue.'); }, 400);
    const g = file[i++]; if (g.pv <= 0) return suivant();
    curseur = { x: g.x, y: g.y };
    if (peutCapturer(g)) { setTimeout(() => { capturer(g); setTimeout(suivant, 500); }, 300); return; }
    const deja = ciblesDepuis(g, g.x, g.y);
    if (ROLES[g.role].fixe && deja.length) { setTimeout(() => combat(g, deja.sort((a, b) => a.pv - b.pv)[0], () => setTimeout(suivant, 250)), 300); return; }
    const p = calculPortee(g), bleus = unites.filter(u => u.camp === 'B'), qg = bat.find(b => CARTE[b.y][b.x] === 'B');
    let mieux = [g.x, g.y], score = 1e9;
    for (const key in p.d) {
      const [x, y] = key.split(',').map(Number), cb = ROLES[g.role].fixe ? [] : ciblesDepuis(g, x, y), b = batEn(x, y);
      let s = Math.min(...bleus.map(u => Math.abs(u.x - x) + Math.abs(u.y - y)), 99) + .3 * (Math.abs(qg.x - x) + Math.abs(qg.y - y));
      if (ROLES[g.role].fixe) s = Math.abs(Math.min(...bleus.map(u => Math.abs(u.x - x) + Math.abs(u.y - y)), 99) - 3);
      if (cb.length) s -= 20 + Math.max(...cb.map(c => degats(g, c)));
      if (ROLES[g.role].capture && b && b.camp !== 'R') s -= 25;
      if (s < score) { score = s; mieux = [x, y]; }
    }
    setTimeout(() => deplacer(g, chemin(p.pere, ...mieux), () => {
      curseur = { x: g.x, y: g.y };
      const cb = ROLES[g.role].fixe ? [] : ciblesDepuis(g, g.x, g.y).sort((a, b) => a.pv - b.pv);
      if (cb.length) combat(g, cb[0], () => setTimeout(suivant, 250));
      else if (peutCapturer(g)) { capturer(g); setTimeout(suivant, 500); }
      else setTimeout(suivant, 200);
    }), 300);
  };
  setTimeout(suivant, 900);
}

// ---------- styles ----------
function choisirStyle(s) {
  style = s; document.body.dataset.style = s;
  document.querySelectorAll('.styles button').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === s));
  cv.width = L * S().T; cv.height = H * S().T;
  document.getElementById('notes').innerHTML = S().notes + `<p>Dans les trois styles, chaque troupe est une escouade : 10 PV = 5 soldats, un soldat tombe tous les 2 PV perdus, comme dans Advance Wars.</p>`;
  majFiches(curseur.x, curseur.y);
  try { localStorage.setItem('escarmouche-style', s); } catch (_) {}
}
document.querySelectorAll('.styles button').forEach(b => b.onclick = () => choisirStyle(b.dataset.style));

function boucle() {
  const t = performance.now();
  try { avancerMarche(t); dessinerCarte(t); if (scene) dessinerScene(t); }
  catch (e) { console.error(e); marche = null; scene = null; sx.clearRect(0, 0, sc.width, sc.height); phase = 'libre'; sel = null; portee = null; cibles = []; majBoutons(); }
  requestAnimationFrame(boucle);
}
nouvellePartie();
let depart = 'gba'; try { depart = localStorage.getItem('escarmouche-style') || depart; } catch (_) {}
if (location.hash && STYLES[location.hash.slice(1)]) depart = location.hash.slice(1);
Promise.all(Object.values(IM).map(im => im.decode ? im.decode().catch(() => {}) : 0)).then(() => {
  choisirStyle(STYLES[depart] ? depart : 'gba'); majBandeau(); majBoutons(); requestAnimationFrame(boucle);
});
</script>
