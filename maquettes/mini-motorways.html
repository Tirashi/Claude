<title>Mini Motorways, maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Trois téléphones côte à côte : même partie, trois directions épurées. */
:root{--bg:#1b1e24;--fg:#eef0f3;--mut:#9aa3ae}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Outfit,system-ui,sans-serif;margin:0;
 padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 26px Outfit,sans-serif;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 24px;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.col{width:300px;max-width:100%;min-width:0}
.tag{font:600 12px Outfit;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.col h2{font:700 19px Outfit;margin:0 0 10px}
.phone{position:relative;width:100%;aspect-ratio:360/600;border-radius:30px;overflow:hidden;border:6px solid #0b0d10;box-shadow:0 10px 30px #0008}
.phone>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0}
.note{color:var(--mut);font-size:14px;margin:12px 0 0}
.note b{color:var(--fg)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{top:0;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.bot{bottom:0;padding:0 14px 14px}
.hint{text-align:center;font-size:12px;margin-bottom:10px}
.tools{display:flex;gap:8px;justify-content:space-between}
.tool{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:9px 0 7px}
.badge{position:absolute;top:3px;right:8px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px}

/* A : Nuit */
.A{background:#0e1320;color:#e8edf8}
.A .score{font:300 46px/1 Outfit;letter-spacing:-.02em}
.A .day{font:600 11px Outfit;letter-spacing:.14em;text-transform:uppercase;color:#7d8aa8;margin-top:6px}
.A .week{margin-top:8px;width:92px;height:3px;border-radius:2px;background:#1e2740;overflow:hidden}
.A .week i{display:block;width:46%;height:100%;background:#e8edf8}
.A .round{width:42px;height:42px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff1f;display:grid;place-items:center;backdrop-filter:blur(8px)}
.A .hint{color:#8d9ab8}
.A .tools{background:#ffffff12;border:1px solid #ffffff1c;border-radius:26px;padding:6px;backdrop-filter:blur(14px)}
.A .tool{color:#8d9ab8;border-radius:20px}
.A .tool.on{background:#e8edf8;color:#0e1320}
.A .badge{background:#ff6b6b;color:#0e1320}

/* B : Suisse */
.B{background:#f5f5f2;color:#111}
.B .score{font:800 64px/.9 'Space Grotesk';letter-spacing:-.04em}
.B .day{font:700 12px 'Space Grotesk';letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.B .week{display:flex;gap:3px;margin-top:6px}
.B .week i{width:12px;height:6px;background:#111}.B .week i.o{background:#d8d8d2}
.B .round{width:40px;height:40px;background:#111;color:#fff;display:grid;place-items:center}
.B .hint{color:#111;font:700 12px 'Space Grotesk';text-transform:uppercase;letter-spacing:.04em}
.B .tools{gap:0;border:2px solid #111;background:#f5f5f2}
.B .tool{color:#111;font:700 11px 'Space Grotesk';text-transform:uppercase;border-right:2px solid #111}
.B .tool:last-child{border-right:0}
.B .tool.on{background:#111;color:#f5f5f2}
.B .badge{background:#ff3b30;color:#fff;border-radius:0}

/* C : Iso doux */
.C{background:linear-gradient(#e7edf9,#f7f2ec);color:#2c3550}
.C .card{background:#fff;border-radius:18px;box-shadow:0 4px 14px #2c35501a}
.C .score{font:800 34px/1 Nunito;padding:10px 16px}
.C .score small{display:block;font:600 11px Nunito;color:#8a93ad;letter-spacing:.04em;margin-top:2px}
.C .round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.C .next{display:flex;align-items:center;gap:10px;padding:9px 14px;font:700 12px Nunito;margin-bottom:10px;justify-content:space-between}
.C .next b{display:inline-block;width:14px;height:14px;border-radius:4px;background:#4d8ff0;vertical-align:-2px;margin-right:6px}
.C .tools{background:#fff;border-radius:24px;box-shadow:0 6px 20px #2c35502a;padding:6px}
.C .tool{color:#8a93ad;font:700 11px Nunito;border-radius:18px}
.C .tool.on{background:#2c3550;color:#fff}
.C .badge{background:#ff6b57;color:#fff}
</style>

<h1>Mini Motorways, pour elle</h1>
<p class="lead">Même partie dans les trois cas : trois maisons déjà reliées, une maison rouge qui s'impatiente et qu'on est en train de relier du doigt (trait pointillé), un lac. Chaque direction a sa propre interface : score, semaine, pause, outils.</p>
<div class="row" id="row"></div>

<script>
const C=40;
const P=(x,y)=>[(x+.5)*C,(y+.5)*C];
const pts=p=>p.map(q=>P(...q).join(',')).join(' ');
const cellsOf=roads=>{const s=new Set();Object.values(roads).forEach(p=>{for(let i=0;i<p.length-1;i++){let[a,b]=p[i],[c,d]=p[i+1];while(a!==c||b!==d){s.add(a+','+b);a+=Math.sign(c-a);b+=Math.sign(d-b)}s.add(c+','+d)}});return[...s].map(k=>k.split(',').map(Number))};
const polys=(roads,w,col,extra='')=>Object.values(roads).map(p=>`<polyline points="${pts(p)}" fill="none" stroke="${col}" stroke-width="${w}" ${extra}/>`).join('');
const ring=(x,y,col,f,r,w,track)=>{const L=2*Math.PI*r;return `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="butt" stroke-dasharray="${L*f} ${L}" transform="rotate(-90 ${x} ${y})"/>`};

/* Scène A et B : 9 colonnes, 13 rangées */
const roads={red:[[1,2],[1,5],[5,5]],blue:[[7,2],[7,4],[3,4],[3,8]],yellow:[[1,9],[7,9]]};
const houses=[['red',1,2],['blue',7,2],['yellow',1,9],['red',7,6,.7]];
const dests=[['red',5,5],['blue',3,8],['yellow',7,9]];
const cars=[['red',1,3.5,'v'],['red',3.2,5,'h'],['blue',7,3,'v'],['blue',5.3,4,'h'],['yellow',2.5,9,'h'],['yellow',5.5,9,'h']];
const lake={x:0,y:6,w:3,h:2};
const ghost=[[7,6],[7,5],[5,5]], finger=[6.3,5];
const svg=(inner,defs='')=>`<svg viewBox="0 0 360 600" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${inner}</svg>`;
const OY=64;

function A(){
 const col={red:'#ff6b6b',blue:'#4dabf7',yellow:'#ffd43b'};
 const defs=`<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter><linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1320"/><stop offset="1" stop-color="#151d33"/></linearGradient>`;
 let s=`<rect width="360" height="600" fill="url(#bgA)"/><g transform="translate(0,${OY})">`;
 s+=`<rect x="0" y="${lake.y*C+4}" width="${lake.w*C-4}" height="${lake.h*C-8}" rx="24" fill="#18233f"/>`;
 s+=`<g filter="url(#g)" opacity=".55">${polys(roads,8,'#7fa2ff','stroke-linecap="round" stroke-linejoin="round"')}</g>`;
 s+=polys(roads,5,'#dfe7fb','stroke-linecap="round" stroke-linejoin="round"');
 s+=polys({g:ghost},5,'#ffffff80','stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 11"');
 dests.forEach(([c,x,y])=>{const[p,q]=P(x,y);s+=`<rect x="${p-20}" y="${q-20}" width="40" height="40" rx="11" fill="${col[c]}" opacity=".18" filter="url(#g)"/><rect x="${p-17}" y="${q-17}" width="34" height="34" rx="10" fill="#0e1320" stroke="${col[c]}" stroke-width="3.5"/><circle cx="${p}" cy="${q}" r="5" fill="${col[c]}"/>`});
 houses.forEach(([c,x,y,f])=>{const[p,q]=P(x,y);s+=`<circle cx="${p}" cy="${q}" r="14" fill="${col[c]}" opacity=".5" filter="url(#g)"/><circle cx="${p}" cy="${q}" r="10" fill="${col[c]}"/>`;if(f)s+=ring(p,q,'#fff',f,17,3,'#ffffff26')});
 cars.forEach(([c,x,y,d])=>{const[p,q]=P(x,y);s+=`<rect x="${p-(d==='v'?3:5)}" y="${q-(d==='v'?5:3)}" width="${d==='v'?6:10}" height="${d==='v'?10:6}" rx="3" fill="${col[c]}"/>`});
 const[fx,fy]=P(...finger);s+=`<circle cx="${fx}" cy="${fy}" r="20" fill="#fff" opacity=".14"/><circle cx="${fx}" cy="${fy}" r="9" fill="#fff" opacity=".5"/>`;
 return svg(s+'</g>',defs)}

function B(){
 const col={red:'#ff3b30',blue:'#1f6bff',yellow:'#ffc800'};
 let s=`<rect width="360" height="600" fill="#f5f5f2"/><g transform="translate(0,${OY})">`;
 s+=`<rect x="0" y="${lake.y*C}" width="${lake.w*C}" height="${lake.h*C}" fill="#d6e4f7"/>`;
 s+=polys(roads,11,'#111','stroke-linejoin="miter" stroke-linecap="square"');
 s+=polys({g:ghost},4,'#11111199','stroke-dasharray="3 8" stroke-linejoin="miter"');
 dests.forEach(([c,x,y])=>{const[p,q]=P(x,y);s+=`<circle cx="${p}" cy="${q}" r="19" fill="${col[c]}"/><circle cx="${p}" cy="${q}" r="7" fill="#f5f5f2"/>`});
 houses.forEach(([c,x,y,f])=>{const[p,q]=P(x,y);s+=`<rect x="${p-11}" y="${q-11}" width="22" height="22" fill="${col[c]}"/>`;if(f)s+=`<rect x="${p-14}" y="${q-24}" width="28" height="6" fill="#d8d8d2"/><rect x="${p-14}" y="${q-24}" width="${28*f}" height="6" fill="#111"/>`});
 cars.forEach(([c,x,y,d])=>{const[p,q]=P(x,y);s+=`<rect x="${p-(d==='v'?4:6)}" y="${q-(d==='v'?6:4)}" width="${d==='v'?8:12}" height="${d==='v'?12:8}" fill="${col[c]}" stroke="#f5f5f2" stroke-width="2"/>`});
 const[fx,fy]=P(...finger);s+=`<circle cx="${fx}" cy="${fy}" r="14" fill="none" stroke="#111" stroke-width="2"/><circle cx="${fx}" cy="${fy}" r="4" fill="#111"/>`;
 return svg(s+'</g>')}

/* Scène C : isométrique, 7 × 7 */
function Cc(){
 const N=7,TW=50,TH=25,OX=180,OYI=170;
 const pr=(x,y,z=0)=>[OX+(x-y)*TW/2,OYI+(x+y)*TH/2-z];
 const poly=(a,fill,extra='')=>`<polygon points="${a.map(q=>pr(...q).join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
 const sq=(x,y,f,e='')=>poly([[x,y],[x+1,y],[x+1,y+1],[x,y+1]],f,e);
 const R={red:[[1,1],[1,3],[4,3]],blue:[[5,1],[5,2],[2,2],[2,5]],yellow:[[1,6],[5,6]]};
 const H=[['red',1,1],['blue',5,1],['yellow',1,6],['red',6,3,.7]];
 const D=[['red',4,3],['blue',2,5],['yellow',5,6]];
 const CAR=[['red',1,2],['red',3,3],['blue',5,2],['blue',3,2],['yellow',2,6],['yellow',4,6]];
 const lakeC=[[5,4],[6,4],[5,5],[6,5]];
 const pal={red:['#ff7a66','#e65a47','#c9422f'],blue:['#6aa5ff','#4d8ff0','#376fc4'],yellow:['#ffd35c','#f2bb32','#cf9a14']};
 let s=`<ellipse cx="180" cy="${OYI+N*TH+30}" rx="150" ry="24" fill="#2c3550" opacity=".10"/>`;
 s+=poly([[0,N,0],[N,N,0],[N,N,-14],[0,N,-14]],'#d4dae8')+poly([[N,0,0],[N,N,0],[N,N,-14],[N,0,-14]],'#bcc4d6');
 s+=poly([[0,0],[N,0],[N,N],[0,N]],'#f4f6f1');
 lakeC.forEach(([x,y])=>s+=sq(x,y,'#b4d9f2'));
 cellsOf(R).forEach(([x,y])=>s+=sq(x,y,'#4a546b','stroke="#4a546b" stroke-width="1"'));
 s+=sq(5.08,3.08,'#ffffff80','transform="translate(0,0)" stroke="#2c3550" stroke-width="1.6" stroke-dasharray="3 3"');
 const box=(x,y,i,h,c)=>{const x0=x+i,x1=x+1-i,y0=y+i,y1=y+1-i;return poly([[x0,y1,0],[x1,y1,0],[x1,y1,h],[x0,y1,h]],c[1])+poly([[x1,y0,0],[x1,y1,0],[x1,y1,h],[x1,y0,h]],c[2])+poly([[x0,y0,h],[x1,y0,h],[x1,y1,h],[x0,y1,h]],c[0])};
 const items=[];
 D.forEach(([c,x,y])=>items.push([x+y,()=>box(x,y,.1,26,pal[c])+poly([[x+.33,y+.33,26.1],[x+.67,y+.33,26.1],[x+.67,y+.67,26.1],[x+.33,y+.67,26.1]],'#fff','opacity=".9"')]));
 H.forEach(([c,x,y,f])=>items.push([x+y,()=>{let t=box(x,y,.18,16,pal[c]);if(f){const[a,b]=pr(x+.5,y+.5,40);t+=ring(a,b,'#2c3550',f,9,4,'#fff')}return t}]));
 CAR.forEach(([c,x,y])=>items.push([x+y+.5,()=>box(x,y,.34,5,pal[c])]));
 items.sort((a,b)=>a[0]-b[0]).forEach(i=>s+=i[1]());
 const[fx,fy]=pr(5.5,3.5,0);s+=`<circle cx="${fx}" cy="${fy}" r="20" fill="#2c3550" opacity=".14"/><circle cx="${fx}" cy="${fy}" r="8" fill="#fff" stroke="#2c3550" stroke-width="2"/>`;
 return svg(s)}

const ic={
 road:'<path d="M6 20C6 10 18 14 18 4"/><path d="M10 20c0-4 8-2 8-6" opacity=".4"/>',
 bridge:'<path d="M3 18h18M5 18c0-7 14-7 14 0M8 12v6M12 10v8M16 12v6"/>',
 light:'<rect x="9" y="3" width="6" height="18" rx="3"/><circle cx="12" cy="8" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="12" cy="16" r="1.1"/>',
 erase:'<path d="M5 15l8-8 6 6-5 5H9z"/><path d="M10 20h10"/>',
 pause:'<path d="M9 6v12M15 6v12"/>'
};
const I=k=>`<svg class="i" viewBox="0 0 24 24">${ic[k]}</svg>`;
const tools=[['road','Route','12',1],['bridge','Pont','1',0],['light','Feu','2',0],['erase','Gomme','',0]];
const toolsHtml=lab=>tools.map(([k,n,c,on])=>`<div class="tool${on?' on':''}">${I(k)}<span>${lab(n)}</span>${c?`<span class="badge">${c}</span>`:''}</div>`).join('');

const dirs=[
 ['A','Direction A','Nuit',A,
  `<div class="hud top"><div><div class="score">47</div><div class="day">Jeudi · semaine 3</div><div class="week"><i></i></div></div><div class="round">${I('pause')}</div></div>
   <div class="hud bot"><div class="hint">Glisse de la maison vers son bâtiment</div><div class="tools">${toolsHtml(x=>x)}</div></div>`,
  'Fond bleu nuit, routes en traits lumineux, maisons en pastilles et bâtiments en cadres. <b>Très calme et élégant</b>, le contraste fait ressortir l\'essentiel. Le fond sombre convient bien aux longues parties.'],
 ['B','Direction B','Suisse clair',B,
  `<div class="hud top"><div><div class="score">47</div><div class="day">Jeudi · semaine 3</div><div class="week"><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i></div></div><div class="round">${I('pause')}</div></div>
   <div class="hud bot"><div class="hint">Glisse : maison → bâtiment</div><div class="tools">${toolsHtml(x=>x)}</div></div>`,
  'Papier blanc, routes noires, trois couleurs vives, grosse typographie. <b>Le plus lisible et le plus graphique</b> : aucune décoration, tout se comprend d\'un regard. La jauge d\'impatience est une barre au-dessus de la maison.'],
 ['C','Direction C','Isométrique doux',Cc,
  `<div class="hud top"><div class="card score">47<small>Jeudi · semaine 3</small></div><div class="card round">${I('pause')}</div></div>
   <div class="hud bot"><div class="card next"><span><b></b>Prochaine maison : bleue</span><span style="color:#8a93ad">dans 12 s</span></div><div class="tools">${toolsHtml(x=>x)}</div></div>`,
  'Petite ville en relief, pastel, avec des cartes blanches très douces. <b>Plus chaleureux, plus « jouet »</b>. Le relief demande un peu plus de place : la ville est plus petite à l\'écran.']
];
document.getElementById('row').innerHTML=dirs.map(([k,t,n,f,hud,note])=>`
<div class="col"><div class="tag">${t}</div><h2>${n}</h2>
<div class="phone ${k}">${f()}${hud}</div><p class="note">${note}</p></div>`).join('');
</script>
