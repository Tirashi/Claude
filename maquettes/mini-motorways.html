<title>Mini Motorways, maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
/* Trois ambiances d'un même style : blocs, ombres longues, routes blanches arrondies. */
:root{--bg:#1b1e24;--fg:#eef0f3;--mut:#9aa3ae}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Outfit,system-ui,sans-serif;margin:0;
 padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 26px Outfit,sans-serif;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 24px;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.col{width:300px;max-width:100%;min-width:0}
.tag{font:600 12px Outfit;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.col h2{font:700 19px Outfit;margin:0 0 10px}
.phone{position:relative;width:100%;aspect-ratio:360/600;border-radius:30px;overflow:hidden;border:6px solid #0b0d10;box-shadow:0 10px 30px #0008}
.phone>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;color:var(--ink)}
.note{color:var(--mut);font-size:14px;margin:12px 0 0}
.note b{color:var(--fg)}
.top{top:0;padding:14px 14px 0;display:flex;justify-content:space-between;align-items:center}
.right{display:flex;align-items:center;gap:10px;font:800 18px Outfit}
.right .day{font-size:17px}
.clock{width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btnfg);display:grid;place-items:center}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.back{width:32px;height:32px}
.bot{bottom:0;padding:0 18px 16px;display:flex;justify-content:space-around;align-items:flex-end}
.t{display:flex;flex-direction:column;align-items:center;gap:14px;font:700 10px Outfit;letter-spacing:.06em;text-transform:uppercase;width:66px}
.d{position:relative;width:44px;height:44px;border-radius:13px;background:var(--btn);color:var(--btnfg);transform:rotate(45deg);margin-top:8px;box-shadow:-5px 5px 0 var(--btn2)}
.d>svg{position:absolute;inset:0;margin:auto;transform:rotate(-45deg)}
.d.off{opacity:.55}
.bd{position:absolute;right:-12px;top:-12px;transform:rotate(-45deg);min-width:24px;height:24px;border-radius:12px;background:var(--bd);color:var(--bdfg);border:2px solid var(--ink);font:800 12px/20px Outfit;text-align:center}
.A{--ink:#4a3b36;--btn:#4a3b36;--btn2:#4a3b3633;--btnfg:#fff;--bd:#fff;--bdfg:#4a3b36;background:#f6f5f2}
.B{--ink:#5a3d2b;--btn:#5a3d2b;--btn2:#5a3d2b33;--btnfg:#fff4e0;--bd:#fff4e0;--bdfg:#5a3d2b;background:#f3dcb0}
.C{--ink:#e9eefb;--btn:#e9eefb;--btn2:#00000044;--btnfg:#232a3d;--bd:#232a3d;--bdfg:#e9eefb;background:#232a3d}
</style>

<h1>Mini Motorways, pour elle</h1>
<p class="lead">Trois ambiances du même style, d'après tes captures : blocs en relief avec ombres longues, routes blanches aux coins arrondis, rivière avec pont. Même partie partout : une maison rouge isolée qu'on relie du doigt, de l'autre côté de la rivière (trait pointillé).</p>
<div class="row" id="row"></div>

<script>
const C=40,OY=66;
const P=(x,y)=>[(x+.5)*C,(y+.5)*C];
const roads={red:[[1,2],[4,2]],blue:[[7,1],[7,3],[2,3],[2,6]],yellow:[[1,9],[4,9]]};
const ghost=[[7,7],[4,7],[4,2]], finger=[5.5,7];
const houses=[['red',1,2],['blue',7,1],['yellow',1,9],['red',7,7,.7]];
const dests=[['red',4,2,2],['blue',2,6,1],['yellow',4,9,0]];
const cars=[['red',2.5,2,'h'],['blue',7,2,'v'],['blue',4.5,3,'h'],['blue',2,4.6,'v'],['yellow',2.6,9,'h']];
const river=[[270,-20],[252,100],[218,200],[216,300],[246,400],[236,560]];

function smooth(p,r=16){const q=p.map(a=>P(...a));let d=`M${q[0]}`;
 for(let i=1;i<q.length-1;i++){const a=q[i-1],b=q[i],c=q[i+1];
  const l1=Math.hypot(a[0]-b[0],a[1]-b[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,l1/2,l2/2);
  const p1=[b[0]+(a[0]-b[0])/l1*rr,b[1]+(a[1]-b[1])/l1*rr],p2=[b[0]+(c[0]-b[0])/l2*rr,b[1]+(c[1]-b[1])/l2*rr];
  d+=` L${p1} Q${b} ${p2}`}
 return d+` L${q[q.length-1]}`}
const riverD='M'+river.map(a=>a.join(',')).join(' L');
const smoothRiver=(()=>{let d=`M${river[0]}`;for(let i=1;i<river.length-1;i++){const m=[(river[i][0]+river[i+1][0])/2,(river[i][1]+river[i+1][1])/2];d+=` Q${river[i]} ${m}`}return d+` L${river[river.length-1]}`})();

const pinSvg=(x,y,ink)=>`<path d="M${x} ${y+9} C${x-9} ${y-1} ${x-6} ${y-8} ${x} ${y-8} C${x+6} ${y-8} ${x+9} ${y-1} ${x} ${y+9}Z" fill="${ink}"/><circle cx="${x}" cy="${y-2}" r="2.4" fill="#fff"/>`;
const ringSvg=(x,y,f,ink,track)=>{const r=8,L=2*Math.PI*r;return `<circle cx="${x}" cy="${y}" r="11" fill="${track}"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ink}" stroke-width="5" stroke-dasharray="${L*f} ${L}" transform="rotate(-90 ${x} ${y})"/>`};

function scene(t){
 let s=`<rect width="360" height="600" fill="${t.ground}"/><g transform="translate(0,${OY})">`;
 t.blobs.forEach(b=>s+=`<polygon points="${b}" fill="${t.blob}" stroke="${t.blob}" stroke-width="46" stroke-linejoin="round"/>`);
 s+=`<path d="${smoothRiver}" fill="none" stroke="${t.bank}" stroke-width="64" stroke-linecap="round" opacity=".9"/>`;
 s+=`<path d="${smoothRiver}" fill="none" stroke="${t.water}" stroke-width="46" stroke-linecap="round"/>`;
 /* routes : liseré, puis blanc */
 const all=Object.values(roads).map(p=>smooth(p));
 all.forEach(d=>s+=`<path d="${d}" fill="none" stroke="${t.edge}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>`);
 all.forEach(d=>s+=`<path d="${d}" fill="none" stroke="${t.road}" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>`);
 /* pont existant : rambardes sur la traversée */
 s+=`<path d="M205 129 H268 M205 151 H268" stroke="${t.ink}" stroke-width="3" stroke-linecap="round"/>`;
 /* tracé en cours */
 s+=`<path d="${smooth(ghost)}" fill="none" stroke="${t.ghost}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 12"/>`;
 /* places des bâtiments */
 dests.forEach(([c,x,y,n])=>{const[p,q]=P(x,y);s+=`<rect x="${p-27}" y="${q-27}" width="54" height="54" rx="12" fill="${t.road}" stroke="${t.edge}" stroke-width="3"/>`});
 const cube=(x,y,w,L,c,notch)=>`<polygon points="${x+w},${y} ${x+w+L},${y+L} ${x+w+L},${y+w+L} ${x+L},${y+w+L} ${x},${y+w} ${x+w},${y+w}" fill="${t.shadow}"/>
  <rect x="${x+3}" y="${y+5}" width="${w}" height="${w}" rx="4" fill="${c[1]}"/><rect x="${x}" y="${y}" width="${w}" height="${w}" rx="4" fill="${c[0]}"/>${notch?`<rect x="${x+w*.32}" y="${y+w-5}" width="${w*.36}" height="5" rx="2" fill="${c[1]}"/>`:''}`;
 houses.forEach(([c,x,y,f])=>{const[p,q]=P(x,y);s+=cube(p-10,q-10,20,9,t.pal[c],true);if(f)s+=ringSvg(p+16,q-18,f,t.ink,t.road)});
 dests.forEach(([c,x,y,n])=>{const[p,q]=P(x,y);s+=cube(p-17,q-17,34,16,t.pal[c],true);for(let i=0;i<n;i++)s+=pinSvg(p-12+i*12,q-26,t.ink)});
 cars.forEach(([c,x,y,d])=>{const[p,q]=P(x-.5,y-.5);const w=d==='h'?11:7,h=d==='h'?7:11;s+=`<rect x="${p-w/2}" y="${q-h/2}" width="${w}" height="${h}" rx="3" fill="${t.pal[c][0]}" stroke="#fff" stroke-width="1.5"/>`});
 const[fx,fy]=P(...finger);s+=`<circle cx="${fx}" cy="${fy}" r="21" fill="${t.ink}" opacity=".13"/><circle cx="${fx}" cy="${fy}" r="9" fill="${t.ink}" opacity=".55"/>`;
 return `<svg viewBox="0 0 360 600" preserveAspectRatio="xMidYMid slice">${s}</g></svg>`}

const T={
 A:{ground:'#f6f5f2',blob:'#fbd5e5',blobs:['40,170 120,120 140,250','300,380 340,470 250,500'],water:'#a4e4e8',bank:'#f4ecd2',road:'#ffffff',edge:'#b4c5cc',ink:'#4a3b36',ghost:'#4a3b3699',shadow:'rgba(74,59,54,.13)',track:'#fff',
  pal:{red:['#ff6b61','#a8344a'],blue:['#6ad0ee','#2d7cb0'],yellow:['#ffd37a','#e39a4a']}},
 B:{ground:'#f3dcb0',blob:'#ecc88c',blobs:['30,160 130,110 120,260','310,400 330,500 240,520'],water:'#a9e5dc',bank:'#faeccb',road:'#fffaf0',edge:'#d9c9a6',ink:'#5a3d2b',ghost:'#5a3d2b99',shadow:'rgba(90,61,43,.16)',
  pal:{red:['#ff6aa6','#b83a7a'],blue:['#2ea8b5','#18707e'],yellow:['#ffb347','#d9772b']}},
 C:{ground:'#232a3d',blob:'#2b3450',blobs:['40,170 120,120 140,250','300,380 340,470 250,500'],water:'#2b6f8c',bank:'#2d3a58',road:'#eef1f8',edge:'#4d5a7c',ink:'#232a3d',ghost:'#ffffffaa',shadow:'rgba(0,0,0,.28)',
  pal:{red:['#ff7a66','#c2453a'],blue:['#59c7ff','#2a82c7'],yellow:['#ffd35c','#d99a1c']}}
};
T.C.ink='#e9eefb';

const ic={
 back:'<path d="M20 12H5M11 5l-7 7 7 7"/>',
 car:'<path d="M4 16l1.6-5.2A2 2 0 017.5 9.4h9a2 2 0 011.9 1.4L20 16v3h-2.5v-1.5h-11V19H4z" fill="currentColor"/><circle cx="7.5" cy="14" r="1" fill="#fff" stroke="none"/><circle cx="16.5" cy="14" r="1" fill="#fff" stroke="none"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
 road:'<rect x="5" y="12" width="14" height="6" rx="2"/><rect x="5" y="7" width="14" height="6" rx="2" opacity=".5"/>',
 bridge:'<path d="M3 16h18M5 16c0-6 14-6 14 0M8.5 11.5V16M12 10.2V16M15.5 11.5V16"/>',
 light:'<rect x="8.5" y="3.5" width="7" height="17" rx="3.5"/><circle cx="12" cy="8" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/>',
 star:'<path d="M12 4l2.4 5 5.4.7-4 3.7 1 5.4-4.8-2.7-4.8 2.7 1-5.4-4-3.7 5.4-.7z"/>'
};
const I=k=>`<svg class="i" viewBox="0 0 24 24">${ic[k]}</svg>`;
const tools=[['road','Routes','95',0],['bridge','Pont','1',0],['light','Feu','2',0],['star','Autoroute','1',1]];
const hud=`<div class="hud top"><svg class="i back" viewBox="0 0 24 24" style="width:32px;height:32px;stroke-width:2.4">${ic.back}</svg>
 <div class="right"><span>65</span>${I('car')}<span class="day">JEU</span><div class="clock">${I('clock')}</div></div></div>
 <div class="hud bot">${tools.map(([k,n,c,off])=>`<div class="t"><div class="d${off?' off':''}">${I(k)}<span class="bd">${c}</span></div>${n}</div>`).join('')}</div>`;

const dirs=[
 ['A','Direction A','Prairie pastel','Le plus proche de tes captures : fond blanc cassé, grandes taches roses, rivière turquoise, blocs orangés et rouges. <b>Doux, clair, très reposant</b>.'],
 ['B','Direction B','Désert','Fond sable, rivière menthe, blocs rose, turquoise et orange, comme ta deuxième capture. <b>Plus chaud et plus coloré</b>, les couleurs se distinguent bien.'],
 ['C','Direction C','Soirée','Le même style en mode sombre : fond bleu nuit, routes blanches qui ressortent, blocs lumineux. <b>Pour jouer le soir</b> sans fatiguer les yeux.']
];
document.getElementById('row').innerHTML=dirs.map(([k,t,n,note])=>`
<div class="col"><div class="tag">${t}</div><h2>${n}</h2>
<div class="phone ${k}">${scene(T[k])}${hud}</div><p class="note">${note}</p></div>`).join('');
</script>
