function hull(len, hh, prof, deck, rail) {

/* ---------- affichage : chaque dessin grossi ×2 sur la mer de la grille ---------- */
const Z = 2;
function seaTile(w, h, seed) {
  const [c, g] = mk(w, h), r = rnd(seed), bayer = [[0, 2], [3, 1]];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = Math.PI * 2 / 96, v = .55 * Math.sin(a * (2 * x + y) + 1.3) + .45 * Math.sin(a * (x - 3 * y) + .4) + .25 * Math.sin(a * (5 * x + 2 * y) + 2.2);
    R(g, x, y, 1, 1, SEA_T[clamp(Math.floor((v + 1.3) / 2.6 * 3 + (bayer[y % 2][x % 2] - 1.5) * .3), 0, 3)]);
  }
  for (let i = 0; i < w / 6; i++) { const x = Math.floor(r() * w), y = Math.floor(r() * h); R(g, x, y, 3, 1, '#5fa2dc'); }
  return c;
}
function preview(img, len, beam) {
  const W = len * CS + 12, Hh = CS + 12, [c, g] = mk(W, Hh);
  g.drawImage(seaTile(W, Hh, len * 7 + img.width), 0, 0);
  for (let k = 0; k <= len; k++) R(g, 6 + k * CS, 0, 1, Hh, 'rgba(210,236,255,.3)');
  R(g, 0, 6, W, 1, 'rgba(210,236,255,.3)'); R(g, 0, 6 + CS, W, 1, 'rgba(210,236,255,.3)');
  if (beam) { g.fillStyle = 'rgba(255,240,150,.28)'; g.beginPath(); g.moveTo(6 + len * CS - 22, 6 + CS / 2); g.lineTo(W, 0); g.lineTo(W, Hh); g.fill(); }
  g.drawImage(tint(img, 'rgba(4,18,48,.45)'), 8, 9);
  foamOf(img).slice(0, 1).forEach(f => g.drawImage(f, 3, 3));
  g.drawImage(img, 6, 6);
  const out = document.createElement('canvas'); out.width = W * Z; out.height = Hh * Z;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(c, 0, 0, W * Z, Hh * Z);
  return out;
}
function refRow() {
  const wrap = document.getElementById('ref');
  for (const [nm, b, len] of [['Porte-avions', buildCarrier, 4], ['Cuirassé', buildBattle, 3], ['Sous-marin', buildSub, 3], ['Torpilleur', buildTorp, 2]]) {
    const f = document.createElement('figure'); f.append(preview(b().c, len)); const t = document.createElement('figcaption'); t.textContent = nm; f.append(t); wrap.append(f);
  }
}
function build() {
  refRow();
  const main = document.getElementById('navires');
  SHIPS.forEach(s => {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${s.name}<span>${s.len} cases</span></h2><p class="pw"><b>${s.power}</b> · ${s.desc}</p>`;
    s.v.forEach(([t, d, fn], i) => {
      const f = document.createElement('figure');
      f.append(preview(fn().c, s.len, s.beam));
      const cap = document.createElement('figcaption');
      cap.innerHTML = `<b class="l">${'ABC'[i]}</b><span><b>${t}</b>${d}</span>`; f.append(cap); sec.append(f);
    });
    main.append(sec);
  });
}
build();
