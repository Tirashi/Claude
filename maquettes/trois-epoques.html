<title>Trois époques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Écran de téléphone : barre des époques, carte en pixels ×2, panneau de commandement, fiche du pack */
:root {
  --fond: #2b1d14; --panneau: #ead8a9; --encre: #3b2414; --accent: #b8322a; --trait: #6b4423;
  --bleu: #2f6fd0; --rouge: #c8332b; --doux: #8a6a45; --clair: #ead8a9;
  --titre: "Press Start 2P", "Courier New", monospace;
  --texte: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
body[data-ere="moderne"] { --fond: #1b2333; --panneau: #e6ecf2; --encre: #1b2333; --accent: #f08a24; --trait: #3c4a63; --bleu: #2f8ee0; --rouge: #e0443c; --doux: #6a7a92; --clair: #e6ecf2; }
body[data-ere="futur"] { --fond: #040a1a; --panneau: #0b1a36; --encre: #9ff5ec; --accent: #2ee6d6; --trait: #1f4a6e; --bleu: #4aa3ff; --rouge: #ff4d6d; --doux: #4f7fa0; --clair: #9ff5ec; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font-family: var(--texte); font-size: 20px; line-height: 1.1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  transition: background .3s;
}
.ecran { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.eres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.eres button {
  font-family: var(--titre); font-size: 9px; letter-spacing: .5px; padding: 10px 2px;
  background: transparent; color: var(--clair); border: 2px solid var(--trait); cursor: pointer;
}
.eres button[aria-pressed="true"] { background: var(--clair); color: var(--fond); border-color: var(--clair); }
.eres button:focus-visible, .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bandeau {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--titre); font-size: 9px; color: var(--clair); letter-spacing: .5px;
}
.bandeau b { color: var(--accent); font-weight: normal; }
.carte { position: relative; border: 3px solid var(--trait); background: #000; line-height: 0; }
canvas { width: 100%; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: manipulation; }
.bulle {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-family: var(--titre); font-size: 12px; line-height: 1.5; text-align: center;
  background: var(--panneau); color: var(--encre); border: 3px solid var(--trait); padding: 10px 14px;
  pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap;
}
.bulle.vue { opacity: 1; }
.commande { background: var(--panneau); border: 3px solid var(--trait); padding: 8px; display: grid; gap: 8px; }
.fiches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fiche { display: grid; grid-template-columns: 36px 1fr; gap: 6px; align-items: center; min-width: 0; }
.fiche canvas { width: 36px; height: 36px; background: color-mix(in srgb, var(--encre) 12%, transparent); }
.fiche .nom { font-family: var(--titre); font-size: 8px; line-height: 1.4; overflow-wrap: anywhere; }
.fiche .val { font-size: 18px; color: var(--doux); }
.fiche .val i { font-style: normal; color: var(--encre); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.actions button {
  font-family: var(--titre); font-size: 8px; padding: 10px 2px; cursor: pointer;
  background: var(--encre); color: var(--panneau); border: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
}
.actions button.chaud { background: var(--accent); color: var(--fond); }
.actions button:disabled { opacity: .3; cursor: default; }
.aide { font-size: 18px; color: var(--doux); min-height: 2.2em; }
.pack { color: var(--clair); border-top: 2px dashed var(--trait); padding-top: 10px; display: grid; gap: 6px; }
.pack h2 { font-family: var(--titre); font-size: 10px; margin: 0; color: var(--accent); font-weight: normal; line-height: 1.5; }
.pack p { margin: 0; font-size: 19px; color: color-mix(in srgb, var(--clair) 82%, var(--fond)); }
.pack a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } .bulle { transition: none; } }
</style>

<div class="ecran">
  <div class="eres" role="group" aria-label="Époque">
    <button id="b-medieval" data-ere="medieval" aria-pressed="true">MEDIEVAL</button>
    <button id="b-moderne" data-ere="moderne" aria-pressed="false">MODERNE</button>
    <button id="b-futur" data-ere="futur" aria-pressed="false">FUTUR</button>
  </div>
  <div class="bandeau"><span id="jour">JOUR 1</span><span id="camp"><b>BLEU</b> JOUE</span><span id="or">OR 3000</span></div>
  <div class="carte">
    <canvas id="jeu" width="160" height="192"></canvas>
    <div class="bulle" id="bulle"></div>
  </div>
  <div class="commande">
    <div class="fiches">
      <div class="fiche"><canvas id="f-terrain" width="16" height="16"></canvas><div><div class="nom" id="t-nom">PLAINE</div><div class="val" id="t-val">DEF <i>★</i></div></div></div>
      <div class="fiche"><canvas id="f-unite" width="24" height="24"></canvas><div><div class="nom" id="u-nom">—</div><div class="val" id="u-val">touche une unité</div></div></div>
    </div>
    <div class="actions">
      <button id="a-attaque" disabled>ATTAQUER</button>
      <button id="a-attendre" disabled>ATTENDRE</button>
      <button id="a-fin" class="chaud">FIN DU TOUR</button>
    </div>
    <div class="aide" id="aide">Touche une unité bleue pour voir où elle peut aller.</div>
  </div>
  <div class="pack" id="pack"></div>
</div>

              R: { inf: 'ARAIGNEE', anti: 'GUEPE', lourd: 'SCARABEE', dist: 'FRELON' } },
    camps: ['HUMAINS', 'MACHINES'], monnaie: 'ENERGIE',
    pack: `<h2>ROBOT WARFARE · 16 PX ANIMÉ</h2>
      <p>Humains contre machines : 7 classes de soldats (marche, tir, rampe, lancer), 5 robots-insectes, explosions, et une interface tactique toute prête (portée, flèches, curseurs).</p>
      <p>Licence CC0. <a href="https://mattwalkden.itch.io/free-robot-warfare-pack" target="_blank" rel="noopener">La page du pack</a>.</p>
      <p>Pas de bâtiments ni d'eau : dômes, base et lac acide sont dessinés pour la maquette. La guêpe et le frelon volent au-dessus du lac.</p>`,
  },
};

const ROLES = {
  inf:   { mv: 3, rg: [1, 1], atk: 5, pied: true },
  anti:  { mv: 3, rg: [1, 1], atk: 6, pied: true },
  lourd: { mv: 5, rg: [1, 1], atk: 7, pied: false },
  dist:  { mv: 4, rg: [2, 3], atk: 7, pied: false },
};
const FORCE = { // multiplicateur attaquant → défenseur
  inf: { inf: 1, anti: 1, lourd: .4, dist: 1.1 },
  anti: { inf: .9, anti: .9, lourd: 1.5, dist: 1.3 },
  lourd: { inf: 1.4, anti: 1.1, lourd: 1, dist: 1.3 },
  dist: { inf: 1.2, anti: 1.2, lourd: 1.1, dist: 1 },
};
const DEF = { '.': 1, '=': 0, 'F': 2, 'M': 4, '~': 0, 'v': 3, 'b': 3, 'r': 3, 'B': 4, 'H': 4 };

let ere = 'medieval';
let unites, jour, tourRouge, sel, phase, portee, cibles, anim, effets, curseur;
function nouvellePartie() {
  unites = [
    { id: 1, camp: 'B', role: 'inf', x: 3, y: 9 }, { id: 2, camp: 'B', role: 'anti', x: 5, y: 10 },
    { id: 3, camp: 'B', role: 'lourd', x: 2, y: 8 }, { id: 4, camp: 'B', role: 'dist', x: 1, y: 9 },
    { id: 5, camp: 'R', role: 'inf', x: 6, y: 2 }, { id: 6, camp: 'R', role: 'anti', x: 4, y: 3 },
    { id: 7, camp: 'R', role: 'lourd', x: 7, y: 2 }, { id: 8, camp: 'R', role: 'dist', x: 8, y: 0 },
  ].map(u => ({ ...u, pv: 10, fait: false, px: u.x * T, py: u.y * T }));
  jour = 1; tourRouge = false; sel = null; phase = 'libre'; portee = null; cibles = []; anim = null; effets = []; curseur = { x: 3, y: 9 };
}

// ---------- images ----------
const images = {};
for (const k in ATLAS) { const im = new Image(); im.src = ATLAS[k][0]; images[k] = im; }
function sprite(ctx, nom, x, y, f = 0, miroir = false, e = ere) {
  const [url, meta] = ATLAS[e], m = meta[nom]; if (!m) return false;
  const [sy, w, h, n] = m, fr = f % n;
  const dx = x + (T - w) / 2, dy = y + (T - h) / 2;
  if (miroir) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(images[e], fr * w, sy, w, h, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(images[e], fr * w, sy, w, h, dx, dy, w, h);
  return true;
}
const hache = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

// pixels dessinés à la main (époque future : dômes, base, lac acide)
function px(ctx, x, y, c, w = 1, h = 1) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function dome(ctx, x, y, coul) {
  px(ctx, x + 2, y + 11, '#0a1428', 12, 3); px(ctx, x + 3, y + 10, '#3a5878', 10, 2);
  for (let j = 0; j < 7; j++) for (let i = 0; i < 12; i++) {
    const dx = i - 5.5, dy = 6.5 - j; if (dx * dx + dy * dy * 1.6 < 40) px(ctx, x + 2 + i, y + 3 + j, (i < 5 && j < 3) ? '#e8fbff' : coul);
  }
  px(ctx, x + 7, y + 1, '#9ab', 1, 2); px(ctx, x + 6, y + 9, '#0a1428', 3, 2);
}
function base(ctx, x, y, coul, t) {
  px(ctx, x + 2, y + 12, '#0a1428', 12, 3); px(ctx, x + 4, y + 4, '#3a5878', 8, 9); px(ctx, x + 5, y + 5, coul, 6, 3);
  px(ctx, x + 5, y + 9, '#0a1428', 6, 1); px(ctx, x + 7, y + 10, '#0a1428', 2, 3);
  px(ctx, x + 7, y, '#9ab', 2, 4); px(ctx, x + 7, y, (Math.floor(t / 400) % 2) ? coul : '#fff', 2, 1);
}
function acide(ctx, x, y, t) {
  px(ctx, x, y, '#0d4a35', T, T);
  for (let k = 0; k < 6; k++) {
    const h = hache(x + k * 7, y + k * 3), ph = Math.floor(t / 300 + h) % 4;
    if (ph < 2) px(ctx, x + (h % 14) + 1, y + ((h >> 4) % 14) + 1, ph ? '#3dff9a' : '#1d8a5a', 2, 1);
  }
}
function eau(c) { return c === '~'; }
function bordLac(x, y) {
  const w = (a, b) => a >= 0 && b >= 0 && a < L && b < H && eau(CARTE[b][a]);
  const c = !w(x - 1, y) ? 0 : !w(x + 1, y) ? 2 : 1, r = !w(x, y - 1) ? 0 : !w(x, y + 1) ? 2 : 1;
  return r * 3 + c;
}

function dessinerCase(ctx, c, x, y, t, ox = x * T, oy = y * T) {
  const h = hache(x, y);
  if (ere === 'futur') sprite(ctx, 'plaine', ox, oy, h % 4); else sprite(ctx, 'plaine', ox, oy, h % 4);
  if (c === '~') {
    if (ere === 'medieval') { sprite(ctx, 'mer', ox, oy); sprite(ctx, 'lac', ox, oy, bordLac(x, y)); }
    else if (ere === 'moderne') sprite(ctx, 'lac', ox, oy, bordLac(x, y));
    else acide(ctx, ox, oy, t);
  } else if (c === 'F') sprite(ctx, 'foret', ox, oy, h % 2);
  else if (c === 'M') sprite(ctx, 'montagne', ox, oy, h % 3);
  else if (c === '=') sprite(ctx, 'route', ox, oy);
  else if ('vbrBH'.includes(c)) {
    const camp = c === 'b' || c === 'B' ? 'B' : c === 'r' || c === 'H' ? 'R' : '';
    const qg = c === 'B' || c === 'H';
    if (ere === 'medieval') {
      sprite(ctx, qg ? 'qg' : 'ville', ox, oy, h % 3);
      if (camp) sprite(ctx, 'drap' + camp, ox + 5, oy - 6);
    } else if (ere === 'moderne') sprite(ctx, (qg ? 'qg' : 'ville') + camp, ox, oy) || sprite(ctx, 'ville', ox, oy);
    else {
      const coul = camp === 'B' ? '#4aa3ff' : camp === 'R' ? '#ff4d6d' : '#7f93a8';
      qg ? base(ctx, ox, oy, coul, t) : dome(ctx, ox, oy, coul);
    }
  }
}

// ---------- chiffres de 3 × 5 pour les PV ----------
const CHIF = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
function chiffre(ctx, n, x, y) {
  px(ctx, x - 1, y - 1, '#000', 5, 7);
  [...CHIF[n]].forEach((b, i) => { if (b === '1') px(ctx, x + i % 3, y + Math.floor(i / 3), '#fff'); });
}

// ---------- règles ----------
const vole = u => ere === 'futur' && u.camp === 'R' && (u.role === 'anti' || u.role === 'dist');
function cout(u, c) {
  if (vole(u)) return 1;
  if (c === '~') return 99;
  if (c === 'M') return ROLES[u.role].pied ? 3 : 99;
  if (c === 'F') return ROLES[u.role].pied ? 1 : 2;
  return 1;
}
const uniteEn = (x, y) => unites.find(u => u.x === x && u.y === y);
function calculPortee(u) {
  const d = {}, pere = {}, cle = (x, y) => x + ',' + y, file = [[u.x, u.y]];
  d[cle(u.x, u.y)] = 0;
  while (file.length) {
    file.sort((a, b) => d[cle(...a)] - d[cle(...b)]);
    const [x, y] = file.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= L || ny >= H) continue;
      const o = uniteEn(nx, ny); if (o && o.camp !== u.camp) continue;
      const nd = d[cle(x, y)] + cout(u, CARTE[ny][nx]);
      if (nd <= ROLES[u.role].mv && (d[cle(nx, ny)] === undefined || nd < d[cle(nx, ny)])) { d[cle(nx, ny)] = nd; pere[cle(nx, ny)] = [x, y]; file.push([nx, ny]); }
    }
  }
  for (const k in d) { const [x, y] = k.split(',').map(Number); const o = uniteEn(x, y); if (o && o !== u) delete d[k]; }
  return { d, pere };
}
function rangs(u) { const r = ROLES[u.role].rg.slice(); if (ere === 'medieval' && u.role === 'anti') r[1] = 2; return r; }
function ciblesDepuis(u, x, y) {
  const [a, b] = rangs(u);
  return unites.filter(o => o.camp !== u.camp && o.pv > 0 && Math.abs(o.x - x) + Math.abs(o.y - y) >= a && Math.abs(o.x - x) + Math.abs(o.y - y) <= b);
}
function degats(a, d) {
  const brut = ROLES[a.role].atk * FORCE[a.role][d.role] * (a.pv / 10) * (1 - 0.08 * (vole(d) ? 0 : DEF[CARTE[d.y][d.x]]));
  return Math.max(1, Math.round(brut));
}

// ---------- dessin ----------
const cv = document.getElementById('jeu'), ctx = cv.getContext('2d');
function dessiner(t) {
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < H; y++) for (let x = 0; x < L; x++) dessinerCase(ctx, CARTE[y][x], x, y, t);
  // zones
  if (portee && phase === 'choix') {
    ctx.fillStyle = ere === 'futur' ? 'rgba(46,230,214,.35)' : 'rgba(80,150,255,.42)';
    for (const k in portee.d) { const [x, y] = k.split(',').map(Number); ctx.fillRect(x * T, y * T, T, T); }
  }
  for (const c of cibles) { ctx.fillStyle = 'rgba(255,60,60,' + (0.35 + 0.15 * Math.sin(t / 150)) + ')'; ctx.fillRect(c.x * T, c.y * T, T, T); }
  // unités, de haut en bas
  for (const u of [...unites].sort((a, b) => a.py - b.py)) {
    const f = Math.floor(t / (ere === 'futur' ? 160 : 500) + u.id);
    const respire = ere === 'futur' ? 0 : (Math.floor(t / 550 + u.id * .5) % 2);
    ctx.globalAlpha = u.fait ? .55 : 1;
    if (u.camp === 'B' && ere !== 'futur') { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(u.px + 3, u.py + 13, 10, 2); }
    sprite(ctx, u.role + u.camp, u.px, u.py - respire, ere === 'futur' ? f : 0, u.camp === 'R');
    ctx.globalAlpha = 1;
    if (u.pv < 10) chiffre(ctx, u.pv, u.px + 12, u.py + 10);
  }
  // curseur
  if (curseur) {
    const o = Math.floor(t / 300) % 2, x = curseur.x * T - o, y = curseur.y * T - o, s = T + 2 * o - 4, c = ere === 'futur' ? '#2ee6d6' : '#fff';
    for (const [a, b, sx, sy] of [[x, y, 1, 1], [x + s + 3, y, -1, 1], [x, y + s + 3, 1, -1], [x + s + 3, y + s + 3, -1, -1]]) {
      px(ctx, sx > 0 ? a : a - 3, b, '#000', 4, 1); px(ctx, a, sy > 0 ? b : b - 3, '#000', 1, 4);
      px(ctx, sx > 0 ? a : a - 2, sy > 0 ? b + 1 : b - 1, c, 3, 1); px(ctx, sx > 0 ? a + 1 : a - 1, sy > 0 ? b : b - 2, c, 1, 3);
    }
  }
  // effets
  effets = effets.filter(e => t - e.t0 < e.duree);
  for (const e of effets) {
    const p = Math.max(0, (t - e.t0) / e.duree);
    if (e.type === 'boom') {
      if (ere === 'futur') sprite(ctx, 'boom', e.x * T, e.y * T, Math.floor(p * 9));
      else for (let k = 0; k < 10; k++) {
        const a = k * 0.63 + e.x, r = 2 + p * 9;
        px(ctx, e.x * T + 8 + Math.cos(a) * r - 1, e.y * T + 8 + Math.sin(a) * r - 1, k % 2 ? '#ffd23f' : '#fff', 2 - Math.floor(p * 2) || 1, 2 - Math.floor(p * 2) || 1);
      }
    } else if (e.type === 'chiffre') {
      ctx.font = '8px "Press Start 2P"'; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText('-' + e.n, e.x * T + 9, e.y * T - p * 8 + 1);
      ctx.fillStyle = '#fff'; ctx.fillText('-' + e.n, e.x * T + 8, e.y * T - p * 8);
    }
  }
}

// ---------- fiches ----------
const fT = document.getElementById('f-terrain').getContext('2d'), fU = document.getElementById('f-unite').getContext('2d');
function majFiches(x, y, t = performance.now()) {
  const c = CARTE[y][x], E = ERES[ere];
  fT.imageSmoothingEnabled = false; fT.clearRect(0, 0, 16, 16); dessinerCase(fT, c, x, y, t, 0, 0);
  document.getElementById('t-nom').textContent = E.terrains[c];
  document.getElementById('t-val').innerHTML = 'DEF <i>' + ('★'.repeat(DEF[c]) || '—') + '</i>';
  const u = uniteEn(x, y);
  fU.imageSmoothingEnabled = false; fU.clearRect(0, 0, 24, 24);
  if (u) {
    sprite(fU, u.role + u.camp, 4, 4, 0, u.camp === 'R');
    const r = rangs(u);
    document.getElementById('u-nom').textContent = E.unites[u.camp][u.role];
    document.getElementById('u-val').innerHTML = `PV <i>${u.pv}</i> · MVT <i>${ROLES[u.role].mv}</i> · TIR <i>${r[0] === r[1] ? r[0] : r[0] + '-' + r[1]}</i>`;
  } else { document.getElementById('u-nom').textContent = '—'; document.getElementById('u-val').textContent = 'case vide'; }
}
const aide = m => document.getElementById('aide').textContent = m;
function majBoutons() {
  document.getElementById('a-attaque').disabled = !(phase === 'agir' && cibles.length);
  document.getElementById('a-attendre').disabled = phase !== 'agir';
  document.getElementById('a-fin').disabled = tourRouge || !!anim;
}
function majBandeau() {
  const E = ERES[ere];
  document.getElementById('jour').textContent = 'JOUR ' + jour;
  document.getElementById('camp').innerHTML = `<b>${tourRouge ? E.camps[1] : E.camps[0]}</b> JOUE`;
  document.getElementById('or').textContent = E.monnaie + ' ' + (3000 + (jour - 1) * 1000);
}
function bulle(txt) {
  const b = document.getElementById('bulle'); b.innerHTML = txt; b.classList.add('vue');
  clearTimeout(bulle.t); bulle.t = setTimeout(() => b.classList.remove('vue'), 1100);
}

// ---------- déplacements et combats ----------
function chemin(pere, x, y) { const c = [[x, y]]; let k = x + ',' + y; while (pere[k]) { c.unshift(pere[k]); k = pere[k].join(','); } return c; }
function deplacer(u, chem, fini) {
  anim = { u, chem, i: 0, t0: performance.now(), fini };
}
function avancerAnim(t) {
  if (!anim) return;
  const pas = 90, i = Math.max(0, Math.floor((t - anim.t0) / pas));
  if (i >= anim.chem.length - 1) {
    const [x, y] = anim.chem[anim.chem.length - 1]; anim.u.x = x; anim.u.y = y; anim.u.px = x * T; anim.u.py = y * T;
    const f = anim.fini; anim = null; f && f(); return;
  }
  const p = Math.min(1, Math.max(0, (t - anim.t0) / pas - i)), [x0, y0] = anim.chem[i], [x1, y1] = anim.chem[i + 1];
  anim.u.px = (x0 + (x1 - x0) * p) * T; anim.u.py = (y0 + (y1 - y0) * p) * T;
}
function frapper(a, d) {
  const t = performance.now(), n = degats(a, d);
  d.pv = Math.max(0, d.pv - n);
  effets.push({ type: 'boom', x: d.x, y: d.y, t0: t, duree: 450 }, { type: 'chiffre', n, x: d.x, y: d.y, t0: t, duree: 700 });
  return n;
}
function combat(a, d, fini) {
  frapper(a, d);
  const dist = Math.abs(a.x - d.x) + Math.abs(a.y - d.y);
  setTimeout(() => {
    if (d.pv > 0 && d.role !== 'dist' && dist >= rangs(d)[0] && dist <= rangs(d)[1]) frapper(d, a);
    setTimeout(() => { unites = unites.filter(u => u.pv > 0); verifierFin(); fini && fini(); }, 380);
  }, 380);
}
function verifierFin() {
  const E = ERES[ere];
  if (!unites.some(u => u.camp === 'R')) bulle('VICTOIRE !<br>' + E.camps[0]);
  else if (!unites.some(u => u.camp === 'B')) bulle('DEFAITE...<br>' + E.camps[1] + ' GAGNE');
}
function finirUnite() { if (sel) sel.fait = true; sel = null; portee = null; cibles = []; phase = 'libre'; majBoutons(); aide('Choisis une autre unité, ou FIN DU TOUR.'); }

cv.addEventListener('pointerdown', ev => {
  if (anim || tourRouge) return;
  const r = cv.getBoundingClientRect(), x = Math.floor((ev.clientX - r.left) / r.width * L), y = Math.floor((ev.clientY - r.top) / r.height * H);
  if (x < 0 || y < 0 || x >= L || y >= H) return;
  curseur = { x, y }; majFiches(x, y);
  const u = uniteEn(x, y);
  if (phase === 'agir') {
    const c = cibles.find(c => c.x === x && c.y === y);
    if (c) { const a = sel; phase = 'combat'; cibles = []; majBoutons(); combat(a, c, () => { a.fait = true; sel = null; phase = 'libre'; majBoutons(); aide('Choisis une autre unité, ou FIN DU TOUR.'); }); }
    return;
  }
  if (phase === 'choix' && sel) {
    const k = x + ',' + y;
    if (portee.d[k] !== undefined) {
      const a = sel, bouge = !(x === a.x && y === a.y);
      phase = 'marche'; majBoutons();
      deplacer(a, chemin(portee.pere, x, y), () => {
        phase = 'agir';
        cibles = (a.role === 'dist' && bouge) ? [] : ciblesDepuis(a, a.x, a.y);
        majBoutons(); majFiches(a.x, a.y);
        aide(cibles.length ? 'Touche une case rouge pour attaquer, ou ATTENDRE.' : (a.role === 'dist' && bouge ? 'Les tireurs à distance ne tirent pas après avoir bougé.' : 'Personne à portée : ATTENDRE.'));
      });
      return;
    }
    sel = null; portee = null; phase = 'libre';
  }
  if (u && u.camp === 'B' && !u.fait) {
    sel = u; portee = calculPortee(u); phase = 'choix';
    cibles = []; aide('Touche une case bleue pour y aller (ou l\'unité pour rester sur place).');
  } else if (u && u.camp === 'R') {
    sel = null; portee = calculPortee(u); phase = 'choix'; cibles = [];
    aide('Portée de l\'ennemi en bleu.');
    setTimeout(() => { if (!sel && phase === 'choix') { portee = null; phase = 'libre'; } }, 1400);
  } else aide('Touche une unité bleue pour voir où elle peut aller.');
  majBoutons();
});
document.getElementById('a-attendre').onclick = finirUnite;
document.getElementById('a-attaque').onclick = () => { aide('Touche maintenant une des cases rouges.'); };
document.getElementById('a-fin').onclick = () => {
  if (anim || tourRouge) return;
  sel = null; portee = null; cibles = []; phase = 'libre';
  tourRouge = true; majBandeau(); majBoutons(); bulle(ERES[ere].camps[1] + '<br>A L\'ATTAQUE');
  const rouges = unites.filter(u => u.camp === 'R');
  let i = 0;
  const suivant = () => {
    if (i >= rouges.length || !unites.some(u => u.camp === 'B')) {
      unites.forEach(u => u.fait = false); tourRouge = false; jour++; majBandeau(); majBoutons();
      bulle('JOUR ' + jour); aide('À toi ! Touche une unité bleue.'); return;
    }
    const r = rouges[i++]; if (r.pv <= 0) return suivant();
    curseur = { x: r.x, y: r.y };
    // IA simple : tirer sur place si possible, sinon aller vers la cible la plus proche puis frapper
    let c = ciblesDepuis(r, r.x, r.y);
    if (c.length) { setTimeout(() => combat(r, c[0], () => setTimeout(suivant, 200)), 300); return; }
    const p = calculPortee(r), bleus = unites.filter(u => u.camp === 'B');
    let mieux = null, score = 1e9;
    for (const k in p.d) {
      const [x, y] = k.split(',').map(Number);
      const proche = Math.min(...bleus.map(b => Math.abs(b.x - x) + Math.abs(b.y - y)));
      const s = proche + (r.role === 'dist' ? 0 : (ciblesDepuis(r, x, y).length ? -20 : 0));
      if (s < score) { score = s; mieux = [x, y]; }
    }
    setTimeout(() => deplacer(r, chemin(p.pere, ...mieux), () => {
      curseur = { x: r.x, y: r.y };
      c = r.role === 'dist' ? [] : ciblesDepuis(r, r.x, r.y);
      if (c.length) combat(r, c[0], () => setTimeout(suivant, 200)); else setTimeout(suivant, 250);
    }), 300);
  };
  setTimeout(suivant, 700);
};

// ---------- époques ----------
function choisirEre(e) {
  ere = e; document.body.dataset.ere = e;
  document.querySelectorAll('.eres button').forEach(b => b.setAttribute('aria-pressed', b.dataset.ere === e));
  document.getElementById('pack').innerHTML = ERES[e].pack;
  majBandeau(); majFiches(curseur.x, curseur.y);
  try { localStorage.setItem('trois-epoques', e); } catch (_) {}
}
document.querySelectorAll('.eres button').forEach(b => b.onclick = () => choisirEre(b.dataset.ere));
