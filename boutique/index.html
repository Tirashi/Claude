<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Boutique de cartes</title>
<meta name="description" content="La Boutique de cartes : tiens une boutique de cartes à collectionner pendant un an, en 3D. Commande, ouvre des boosters, aménage et agrandis ta boutique.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2b2838">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!-- polices dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/boutique.css" data-google="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="La boutique en 3D"></canvas>
<div id="chargement">La boutique ouvre…</div>

<div id="haut">
  <div class="pastille"><span id="hSemaine">SEMAINE 1 · LUNDI</span><small id="hInfo"></small></div>
  <div class="pastille argent" id="hArgent"><small>EN CAISSE</small><b id="hCaisse">0 €</b></div>
</div>
<div id="tourner"><button id="gauche" aria-label="Tourner à gauche">⟲</button><button id="droite" aria-label="Tourner à droite">⟳</button></div>
<div id="journal"></div>

<!-- le lundi -->
<div id="barreLundi" class="barre">
  <button id="bAmenager" class="jaune">AMÉNAGER</button>
  <button id="bOuvrir" class="vert">OUVRIR LA BOUTIQUE</button>
</div>
<!-- pendant la semaine -->
<div id="barreSemaine" class="barre" hidden>
  <div class="jour"><b id="sJour">MARDI</b><small id="sClients"></small></div>
  <button id="bVitesse">×1</button>
  <button id="bPause">PAUSE</button>
</div>

<!-- aménager -->
<div id="feuille" class="feuille" hidden>
  <div class="tete"><b>AMÉNAGER</b><button class="vert" id="fini">TERMINÉ</button></div>
  <div id="fCatalogue">
    <div class="catalogue" id="catalogue"></div>
    <p class="aide">Touche un meuble de la boutique pour le déplacer, le tourner ou le revendre.</p>
  </div>
  <div id="fPose" hidden>
    <div class="ligne"><div class="nom" id="poseNom"></div><button class="rond" id="poseTourner" aria-label="Tourner">↻</button><button class="rond" id="poseAnnuler" aria-label="Annuler">✕</button><button class="vert" id="poseOk">POSER</button></div>
    <p class="aide" id="poseAide"></p>
  </div>
  <div id="fChoix" hidden>
    <div class="ligne"><div class="nom" id="choixNom"></div><button class="rond" id="choixTourner" aria-label="Tourner">↻</button><button class="gris" id="choixDeplacer">DÉPLACER</button><button class="rouge" id="choixVendre">VENDRE</button></div>
    <p class="aide"><button class="lien" id="choixFermer">Fermer</button></p>
  </div>
</div>

<!-- fenêtres (rencontres, bilan, agrandissement) -->
<div id="voile" hidden><div id="boite"></div></div>

<script src="monstres.js"></script>
<script src="regles.js"></script>
<script src="cartes.js"></script>
<script src="clients.js"></script>
<script src="images.js"></script>
<script src="modeles.js"></script>
<script src="../lib/three.min.js"></script>
<script src="../lib/GLTFLoader.js"></script>
<script src="../lib/SkeletonUtils.js"></script>
<script src="dessin-cartes.js"></script>
<script src="monde3d.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu. */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
