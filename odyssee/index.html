<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odyssée</title>
<meta name="description" content="Odyssée : penche le téléphone pour ramener la galère d'Ulysse de Troie jusqu'à Ithaque.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#9fdcff">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!-- Fredoka, dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/empilage.css" data-google="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="jeu">
  <canvas id="cv" aria-label="Odyssée : la galère d'Ulysse sur la mer Égée"></canvas>
  <div class="hud ombre" id="hud" hidden>
    <div><div id="temps">0:00</div><div id="ep"></div></div>
    <div class="droite"><button class="rond" id="bPause" aria-label="Pause">❚❚</button><div id="chutes"></div></div>
  </div>
  <div id="msg" class="ombre"></div>
  <button class="rond" id="aplat" hidden>⟲ À PLAT</button>
  <button id="bCire" hidden aria-label="Boucher les oreilles avec la cire">CIRE</button>

  <div class="ecran" id="eTitre">
    <div class="carte">
      <h1>ODYSSÉE</h1>
      <p class="recit">Le retour d'Ulysse, de Troie jusqu'à Ithaque.</p>
      <p>Penche le téléphone pour guider la galère. Sans capteur, fais glisser le doigt.</p>
      <p class="petit" id="totalTitre" style="white-space: pre-line"></p>
      <button id="bJouer">JOUER</button>
      <button class="sable" id="bJour">PLATEAU DU JOUR</button>
      <div class="rang"><a class="lien" href="../classements/index.html#odyssee">CLASSEMENT</a><button class="doux" id="bSon">SON : OUI</button></div>
      <a class="lien" href="../index.html">◀ LUDOTHÈQUE</a>
    </div>
  </div>

  <div class="ecran" id="eRecit" hidden>
    <div class="carte" id="cRecit">
      <p class="chant" id="rChant"></p>
      <p class="titre2" id="rNom"></p>
      <p class="recit" id="rRecit"></p>
      <p class="petit" id="rAide"></p>
      <p class="petit" id="rCible"></p>
      <button id="bPartir">TOUCHE POUR PARTIR</button>
    </div>
  </div>

  <div class="ecran" id="ePause" hidden>
    <div class="carte">
      <p class="titre2">PAUSE</p>
      <p class="petit" id="pTourne" hidden>Remets le téléphone droit, en portrait, pour reprendre.</p>
      <button id="bReprendre">REPRENDRE</button>
      <div class="rang"><button class="doux" id="bRecommencer">RECOMMENCER</button><button class="doux" id="bCarteP">LA CARTE</button></div>
      <button class="doux" id="bSonP">SON : OUI</button>
      <a class="lien" href="../index.html">◀ RETOUR À LA LUDOTHÈQUE</a>
    </div>
  </div>

  <div class="ecran" id="eFin" hidden>
    <div class="carte">
      <p class="chant" id="fChant"></p>
      <p class="titre2" id="fTitre">TERRE EN VUE !</p>
      <div class="etoiles" id="fEtoiles"></div>
      <div class="grand" id="fTemps"></div>
      <p class="petit" id="fDetail"></p>
      <p class="petit" id="fRecord"></p>
      <p class="petit" id="fRang"></p>
      <button id="bSuivant">PLATEAU SUIVANT</button>
      <div class="rang"><button class="doux" id="bRejouer">REJOUER</button><button class="doux" id="bCarteF">LA CARTE</button></div>
    </div>
  </div>

  <div id="egee" hidden>
    <svg id="svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="haut"><button class="rond" id="bRetour">◀ TITRE</button><div class="ombre" id="total"></div></div>
    <div id="volet" hidden><div class="carte" id="cVolet"></div></div>
  </div>
</div>
<script src="../lib/three.min.js"></script>
<script src="regles.js"></script>
<script src="sons.js"></script>
<script src="../ludo-scores.js"></script>
<script src="jeu.js"></script>
<script>
/* Ludothèque : mode hors connexion. Pas de bouton « ◀ MENU » ajouté par-dessus le jeu :
   le retour à la Ludothèque est dans les menus du jeu (écran titre, pause). */
(function () {
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
      navigator.serviceWorker.register("../sw.js").catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
