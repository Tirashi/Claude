<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Empilage : lâche chaque bloc pile sur la tour et monte jusqu'aux étoiles.">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#9fd8ff">

<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!-- police dans le dépôt (hors connexion) ; data-google : le lien utilisé par l'artefact (outils/artefact.py) -->
<link rel="stylesheet" href="../polices/empilage.css" data-google="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #fff1e6; }
body { display: flex; justify-content: center; align-items: flex-start; touch-action: manipulation; font-family: 'Fredoka', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#jeu { position: relative; width: 100%; max-width: 62vh; height: 100%; overflow: hidden; cursor: pointer; touch-action: none; }
#ciel, #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; left: 0; right: 0; top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 22px); text-align: center; pointer-events: none;
  color: #fff; font-weight: 700; text-shadow: 0 2px 0 rgba(110, 80, 160, .35); }
#score { font-size: 64px; line-height: 1; }
#sous { font-size: 14px; font-weight: 600; margin-top: 6px; opacity: .9; letter-spacing: .5px; }
#bonus { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; color: #fff; font-weight: 700; font-size: 26px;
  text-shadow: 0 2px 0 rgba(110, 80, 160, .35); opacity: 0; transition: opacity .25s, transform .45s; }
#bonus.vu { opacity: 1; transform: translateY(-16px); }
.ecran { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.carte { width: 100%; max-width: 340px; box-sizing: border-box; background: rgba(255, 255, 255, .86); border-radius: 22px; padding: 18px 18px 16px;
  box-shadow: 0 10px 30px rgba(90, 60, 140, .22); color: #4a3a6a; text-align: center; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: 1px; }
h1 span:nth-child(5n+1) { color: #7cc6f2; } h1 span:nth-child(5n+2) { color: #f29bc0; } h1 span:nth-child(5n+3) { color: #9b8cf0; }
h1 span:nth-child(5n+4) { color: #f2b56b; } h1 span:nth-child(5n) { color: #74cfa8; }
.carte p { margin: 0; font-size: 15px; line-height: 1.35; }
.carte .grand { font-size: 40px; font-weight: 700; line-height: 1; color: #6a54b8; }
.carte .petit { font-size: 13px; color: #7a6a98; }
.carte .or { color: #e08a2a; font-weight: 700; }
button, .lien { font: 700 17px 'Fredoka', system-ui, sans-serif; color: #fff; background: #9b8cf0; border: 0; border-radius: 14px; padding: 12px 10px;
  box-shadow: 0 4px 0 #6f5fc8; cursor: pointer; text-decoration: none; display: block; width: 100%; box-sizing: border-box; }
button:active, .lien:active { transform: translateY(3px); box-shadow: 0 1px 0 #6f5fc8; }
button.jour { background: #f29bc0; box-shadow: 0 4px 0 #cf6f98; }
button.doux, .lien { background: #eae4fb; color: #6a54b8; box-shadow: 0 4px 0 #c9bff0; font-size: 15px; padding: 9px 10px; }
.rang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #bonus { transition: none; } }
</style>
</head>
<body>
<div id="jeu">
  <div id="ciel"></div>
  <canvas id="cv" aria-label="Empilage : une tour de blocs à empiler"></canvas>
  <div class="hud" id="hud" hidden><div id="score">0</div><div id="sous"></div></div>
  <div id="bonus"></div>
  <div class="ecran" id="titre">
    <div class="carte">
      <h1 id="nom">EMPILAGE</h1>
      <p>Touche l'écran pour lâcher chaque bloc pile sur la tour. Ce qui dépasse tombe ; trois poses parfaites d'affilée font regrandir le bloc.</p>
      <p class="petit" id="recordTitre"></p>
      <button id="bJouer">JOUER</button>
      <button class="jour" id="bJour">TOUR DU JOUR</button>
      <div class="rang"><a class="lien" id="bClass" href="../classements/index.html#empilage">CLASSEMENT</a><button class="doux" id="bSon">SON : OUI</button></div>
    </div>
  </div>
  <div class="ecran" id="fin" hidden>
    <div class="carte">
      <p class="petit" id="finMode">TOUR LIBRE</p>
      <div class="grand" id="finScore">0</div>
      <p id="finRecord"></p>
      <p class="petit" id="finSerie"></p>
      <p class="petit" id="finRang"></p>
      <button id="bRejouer">REJOUER</button>
      <button class="doux" id="bAccueil">ACCUEIL</button>
    </div>
  </div>
</div>
<script src="../lib/three.min.js"></script>
<script src="../ludo-scores.js"></script>
<script>
'use strict';
/* =====================================================================
   EMPILAGE : un bloc va et vient au-dessus de la tour ; on touche pour le
   lâcher, ce qui dépasse tombe. Un bloc posé pile (à TOL près) garde sa
   taille ; trois parfaits d'affilée le font regrandir. Le ciel passe du
   matin au coucher de soleil puis à la nuit étoilée à mesure que la tour
   monte. Direction A de la maquette (maquettes/empilage.html) : low poly
   pastel, nuages en facettes, police Fredoka. Rendu Three.js (lib/).
   Tour du jour : mêmes vitesses et mêmes côtés de départ pour toute la
   famille (graine = la date) ; seule la première tentative est classée
   (empilage.dailyTry, posé dès le départ).
   Sauvegarde : empilage.best, empilage.parties, empilage.daily {AAAAMMJJ: blocs},
   empilage.dailyTry, empilage.son.
   ===================================================================== */
const H = 0.5, BASE = 3, PORTEE = 3.6, TOL = 0.12;
const store = {
  get(k, d){ try { const v = localStorage.getItem('empilage.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('empilage.' + k, JSON.stringify(v)); } catch (e) {} }
};
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const todayKey = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const $ = id => document.getElementById(id);
const col = c => new THREE.Color(c);
const hsl = (h, s, l) => new THREE.Color().setHSL(((h % 1) + 1) % 1, s, l);

/* ---------- ciel : [hauteur, couleur du haut, couleur du bas] ---------- */
const CIEL = [[0, '#9fd8ff', '#fff1e6'], [12, '#ffb7c5', '#ffe3b3'], [24, '#8e7cc3', '#f7a8b8'], [36, '#22265a', '#6b5b95'], [50, '#0b0d26', '#262a5c']];
function cielA(y){
  let i = 0; while (i < CIEL.length - 2 && y > CIEL[i + 1][0]) i++;
  const [y0, h0, b0] = CIEL[i], [y1, h1, b1] = CIEL[i + 1];
  const t = Math.min(1, Math.max(0, (y - y0) / (y1 - y0)));
  return [col(h0).lerp(col(h1), t), col(b0).lerp(col(b1), t)];
}
// couleur des nuages : blancs le jour, roses au coucher, violets la nuit
const NUAGE = [[0, '#ffffff'], [14, '#ffe0e8'], [28, '#b9a8e0'], [42, '#5a5490']];
function nuageA(y){
  let i = 0; while (i < NUAGE.length - 2 && y > NUAGE[i + 1][0]) i++;
  const t = Math.min(1, Math.max(0, (y - NUAGE[i][0]) / (NUAGE[i + 1][0] - NUAGE[i][0])));
  return col(NUAGE[i][1]).lerp(col(NUAGE[i + 1][1]), t);
}
const PALIERS = {25: 'Le soir tombe', 50: 'Voici la nuit', 75: 'Dans les étoiles', 100: '100 blocs !', 150: 'Plus haut que la lune'};

/* ---------- état ---------- */
const S = { phase: 'titre', mode: 'libre', offRank: false, score: 0, best: store.get('best', 0) || 0, daily: store.get('daily', {}) || {},
  serie: 0, serieMax: 0, son: store.get('son', true) !== false, rng: Math.random, rangTexte: '', auto: true, finT: 0 };
let couches = [], cur = null, chutes = [], eclats = [], camY = 0, vue = 6.5, aspect = 0.56;

/* ---------- Three.js ---------- */
const jeuEl = $('jeu'), cielEl = $('ciel');
let rendu = null;
try { rendu = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: true, alpha: true }); }
catch (e) { $('nom').textContent = 'OUPS'; document.querySelector('#titre p').textContent = "Ce navigateur n'arrive pas à afficher la 3D (WebGL)."; }
if (rendu) rendu.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcdb8ff, 0.85));
const soleil = new THREE.DirectionalLight(0xffffff, 0.55); soleil.position.set(4, 10, 2); scene.add(soleil); scene.add(soleil.target);

const blanc = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
const nuages = [];
for (let k = 0; k < 14; k++){
  const g = new THREE.Group();
  for (let j = 0; j < 4; j++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 0.5, 0), blanc);
    m.position.set(j * 0.75 - 1.1, Math.random() * 0.3, Math.random() * 0.4); g.add(m);
  }
  const z = -7 - Math.random() * 4; g.position.set(z - 8 + Math.random() * 16, 1 + k * 3.2, z);
  g.userData.v = 0.2 + Math.random() * 0.3; nuages.push(g); scene.add(g);
}
const etoiles = (() => {
  const p = [];
  for (let k = 0; k < 320; k++){ const a = Math.random() * Math.PI * 2, r = 25 + Math.random() * 20; p.push(Math.cos(a) * r - 15, Math.random() * 60 - 20, Math.sin(a) * r - 15); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const e = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0 }));
  scene.add(e); return e;
})();
const lune = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), new THREE.MeshBasicMaterial({ color: 0xfff2cf, transparent: true, opacity: 0 }));
scene.add(lune);

function bloc(w, h, d, i){
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ color: i < 0 ? col('#f3d9c4') : hsl(0.55 + i * 0.035, 0.6, 0.74) }));
}
function jeter(o){ scene.remove(o); o.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material && x.material !== blanc) x.material.dispose(); }); }
function poser(c){ c.mesh.position.set(c.x, c.y, c.z); }

/* ---------- sons (synthétisés, très courts) ---------- */
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function bip(f, dur, type, vol, f2){
  if (!S.son || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  pose(){ bip(260, 0.12, 'triangle', 0.14, 180); },
  parfait(n){ const f = 523 * Math.pow(2, Math.min(n - 1, 12) / 12); bip(f, 0.22, 'sine', 0.13); bip(f * 1.5, 0.18, 'sine', 0.05); },
  perdu(){ bip(330, 0.6, 'triangle', 0.12, 90); },
  clic(){ bip(660, 0.06, 'square', 0.04); }
};

/* ---------- partie ---------- */
function remise(){
  couches.forEach(c => jeter(c.mesh)); chutes.forEach(c => jeter(c.mesh)); eclats.forEach(e => jeter(e.mesh));
  if (cur) jeter(cur.mesh);
  couches = []; chutes = []; eclats = []; cur = null; S.score = 0; S.serie = 0; S.serieMax = 0;
  const socle = { x: 0, y: 0, z: 0, w: BASE, d: BASE, mesh: bloc(BASE, 10, BASE, -1) };
  socle.mesh.position.set(0, -5 + H / 2, 0); scene.add(socle.mesh);
  couches.push(socle); nouveau();
}
function nouveau(){
  const p = couches[couches.length - 1], i = couches.length, r = S.rng, cote = r() < 0.5 ? -1 : 1;
  cur = { x: p.x, z: p.z, w: p.w, d: p.d, y: i * H, i, axe: i % 2 ? 'x' : 'z', o: cote * PORTEE, sens: -cote,
    vit: Math.min(6.2, 2.5 + i * 0.055) * (0.9 + r() * 0.25),
    err: S.auto ? (Math.random() < 0.4 ? 0 : (Math.random() - 0.5) * 0.45) : 0 };
  cur.mesh = bloc(cur.w, H, cur.d, i); scene.add(cur.mesh); placeCur();
}
function placeCur(){ const p = couches[couches.length - 1]; cur[cur.axe] = p[cur.axe] + cur.o; poser(cur); }

function lacher(){
  if (!cur) return;
  const p = couches[couches.length - 1], a = cur.axe, tk = a === 'x' ? 'w' : 'd';
  let delta = cur[a] - p[a];
  if (Math.abs(delta) < TOL){
    delta = 0; S.serie++; S.serieMax = Math.max(S.serieMax, S.serie); cur[a] = p[a];
    if (S.serie >= 3){ cur.w = Math.min(BASE, cur.w + 0.15); cur.d = Math.min(BASE, cur.d + 0.15); }
    eclat(cur);
    if (!S.auto){ SFX.parfait(S.serie); bonus(S.serie >= 3 ? 'Parfait ×' + S.serie : 'Parfait !'); }
  } else { S.serie = 0; if (!S.auto) SFX.pose(); }
  const reste = cur[tk] - Math.abs(delta);
  if (reste <= 0){ chutes.push({ mesh: cur.mesh, vy: 0, rot: (Math.random() - 0.5) * 3, axe: a }); cur = null; finPartie(); return; }
  jeter(cur.mesh);
  if (delta !== 0){
    const s = Math.sign(delta), c = cur[a] - delta / 2;
    const bout = { x: cur.x, z: cur.z, w: cur.w, d: cur.d };
    bout[tk] = Math.abs(delta); bout[a] = c + s * (reste / 2 + Math.abs(delta) / 2);
    const m = bloc(bout.w, H, bout.d, cur.i); m.position.set(bout.x, cur.y, bout.z); scene.add(m);
    chutes.push({ mesh: m, vy: 0, rot: s * (1.5 + Math.random()), axe: a });
    cur[a] = c; cur[tk] = reste;
  }
  cur.mesh = bloc(cur.w, H, cur.d, cur.i); scene.add(cur.mesh); poser(cur);
  couches.push(cur); S.score++;
  if (!S.auto && PALIERS[S.score]) bonus(PALIERS[S.score]);
  nouveau(); hud();
}

function eclat(c){
  const m = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(c.w, H, c.d)), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true }));
  m.position.set(c.x, c.y, c.z); scene.add(m); eclats.push({ mesh: m, t: 0 });
}
let minuteur;
function bonus(t){ const b = $('bonus'); b.textContent = t; b.classList.add('vu'); clearTimeout(minuteur); minuteur = setTimeout(() => b.classList.remove('vu'), 700); }
function hud(){
  $('score').textContent = S.score;
  $('sous').textContent = S.mode === 'jour' ? (S.offRank ? 'DU JOUR · HORS CLASSEMENT' : 'TOUR DU JOUR') : (S.best ? 'RECORD ' + S.best : '');
}

function partie(mode){
  audio(); SFX.clic();
  const d = todayKey();
  S.mode = mode; S.auto = false; S.rangTexte = '';
  S.offRank = mode === 'jour' && store.get('dailyTry', 0) === d;
  if (mode === 'jour' && !S.offRank) store.set('dailyTry', d);
  S.rng = mode === 'jour' ? mulberry(d * 7919 + 17) : Math.random;
  remise(); S.phase = 'jeu';
  $('titre').hidden = true; $('fin').hidden = true; $('hud').hidden = false; hud();
}
function finPartie(){
  if (S.auto){ S.phase = 'demoFin'; S.finT = 0; return; }
  S.phase = 'fin'; S.finT = 0; SFX.perdu();
  const sc = S.score, d = todayKey(), record = sc > S.best;
  if (record){ S.best = sc; store.set('best', sc); }
  store.set('parties', (store.get('parties', 0) || 0) + 1);
  const classe = S.mode === 'jour' && !S.offRank;
  if (classe){ S.daily[d] = sc; store.set('daily', S.daily); }
  $('finMode').textContent = S.mode === 'jour' ? (S.offRank ? 'TOUR DU JOUR · HORS CLASSEMENT' : 'TOUR DU JOUR') : 'TOUR LIBRE';
  $('finScore').textContent = sc + (sc > 1 ? ' blocs' : ' bloc');
  $('finRecord').innerHTML = record && sc > 0 ? '<span class="or">Nouveau record !</span>' : 'Record : ' + S.best;
  $('finSerie').textContent = S.serieMax >= 2 ? 'Meilleure série de parfaits : ' + S.serieMax : '';
  $('finRang').textContent = '';
  $('bRejouer').textContent = S.mode === 'jour' ? 'TOUR LIBRE' : 'REJOUER';
  if (sc > 0 && window.LudoScores){
    LudoScores.submit('empilage', 'best', sc, false).then(r => { if (r && !classe) $('finRang').textContent = 'Classement : ' + LudoScores.rankText(r); });
    if (classe) LudoScores.submit('empilage', 'daily:' + d, sc, false).then(r => { if (r) $('finRang').textContent = 'Tour du jour : ' + LudoScores.rankText(r); });
  }
}
function accueil(){
  SFX.clic(); S.phase = 'titre'; S.auto = true; S.mode = 'libre'; S.rng = Math.random;
  $('fin').hidden = true; $('hud').hidden = true; $('titre').hidden = false; majTitre(); remise();
}
function majTitre(){
  const d = todayKey(), essai = store.get('dailyTry', 0) === d;
  $('recordTitre').textContent = S.best ? 'Ton record : ' + S.best + (S.best > 1 ? ' blocs' : ' bloc') : 'Première tour ? Vise les nuages.';
  $('bJour').textContent = essai ? (S.daily[d] != null ? 'TOUR DU JOUR · ' + S.daily[d] : 'TOUR DU JOUR · DEJA JOUEE') : 'TOUR DU JOUR';
  $('bSon').textContent = 'SON : ' + (S.son ? 'OUI' : 'NON');
}

/* ---------- commandes ---------- */
const stop = f => e => { e.stopPropagation(); f(e); };
for (const id of ['bJouer', 'bJour', 'bSon', 'bRejouer', 'bAccueil', 'bClass']) $(id).addEventListener('pointerdown', e => e.stopPropagation());
$('bJouer').addEventListener('click', stop(() => partie('libre')));
$('bJour').addEventListener('click', stop(() => partie('jour')));
$('bRejouer').addEventListener('click', stop(() => partie('libre')));
$('bAccueil').addEventListener('click', stop(accueil));
$('bSon').addEventListener('click', stop(() => { S.son = !S.son; store.set('son', S.son); audio(); SFX.clic(); majTitre(); }));
jeuEl.addEventListener('pointerdown', e => {
  if (S.phase !== 'jeu') return;
  e.preventDefault(); audio(); lacher();
});
document.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && S.phase === 'jeu'){ e.preventDefault(); lacher(); } });

/* ---------- affichage ---------- */
function resize(){
  const top = jeuEl.getBoundingClientRect().top;
  jeuEl.style.height = Math.max(200, window.innerHeight - top) + 'px';
  const w = jeuEl.clientWidth, h = jeuEl.clientHeight; if (!w || !h) return;
  aspect = w / h;
  if (rendu) rendu.setSize(w, h, false);
}
window.addEventListener('resize', resize);

let avant = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t - avant) / 1000); avant = t;
  if (cur && (S.phase === 'jeu' || S.phase === 'titre')){
    const o0 = cur.o;
    cur.o += cur.sens * cur.vit * dt;
    if (cur.o > PORTEE){ cur.o = PORTEE; cur.sens = -1; }
    if (cur.o < -PORTEE){ cur.o = -PORTEE; cur.sens = 1; }
    if (S.auto && (o0 - cur.err) * (cur.o - cur.err) <= 0){ cur.o = cur.err; placeCur(); lacher(); }
    else placeCur();
  }
  if (S.phase === 'demoFin' && (S.finT += dt) > 1.6){ S.phase = 'titre'; remise(); }
  if (S.phase === 'fin' && S.finT < 1){ S.finT += dt; if (S.finT >= 0.8) $('fin').hidden = false; }
  for (const c of chutes){
    c.vy -= 14 * dt; c.mesh.position.y += c.vy * dt;
    if (c.axe === 'x') c.mesh.rotation.z -= c.rot * dt; else c.mesh.rotation.x += c.rot * dt;
  }
  chutes = chutes.filter(c => { if (c.mesh.position.y < camY - 25){ jeter(c.mesh); return false; } return true; });
  for (const e of eclats){ e.t += dt; const k = 1 + e.t * 1.6; e.mesh.scale.set(k, 1, k); e.mesh.material.opacity = Math.max(0, 1 - e.t * 2.2); }
  eclats = eclats.filter(e => { if (e.t > 0.5){ jeter(e.mesh); return false; } return true; });

  // caméra : suit le sommet ; à la fin, recule pour montrer toute la tour
  const haut = couches.length * H, fini = S.phase === 'fin' || S.phase === 'demoFin';
  const cibleY = fini ? haut / 2 - 1 : haut - 1.2 - (S.phase === 'titre' ? 2.5 : 0), cibleV = fini ? Math.max(6.5, haut * 0.55 + 2.5) : 6.5;
  camY += (cibleY - camY) * Math.min(1, dt * 3); vue += (cibleV - vue) * Math.min(1, dt * 2.5);
  cam.left = -vue * aspect; cam.right = vue * aspect; cam.top = vue; cam.bottom = -vue; cam.updateProjectionMatrix();
  cam.position.set(10, camY + 8, 10); cam.lookAt(0, camY, 0);
  soleil.position.set(4, camY + 10, 2); soleil.target.position.set(0, camY, 0);

  // décor : nuages qui dérivent (et remontent tant qu'il fait jour), étoiles et lune la nuit
  const cy = fini ? haut : camY;
  for (const n of nuages){
    n.position.x += n.userData.v * dt; if (n.position.x - n.position.z > 8) n.position.x = n.position.z - 8;
    if (!fini && n.position.y < camY - 14 && camY < 38) n.position.y += 14 * 3.2;
  }
  blanc.color.copy(nuageA(cy));
  const nuit = Math.min(1, Math.max(0, (cy - 26) / 12));
  etoiles.material.opacity = nuit; etoiles.position.y = camY;
  lune.material.opacity = nuit; lune.position.set(-9, camY + 4.5, -14);
  const [h, b] = cielA(cy);
  const hx = '#' + h.getHexString(), bx = '#' + b.getHexString();
  cielEl.style.background = `linear-gradient(${hx},${bx})`;
  document.body.style.background = bx;
  if (rendu) rendu.render(scene, cam);
  requestAnimationFrame(frame);
}

$('nom').innerHTML = 'EMPILAGE'.split('').map(c => '<span>' + c + '</span>').join('');
majTitre(); remise();
setTimeout(resize, 0); resize();
requestAnimationFrame(frame);
window.Empilage = { S, partie, lacher, finPartie, accueil, couches: () => couches, cur: () => cur };
</script>

      navigator.serviceWorker.register("../sw.js").catch(function () {});
    var app = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
