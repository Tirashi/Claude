# Vérifications à chaque push (branches main, claude/* et ccr-*) : rien n'est publié ni modifié,
# aucun secret n'est utilisé. Un push cassé apparaît en rouge dans l'onglet « Actions »
# avant de mettre main à jour. Mêmes commandes en local (voir outils/README.md).
name: Vérifications
on:
  push:
    branches: [main, "claude/**", "ccr-*"]
  pull_request:
  workflow_dispatch:
jobs:
  rapides:
    name: Syntaxe, service worker, sécurité, icônes, simulateur et types Nebula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5.8.3
      - run: node outils/verifications.js
  navigateur:
    name: Chaque jeu s'ouvre sans erreur (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          mkdir -p captures
          node outils/fumee.js captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures
          if-no-files-found: ignore
