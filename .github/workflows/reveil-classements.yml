# Réveille la base des classements (Supabase) tous les 3 jours :
# sur l'offre gratuite, un projet sans activité pendant 7 jours est mis en pause.
# La clé utilisée est la clé PUBLIQUE, déjà visible dans ludo-scores.js.
name: Réveil des classements
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://hfoiofrgltzdyetoqpjc.supabase.co/rest/v1/rpc/ludo_ping" \
            -H "apikey: sb_publishable_6nlzAAAG3LLLonztigio4g_0Q6dakQE" \
            -H "Content-Type: application/json" -d '{}'
