<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>/* page déjà sombre : le mode sombre forcé des navigateurs (Samsung Internet, Chrome…) n'a pas à la repeindre */
@media (prefers-color-scheme: dark){ :root{ color-scheme: dark; } }</style>
<title>Classements · Ludothèque 16 bits</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#110d22">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Page des classements familiaux : étagère de boîtes de jeu (une par jeu), face avant et tableau du jeu choisi. */
:root{
  color-scheme: dark;
  --night:#110d22; --night-2:#1e1840; --panel:#1e1840; --ink:#0d0a18;
  --text:#f2f0ff; --text-dim:#a9a6d8; --gold:#ffd23f; --me:#5cff8a; --err:#ff8fb0;
  --silver:#cfd3e6; --bronze:#e0905a;
  --f-display:"Press Start 2P", "Courier New", monospace;
  --f-body:"VT323", "Lucida Console", monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0; background-color:var(--night); color:var(--text); font-family:var(--f-body); font-size:22px; line-height:1.2;
  background-image:radial-gradient(var(--night-2) 1px, transparent 1.5px); background-size:4px 4px;
  padding-inline:16px; padding-block:18px 48px}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.05) 0 1px, transparent 1px 3px)}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
h1{margin:0; font-family:var(--f-display); font-weight:400; font-size:clamp(16px,5.4vw,26px); letter-spacing:2px; line-height:1.3;
  color:var(--gold); text-shadow:3px 0 0 #b8571a, 0 3px 0 #b8571a, 3px 3px 0 #b8571a, 5px 5px 0 #000}
.who{font-family:var(--f-display); font-size:9px; letter-spacing:1px; color:var(--text-dim); line-height:1.8}
.who b{color:var(--me); font-weight:400}

.btn{font-family:var(--f-display); font-size:9px; letter-spacing:1px; color:var(--text); background:#2b2a4a; cursor:pointer; text-decoration:none; text-align:center;
  border:3px solid var(--text-dim); border-radius:4px; padding:10px 12px; box-shadow:0 0 0 3px var(--ink), 4px 4px 0 3px #000; display:inline-block}
.btn:hover{color:var(--gold); border-color:var(--gold)}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 3px var(--ink), 2px 2px 0 3px #000}
.btn:focus-visible{outline:3px dashed var(--gold); outline-offset:4px}
.btn[aria-pressed="true"]{color:#110d22; background:var(--gold); border-color:var(--gold)}
.btn:disabled{opacity:.35; cursor:default; transform:none}

.panel{background:var(--panel); border:3px solid var(--text-dim); box-shadow:0 0 0 3px var(--ink), 6px 6px 0 3px #000; padding:16px; display:flex; flex-direction:column; gap:14px}
.panel h2{margin:0; font-family:var(--f-display); font-weight:400; font-size:11px; letter-spacing:1px; color:var(--gold); line-height:1.6}
.panel p{margin:0; font-size:20px; color:var(--text-dim)}
.panel p b{color:var(--text); font-weight:400}
label{font-family:var(--f-display); font-size:9px; letter-spacing:1px; display:flex; flex-direction:column; gap:6px}
input{width:100%; font:22px/1.2 var(--f-body); color:#110d22; background:#f2f0ff; border:3px solid var(--ink); padding:8px}

/* l'étagère : une tranche de boîte de jeu par jeu (noir strié, filet rouge, titre chromé, couleurs du jeu) ;
   la boîte touchée sort du rang, et dessous sa face avant et son classement */
.shelf{position:relative; padding:0 14px; background:linear-gradient(#1a1430, #120e24); border:3px solid var(--ink); box-shadow:0 0 0 3px #3b3566, 6px 6px 0 3px #000}
.spines{display:flex; align-items:flex-end; gap:4px; overflow-x:auto; scrollbar-width:none; padding:34px 6px 0; margin:0 -14px; padding-inline:20px}
.spines::-webkit-scrollbar{display:none}
.plank{height:18px; margin:0 -14px; background:linear-gradient(#9a643a, #7a4a24 40%, #5a3418); border-top:3px solid #b77a48; border-bottom:3px solid var(--ink)}
.spine{flex:none; position:relative; width:50px; height:var(--h, 210px); border:3px solid #000; cursor:pointer; padding:0; overflow:visible; color:#fff;
  background:repeating-linear-gradient(90deg, #2a2a2a 0 3px, #111 3px 7px); display:flex; flex-direction:column; align-items:center;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.12), inset -4px 0 0 rgba(0,0,0,.5); transition:transform .25s steps(4); transform-origin:bottom center}
.spine::before{content:""; position:absolute; top:0; bottom:0; right:4px; width:3px; background:#e8264d}
.spine .ico{margin-top:8px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--c); border:2px solid #000}
.spine .ico canvas{width:28px; height:28px; image-rendering:pixelated}
.spine .ico canvas.wide{width:34px; height:24px}
.spine .ico img{width:100%; height:100%; object-fit:cover}
.spine .t{margin-top:10px; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--f-display); font-size:var(--fs, 10px); letter-spacing:2px; white-space:nowrap;
  background:linear-gradient(90deg, #fff 30%, #9fb4d6 55%, #fff 60%, #c9d6f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(1px 1px 0 #000)}
.spine .lab{position:absolute; bottom:8px; left:6px; right:10px; height:18px; background:var(--c); border:2px solid #000}
.spine:hover{transform:translateY(-8px)}
.spine[aria-pressed="true"]{transform:translateY(-26px) rotate(-4deg); box-shadow:inset 3px 0 0 rgba(255,255,255,.12), inset -4px 0 0 rgba(0,0,0,.5), 0 0 0 3px var(--gold)}
.spine:focus-visible{outline:3px dashed var(--gold); outline-offset:3px}
.spine .crown{position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-style:normal; font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif; font-size:18px; color:var(--gold); text-shadow:2px 2px 0 #000}
.board{display:grid; grid-template-columns:minmax(0, 260px) minmax(0, 1fr); gap:22px; align-items:start}
@media (max-width:640px){ .board{grid-template-columns:minmax(0,1fr)} .cover{max-width:220px; justify-self:center} }
.cover{position:relative; width:100%; aspect-ratio:300 / 210; display:grid; grid-template-columns:24px 1fr; background:#111; border:3px solid #000; box-shadow:8px 8px 0 #000;
  transform:perspective(900px) rotateY(-14deg); margin:6px 0 10px}
.cover .stripe{background:repeating-linear-gradient(#2a2a2a 0 3px, #111 3px 7px); border-right:3px solid #e8264d; display:flex; align-items:center; justify-content:center}
.cover .stripe i{writing-mode:vertical-rl; transform:rotate(180deg); font-style:normal; font-family:var(--f-display); font-size:6px; color:#ddd; letter-spacing:2px}
.cover .art{position:relative; background:var(--c); display:flex; align-items:center; justify-content:center; overflow:hidden}
.cover .art canvas{width:84px; height:84px; image-rendering:pixelated; margin-top:26px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45))}
.cover .art canvas.wide{width:140px; height:97px}
.cover .art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.cover .art::after{content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,.18), transparent 40%)}
.cover b{position:absolute; z-index:1; left:0; right:0; top:8px; text-align:center; font-family:var(--f-display); font-weight:400; font-size:14px; letter-spacing:2px; line-height:1.3; padding:0 6px;
  background:linear-gradient(#fff 30%, #9fb4d6 55%, #fff 60%, #c9d6f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(2px 2px 0 #000)}
.res-col{display:flex; flex-direction:column; gap:14px; min-width:0}
.views{display:flex; flex-wrap:wrap; gap:4px 8px}
.views button{font-family:var(--f-display); font-size:8px; letter-spacing:1px; line-height:1.5; padding:8px 6px; background:none; border:0; border-bottom:3px solid #3b3566; color:var(--text-dim); cursor:pointer}
.views button[aria-pressed="true"]{color:var(--gold); border-color:var(--gold)}
.views button:focus-visible{outline:2px dashed var(--gold); outline-offset:2px}
.ctl{display:flex; flex-direction:column; gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips .btn{flex:1 1 auto; font-size:8px; padding:9px 6px}
select{width:100%; font:20px/1.2 var(--f-body); color:#110d22; background:#f2f0ff; border:3px solid var(--ink); padding:6px 8px}
.note{margin:0; font-size:18px; color:var(--text-dim); text-align:center}
.sub{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.day{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px}
.day .btn{font-size:12px; padding:9px 13px}
.day span{text-align:center; font-family:var(--f-display); font-size:10px; letter-spacing:1px; line-height:1.6}

/* le tableau : 1er en or, 2e en argent, 3e en bronze, ta ligne en vert */
.list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px}
.list li{display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 10px; background:#15112c}
.list .r{font-family:var(--f-display); font-size:10px; color:var(--text-dim)}
.list li.p1 .r{color:var(--gold)} .list li.p2 .r{color:var(--silver)} .list li.p3 .r{color:var(--bronze)}
.list .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.list .v{font-family:var(--f-display); font-size:10px; color:var(--text); font-variant-numeric:tabular-nums}
.list li.me{background:#23402c} .list li.me .n{color:var(--me)}
.mine{font-family:var(--f-display); font-size:9px; line-height:1.9; color:var(--me); text-align:center}
.res{font-family:var(--f-display); font-size:9px; line-height:1.9; min-height:1.9em; text-align:center}
.res.err{color:var(--err)} .res.ok{color:var(--text-dim)}
.row{display:flex; flex-wrap:wrap; gap:12px}
.row .btn{flex:1 1 auto}
.foot{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn" href="../index.html">◀ MENU</a>
    <div class="who" id="who"></div>
  </div>
  <h1>CLASSEMENTS</h1>

  <section class="panel" id="join" hidden>
    <h2>REJOINDRE LE CLASSEMENT</h2>
    <p>Choisis un <b>pseudo</b> et entre le <b>code familial</b> qu'on t'a donné. Ensuite, tes records partent tout seuls dans le classement commun, même ceux déjà faits sur cet appareil (téléphone, tablette ou ordinateur).</p>
    <label>PSEUDO<input id="pseudo" maxlength="16" autocomplete="nickname" placeholder="ex. Rudy"></label>
    <label>CODE FAMILIAL<input id="code" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row"><button class="btn" id="joinBtn" type="button">REJOINDRE</button></div>
    <div class="res" id="joinRes" aria-live="polite"></div>
  </section>

  <div id="boards" hidden>
    <div class="shelf"><div class="spines" id="games" role="group" aria-label="Jeu"></div><div class="plank"></div></div>
    <section class="panel board" style="margin-top:18px">
      <div class="cover" id="cover" aria-hidden="true"></div>
      <div class="res-col">
      <h2 id="title"></h2>
      <div class="views" id="views" role="group" aria-label="Classement"></div>
      <div class="ctl" id="ctl"></div>
      <ol class="list" id="list"></ol>
      <div class="mine" id="mine"></div>
      <p class="note" id="note" hidden></p>
      <div class="res" id="res" aria-live="polite"></div>
      <div class="row"><button class="btn" type="button" id="refresh">ACTUALISER</button><a class="btn" id="play" href="#">JOUER</a></div>
      </div>
    </section>
    <div class="foot" style="margin-top:22px"><button class="btn" type="button" id="change">CHANGER DE PSEUDO</button></div>
  </div>
</div>

<script src="../injagility/chiens32.js"></script>
<script src="../icones.js"></script>
<script src="../ludo-scores.js"></script>
<script>
(() => {
  const L = window.LudoScores, $ = id => document.getElementById(id);
  const fmtTime = ms => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
  const N = v => String(Math.round(v)), T = fmtTime;
  // même code que l'Arbre du jour de Lignée : C2-J + date aaaammjj en base 36
  const dayCode = (mode, d) => `${mode}2-J${(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()).toString(36).toUpperCase()}`;
  const LEVELS = ["FACILE", "MOYEN", "DIFFICILE", "EXPERT"];
  const st = {game: "tetris", view: 0, mode: "C", back: 0, level: 2, size: 7, plevel: 1, poke: null, tcmode: "classic", tcai: "normal", amai: "normal", pssize: 9};
  const TCMODES = [["classic", "CLASSIQUE"], ["arsenal", "ARSENAL"]], TCAI = [["easy", "FACILE"], ["normal", "NORMAL"], ["hard", "AMIRAL"]];
  const AMAI = [["easy", "MOUSSE"], ["normal", "CAPITAINE"], ["hard", "AMIRAL"]];
  const day = () => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - st.back); return d; };
  const dayName = () => st.back === 0 ? "AUJOURD'HUI" : st.back === 1 ? "HIER" :
    day().toLocaleDateString("fr-FR", {weekday: "short", day: "numeric", month: "short"}).toUpperCase().replace(/\./g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  // les Pokémon du Picross Dex (noms lus dans la page du jeu, mise en cache par l'appli)
  let DEX = null;
  const dexReady = fetch("../picross/index.html").then(r => r.text()).then(t => {
    DEX = {}; for (const m of t.matchAll(/\{id:"([a-z0-9_-]+)", no:"([0-9A-Z]+)", name:"([^"]+)"/g)) DEX[m[1]] = {no: m[2], name: m[3]};
  }).catch(() => { DEX = {}; });
  const pokeLabel = id => { const d = DEX && DEX[id]; return d ? `${d.no === "OBJ" ? "OBJ" : "#" + d.no} ${d.name}` : id.toUpperCase(); };

  /* chaque jeu : ses classements (vues), leur réglage, leur format */
  const GAMES = [
    {id: "tetris", name: "TETRIS", play: "../tetris/index.html", views: [{label: "MEILLEUR SCORE", game: "tetris", board: () => "best", fmt: N}]},
    {id: "snake", name: "SNAKE", play: "../snake/index.html", views: [{label: "MEILLEUR SCORE", game: "snake", board: () => "best", fmt: N}]},
    {id: "asteroids", name: "ASTEROIDS", play: "../asteroids/index.html", views: [{label: "MEILLEUR SCORE", game: "asteroids", board: () => "best", fmt: N}]},
    {id: "solitaire", name: "SOLITAIRE", play: "../solitaire/index.html", views: [{label: "MEILLEUR SCORE", game: "solitaire", board: () => "best", fmt: N}]},
    {id: "queens", name: "QUEENS", play: "../queens/index.html", views: [{label: "MEILLEUR TEMPS", ctl: ["size"], game: "queens", board: () => "best:" + st.size, fmt: T,
      title: () => `QUEENS · ${st.size}×${st.size}`, note: "Grilles réussies sans indice."},
      {label: "GRILLE DU JOUR", ctl: ["day"], game: "queens", board: () => { const d = day(); return "daily:" + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()); }, fmt: T,
       title: () => `GRILLE DU JOUR · ${[9, 5, 6, 7, 7, 8, 9][day().getDay()]}×${[9, 5, 6, 7, 7, 8, 9][day().getDay()]}`, play: "../queens/index.html#jour",
       note: "La même grille pour toute la famille, de 5×5 le lundi à 9×9 le week-end. Temps plus 30 secondes par indice. Une seule tentative classée par jour.",
       empty: () => st.back ? "Personne n'a fini la grille ce jour-là." : "Personne n'a encore fini la grille du jour : à toi de jouer !"}]},
    {id: "picross", name: "PICROSS DEX", play: "../picross/index.html", views: [
      {label: "PAR POKEMON", ctl: ["pokemon"], game: "picross", board: () => "t:" + st.poke, fmt: T, title: () => st.poke ? pokeLabel(st.poke) : "PICROSS DEX",
       note: "Temps de la grille, plus 30 secondes par indice utilisé.", empty: "Personne n'a encore capturé de Pokémon."},
      {label: "RECORDS DETENUS", kind: "records", game: "picross", fmt: v => N(v) + (v > 1 ? " records" : " record"), title: () => "QUI DETIENT LE PLUS DE RECORDS",
       note: "Nombre de Pokémon sur lesquels chacun a le meilleur temps de la famille."},
      {label: "POKEDEX", game: "picross", board: () => "dex", fmt: v => N(v) + " capturés", title: () => "LE POKEDEX LE PLUS COMPLET"}]},
    {id: "lignee", name: "LIGNEE", play: "../lignee/index.html", views: [
      {label: "ARBRE DU JOUR", ctl: ["mode", "day"], game: "lignee", board: () => "daily:" + dayCode(st.mode, day()), fmt: T,
       title: () => `ARBRE DU JOUR · ${st.mode === "R" ? "ROYAL" : "CLASSIQUE"}`,
       empty: () => st.back ? "Personne n'a fini l'arbre ce jour-là." : "Personne n'a encore fini l'arbre du jour : à toi de jouer !"},
      {label: "PAR NIVEAU", ctl: ["mode", "level"], game: "lignee", board: () => "best:" + st.mode + st.level, fmt: T,
       title: () => `${st.mode === "R" ? "ROYAL" : "CLASSIQUE"} · ${LEVELS[st.level - 1]}`},
      {label: "ARBRES", game: "lignee", board: () => "arbres", fmt: v => N(v) + (v > 1 ? " arbres" : " arbre"), title: () => "ARBRES RECONSTITUES"}]},
    {id: "injagility", name: "INJAGILITY", play: "../injagility/index.html", views: [
      {label: "INFINI", game: "injagility", board: () => "best", fmt: v => N(v) + " obst.", title: () => "INFINI · OBSTACLES FRANCHIS"},
      {label: "PARCOURS · TOTAL", game: "parcours", board: () => "total", fmt: v => N(v) + " pts", title: () => "PARCOURS · TOTAL DES MEILLEURS SCORES", play: "../injagility/parcours.html"},
      {label: "PAR PARCOURS", ctl: ["plevel"], game: "parcours", board: () => "lvl:" + st.plevel, fmt: v => N(v) + " pts", title: () => `PARCOURS N° ${st.plevel}`, play: "../injagility/parcours.html"}]},
    {id: "touchecoule", name: "TOUCHE COULE", play: "../touche-coule/index.html", views: [
      {label: "MEILLEURE VICTOIRE", ctl: ["tcmode", "tcai"], game: "touchecoule", board: () => `best:${st.tcmode}:${st.tcai}`, fmt: v => N(v) + " tirs",
       title: () => `${TCMODES.find(m => m[0] === st.tcmode)[1]} · IA ${TCAI.find(m => m[0] === st.tcai)[1]}`, note: "La victoire en le moins de tirs, par mode et par niveau de l'IA."}]},
    {id: "club", name: "CLUB D'AGILITY", play: "../club/index.html", views: [
      {label: "REPUTATION", game: "club", board: () => "rep", fmt: v => N(v) + " pts", title: () => "LA PLUS GRANDE REPUTATION"},
      {label: "CHAMPION", game: "club", board: () => "champion", fmt: v => N(v) + " sem.", title: () => "CHAMPION DE FRANCE LE PLUS RAPIDE",
       note: "Le nombre de semaines pour gagner le Championnat de France.", empty: "Personne n'est encore champion de France."}]},
    {id: "alunissage", name: "ALUNISSAGE", play: "../alunissage/index.html", views: [
      {label: "MEILLEUR SCORE", game: "alunissage", board: () => "best", fmt: v => N(v) + " pts", title: () => "ALUNISSAGE · MEILLEURE MISSION",
       note: "Score d'une mission : à chaque site, (100 + carburant restant) × le multiplicateur de l'aire."},
      {label: "MISSION DU JOUR", ctl: ["day"], game: "alunissage", board: () => { const d = day(); return "daily:" + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()); }, fmt: v => N(v) + " pts",
       title: () => "MISSION DU JOUR", note: "La même suite de sites pour toute la famille. Seule la première mission du jour est classée.", empty: () => st.back ? "Personne n'a joué la mission ce jour-là." : "Personne n'a encore joué la mission du jour : à toi !"}]},
    {id: "nebula", name: "NEBULA", play: "../nebula/index.html", views: [
      {label: "MEILLEUR SCORE", game: "nebula", board: () => "best", fmt: v => N(v) + " pts", title: () => "NEBULA · MEILLEURE PARTIE",
       note: "1000 par secteur terminé, 20 par pirate détruit, les crédits restants, et 3000 pour la victoire finale."},
      {label: "PARTIE DU JOUR", ctl: ["day"], game: "nebula", board: () => { const d = day(); return "daily:" + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()); }, fmt: v => N(v) + " pts",
       title: () => "PARTIE DU JOUR", note: "La même carte et les mêmes combats pour toute la famille, avec la flotte d'escorte. Une seule tentative classée par jour.",
       empty: () => st.back ? "Personne n'a joué la partie ce jour-là." : "Personne n'a encore joué la partie du jour : à toi !"},
      {label: "VICTOIRES", game: "nebula", board: () => "victoires", fmt: v => N(v) + " victoire" + (v > 1 ? "s" : ""), title: () => "NEBULA · VICTOIRES",
       note: "Le nombre de parties gagnées (la Rouille-Reine vaincue).", empty: "Personne n'a encore vaincu la Rouille-Reine."}]},
    {id: "pontstellaire", name: "PONT STELLAIRE", play: "../pont-stellaire/index.html", views: [
      {label: "CIEL DU JOUR", ctl: ["day"], game: "pontstellaire", board: () => { const d = day(); return "daily:" + (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()); }, fmt: T,
       title: () => "CIEL DU JOUR", note: "Le même ciel 9×9 pour toute la famille, plus 30 secondes par indice. Une seule tentative classée par jour.",
       empty: () => st.back ? "Personne n'a dessiné le ciel ce jour-là." : "Personne n'a encore dessiné le ciel du jour : à toi de jouer !"},
      {label: "PAR TAILLE", ctl: ["pssize"], game: "pontstellaire", board: () => "best:" + st.pssize, fmt: T,
       title: () => `PONT STELLAIRE · ${st.pssize}×${st.pssize}`, note: "Le meilleur temps, plus 30 secondes par indice."},
      {label: "CONSTELLATIONS", game: "pontstellaire", board: () => "ciels", fmt: v => N(v) + (v > 1 ? " ciels" : " ciel"), title: () => "CONSTELLATIONS DESSINEES"}]},
    {id: "orbite", name: "ORBITE", play: "../orbite/index.html", views: [
      {label: "ETOILES", game: "orbite", board: () => "etoiles", fmt: v => N(v) + (v > 1 ? " étoiles" : " étoile"), title: () => "ORBITE · TOTAL D'ETOILES",
       note: "3 étoiles par niveau réussi du premier coup, 2 au deuxième essai, 1 au troisième (90 au maximum)."}]},
    {id: "amiral", name: "AMIRAL !", play: "../amiral/index.html", views: [
      {label: "MEILLEURE VICTOIRE", ctl: ["amai"], game: "amiral", board: () => `best:${st.amai}`, fmt: v => N(v) + " tours",
       title: () => `AMIRAL ! · ${AMAI.find(m => m[0] === st.amai)[1]}`, note: "La victoire en le moins de tours, par niveau de l'ordinateur."}]},
  ];
  // l'apparence de chaque boîte : icône de l'accueil (icones.js) et couleurs de sa cartouche
  const LOOK = {
    tetris: ["blocks", "linear-gradient(#3b2a8a, #160f45)"], snake: ["snake", "linear-gradient(#377a28, #1c4214)"],
    asteroids: ["rock", "radial-gradient(circle at 70% 30%, #1d2a5a, #05040e 70%)"], solitaire: ["cards", "linear-gradient(#2a8a48, #145a2c)"],
    queens: ["crown", "linear-gradient(#3a4cc8, #141a6a)"], picross: ["ball", "#cf2b34"], lignee: ["tree", "linear-gradient(#6b3f1f, #2f1a0c)"],
    injagility: ["dog", "linear-gradient(#78bae7, #5fb548)"], touchecoule: ["boat", "linear-gradient(#2b6fd0, #0f1866)"],
    club: ["cup", "linear-gradient(#3f8a37, #173a1a)"], alunissage: ["lander", "linear-gradient(#0a0c1e, #2c2a28)"],
    nebula: ["../nebula/cartouche.jpg", "radial-gradient(circle at 75% 20%, #3a2a4a, #04060c 70%)"],
    pontstellaire: ["stars", "radial-gradient(circle at 70% 25%, #24407a, #070a1c 75%)"],
    orbite: ["planet", "radial-gradient(circle at 30% 30%, #3a2a8a, #070a1c 75%)"], amiral: ["anchor", "linear-gradient(#1c579c, #0a1c40)"],
  };
  // l'image d'une boîte : une icône 16×16 (le chien est plus large), ou la capture de Nebula
  function art(id){
    const ic = (LOOK[id] || [])[0];
    if (!ic) return document.createElement("span");
    if (ic.endsWith(".jpg")){ const im = document.createElement("img"); im.src = ic; im.alt = ""; return im; }
    const c = document.createElement("canvas"); c.width = ic === "dog" ? 78 : 16; c.height = ic === "dog" ? 54 : 16;
    if (ic === "dog") c.className = "wide";
    if (window.LudoIcons) LudoIcons.draw(c, ic);
    return c;
  }
  const ord = n => n === 1 ? "1er" : n + "e";
  const res = (t, ok) => { $("res").textContent = t; $("res").className = "res " + (ok ? "ok" : "err"); };
  const game = () => GAMES.find(g => g.id === st.game) || GAMES[0], view = () => game().views[Math.min(st.view, game().views.length - 1)];

  // anciens liens (#tetris, #lignee-C, #lignee-R) et nouveaux (#jeu ou #jeu-vue)
  { const h = location.hash.slice(1).split("-");
    if (GAMES.some(g => g.id === h[0])) st.game = h[0];
    if (h[0] === "lignee" && /^[CR]$/.test(h[1] || "")) st.mode = h[1];
    else if (/^\d$/.test(h[1] || "")) st.view = +h[1];
    if (/^[CR]$/.test(h[2] || "")) st.mode = h[2];
    if (h[0] === "parcours"){ st.game = "injagility"; st.view = 2; }
    if (h[0] === "amiral" && /^(easy|normal|hard)$/.test(h[2] || "")) st.amai = h[2];
    if (h[0] === "touchecoule"){ if (/^(classic|arsenal)$/.test(h[2] || "")) st.tcmode = h[2]; if (/^(easy|normal|hard)$/.test(h[3] || "")) st.tcai = h[3]; } }

  function button(label, pressed, onclick, extra){ const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = label;
    b.setAttribute("aria-pressed", !!pressed); b.onclick = onclick; if (extra) Object.assign(b, extra); return b; }
  function stepper(label, onPrev, onNext, prevOff, nextOff){
    const box = document.createElement("div"); box.className = "day";
    const a = button("◀", false, onPrev, {disabled: prevOff}), b = button("▶", false, onNext, {disabled: nextOff}), s = document.createElement("span");
    a.setAttribute("aria-label", "Précédent"); b.setAttribute("aria-label", "Suivant"); s.textContent = label; box.append(a, s, b); return box; }

  // le réglage de la vue : mode, jour, niveau, taille, parcours, Pokémon
  let pokeList = [];
  function controls(v){
    const box = $("ctl"); box.innerHTML = "";
    for (const c of v.ctl || []){
      if (c === "mode"){ const r = document.createElement("div"); r.className = "chips";
        for (const [m, l] of [["C", "CLASSIQUE"], ["R", "ROYAL"]]) r.appendChild(button(l, st.mode === m, () => { st.mode = m; view_(); }));
        box.appendChild(r); }
      if (c === "day") box.appendChild(stepper(dayName(), () => { st.back = Math.min(60, st.back + 1); view_(); }, () => { st.back = Math.max(0, st.back - 1); view_(); }, st.back >= 60, st.back === 0));
      if (c === "level"){ const r = document.createElement("div"); r.className = "chips";
        LEVELS.forEach((l, i) => r.appendChild(button(l, st.level === i + 1, () => { st.level = i + 1; view_(); }))); box.appendChild(r); }
      if (c === "tcmode" || c === "tcai" || c === "amai"){ const r = document.createElement("div"); r.className = "chips";
        for (const [k, l] of c === "tcmode" ? TCMODES : c === "amai" ? AMAI : TCAI) r.appendChild(button(l, st[c] === k, () => { st[c] = k; view_(); }));
        box.appendChild(r); }
      if (c === "pssize"){ const r = document.createElement("div"); r.className = "chips";
        for (const n of [7, 9, 11]) r.appendChild(button(`${n}×${n}`, st.pssize === n, () => { st.pssize = n; view_(); })); box.appendChild(r); }
      if (c === "size"){ const r = document.createElement("div"); r.className = "chips";
        for (let n = 5; n <= 9; n++) r.appendChild(button(`${n}×${n}`, st.size === n, () => { st.size = n; view_(); })); box.appendChild(r); }
      if (c === "plevel") box.appendChild(stepper(`PARCOURS N° ${st.plevel}`, () => { st.plevel = Math.max(1, st.plevel - 1); view_(); }, () => { st.plevel++; view_(); }, st.plevel <= 1, st.plevel >= 999));
      if (c === "pokemon"){
        const sel = document.createElement("select"); sel.id = "pokeSel"; sel.setAttribute("aria-label", "Pokémon");
        if (!pokeList.length){ const o = document.createElement("option"); o.textContent = "Aucun Pokémon classé pour l'instant"; sel.appendChild(o); sel.disabled = true; }
        for (const id of pokeList){ const o = document.createElement("option"); o.value = id; o.textContent = pokeLabel(id); if (id === st.poke) o.selected = true; sel.appendChild(o); }
        sel.onchange = () => { st.poke = sel.value; view_(); };
        const i = pokeList.indexOf(st.poke);
        box.appendChild(stepper("", () => { st.poke = pokeList[i - 1]; view_(); }, () => { st.poke = pokeList[i + 1]; view_(); }, i <= 0, i < 0 || i >= pokeList.length - 1));
        box.lastChild.querySelector("span").replaceWith(sel);
      }
    }
  }

  function view_(){
    const j = L && L.joined();
    $("join").hidden = j; $("boards").hidden = !j;
    $("who").innerHTML = j ? `JOUEUR<br><b></b>` : "";
    if (j) $("who").querySelector("b").textContent = L.pseudo();
    if (!j){ $("pseudo").value = (L && L.pseudo()) || ""; return; }
    const g = game(), v = view();
    shelf_();
    [...$("games").children].forEach(b => { const on = b.dataset.id === g.id; b.setAttribute("aria-pressed", on); if (on && b !== picked){ picked = b; b.scrollIntoView({block: "nearest", inline: "center", behavior: "smooth"}); } });
    const cv = $("cover"); cv.style.setProperty("--c", (LOOK[g.id] || [])[1] || "#222");
    cv.innerHTML = '<span class="stripe"><i>LUDOTHEQUE 16 BITS</i></span><span class="art"><b></b></span>';
    cv.querySelector("b").textContent = g.name; cv.querySelector(".art").prepend(art(g.id));
    const vb = $("views"); vb.innerHTML = ""; vb.hidden = g.views.length < 2;
    g.views.forEach((V, i) => { const b = button(V.label, V === v, () => { st.view = i; view_(); }); b.className = ""; vb.appendChild(b); });
    $("title").textContent = v.title ? v.title() : `${g.name} · ${v.label}`;
    $("note").hidden = !v.note; $("note").textContent = v.note || "";
    $("play").href = v.play || g.play;
    history.replaceState(null, "", "#" + g.id + (g.views.length > 1 ? "-" + st.view : ""));
    controls(v);
    load();
  }

  // l'étagère, construite une fois : hauteurs un peu différentes comme de vraies boîtes, couronne là où tu as un record
  let picked = null, crowned = false;
  function shelf_(){
    const box = $("games"); if (box.children.length) return;
    GAMES.forEach((G, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "spine"; b.dataset.id = G.id;
      const fs = G.name.length > 10 ? 8 : 10;
      b.style.setProperty("--c", (LOOK[G.id] || [])[1] || "#222"); b.style.setProperty("--fs", fs + "px");
      b.style.setProperty("--h", Math.max(186, 92 + G.name.length * (fs + 2) + (i * 37) % 26) + "px");
      b.setAttribute("aria-label", "Classement : " + G.name);
      const ic = document.createElement("i"); ic.className = "ico"; ic.appendChild(art(G.id));
      const t = document.createElement("span"); t.className = "t"; t.textContent = G.name;
      const lab = document.createElement("i"); lab.className = "lab";
      b.append(ic, t, lab); b.onclick = () => { st.game = G.id; st.view = 0; view_(); };
      box.appendChild(b);
    });
    crowns();
  }
  function crowns(){
    if (crowned || !L.bests) return; crowned = true;
    GAMES.forEach(G => {
      const ids = [...new Set(G.views.map(V => V.game))];
      Promise.all(ids.map(id => L.bests(id).catch(() => null))).then(all => {
        if (!all.some(rows => rows && rows.some(r => r.me))) return;
        const b = $("games").querySelector(`[data-id="${G.id}"]`); if (!b || b.querySelector(".crown")) return;
        const k = document.createElement("i"); k.className = "crown"; k.textContent = "♛"; k.title = "Tu détiens un record"; b.appendChild(k);
        b.setAttribute("aria-label", b.getAttribute("aria-label") + " (tu détiens un record)");
      });
    });
  }

  let ticket = 0;
  function show(rows, fmt){
    rows = rows || [];
    // ex æquo au même rang : 1, 2, 2, 4 (les lignes arrivent déjà triées)
    const rank = []; rows.forEach((r, i) => rank[i] = i && r.value === rows[i - 1].value ? rank[i - 1] : i + 1);
    rows.forEach((r, k) => {
      const li = document.createElement("li"); li.className = (rank[k] <= 3 ? "p" + rank[k] : "") + (r.me ? " me" : "");
      const a = document.createElement("span"); a.className = "r"; a.textContent = ord(rank[k]).toUpperCase();
      const n = document.createElement("span"); n.className = "n"; n.textContent = r.pseudo;
      const v = document.createElement("span"); v.className = "v"; v.textContent = fmt(r.value);
      li.append(a, n, v); $("list").appendChild(li);
    });
    const me = rows.findIndex(r => r.me);
    $("mine").textContent = me >= 0 ? `TU ES ${ord(rank[me]).toUpperCase()}${rank.filter(x => x === rank[me]).length > 1 ? " EX AEQUO" : ""} SUR ${rows.length}` : "";
  }
  function load(){
    const v = view(), my = ++ticket;
    $("list").innerHTML = ""; $("mine").textContent = ""; res("Chargement…", true);
    const fail = e => { if (my !== ticket) return;
      if (e && e.code === "code"){ view_(); $("joinRes").textContent = "Le code familial a changé : entre le nouveau code."; $("joinRes").className = "res err"; return; }
      res(e && e.code === "missing" ? "Ce classement demande une mise à jour de Supabase (fichier classements-2.sql)." : "Classement injoignable pour le moment (pas de réseau ?).", false); };
    let job;
    if (v.kind === "records" || (v.ctl || []).includes("pokemon")){
      // une seule requête : le meilleur temps de chaque Pokémon
      job = Promise.all([L.flush(), dexReady]).then(() => L.bests("picross")).then(rows => {
        if (rows === null) return null;
        const recs = rows.filter(r => String(r.board).startsWith("t:"));
        const order = id => { const d = DEX && DEX[id]; return d ? (d.no === "OBJ" ? 0 : +d.no) : 9999; };
        pokeList = recs.map(r => r.board.slice(2)).sort((a, b) => order(a) - order(b) || a.localeCompare(b));
        if (v.kind === "records"){
          const by = {};
          for (const r of recs){ const k = r.pseudo; by[k] = by[k] || {pseudo: k, value: 0, me: false}; by[k].value++; if (r.me) by[k].me = true; }
          return Object.values(by).sort((a, b) => b.value - a.value || a.pseudo.localeCompare(b.pseudo));
        }
        if (!st.poke || !pokeList.includes(st.poke)) st.poke = pokeList[0] || null;
        controls(v); $("title").textContent = v.title();
        return st.poke ? L.board("picross", "t:" + st.poke, 100) : [];
      });
    } else job = L.flush().then(() => L.board(v.game, v.board(), 100));
    job.then(rows => {
      if (my !== ticket) return;
      if (rows === null){ view_(); $("joinRes").textContent = "Le code familial a changé : entre le nouveau code."; $("joinRes").className = "res err"; return; }
      res("", true);
      if (!rows.length){ const e = view().empty; res(typeof e === "function" ? e() : e || "Personne pour l'instant : à toi de jouer !", true); return; }
      show(rows, v.fmt);
      if (L.pending()) res(`${L.pending()} score(s) en attente d'envoi.`, true);
    }).catch(fail);
  }

  if (!L){ $("join").hidden = false; $("joinRes").textContent = "Le module des classements n'a pas pu se charger."; $("joinRes").className = "res err"; return; }
  $("refresh").onclick = load;
  $("change").onclick = () => { L.leave(); $("joinRes").textContent = ""; view_(); $("code").focus(); };
  $("joinBtn").onclick = () => {
    $("joinRes").textContent = "Vérification du code…"; $("joinRes").className = "res ok";
    L.join($("pseudo").value, $("code").value).then(() => { $("code").value = ""; $("joinRes").textContent = ""; view_(); })
      .catch(e => { $("joinRes").className = "res err";
        $("joinRes").textContent = e.code === "code" ? "Ce code familial n'est pas le bon." : (e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : "Impossible de joindre le classement (pas de réseau ?)."); });
  };
  [$("pseudo"), $("code")].forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") $("joinBtn").click(); }));
  view_();
})();
</script>
</body>
</html>
